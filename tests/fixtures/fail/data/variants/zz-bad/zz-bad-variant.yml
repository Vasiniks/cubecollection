# Nothing in tests/fixtures is ever loaded into data/ or published.


id: zz-bad-variant
entity: variant
model_id: zz-bad-model
name: ZZ Bad Variant
scope_class: core
fingerprint: "sha1:0000000000000000000000000000000000000000"
edition:
  types: [standard]
  designation: Flagship
config:
  coating: uv
  size_mm: 999
  weight_g: 999
colorway:
  application: stickerless
  faces:
    - { face: U, color_name: white, color_normalized: "#ffffff", material: vinyl_sticker }
legality:
