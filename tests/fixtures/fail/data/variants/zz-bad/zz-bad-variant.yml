status: published
attestations:
  "/no/such/path":
    confidence: probable
    sources: [zz-bad-src-unpreserved]
  "/config/coating":
    confidence: confirmed
    sources: [zz-bad-src-unpreserved]
  "/colorway/faces/0/color_normalized":
    confidence: confirmed
    sources: [zz-bad-src-unpreserved]
    derived_from: sampled_from_image
  "/legality/wca_status":
    confidence: disputed
    disputed:
      - { value: legal, sources: [zz-bad-src-unpreserved], confidence: reported }
      - { value: legal, sources: [zz-bad-src-unpreserved], confidence: reported }
  "/rarity/level":
