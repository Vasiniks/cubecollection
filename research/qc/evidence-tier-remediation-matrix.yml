# evidence-tier-remediation-matrix
# Written by Agent B, remediation gate (Pass 2). Source of the 111 count and methodology:
# research/qc/agent-b-evidence-policy.md — read that first for the reasoning; this file is
# meant to be actionable on its own by a future session without re-reading the Pass 2 log.
#
# Scope: every source that backs at least one of the 111 attestations (107 'reported', 4
# 'probable') resting solely on a tier-4 source, as independently re-derived and confirmed
# exact by this agent (see method in the companion .md). Does not include data/ edits — this
# agent's write lane is research/qc/ only. A future session (or a human) applies the
# 'decision' and 'mechanism' fields below as data/ edits.

policy:
  rule: >-
    A confidence value of 'reported' or 'probable' requires at least one cited source at tier <=3 or
    tier <=2 respectively (per vocab/confidence.yml, as written). A solitary tier-4 source backing
    an attestation must use 'uncertain', never 'reported'/'probable', unless that specific source
    has an individually-justified tier override to tier 3 recorded on the source file itself
    (source.tier + reliability_note, the existing RESEARCH_SPEC S3.1 mechanism). A tier override is
    source-specific, never kind-wide: 'kind: wiki' stays tier 4 by default archive-wide. An override
    to tier 3 is justified only when ALL of: (1) editing is restricted/protected, not
    open-anonymous; (2) a revision history exists; (3) the specific page carries no self-declared
    outdated/stub/DNF banner as of the capture used; (4) the claim being cited is within
    claim_types_permitted for tier 3 (see below) -- corporate/ownership relationships and numeric
    specifications are never covered by a tier-3 wiki override regardless of how well-curated the
    page is. Positioning classifications and any comparative/superlative characterisation drawn from
    such a source are capped at 'reported' and may never reach 'confirmed', matching RESEARCH_SPEC
    S3.3's manufacturer-marketing rule applied by analogy to community sources. Precise (day-level
    or unqualified-month) dates never rest on this source class alone, upgraded or not; record at
    'quarter' or 'year' precision with qualifier 'circa'. When a source cannot be verified against
    criteria (1)-(3) directly (rather than inferred from family resemblance to a verified sibling),
    the conservative default is tier 4 / confidence 'uncertain' until verified -- never 'reported'
    on the strength of resemblance alone.
  claim_types_tier3_permitted:
    - existence_and_naming
    - approximate_chronology_quarter_or_year_circa_only
    - family_succession_same_manufacturer
    - positioning_capped_at_reported_never_confirmed
    - descriptive_prose_with_comparative_language_attributed_not_adopted
  claim_types_tier4_permitted:
    - existence_and_naming_at_uncertain_only
    - approximate_chronology_at_uncertain_only
  claim_types_forbidden_regardless_of_tier:
    - >-
      numeric_specifications (size_mm, weight_g, magnet_configuration, core_system, maglev,
      adjustment_system, coating)
    - >-
      corporate_ownership_or_subbrand_relationships (parent_id, kind:sub_brand, rebrand_of,
      modified_from)
    - confirmed_confidence (schema rule 9 already blocks this; restated for durability)
    - precise_day_or_unqualified_month_dates
  verification_procedure_for_a_wiki_tier_override:
    - >-
      WebFetch the live page (not the archived capture) on speedsolving.com directly;
      web.archive.org refuses WebFetch per RESEARCH_SPEC S3.6, use scripts/wayback.mjs there if
      archived-only verification is needed instead
    - Check for an edit-protection notice ("This page is protected")
    - Check for a working History / past-revisions link
    - >-
      Check for any self-declared staleness banner ("may be currently outdated", "DNF", "stub")
      anywhere on the page, not just the excerpted section
    - >-
      Only then set source.tier: 3 with a reliability_note stating what was checked and when,
      following the companies-house-rubiks-brand-ltd precedent
