# P4-9 candidate adjudication — is the enumeration method systematically deficient?
#
# GENERATED, then adjudicated BY HAND. Regenerate the candidate list with:
#     npm run catalogue-gap -- --fetch --json
# Adjudications below are not regenerable and must be preserved across any regeneration.
#
# THE QUESTION THIS FILE EXISTS TO ANSWER is not "which models are missing". It is:
#   Did the enumeration method systematically miss NEWER GENERATIONS of lines it already found?
# So the field that matters most is `known_family`. A candidate inside a family the archive
# already holds means enumeration found the line and stopped before its later generations —
# a RECENCY failure. A candidate in no known family means the line was never found at all —
# a BREADTH failure. The two have different fixes and the ratio between them is the finding.
#
# CLASSIFICATIONS (RESEARCH_SPEC-aligned, one per candidate):
#   confirmed_missing  a real manufacturer product with no model in the frozen 269
#   alternate_naming   the archive HAS this product under a different name
#   service_listing    a retailer service tier / custom setup — belongs to the service manufacturer
#   bundle             a multi-product SKU, not a product
#   variant            a configuration of a model the archive already holds
#   sub_brand          belongs to a manufacturer recorded under another id
#   not_3x3            out of scope: non-3x3, shape mod, or novelty by the archive's own rules
#   false_positive     a matcher artefact; not a product at all
#   unadjudicated      not yet examined — the honest default, and never a silent skip
#
# NOTHING IN THIS FILE MUTATES THE TAXONOMY. It is research and evidence. Admission is a
# separate, authorised step under the freeze.
