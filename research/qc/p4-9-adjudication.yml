  note: >-
    "MoYu WeiLong V11 3x3" and "MoYu WeiLong 3x3 V11" are one product written two ways by two
    retailers; collapsing on a normalised key merges them. That alone removed 12 phantom
    candidates, and is why a raw diff count must never be quoted as a gap size.
  known_family_caveat: >-
    THE known_family FIELD UNDERSTATES RECENCY FAILURES, and the raw 28-vs-233 split must not be
    quoted without this. The family matcher is PREFIX-ONLY, so "MoYu Super WeiLong V2" does not
    match the family "MoYu WeiLong" — the word "Super" sits in front — and it landed in the
    no-known-family bucket despite being a later generation of a line the archive holds. Same for
    MoYu Super AoLong and MoYu Super RS3 M. The adjudicated classifications below are the
    reliable signal; known_family is a triage hint only.
    A second artefact runs the other way: three YuXin candidates were attributed to the family
    yuxin-3x3, which is one of the archive's ZERO-MODEL families. A family with no models cannot
    evidence a recency failure, so those attributions mean nothing at all.
  findings: >-
    ALL 261 ADJUDICATED. Distribution: missing_manufacturer 71 (27%), not_3x3 60 (23%),
    needs_research 44 (17%), service_listing 32 (12%), confirmed_missing 20 (8%),
    alternate_naming 14 (5%), variant 12 (5%), bundle 6, sub_brand 1, false_positive 1.
    THE ANSWER TO THE QUESTION THIS FILE ASKED IS "BOTH, AT DIFFERENT LAYERS."
    MODEL LAYER - yes, the method systematically misses newer generations. Of 20 confirmed
    missing models, TWELVE are later generations of lines the archive already holds, and EIGHT
    of those twelve are MoYu. That is not a handful of oversights; it is one manufacturer's
    entire recent output. The other eight are lines never found at all (QiYi's smart cube, GAN
    330, ZCube, the FerYooCore V1).
    MANUFACTURER LAYER - and this is the larger finding, which the original P4-9 escalation did
    not see at all. SEVEN distinct vendors are absent from the 54 entirely: Ziina (51 lines from
    2023-11), VIN Cube (6), Cubelelo's own Drift house brand (4), YZ, Cube Lab, ZePuzzles and
    Smart Cube Labs. A missing manufacturer is a larger gap in kind than a missing model,
    because every family, model and variant beneath it is missing too and nothing in the archive
    can point at the hole.
    THE TWO HAVE DIFFERENT FIXES, which is why separating them mattered. Missed generations are
    a RECENCY problem - the line was found and enumeration stopped before its later products, so
    the fix is checking current catalogues, which is now `npm run catalogue-gap`. Missing
    manufacturers are a BREADTH problem - the brand was never found, so the fix is Pass 1
    discovery, and no amount of re-checking known lines would ever surface them.
    HALF OF WHAT THE TOOL REPORTED WAS CORRECTLY NOT A GAP: 126 of 261 (48%) are out-of-scope
    novelties, retailer service listings, bundles, licensed prints that belong at variant level,
    or products the archive already holds under another name. That is the tool behaving as
    documented - tuned to over-report - and it is why every line needed adjudicating rather than
    counting. Fourteen were products the archive HAS, including moretry-tianma-x3-v4, where a
    "+" in the retailer's title was the entire difference.
    44 ARE UNRESOLVED AND SAY SO. The largest unresolved class is not a research gap but a
    POLICY gap: mini and keychain formats. The archive admits mfjs-mini-3x3-keychain-40mm and
    cyclone-boys-mini-3x3-original at 40mm while holding no GAN 330, GAN 328, QiYi Mini, MoYu
    Mini, YJ Mini or Maru Mini. That inconsistency has to be decided once as a class. The
    oversized formats (DianSheng Big/Giant, YuXin Super Big, MoYu Big, YJ Big, HeShu Super Big)
    are the same shape of question against shengshou-legend-big at 70mm.
