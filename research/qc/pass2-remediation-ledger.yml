  - id: P4-11
    severity: medium
    status: resolved
    title: "Mini/keychain and oversized formats are admitted inconsistently, and it is a policy gap not a research gap"
    evidence: >-
      The largest unresolved class in the P4-9 adjudication is 44 candidates marked
      needs_research, and most of them turn on one unanswered scope question rather than on
      missing evidence.
      MINI/KEYCHAIN: the archive ADMITS mfjs-mini-3x3-keychain-40mm and
      cyclone-boys-mini-3x3-original at 40mm, and qiyi-valk-3-mini at 47.4mm, while holding no
      GAN 330 (33mm, listed since 2020-05-05), GAN 328, QiYi Mini, QiYi Mini Keychain, MoYu Mini
      (listed since 2017-09-15), YJ Mini, YJ Pocket Cube or Maru Mini. Nothing states a size
      floor; the difference appears to be which sweep happened to find which product.
      OVERSIZED: the archive admits shengshou-legend-big at 70mm and dayan-zhanchi-42mm at the
      other end, while holding no DianSheng Big or Giant, YuXin Super Big, MoYu Big, YJ Big or
      HeShu Super Big.
      Both are decidable from the archive's own existing records without any new research. Until
      they are decided, every individual mini or oversized candidate is unadjudicable, and
      adjudicating them one at a time would produce exactly the inconsistency that created this.
      CORRECTED AND RESOLVED 2026-09-09, the same day it was raised. THIS WAS NOT A POLICY GAP
      and the escalation was wrong to call it one. RESEARCH_SPEC 2.4 puts out of scope "puzzles
      other than 3x3x3" and states NO size criterion anywhere; a 33mm keychain 3x3 is a 3x3x3.
      The archive's practice already matches its policy: cyclone-boys-mini-3x3-original (40mm),
      dayan-zhanchi-42mm, qiyi-valk-3-mini (47.4mm) and shengshou-legend-big (70mm) are ALL
      scope_class core. The single conditional out-of-range record is maru-nano-original at
      15mm, admitted on significance exactly as 2.2 provides for. There is no inconsistency to
      resolve and no rule to write.
      The missing minis are therefore NOT blocked on a scope decision. They are ordinary P4-9
      enumeration candidates and should be adjudicated as such, which removes the largest
      supposed blocker from that issue's 44 needs_research entries.
      WHAT THE INVESTIGATION DID FIND is a different and sharper defect, escalated as rule 49
      rather than left here: the three MFJS minis are scope_class reference_only for a reason
      2.4 does not cover - "no WCA legality evidence and no documented significance beyond size
      alone" - while an identically-sized Cyclone Boys mini is core. reference_only is defined
      for OUT-OF-WINDOW lineage records, and build.mjs removes those records from the public
      bundle. That made the real question visible: an exclusion from the published archive was
      costing nothing, while rule 15 made an admission cost an argument. Rule 49 now reports it.
      Recording the correction rather than quietly reclassifying: this issue was raised on a
      misreading of the archive's own scope policy, and reading the policy settled it.
    recommendation: >-
      Decide the CLASS, once, and write it into RESEARCH_SPEC's scope section rather than
      settling each product. Either a stated size range with the existing admissions justified
      against it, or an explicit statement that format is not a scope criterion and the minis
      belong. Then re-adjudicate the 44 in one pass. Do NOT admit or refuse individual minis
      before the rule exists - that is how the current inconsistency arose.
    confidence: confirmed
    downstream_impact: >-
      No existing record is wrong either way. What is at stake is whether roughly 15 further
      products belong in the inventory, and whether the archive can state its own scope when
      asked.
