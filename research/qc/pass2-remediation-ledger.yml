      yuxin-kylin-v2-m-3x3). The Speedsolving wiki names both in ONE SENTENCE - "It and the YuXin
      Black Kirin V2 can be bought with transparent plastic" - which only parses if they are
      different products. Recorded "YuXin Black Kylin" as an ALIAS on yuxin-black-kirin so a
      collector searching the other romanisation finds it, WITHOUT asserting identity. Had the
      issue been resolved by merging on the spelling, it would have destroyed a real distinction.
      (2) LITTLE MAGIC V3 / "SMALL MAGIC" - raised from `uncertain` to `probable`. The flag said
      the manufacturer's page title reads "Small Magic", which is true of the HEADING only. The
      same 666toy page's BODY reads "Yuxin Little Magic Magnetically Suspended Third Order Magic
      Cube", and the manufacturer files item 1722 under its own "little-magic-series" category.
      The manufacturer uses both names on one page and calls the line Little Magic in the two
      places that outweigh a heading: its own prose and its own taxonomy. Cubezz independently
      titles it "YuXin Little Magic V3 MagLev".
      HELD AT `probable`, NOT `confirmed`, because the heading genuinely does say Small Magic -
      a real inconsistency in the manufacturer's own material, not a misreading. The existing
      alias preserves it for search.
      Both resolutions take the same shape and it is worth stating as a pattern: record the other
      name, do not assert it away. An alias costs nothing; a merge or a rename destroys
      information and is expensive to reverse.
    recommendation: >-
      Check each against the manufacturer's own Chinese-language naming and record the loser as an
      alias rather than renaming anything. Aliases cost nothing and renaming an id is expensive.
    confidence: confirmed
    downstream_impact: >-
      A collector searching the other transliteration finds nothing. That is the whole impact, and
      it is the kind an archive exists to prevent.
    owner: main
    last_updated: "2026-09-09"

  - id: P4-16
    severity: medium
    status: needs_human_decision
    title: "reference_only carries two meanings, and only one of them is documented"
    evidence: >-
      Found while closing rule 49's eight unsigned exclusions on 2026-09-09. Recovering the
      reasoning behind each one showed the lanes were not being careless - they were applying a
      consistent rule that the methodology does not describe.
      RESEARCH_SPEC 2.4 defines reference_only for ONE purpose: "Products outside roughly
      2016-2026, except where a predecessor or successor must be named to make a lineage
      intelligible - those get scope_class: reference_only, identity and aliases and nothing
      more."
      Every one of the eight is IN WINDOW. What they share is a different rule entirely, applied
      independently by four separate lanes and stated most clearly in
      research/qc/pass3-b3-agent-b-historic.md: a product that is not WCA-legal (so it fails
      `core`) and has no tier 1-3 source stating documented significance (so it fails rule 15's
      bar for `conditional`) has nowhere left to go, and lands in reference_only.
      That is a coherent, defensible policy and it is applied consistently - QiYi Warrior Plus
      (188mm, "use it as furniture"), QiYi QiMeng Plus (90mm), Meffert's Kokonotsu, YJ JinJiao
      ("non-comp-legal... strange concaveness"), ShengShou Crazy (pillowed, rings do not turn),
      and the three MFJS minis. It is simply not the policy that is written down.
      IT ALSO HAS A CONSEQUENCE 2.4 DOES NOT INTEND. build.mjs sets PUBLIC_SCOPE to {core,
      conditional}, so 2.4's lineage records are excluded from the public bundle because they are
      out-of-window stubs carrying "identity and aliases and nothing more". These eight are fully
      researched, in-window 3x3s with descriptions, specs and sources - and they are excluded by
      the same switch, for a different reason, with no separate affordance.
      MEASURED 2026-09-11, and the measurement settles the factual half of this question even
      though the POLICY half remains the user's to decide.
      THE DECISIVE FACT: not one of the 13 reference_only models has a release or announcement
      date at all. So RESEARCH_SPEC 2.4's stated criterion - "products outside roughly 2016-2026"
      - is not merely unmet by these records, it is UNTESTABLE against every single one of them
      from the fields 2.4 relies on.
      Testing it another way settles it anyway. Every one of the 13 is evidenced by sources whose
      captures fall between 2019 and 2026: calvins-crazy-mirror (2025), calvins-full-function
      (2023, 2025), kungfu-dot-cube (2020), mefferts-kokonotsu (2020), the three MFJS minis (2019,
      2019, 2020), qiyi-qimeng-plus (2025), qiyi-warrior-plus (2025, 2026), shengshou-crazy
      (2024), witeden-camouflage (2025), witeden-super-cube (2025, 2026), yj-jinjiao (2020, 2026).
      A capture bounds circulation, not release - but 13 of 13 in circulation inside the window is
      not consistent with 2.4's out-of-window reading under any interpretation.
      NOR ARE THEY IDENTITY STUBS, which is 2.4's other half ("identity and aliases and nothing
      more"). All 13 carry variants (16 between them), 6 carry specs, 4 carry two or more sources,
      and one is at `status: sourced`. These are researched records.
      SO THE SECOND, UNDOCUMENTED MEANING IS DOING ALL THE WORK: reference_only is in practice
      "in-window product that meets neither the core nor the conditional bar", and 2.4 describes
      a use that NO CURRENT RECORD makes. The divergence is total, not partial.
      WHAT IS STILL THE USER'S CALL, and why this issue stays open: which way to close it. Naming
      the second meaning in 2.4 legitimises hiding 13 researched in-window products from the
      public bundle. Rejecting it means either arguing significance for each under `conditional`
      or dropping them. Both are curation decisions that change what the archive SHOWS, and
      neither follows from the evidence above.
      The recommendation's instruction not to reclassify the 13 before the rule is decided stands,
      and is now better founded: they are consistent with each other, and the inconsistency is
      between practice and the WRITTEN RULE, not among the records.
    recommendation: >-
      Decide which of two readings is intended, and write it into 2.4 either way.
      EITHER the second meaning is legitimate, in which case name it in 2.4 - something like
      "in-window products that meet neither the core nor the conditional bar" - and consider
      whether they deserve a public affordance distinct from out-of-window lineage stubs, since
      an archive that has researched a cube thoroughly and then hides it is answering a
      collector's question with silence.
      OR the second meaning is wrong, in which case these eight belong under `conditional` with
      the significance argument rule 15 demands, or nowhere at all - and the honest answer may be
      that "documented significance" is too high a bar for an oversized novelty that a
      manufacturer really sold.
      Do NOT reclassify the eight before the rule is decided. They are consistent with each other
      right now, and that consistency is worth more than any individual placement.
    confidence: confirmed
    downstream_impact: >-
      Eight fully-researched in-window products are absent from the public bundle. Nothing is
      mis-recorded; the archive simply cannot explain, from its own methodology, why they are
      hidden. Related to P4-11, which asked a similar question about size and turned out to be a
      misreading - this one is not, because the divergence between 2.4 and practice is real.
    owner: main
    last_updated: "2026-09-09"

