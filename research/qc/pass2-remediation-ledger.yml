  - id: P4-13
    severity: low
    status: open
    title: "Two records cannot be expressed because the schema has no place for them"
    evidence: >-
      Two of the 18 unfiled escalations are not research gaps but SCHEMA gaps - a lane found a
      real thing and the data model could not hold it.
      (1) ShengShou Crazy "Jelly LE" cannot be recorded: `model_id` is required on a variant and
