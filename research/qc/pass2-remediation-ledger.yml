      Both are the same shape: the archive knows something it cannot say.
      RE-EXAMINED 2026-09-11, AND THE ISSUE'S PREMISE IS WRONG ON BOTH HALVES. Neither is a
      schema gap. Filing them as one was an artefact of both escalations coming from lanes whose
      WRITE SCOPE excluded the place the answer lived, which reads identically to a schema that
      cannot express something.
      (2) edition.commemorates IS EXPRESSIBLE AND THE MECHANISM ALREADY WORKS. `data/events/`
      exists, has its own schema (schema/event.schema.json) and holds three records, and TWO
