  - id: G1
    severity: high
    status: resolved
    title: "GAN 356 / i / i-carry boundary applies numeric identity inconsistently"
    category: taxonomy-boundary
    affected_records: >-
      data/families/gan-356.yml, gan-i-series.yml, gan-i-carry-series.yml,
      gan-flagship-series.yml; 22 already-built model records
    evidence: >-
      Six models whose manufacturer-given names begin "GAN 356" (gan-356-i, gan-356-i2,
      gan-356-i-carry, -2, -e, -s) sit outside gan-356, while gan-flagship-series deliberately
      keeps GAN11-GAN17 together despite numeric change. Numeric identity is therefore decisive
      in one place and non-decisive in the other, with no stated rule.
    counterevidence: >-
      Both readings are individually defensible: "356" may name a hardware platform, or the smart
      line may be its own lineage with a vestigial number. The inconsistency is the finding, not
      necessarily an error in either record.
    recommendation: >-
      RESOLVED 2026-09-03. Rule written to research/qc/gan-family-boundary-rule.md: a GAN family
      is the persistent name GAN itself keeps using; numeric change within a line does not create
      a family, and a name element persisting while the number is dropped IS the family identity.
      Decisive evidence is GAN's own naming behaviour - current products dropped the "356" prefix
      while keeping "i"/"i carry" (gan-i4, gan-i-carry-4). Under this reading the two rules were
      never different, only unstated. Includes a mechanical 4-step test for Pass 3.
    confidence: high
    downstream_impact: >-
      ZERO model re-parenting - 0 of 41 GAN models move. The 22 already-built models stay put.
      One question deliberately deferred to Pass 4 (non-blocking): whether gan-ui-series is an
      independent family or a smart-electronics modifier on flagship models, since ui names are
      parasitic on flagship names while i/i-carry carry their own numbering.
    owner: agent-c / main
    last_updated: "2026-09-03"

