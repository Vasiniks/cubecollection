  - id: P4-7
    severity: low
    status: needs_human_decision
    title: "Is the 2018-09-11 catalogue artefact worthless as a date, or only as a RELEASE date?"
    evidence: >-
      The archive's standing rule on TheCubicle's 'Added: 2018-09-11' field - 29 occurrences
      across 22 sources and 13 unrelated brands - is to discard it outright, "not even as a
      bound". An archive-wide sweep on 2026-09-09 found 33 date fields naming an artefact date.
      Thirty-one name it in order to refuse it, which is the discipline working. Two used it as
      the basis of a value: qj-candy-3x3 and qj-pillowed-3x3, both `introduced: 2018-09 circa`,
      both written before the artefact was identified. Both were withdrawn the same day and
      replaced with a `before 2019-08` circulation bound taken from the earliest surviving
      capture, with a full CDX sweep confirming no earlier one exists.
      That leaves one record in genuine tension with the stated rule. gan-354-m keeps
      `announced: 2018-09 before` and its note says so openly: "Retained as a weak upper bound
      only." It sits at `uncertain` confidence, so nothing rests on it.
      The tension is real and not merely wording. A migration stamp cannot date a release, but
      it may still evidence CATALOGUE PRESENCE at migration time, which would make "existed by
      2018-09" a legitimate - and tighter - bound than any capture provides. Two observations
      pull in opposite directions: products added later (escube-air 2025-11-13, pbcube-wr
      2026-08-25, haitun-waverider 2024-01-17) each carry their OWN distinct `Added:` value,
      which is consistent with the stamp marking only what was present at migration; but no
      product known to have launched after 2018-09-11 has been checked for the stamp, which is
      the test that would actually settle it.
    recommendation: >-
      Do NOT resolve this by picking the reading that yields more data. The test is specific and
      cheap: find a product whose launch is independently dated AFTER 2018-09-11 and check
      whether its TheCubicle page carries 'Added: 2018-09-11'. One such product settles it
      against the bound; a sweep finding none, across enough later products, settles it for.
      Until then leave gan-354-m as it stands - it is honest about what it is doing and its
      confidence is already `uncertain` - and leave the stated rule as the default, since the
      strict reading can only lose information, never assert a wrong one.
      The audit prints the refuse/use split on every run so a regression is visible.
    confidence: confirmed
    downstream_impact: >-
      Nothing currently depends on the answer. The two records that used the artefact are fixed;
      the one that retains it carries `uncertain`. The decision matters only if a future pass
      wants tighter introduction bounds for the mid-2010s TheCubicle catalogue.
    owner: main
    last_updated: "2026-09-09"

  - id: P4-8
    severity: medium
    status: open
    title: "Nine manufacturers rest entirely on one US English-language retailer"
    evidence: >-
      A source-class dependence sweep on 2026-09-09, across every family, model and variant
      attributed to each manufacturer, found NINE whose entire evidence base is TheCubicle and
      which carry no first-party source at all: lefun (34 citations), x-man-design (27),
      huameng (16), fanxin (13), newisland (9), cubestyle (5), guojia (5), mefferts (3),
      pbcube (3). 115 citations, one publisher, one language, one region.
      RESEARCH_SPEC 3.6a requires discovery breadth including at least one non-US/English
      retailer. These nine have none. Four more are dominant-but-not-sole on the same publisher
      (maru 89%, kungfu 90%, calvins-puzzle 86%, haitun 83%).
      The measurement only means anything because first-party citations are resolved UP THE
      parent_id CHAIN and excluded first. Without that step the sweep reports twelve
      manufacturers at 100% and three are false: monster-go and swift-block cite gancube.com
      because GAN owns them, and cube4you cites its own site. That is the strongest evidence
      available, not narrow sourcing. This was verified - both sub-brands carry parent_id gan.
      x-man-design is the sharpest case and the most tractable: 27 citations resting on one US
      retailer while its parent QiYi has a live official site that is already cited elsewhere in
      this archive for other QiYi lines.
    recommendation: >-
      Do NOT bulk-add sources to reduce the number. The requirement is INDEPENDENT corroboration,
      and adding a second US retailer that mirrors TheCubicle's own copy would satisfy the count
      while satisfying nothing else - the archive already documents retailer spec tables copied
      verbatim between vendors. Work the list in citation order, and for each manufacturer seek,
      in this order: a first-party page (x-man-design via qiyi first), then a non-US/non-English
      retailer, then a specialist reference. Record every sweep outcome including the empty ones;
      an unrecorded sweep is indistinguishable from one never run.
    confidence: confirmed
    downstream_impact: >-
      No claim is known to be WRONG because of this. Rule 9 already prevents a `confirmed` from
      resting on one publisher, so the effect is a ceiling on confidence rather than an error:
      these manufacturers cannot rise above `probable` on their current evidence, and a single
      retailer's error or omission propagates unchecked through everything attributed to them.
      The audit prints the list every run, so the number moves visibly in either direction.
    owner: main
    last_updated: "2026-09-09"

  - id: P4-9
    severity: critical
    status: needs_human_decision
    title: "The frozen 269-model inventory is missing current-generation flagships, including MoYu's and X-Man's"
    evidence: >-
      A complete enumeration of TheCubicle's live 3x3 collection on 2026-09-09 (578 products,
      preserved as thecubicle-3x3-collection-enumeration-2026-09) found NINE manufacturer-branded
      product lines with no corresponding model in the frozen 269. Attribution is read from the
      retailer's OWN structured `vendor` field, not parsed from titles, and TheCubicle's service
      and collaboration listings (Cubicle Pro Shop, Griesser's, Tommy Cherry's, PiCube SE,
      SAOCube SE) are excluded, since those belong to the `thecubicle` service manufacturer.
      MoYu WeiLong V11 (14 SKUs, first listed 2025-06-06) - MoYu's CURRENT FLAGSHIP; the archive's
      newest WeiLong is V9. MoYu WeiLong WRM V10 (6 SKUs, 2024-05-09). MoYu WeiLong V10 AI
      (2024-08-15). MoYu Super WeiLong V2 (3 SKUs, 2025-02-11). MoYu AoLong V5 (4 SKUs,
      2026-06-18). X-Man Tornado V5 (4 SKUs) - X-Man's CURRENT FLAGSHIP, independently confirmed
      in stock at Cubelelo with three distinct SKUs and its own version-comparison table; the
      archive's newest Tornado is V4. MFJS MeiLong 3M V2 (3 SKUs). MoYu FerYooCore and FerYooCore
      V2 (3 SKUs). SAOCube V56 (2 SKUs) - under a manufacturer the archive already records.
      THIS IS NOT A RECENCY HORIZON. The `published_at` listing dates place WRM V10 on sale from
      2024-05-09 and WeiLong V11 from 2025-06-06 - both more than a year before Pass 3's MoYu
      lane ran on 2026-09-03 and recorded a "full WeiLong succession" ending at V9. The products
      were on sale, at a retailer this archive cites 115 times, while the enumeration was
      running.
      MECHANISM, indicated but not proven: moyu-weilong-v9's succession evidence is
      speedsolving-wiki-moyu, whose stored excerpt mentions no year later than 2019 and whose
      capture is 2025-08. A wiki-led enumeration that never checked the retailer's current
      catalogue would produce exactly this gap. That is consistent with P4-8's finding about
      source-class dependence, though NOT its cause here - TheCubicle stocks every missing line,
      so breadth of retailer would not have helped. RECENCY of the source class would have.
      CONTROL, so the finding is not overstated. The same enumeration confirms MoYu RS3 M V5,
      QiYi M Pro V2, YuXin Kylin V2, YuXin HuangLong V2 and YuXin Little Magic V3 are all present
      in the frozen inventory. The gap is specific, not a wholesale coverage failure. Two entries
      on the first candidate list (Little Magic V3, HuangLong V2) were name-matcher false
      positives and were removed after checking the files directly.
      CORROBORATED ACROSS TWO FURTHER RETAILERS on the same day (source
      cross-retailer-3x3-enumeration-2026-09): SpeedCubeShop (265 products) and Cubelelo, India
      (69). Three further lines with no model in the frozen 269, and they widen the gap beyond
      MoYu and X-Man. QiYi AI 3x3 Bluetooth Smart Cube, 2 SKUs from 2024-04-07 - the archive
      holds 24 QiYi models and NOT ONE is a smart cube, while it does carry the smart lines of
      GAN, Giiker, Particula, Rubik's and MoreTry. GAN 330 3x3 Mini, keychain format, listed
      2020-05-05 - over SIX YEARS before Pass 3, against 132 GAN-attributed records. ShengShou
      Lustrous Light-Up 3x3 (Magnetic), 2024-06-13.
      So the gap spans at least four manufacturers, is corroborated by three independent
      retailers including a non-US one, and in the GAN case predates the enumeration by six
      years. Recorded but NOT counted, because their scope is genuinely unsettled: DianSheng Big
      and Giant 3x3, MoYu and YJ 3x3 Minis, and several Calvin's Puzzle printed/novelty lines.
      A "QiYi X" candidate with 8 SKUs was a title-parsing artefact ("QiYi X-Man" cut at the
      first token) and is recorded as a false positive so it is not rediscovered.
      MADE REPEATABLE. The sweep is now `npm run catalogue-gap` (scripts/catalogue-gap.mjs),
      offline by default like check-links, `--fetch` to query. Building it caught a flaw in the
      manual sweep that had made the finding LOOK smaller: matching catalogue lines against
      FAMILY names as well as model names silently swallowed every missing generation, because
      "MoYu WeiLong V11" contains the family name "MoYu WeiLong". A check that hides the thing it
      was written to find is worse than none. Matching model names only, with a generation-token
      rule so a versioned line can never match an unversioned name, the script surfaces the
      flagships AND two lines the manual sweep missed entirely: MoYu Super AoLong (6 SKUs,
      2025-11-01, two retailers) and MoYu Super AoLong AI (4 SKUs). It also drops the "QiYi X"
      artefact, which came from splitting titles on any hyphen and cutting "QiYi X-Man".
      ONE RESULT BEARS ON A DOCUMENTED PASS 3 CONCLUSION. "Cyclone Boys Metallic 3x3" is listed
      at TWO retailers with its own SKUs from 2021-09-29, while cyclone-boys-metallic-3x3 is one
      of the archive's three deliberate ZERO-MODEL families, concluded as "\'Metallic\' is a
      finish treatment - a Pass 4 variant axis, not a model line". That conclusion may still be
      right, since a retailer selling a named finish does not make it a model. But it was reached
      without this evidence and should be re-examined with it, not left standing by default.
      The script reports 56 lines at two or more SKUs. It is tuned to under-report and still
      over-reports: several are naming variations of models the archive holds ("MoYu Super
      WeiLong 3x3" against moyu-weilong-super). Every line it prints needs human confirmation,
      and its silence confirms nothing. Only the twelve verified by hand are claimed above.
      ADJUDICATED IN FULL 2026-09-09 — research/qc/p4-9-adjudication.yml, all 261 candidates
      classified, none left unadjudicated. The distribution answers the question this issue
      was raised to ask, and the answer is "both, at two different layers".
      MODEL LAYER: 20 confirmed_missing, of which TWELVE are later generations of lines the
      archive already holds and EIGHT of those twelve are MoYu. The method does systematically
      miss newer generations; it is one manufacturer's entire recent output, not oversight.
      MANUFACTURER LAYER: 71 lines from SEVEN vendors absent from the 54 — escalated separately
      as P4-10, because it is a larger gap in kind and has a different fix.
      THE TWO FIXES DIFFER, which is why separating them mattered. Missed generations are a
      RECENCY failure — the line was found and enumeration stopped before its later products —
      and `npm run catalogue-gap` now covers it. Missing manufacturers are a BREADTH failure:
      no amount of re-checking known lines would ever surface them. That is Pass 1 work.
      HALF THE CANDIDATES WERE CORRECTLY NOT GAPS: 126 of 261 (48%) are out-of-scope novelties,
      retailer service listings, bundles, licensed prints belonging at variant level, or
      products the archive already holds under another name. Fourteen were the latter, including
      moretry-tianma-x3-v4 where a "+" in the retailer title was the whole difference. That is
      the tool behaving as documented, and why adjudication was required rather than counting.
      44 REMAIN UNRESOLVED, and the largest group of them is a POLICY question, not a research
      one — the mini/keychain and oversized scope inconsistency, escalated as P4-11.
      ONE ADJUDICATION IS THE CRUX AND IS DELIBERATELY UNRESOLVED: the archive records
      moyu-weilong-wr-m-2020 and -2021 while retailers number the same line WRM V9 and V10. If
      WRM V9 is wr-m-2021 under another scheme, that candidate is alternate_naming and the gap
      is smaller; if not, both V9 and V10 are missing. Settling it needs a statement tying a WRM
      version number to a year, which this pass did not find.
    recommendation: >-
      This overturns a frozen inventory and is NOT this phase's call to make. No model or family
      was created; the evidence is preserved instead, which is what the freeze requires.
      When authorised, the correct response is an enumeration pass, not nine hand-added records:
      each line needs the model-vs-variant boundary applied (WeiLong V11's 14 SKUs are plainly
      variants of one model, not 14 models), a release date from an explicit dated statement
      rather than the `published_at` field used here, and the WRM naming reconciled - the archive
      records wr-m-2020 and wr-m-2021 while the retailer numbers the same line WRM V9 and V10,
      and whether those are the same products under two schemes is unresolved.
      Before that pass, answer the question this raises about the other 268: the same wiki-led
      method was used across Pass 3. This enumeration covers ONE retailer's 3x3 collection. The
      equivalent sweep has not been run for any other current catalogue.
    confidence: confirmed
    downstream_impact: >-
      Nothing in the archive is WRONG because of this; the 269 records that exist are unaffected
      and the control above shows coverage is broadly sound. What is wrong is a completeness
      claim: Pass 3 is recorded as having enumerated the full WeiLong succession and the full
      X-Man Tornado line, and it did not. Pass 4's "269 of 269 models assessed" remains true as
      stated - every model in the inventory was assessed - but the inventory itself is not
      complete for the current generation, and the exhibition would be missing the flagship
      3x3 of the archive's single most heavily-represented manufacturer.
    owner: main
    last_updated: "2026-09-09"

  - id: P4-10
    severity: critical
    status: needs_human_decision
    title: "Seven manufacturers are absent from the 54 entirely, one of them substantial"
    evidence: >-
      Found while adjudicating P4-9 (research/qc/p4-9-adjudication.yml, all 261 candidates
      classified). P4-9 asked which MODELS were missing. Classifying every candidate by its
      retailer-declared `vendor` field surfaced a larger question the escalation had not asked:
      seven vendors selling 3x3s at these retailers have no manufacturer record at all.
      ZIINA is the substantial one - 51 candidate lines at TheCubicle from 2023-11 onward, under
      the vendor names "Ziina" and "Ziina Star". Most are printed themes (World Map, Christmas,
      Halloween, Emoji, Chemistry, Mahjong, Poker, Mosaic), and this archive treats printed
      themes as VARIANT-level: it holds fourteen LeFun print editions on exactly that basis. So
      these are in-scope variant material that cannot exist until a Ziina manufacturer, family
      and model do. Two lines ("Ziina Space Magnetic", "Ziina Lite-Super") read as base
      speedcubes rather than prints.
      The others: VIN Cube / VIN3 (6 lines - Nova, Lite, Racer, a naming pattern that reads as
      one line in three configurations), Cubelelo's own "Drift" house brand (4), and single
      lines from YZ, Cube Lab, ZePuzzles and Smart Cube Labs.
      A MISSING MANUFACTURER IS A LARGER GAP IN KIND THAN A MISSING MODEL, because every family,
      model and variant beneath it is missing too and nothing in the archive can point at the
      hole. P4-9's twelve missed generations are recoverable by re-checking lines the archive
      already knows; nothing in the archive could ever surface Ziina.
      NOT EVERY UNKNOWN VENDOR IS A MISSING MANUFACTURER, and checking that mattered: "Spin
      Master" is Rubik's parent company, a corporate label rather than a brand, and the six lines
      under it are licensed prints the archive already handles correctly as variants of
      rubiks-classic-cube.
      DECORATOR-VS-MANUFACTURER QUESTION ANSWERED 2026-09-09, and it was the first thing this
      issue said had to be settled. Evidence preserved as
      data/sources/thecubicle-ziina-space-magnetic-3x3-2025.yml.
      "Ziina Space Magnetic 3x3" is described by the retailer as "a budget-friendly 3x3 with
      great turning right out of the box... as with most budget puzzles, a little set-up goes a
      long way", with a full specification table reading "Manufacturer: Ziina", "Dimensions:
      56.0mm3", "Item Weight: 68.0g". No reference to printing, decoration or artwork anywhere
      on the page. That is a BASE SPEEDCUBE sold under the Ziina name, not a decorated cube made
      by someone else. A second Ziina line, "Lite-Super", IS a printed edition ("premium
      UV-printed surface"), so Ziina sells both - which is exactly what LeFun does, and this
      archive already models LeFun as a manufacturer with variant-level print themes.
      So Ziina is not merely a decorator, and RESEARCH_SPEC 2.3 is satisfied on materiality: the
      product has a name, a manufacturer and specifications a record can hold.
      WHAT IS STILL NOT ESTABLISHED, and blocks admission rather than merely qualifying it: WHO
      MAKES IT. A retailer "Manufacturer" field records who the brand is sold as, not who
      produced it, and the archive has OEM and rebrand rules (2.3, rule 17) precisely because
      those differ. Ziina could be an independent maker, a house brand of an existing
      manufacturer, or an OEM rebrand - and the third case would make it a variant layer under
      someone else rather than a 55th manufacturer. Both corroborating structures (the spec
