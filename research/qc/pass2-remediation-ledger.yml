  # ---- Pass 4 findings (2026-09-08) -------------------------------------------

  - id: P4-1
    severity: low
    status: open
    title: "Rule 18 checks variants only, so out-of-range model sizes surface late and as false positives"
    category: tooling
    affected_records: "8 models; warnings appear on their variants, not on the models themselves"
    evidence: >-
      lint-semantic rule 18 warns when size_mm falls outside a plausible 50-60mm range. It
      iterates VARIANTS and resolves the value from the parent model, so a model whose own size
      is out of range is invisible to the rule until a variant is enumerated beneath it - at
      which point the warning lands on the variant even though the variant inherits the value
      and asserts nothing itself. Surfaced by Pass 4 Agent B on qiyi-valk-3-mini (47.4mm), which
      correctly flagged it rather than working around it. Eight models sit outside the window,
      all for good reasons: maru-nano-original 15mm, cyclone-boys-mini-3x3-original 40mm,
      mfjs-mini-3x3-keychain-40mm 40mm, dayan-zhanchi-42mm 42mm, mfjs-mini-3x3-45mm 45mm,
      qiyi-valk-3-mini 47.4mm, shengshou-crazy-original 60.5mm, shengshou-legend-big 70mm.
    counterevidence: >-
      The rule is doing its job for standard speedcubes and has caught real errors before. These
      are genuine mini and oversized products, so the range is simply not calibrated for them.
      No data is wrong; the warnings are advisory and block nothing.
    recommendation: >-
      Do NOT denormalise a size onto a variant to dodge the warning, and do not alter frozen
      model specs. Note rule 18 checks weight_g on the same pattern: mfjs-mini-3x3-keychain-40mm
      surfaced a 41.3g weight warning against a 50-130g range, so the exposure is not limited to
      size. Options for later: widen the range, exempt a variant whose size is inherited
      rather than overridden, or check the model directly so the signal appears where the value
      actually lives.

      PARTIALLY IMPLEMENTED 2026-09-09: the third option is done. Rule 18 now reports an inherited
      out-of-range value ONCE on the model that asserts it, and warns on a variant only when the
      variant overrides the spec itself. maru-3x3-original had been firing eight times for one
      fact, once per Special Patterns sticker variant, none of which asserts a size at all. Total
      rule-18 warnings fell from 18 to 11 and every one now points at the file a fix would edit.
      The RANGE is deliberately unchanged: it still flags maru-nano at 15mm and
      shengshou-legend-big at 70mm, which are true statements about unusual products, and
      widening it to silence them would blind the rule to the case it exists for.
    confidence: confirmed
    downstream_impact: >-
      Cosmetic. The practical risk is a researcher suppressing a legitimate variant to keep a
      warning count at a stale baseline, which is why the running lanes were warned explicitly.
    owner: main
    last_updated: "2026-09-08"

