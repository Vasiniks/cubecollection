  - id: Q1
    severity: critical
    status: in_progress
    title: "theqiyi-about-us is an Amazon affiliate site recorded as manufacturer_official (tier 1)"
    category: source-provenance
    affected_records:
      - data/sources/theqiyi-about-us.yml
      - data/manufacturers/qiyi.yml          # /country /founded /website (confirmed, no other T1)
      - data/manufacturers/x-man-design.yml  # /kind (confirmed, no other T1)
      - data/families/x-man-tornado.yml      # /positioning /aliases (confirmed, no other T1)
    evidence: >-
      Live fetch of https://theqiyi.com/about-us.html returns a footer reading verbatim
      "QIYI is a participant in the Amazon Services LLC Associates Program ... to earn
      advertising fees by advertising and linking to Amazon.com (c) 2025 QIYI". No ICP filing,
      no contact address, no native checkout, products link to Amazon. A manufacturer does not
      earn affiliate commission on its own products. Speedsolving wiki gives a different domain
      (qiyitoys.net) and founding year "unknown", while this page asserts a specific 1998
      founding narrative found nowhere else.
    counterevidence: >-
      The page presents itself as QiYi's and its title/publisher claim first-party status. Not
      yet excluded: that theqiyi.com is a legitimate QiYi regional or marketing site that also
      runs affiliate links, or that the domain changed hands. Agent A is tasked with falsifying
      the illegitimacy conclusion.
    recommendation: >-
      Re-kind or apply explicit tier:4 override with justification; re-source or downgrade the
      six orphaned confirmed attestations; correct qiyi.website; re-source QiYi's founding year.
      Do NOT apply until replacement evidence exists - the fix breaks six confirmed claims and
      would leave validation red.
    confidence: high
    downstream_impact: >-
      Blocks Pass 3 for QiYi and X-Man Design (11 families). Models inherit manufacturer_id by
      construction, so building on a disputed attribution means systemic re-parenting later.
    owner: agent-a
    last_updated: "2026-09-03"

  - id: E1
    severity: critical
    status: needs_human_decision
    title: "111 attestations rest solely on tier-4 sources, contradicting the archive's own rules"
    category: evidence-policy
    affected_records: "~53 of 122 families; 32 are /introduced fields; 107 reported + 4 probable"
    evidence: >-
      vocab/confidence.yml defines `reported` as "Tier 3 source, uncontradicted and plausible".
      RESEARCH_SPEC.md line 103 defines tier 4 as "Corroborates only. Never establishes".
      Almost all 111 cite Speedsolving.com per-manufacturer product-history pages, which derive
      to tier 4 via kind: wiki. Two independent methods converged on the count.
    counterevidence: >-
      RESEARCH_SPEC line 102 defines tier 3 as including "long-form community documentation",
      which arguably describes these pages better than tier 4's "unattributed wikis". Under that
      reading `reported` is already correct and no data need change.
    recommendation: >-
      Two defensible options. (1) Downgrade all 111 to uncertain. (2) Use the existing per-source
      tier override to reclassify the specific Speedsolving product-history pages to tier 3, with
      individual written justification, never as a blanket rule for kind: wiki. Main session
      leans to (2) scoped narrowly. Requires human sign-off either way.
    confidence: high      # that a rule is broken; the resolution is a policy choice
    downstream_impact: >-
      ~53 families. Enumerating models beneath them before the decision means redoing the
      attestations afterwards.
    owner: agent-b
    last_updated: "2026-09-03"

