  - id: P26-2
    severity: critical
    status: open
    title: "Escalation roll-up has no mechanism; real findings went silent twice"
    category: process
    affected_records: "research/qc/pass3-progress.md, research/qc/pass2-remediation-ledger.yml"
    evidence: >-
      Two independent failures. (1) Pass 3 Batch 1 lanes C (DaYan) and D (YJ+ShengShou) were
      killed by rate limits; the recovery pattern rescued their records but their reports were
      never written, so 24 families and 56 models were enumerated with no escalation roll-up.
      The ShengShou YuFeng escalation survived only because that agent also wrote it into
      data/sources/thecubicle-shengshou-products-prefix-2026.yml notes, where it sat at
      status sourced and unpropagated. (2) research/qc/pass3-b2-agent-c-cycloneboys-maru.md
      SURVIVED and explicitly records six Cyclone Boys and four Maru lines as having no frozen
      family - and still never reached the ledger. pass3-progress.md listed six open
      escalations when the true number was materially higher.
      MEASURED 2026-09-09, and the measurement is worse than the issue assumed. Across 74 reports
      in research/qc and research/notes: only NINE declare escalations in a machine-readable
      block, THIRTY-SEVEN use escalation language with no such block, and 28 mention neither.
      Of the 25 escalation entries that ARE declared in blocks, ZERO cite a ledger id - all 25
      are free prose. So the linkage is not weak, it is absent: a report escalation and a ledger
      entry cannot be matched by any means even when both were written correctly.
      That is precisely why the two Pass 3 lane deaths went silent, and why this issue recurred
      during the remediation, and why it recurred AGAIN on 2026-09-09 - E1 recorded mf8-products
      and mofang-jiaoshi as "held for human decision" in this ledger and in neither source file.
      Found while closing P4-6, by reading the records rather than the ledger.
      A partial guard already holds and is worth stating so a regression is visible: every
      ledger-issue id referenced anywhere in prose DOES resolve to a real ledger entry (checked
      archive-wide, zero dangling). The failure is entirely in the other direction - findings
      that never acquire an id at all.
      Now measured on every `npm run audit` run, so the numbers move visibly instead of being
      rediscovered by the next person who reads a lane report.
    counterevidence: >-
      None. Both failures verified directly against the repository this pass.
      MECHANISM BUILT 2026-09-09 — `npm run escalations` (scripts/check-escalations.mjs), now
      part of `npm run check`. It enforces the linkage this issue said did not exist:
      research report -> machine-readable escalations: block -> ledger issue id -> status.
      Each arrow is checkable and each was previously absent.
      THE RETROFIT IS THE FINDING. All 25 declared escalation entries across 9 reports were
      tagged with a ledger id or UNFILED. Result: SEVEN map to a filed issue (P3-T2, P3-T4,
      P4-1, P4-2, P4-4 x2, P4-9) and EIGHTEEN WERE NEVER FILED AT ALL. That is this issue
      measured at the entry level: agents declared findings correctly, in the right place, in a
      machine-readable block - and 72% of them still went nowhere.
      The 18 are now loud rather than silent. UNFILED is deliberately NOT an error: the point is
      that a finding cannot go quiet, not that a lane must stop to file paperwork mid-run. A
      DANGLING id IS an error, because it means a report cites an issue that does not exist.
      WHY IT DOES NOT SCAN PROSE. 38 reports use escalation language with no block, and most
      discuss the concept rather than raise a finding. Treating every mention as an escalation
      would flag all 38, and a check that cries wolf gets ignored - which is how the archive
      lost findings in the first place. The contract is narrow: DECLARE an escalation and it
      must carry an id or UNFILED. The 38 are counted and reported softly, never failed.
      Format chosen for retrofittability: "- [P4-9] text" rather than a nested id/summary
      mapping, so all nine existing free-prose blocks were tagged WITHOUT rewriting a word. A
      convention that forces existing findings to be re-typed is one that gets skipped.
      RETROFIT COMPLETED 2026-09-09. All 25 declared escalations are now traceable: 23 linked to
      a ledger issue, 2 marked NOTFINDING, 0 unfiled, 0 unmatched. Closing the 18 required
      filing four new grouped issues rather than eighteen singletons - P4-12 (six model/variant
      boundary questions deferred by the freeze), P4-13 (two records the schema cannot express),
      P4-14 (three self-reported evidence weaknesses), P4-15 (two YuXin naming questions) - plus
      linking three to issues that already existed (P3-T3, P3-T4, P26-3).
      ONE OF THE EIGHTEEN WAS ALREADY FIXED AND NOBODY KNEW. A Pass 4 lane reported that rule 15
      checked scope_class/legality directly on the variant with no model-to-variant inheritance,
      forcing conditional Bermuda variants to restate their model verbatim. That was fixed
      during the P26-13 work for an unrelated reason, and validate.mjs now resolves both through
      the parent. The report still said "unresolved" until today. That is this issue in one
      example: the finding was declared, independently fixed, and the loop never closed.
      NOTFINDING was added to the vocabulary for the two entries that record a RUN condition
      rather than an archive defect ("WebSearch budget exhausted", "wayback prefix failed on
      every attempt"). Without it the only options were to file noise into the ledger or to
      leave honest run-notes looking like unfiled findings.
    recommendation: >-
      Make roll-up checkable. In preference order: require every escalation to also be written
      into a canonical record's notes (the practice that saved the ShengShou finding); add a
      lint rule scanning record prose and reports for escalation language with no matching
      ledger id; require a ledger entry before a lane counts as merged. Additionally, treat a
      killed lane as unrecovered until its report exists or it is marked report_lost: true.
    confidence: confirmed
    downstream_impact: >-
      The defective step is the roll-up, not the research. Every finding was made correctly and
      written honestly; the archive had no mechanism guaranteeing it reached the ledger.
    owner: main
    last_updated: "2026-09-07"

  - id: P26-3
    severity: high
    status: open
    title: "RESEARCH_SPEC 3.6a was never applied retroactively to the frozen family taxonomy"
    category: methodology
    affected_records: "data/families/ (all 122), data/manufacturers/ (all 54)"
    evidence: >-
      Three separable discovery mechanisms failed. (1) Retailer-channel narrowness: only
      US/English retailers checked - missed FangShi GuangYing/JieYun and CubeTwist. (2)
      URL-pattern narrowness: a retailer /collections/ page instead of the raw /products/
      prefix on the SAME retailer - missed six ShengShou lines. The archive's own source record
      states this outright: the collections page "filters differently than the raw /products/
      prefix and missed a live, dated 3x3 catalogue." RESEARCH_SPEC 3.6a already mandates BOTH
      checks. It was added 2026-09-03, after Pass 2 family enumeration completed.
      MEASURED 2026-09-09, turning this issue from a narrative into a coverage table now printed
      by `npm run audit`. Of 42 manufacturers with cited sources, only 23 have a 3.6a-style
      prefix or collection sweep and only 22 have a single non-US source. TWELVE FAIL BOTH.
      The entry that matters is MoYu: 109 citations, the archive's most heavily cited
      manufacturer, and it fails both checks. It also accounts for EIGHT of the fourteen product
      lines that escalation P4-9 found missing from the frozen inventory. Next heaviest without
      a sweep: rubiks 31, particula 28, mf8 26, giiker 17, guoguan 16.
      THE CORRELATION IS REAL BUT NOT TOTAL, and the exception is the more useful half. Four of
      P4-9's fourteen lines belong to manufacturers that DO satisfy 3.6a (qiyi, gan, shengshou,
      saocube), so retroactive compliance would NOT by itself have prevented P4-9. The reason is
      a limit in 3.6a itself rather than in its application: it mandates ARCHIVED retailer
      sweeps, which look backwards by construction, and nothing in it requires checking a
      CURRENT catalogue. A perfectly compliant archived sweep run against 2023 captures cannot
      surface a product listed in 2025.
      That gap is now covered by a separate command, `npm run catalogue-gap`, which is why it
      could not simply be folded into 3.6a compliance.
      A THIRD DISCOVERY-BREADTH FAILURE MODE FOUND 2026-09-09, and it is the same shape as the
      two this issue already records. 3.6a names retailer-channel narrowness and /collections/
      versus /products/ narrowness. Add SLUG-FORM narrowness.
      A CDX prefix sweep of thecubicle.com/products/gan-356-i returns essentially nothing usable:
      27 URLs, of which all but two are the same two products repeated with tracking parameters.
      The SAME retailer files the rest of the line under `gan356-` with no hyphen, and a sweep of
      thecubicle.com/products/gan356 returns 33 distinct products including gan356-i-carry-e-3x3,
      gan356-i-carry-s-3x3, gan356-i2, gan356-i3-v2-3x3, gan356-i-play, gan356-m-lite,
      gan356-m-3x3-uv-coated, gan356-me-v2-3x3-uv-coated and six named gan356-me editions
      (Christmas, 2025 Lunar New Year, Brainstorm Voyage, 10th Anniversary).
      A sweep on one slug form is therefore not a sweep of the line. It reports "swept, nothing
      found" while missing most of what exists - the same false confidence as checking a
      /collections/ page instead of the /products/ prefix.
      IT IMMEDIATELY YIELDED A REAL RECORD: gan-356-i-carry--brainstorm-voyage, a named edition
      absent from every live catalogue because it is discontinued, found only on the alternate
      slug form. It also carried a trap - its slug reads "i-carry-2" while its title, its
      description and its 79.0g item weight (against the i Carry 2's 88.0g) all say i Carry.
      Three signals against one, and the slug is the one that lies.
    counterevidence: >-
