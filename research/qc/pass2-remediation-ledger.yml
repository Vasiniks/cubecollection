  - id: P4-3
    severity: medium
    status: resolved
    title: "Lanes split on whether a single-configuration model earns a lone standard variant"
    category: methodology
    affected_records: "69 lone --standard variants exist; ~146 models sit at zero"
    evidence: >-
      Batch 1 produced two incompatible readings of the same brief. Lanes A and B gave EVERY
      model in scope at least one variant, so a model sold in one configuration carries a bare
      --standard record: moyu 23/23, qiyi 24/24, x-man 5/5. Lanes C and D left most models at
      zero: yj 4/23, dayan 8/28, shengshou 4/18. Both readings are defensible. The GAN pilot
      supports lanes A and B - all 40 GAN models carry at least one variant and gan-354-m's lone
      standard is exactly that shape. The Pass 4 brief supports lanes C and D, since it states
      that a model with zero variants is a complete correct result and that variants must not be
      manufactured to raise a count. 69 lone --standard records now exist archive-wide, 23 of
      them pre-dating Pass 4 from the GAN pilot.
    counterevidence: >-
      A lone --standard record is not empty: it carries an attestation and typically a note
      stating that no colourway, magnet or coating option was found. It asserts "this model was
      sold in one configuration", which is a real finding rather than a placeholder. That is why
      neither reading is wrong, only inconsistent.
    recommendation: >-
      Decide the convention BEFORE batch 2, so the remaining ~90 models are enumerated one way.
      Whichever is chosen, the other half should be reconciled: either add ~146 lone standards,
      or remove the 69 that exist and record single-configuration findings in the model record
      instead. Do NOT normalise 146 records silently either way - it is a large mutation and a
      genuine curatorial choice about whether the variant layer represents configurations or
      configuration DIFFERENCES.
    confidence: confirmed
    downstream_impact: >-
      "Models at zero" is currently not comparable across manufacturers, so any coverage metric
      computed from it is misleading until the convention is settled.
