      2024-05-09 and WeiLong V11 from 2025-06-06 - both more than a year before Pass 3's MoYu
      lane ran on 2026-09-03 and recorded a "full WeiLong succession" ending at V9. The products
      were on sale, at a retailer this archive cites 115 times, while the enumeration was
      running.
      MECHANISM, indicated but not proven: moyu-weilong-v9's succession evidence is
      speedsolving-wiki-moyu, whose stored excerpt mentions no year later than 2019 and whose
      capture is 2025-08. A wiki-led enumeration that never checked the retailer's current
      catalogue would produce exactly this gap. That is consistent with P4-8's finding about
      source-class dependence, though NOT its cause here - TheCubicle stocks every missing line,
      so breadth of retailer would not have helped. RECENCY of the source class would have.
      CONTROL, so the finding is not overstated. The same enumeration confirms MoYu RS3 M V5,
      QiYi M Pro V2, YuXin Kylin V2, YuXin HuangLong V2 and YuXin Little Magic V3 are all present
      in the frozen inventory. The gap is specific, not a wholesale coverage failure. Two entries
      on the first candidate list (Little Magic V3, HuangLong V2) were name-matcher false
      positives and were removed after checking the files directly.
      CORROBORATED ACROSS TWO FURTHER RETAILERS on the same day (source
      cross-retailer-3x3-enumeration-2026-09): SpeedCubeShop (265 products) and Cubelelo, India
      (69). Three further lines with no model in the frozen 269, and they widen the gap beyond
      MoYu and X-Man. QiYi AI 3x3 Bluetooth Smart Cube, 2 SKUs from 2024-04-07 - the archive
      holds 24 QiYi models and NOT ONE is a smart cube, while it does carry the smart lines of
      GAN, Giiker, Particula, Rubik's and MoreTry. GAN 330 3x3 Mini, keychain format, listed
      2020-05-05 - over SIX YEARS before Pass 3, against 132 GAN-attributed records. ShengShou
      Lustrous Light-Up 3x3 (Magnetic), 2024-06-13.
      So the gap spans at least four manufacturers, is corroborated by three independent
      retailers including a non-US one, and in the GAN case predates the enumeration by six
      years. Recorded but NOT counted, because their scope is genuinely unsettled: DianSheng Big
      and Giant 3x3, MoYu and YJ 3x3 Minis, and several Calvin's Puzzle printed/novelty lines.
      A "QiYi X" candidate with 8 SKUs was a title-parsing artefact ("QiYi X-Man" cut at the
      first token) and is recorded as a false positive so it is not rediscovered.
      MADE REPEATABLE. The sweep is now `npm run catalogue-gap` (scripts/catalogue-gap.mjs),
      offline by default like check-links, `--fetch` to query. Building it caught a flaw in the
      manual sweep that had made the finding LOOK smaller: matching catalogue lines against
      FAMILY names as well as model names silently swallowed every missing generation, because
      "MoYu WeiLong V11" contains the family name "MoYu WeiLong". A check that hides the thing it
      was written to find is worse than none. Matching model names only, with a generation-token
      rule so a versioned line can never match an unversioned name, the script surfaces the
      flagships AND two lines the manual sweep missed entirely: MoYu Super AoLong (6 SKUs,
      2025-11-01, two retailers) and MoYu Super AoLong AI (4 SKUs). It also drops the "QiYi X"
      artefact, which came from splitting titles on any hyphen and cutting "QiYi X-Man".
      ONE RESULT BEARS ON A DOCUMENTED PASS 3 CONCLUSION. "Cyclone Boys Metallic 3x3" is listed
      at TWO retailers with its own SKUs from 2021-09-29, while cyclone-boys-metallic-3x3 is one
      of the archive's three deliberate ZERO-MODEL families, concluded as "\'Metallic\' is a
      finish treatment - a Pass 4 variant axis, not a model line". That conclusion may still be
      right, since a retailer selling a named finish does not make it a model. But it was reached
      without this evidence and should be re-examined with it, not left standing by default.
      The script reports 56 lines at two or more SKUs. It is tuned to under-report and still
      over-reports: several are naming variations of models the archive holds ("MoYu Super
      WeiLong 3x3" against moyu-weilong-super). Every line it prints needs human confirmation,
      and its silence confirms nothing. Only the twelve verified by hand are claimed above.
    recommendation: >-
      This overturns a frozen inventory and is NOT this phase's call to make. No model or family
      was created; the evidence is preserved instead, which is what the freeze requires.
      When authorised, the correct response is an enumeration pass, not nine hand-added records:
      each line needs the model-vs-variant boundary applied (WeiLong V11's 14 SKUs are plainly
      variants of one model, not 14 models), a release date from an explicit dated statement
      rather than the `published_at` field used here, and the WRM naming reconciled - the archive
      records wr-m-2020 and wr-m-2021 while the retailer numbers the same line WRM V9 and V10,
      and whether those are the same products under two schemes is unresolved.
      Before that pass, answer the question this raises about the other 268: the same wiki-led
      method was used across Pass 3. This enumeration covers ONE retailer's 3x3 collection. The
      equivalent sweep has not been run for any other current catalogue.
    confidence: confirmed
    downstream_impact: >-
      Nothing in the archive is WRONG because of this; the 269 records that exist are unaffected
      and the control above shows coverage is broadly sound. What is wrong is a completeness
      claim: Pass 3 is recorded as having enumerated the full WeiLong succession and the full
      X-Man Tornado line, and it did not. Pass 4's "269 of 269 models assessed" remains true as
      stated - every model in the inventory was assessed - but the inventory itself is not
      complete for the current generation, and the exhibition would be missing the flagship
      3x3 of the archive's single most heavily-represented manufacturer.
