      are source-specific with individual justification and restricted permitted claim types;
      kind: wiki remains tier 4 archive-wide. A tier-3 override cannot create a false confirmed
      - rule 9 still requires tier 1 or two independent tier 1-2.
    confidence: high
    downstream_impact: >-
      111 violations reduced to 12. The remaining 12 are the deliberate human-decision set.
    owner: agent-b / main
    last_updated: "2026-09-03"

