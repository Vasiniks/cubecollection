# Global Pass 0 — manufacturer candidate backlog
#
# NOTHING HERE IS A FACT. These are brand-shaped names harvested from two retailers' archived
# collection URLs. A retailer collection proves that retailer grouped products under a name. It
# does not prove the name is a manufacturer, that the manufacturer made 3x3s, or that two
# spellings are two companies.
#
# Method (do not repeat — the raw output is saved beside this file):
#   npm run wayback -- prefix 'thecubicle.com/collections/'    --limit 25000
#   npm run wayback -- prefix 'speedcubeshop.com/collections/<letter>' --limit 4000   # a-z
# Yielded 260 and 386 distinct collection slugs respectively.

staged_by: main-agent
staged_on: "2026-09-02"
scope: >
  Candidate manufacturer universe for 2016-2026 3x3 speedcubes, harvested before
  canonicalisation. Recall first; identity resolution is the next step.

# ---------------------------------------------------------------- already canonical
already_canonical: [gan, monster-go, swift-block, thecubicle, picube, cubicle-labs]

# ---------------------------------------------------------------- high confidence: real
# manufacturers, seen at BOTH retailers, and named in the project seed list
strong_candidates:
  - { name: "MoYu",          slugs: [moyu, moyu-speed-cubes],        seen: [thecubicle, speedcubeshop] }
  - { name: "QiYi",          slugs: [qiyi, qiyi-mofangge],           seen: [thecubicle, speedcubeshop],
      note: "QiYi MoFangGe. TheCubicle's slug pairs the two names, which is itself alias evidence." }
  - { name: "YJ",            slugs: [yj, yj-budget-magnetic-collection], seen: [thecubicle] }
  - { name: "DaYan",         slugs: [dayan],                          seen: [thecubicle, speedcubeshop] }
  - { name: "YuXin",         slugs: [yuxin],                          seen: [thecubicle] }
  - { name: "ShengShou",     slugs: [shengshou, shengshou-fto],       seen: [thecubicle, speedcubeshop] }
  - { name: "DianSheng",     slugs: [diansheng, diansheng-fto],       seen: [thecubicle, speedcubeshop] }
  - { name: "Cyclone Boys",  slugs: [cyclone-boys],                   seen: [speedcubeshop] }
  - { name: "LanLan",        slugs: [lanlan],                         seen: [thecubicle, speedcubeshop] }
  - { name: "MF8",           slugs: [mf8],                            seen: [thecubicle, speedcubeshop] }
  - { name: "FangShi",       slugs: [fangshi],                        seen: [speedcubeshop],
      note: "Possibly the same entity as TheCubicle's 'fz' prefix, flagged as unknown during the GAN pass. Investigate before creating either." }
  - { name: "FanXin",        slugs: [fanxin],                         seen: [speedcubeshop] }
  - { name: "QJ",            slugs: [qj-educational],                 seen: [speedcubeshop] }
  - { name: "Rubik's",       slugs: [rubiks],                         seen: [thecubicle, speedcubeshop],
      note: "A licensed brand, not a Chinese manufacturer. Its 3x3s are made under licence by others; the manufacturing identity may differ from the brand and may have changed across the period." }

# ---------------------------------------------------------------- sub-brand candidates
probable_sub_brands:
  - { name: "X-Man Design",  slugs: [x-man-designs],  suspected_parent: "QiYi" }
  - { name: "MFJS / MoFang JiaoShi", slugs: [mfjs, mofang-jiaoshi], suspected_parent: "MoYu" }
  - { name: "Meilong",       slugs: [moyu-meilong],   suspected_parent: "MoYu",
      note: "May be a product line rather than a sub-brand. MoYu's internal structure is not GAN's; do not assume." }

# ---------------------------------------------------------------- NOT manufacturers
# The project seed list mixes companies with product lines. Creating manufacturer records for
# these would fracture the archive at the wrong layer, and is the single most likely error in
# this pass.
product_lines_not_manufacturers:
  - { name: "Valk",     belongs_to: "QiYi",  note: "A product line from QiYi's collaboration with Mats Valk. A person and a line, not a company." }
  - { name: "MGC",      belongs_to: "YJ",    note: "A YJ product line." }
  - { name: "WeiLong",  belongs_to: "MoYu",  note: "A MoYu product line. TheCubicle slugs moyu-weilong-wrm-v9/v10 confirm the pairing." }
  - { name: "TangLong", belongs_to: "MoYu",  note: "A MoYu product line." }
  - { name: "Tornado",  belongs_to: "QiYi / X-Man", note: "Slugs tornado-v3, tornado-v4 sit beside x-man-designs." }
  - { name: "Guhong",   belongs_to: "DaYan or QiYi", note: "Slug guhong-pro-m-3x3; historically a DaYan name. Investigate — the name may have moved between companies, which would be a notable identity finding." }

