# ---------------------------------------------------------------- service / modifier candidates
service_candidates:
  - { name: "Angstrom Research", slugs: [angstrom, angstrom-research, angstrom-studio],
      note: "TheCubicle's coating and setup line. Likely kind: service, possibly parent_id: thecubicle, mirroring cubicle-labs. Verify rather than assume." }
  - { name: "FZ",            slugs: [fz, fz-lubricants],
      note: "Unresolved prefix carried over from the GAN pass (fz-gan13-*, fz-gan15-*). The lubricant collection suggests a setup/service line rather than a manufacturer. May relate to FangShi. Genuinely open." }

# ---------------------------------------------------------------- official domains checked
# One CDX 'nearest' lookup each at 2022-01-01. A miss means this guessed domain has no capture,
# NOT that the company lacks a website — the guess may simply be wrong.
domains_with_captures:  [yjcube.com, dayancube.com, cycloneboys.com, verypuzzle.com, cube4you.com]
domains_guessed_no_hit: [moyu.com.cn, qiyicube.com, yuxincube.com, shengshou.com, diansheng.net,
                         fangshi.net, lanlan-puzzle.com, mf8-puzzle.com, mscube.cn, qjcube.com]
