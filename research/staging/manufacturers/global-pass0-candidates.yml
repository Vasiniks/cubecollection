# NOTHING HERE IS A FACT. These are brand-shaped names harvested from two retailers' archived
# collection URLs. A retailer collection proves that retailer grouped products under a name. It
# does not prove the name is a manufacturer, that the manufacturer made 3x3s, or that two
# spellings are two companies.
#
# Method (do not repeat — the raw output is saved beside this file):
#   npm run wayback -- prefix 'thecubicle.com/collections/'    --limit 25000
#   npm run wayback -- prefix 'speedcubeshop.com/collections/<letter>' --limit 4000   # a-z
# Yielded 260 and 386 distinct collection slugs respectively.

