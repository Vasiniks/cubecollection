staged_by: variant-researcher
staged_on: "2026-09-01"
scope: >
  Colourways GAN sells as their own marketed configuration, including body plastic colour and
  any colourway carrying its own proprietary marketing name. GAN runs an unusually large and
  active program of named colourway drops — this file is a discovery inventory, not a filled
  colourway.body/faces record (that is pass 5 work per variant, once models are canonical).
  Strongest single finding of this pass: GAN's own gancube.cn site (tier 1, manufacturer_official)
  independently lists almost the entire named-colourway roster found via TheCubicle (tier 2)
  under its own "Limited Edition" navigation category, which is unusually strong cross-tier
  corroboration for a discovery pass.

