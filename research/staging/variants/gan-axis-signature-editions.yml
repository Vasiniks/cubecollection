not_found:
  - "No GAN-issued (i.e., sold on gancube.com under GAN's own branding, not a retailer's Signature Series) edition bearing a speedcuber's name OTHER than Max Park and (arguably) XuanYi Geng was found this pass. GAN's own site's product-name vocabulary for 'signature' specifically was not independently confirmed — both cases above were captured via TheCubicle, which is tier 2 for GAN's own editions (it may be reproducing GAN's copy) versus tier 1/first-party for TheCubicle's own Signature Series products. This tier distinction matters and should be preserved in reconciliation, not flattened."
  - "Feliks Zemdegs ('FZ') was found only as a retailer product-line PREFIX (fz-gan13-m-maglev-uv-3x3, fz-gan15-uv-3x3-newblack, box-fz-stealth-gan15-maglev-uv, etc. — a large family of products) with no product description confirming the initials stand for Feliks Zemdegs captured this pass — a plausible but UNCONFIRMED identification. Do not assume; verify with a direct fetch of one fz-* product's full description or TheCubicle's own 'FZ' collection/about page before writing this into canonical data."
