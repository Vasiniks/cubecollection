# family: rubiks-speed
# Pass 2 (family enumeration). Rubik's own dedicated speedcubing line, distinct from
# rubiks-classic.yml on genuine mechanism grounds (magnets, a "stronger, more reliable core"),
# not merely colourway or material — the opposite boundary call from the classic-line special
# editions, made deliberately because the evidence differs. This is the single most
# archive-relevant Rubik's-branded family, since it is the brand's own WCA-legal speedcube
# product.

id: rubiks-speed
entity: family
