# family: huameng-ys3m
# Pass 2 (family enumeration). HuaMeng's YS3M line — the earlier-documented of HuaMeng's two
# 3x3 families found this pass (TheCubicle's own "Added" date is 2023-02-17, versus 2024-10-23
# for huameng-tg), retailer-described as HuaMeng's flagship. Kept separate from `huameng-tg`:
# no source found this pass frames one as a successor to the other, both were sold
# concurrently (YS3M captures continue through at least 2025 alongside TG's 2024-2026
# captures), and the two names carry entirely different marketing identities (dragon-scale
# surface pattern / YuSheng Du endorsement for YS3M vs. a 1620-combination adjustability pitch
# for TG) rather than reading as one line renamed.

