aliases: []
introduced:
  value: "2023-02"
  precision: month
  qualifier: circa
positioning: flagship
description: |-
  TheCubicle's own product description (thecubicle-huameng-ys3m-3x3-2023): "The ... HuaMeng
  YS3M is the latest flagship 3x3 release from the famous cube company. This puzzle features
  amazing corner cutting, adjustable tensions/compressions, a dragon scale pattern to reduce
  sticking, and is designed/endorsed by the 3x3 world record single holder YuSheng Du." Sold
  in at least three configurations at launch per the same page's own cross-links — a standard
  "piece-to-piece magnetization" version, a Maglev version, and a Ball-core version (config-
  level, pass-3/4 material, not enumerated further here) — plus a further "YS3-M 20-Core
  Magnetic Maglev Ball-Core UV" configuration found in a 2024-04-15 capture
  (`huameng-ys3-m-20-core-magnetic-maglev-ball-core-uv`, product slug only, not fetched this
  pass).

  **Unresolved lead, not acted on.** The cited product description literally opens "The MoYu
  HuaMeng YS3M is..." — a direct textual pairing of "MoYu" and "HuaMeng" that could be read as
  evidence HuaMeng is a MoYu-affiliated brand, on the same pattern already recorded for
  GuoGuan/MoJue/SenHuan/MoHuanShouSu/YanCheng (see those manufacturer records). It is
  **not** treated as such evidence here: TheCubicle's product copy is known to reuse templated
  boilerplate across listings, and no other capture, page, or source found this pass repeats
  the pairing (including HuaMeng's own `thecubicle-huameng-tg-3x3-ball-core` listing, which
  says only "HuaMeng"). Recorded as a lead for a future pass to verify or dismiss with better
  evidence — not used to justify any change to `data/manufacturers/huameng.yml`'s existing
  `kind: manufacturer` (independent) reading, which this pass leaves untouched per the
  standing instruction not to upgrade corporate relationships on weak or single-source
  evidence.
status: drafted

