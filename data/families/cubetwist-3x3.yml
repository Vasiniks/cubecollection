positioning: budget
description: |-
  CubeTwist's standard 3x3x3 line, distinct from the shape-mod and novelty products that
  dominate the brand's retailer presence and that led an earlier pass to class it a novelty
  specialist.

  The manufacturer's own site (cubetwist-com-2010-official-site, tier 1) pairs the Latin brand
  name with the Chinese 梯色魔方 in its own page title, gives a Guangzhou address, and lists as
  parallel top-level product categories: 二阶梯色魔方 (2x2), **三阶梯色魔方 (3x3x3)**, 四阶梯色魔方
  (4x4), 七阶梯色魔方 (7x7), and — separately — 异形梯色魔方 (shaped/novelty). That separation is
  manufacturer-declared, not retailer inference, and it is the evidence this family rests on.

  Under the 3x3x3 category (cubetwist-com-2010-3x3-listing, tier 1): 三阶原色 (original colour),
  三阶黑面 (black face), 三阶白面 (white face) and 三阶DIY散件 (a DIY loose-parts kit). Those are
  colourways and an assembly-state choice — **pass 4 variant material**, not separate models, per
  the archive's own `cube4you-3x3` precedent.

  Commercially the line reaches well into the archive's window: Cubezz carried it from 2015
  through at least 2026 (cubezz-cubetwist-speed-3x3, 57mm/94g), Lightake from 2011
  (lightake-cubetwist-speeding-3x3), and SpeedCubeShop maintained a dedicated CubeTwist brand
  page with its own logo asset from 2013 (speedcubeshop-cubetwist-brand-page-2014).

  **A caveat recorded rather than smoothed over:** Lightake mirrors Cubezz's SKU numbers, so
  under RESEARCH_SPEC §3.2 those two corroborate each other's *existence* claim without being
  independent on specifications. The SpeedCubeShop brand page proves the brand was carried as a
  recognised manufacturer, but its captured product grid reads "There are no products to list."
  The family does not rest on that retailer trio — it rests on the two tier-1 pages.

  A `4.0cm三阶钥匙扣` (40mm 3x3 keychain) sits in an adjacent catalogue position on the
  manufacturer's own site. Whether it belongs to this line as a size sibling (the `dayan-zhanchi`
  42mm precedent) is **not resolved** — the page was not fetched, and it is recorded as an open
  lead rather than assumed either way.
status: sourced

