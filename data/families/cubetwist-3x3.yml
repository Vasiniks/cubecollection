# P26-5 remediation (ledger P26-10, tranche 1 / confirmed, authorised 2026-09-08).
# Established by the P26-5 adjudication — see research/qc/p26-5-family-adjudication.md and
# research/qc/p26-5-agent-a-cubetwist.md.
#
# This family OVERTURNS a frozen conclusion. data/manufacturers/cubetwist.yml states "No standard
# WCA-legal 3x3 was found under the CubeTwist name this pass" and classes the brand a novelty
# specialist. CubeTwist's OWN site disproves that: its product navigation carries 三阶梯色魔方
# (3x3x3) as a category distinct from 异形梯色魔方 (shaped/novelty). The manufacturer itself draws
# the line the frozen record said did not exist. Ledger P26-4.

