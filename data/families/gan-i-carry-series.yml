positioning: smart
description: |-
  A second GAN smart-cube line, sold from GAN's own storefront under a collection titled
  "i carry Series" — distinct from "i Series" (gan-i-series) and "GAN ui Series"
  (gan-ui-series) as three separate GAN-declared collections, all found during discovery of
  gancube.com's own site navigation. As of 2026 the collection lists six current products
  spanning at least two naming generations: "GAN356 i carry 2" and "GAN356 i carry E" carry
  the older "356" prefix; "GAN i carry 4 Smart Cube" and its Minions/Year of the Horse/SSL
  Limited siblings have dropped it, mirroring the same naming shift seen in gan-i-series.

  No source located this pass states when this line was introduced or how "i carry" relates
  mechanically or historically to "i" (a smaller/more portable smart cube sold alongside the
  base "i" line, per the product naming, but not established as either a successor or a
  parallel sibling by any source found). `introduced` is left unset rather than estimated from
  the earliest available web-archive capture of gancube.com's current URL structure, which only
  reflects when this specific site was archived at scale (November 2024) and is not evidence of
  when the product line itself began.
status: drafted

