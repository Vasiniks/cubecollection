description: |-
  The third generation of FangShi's flagship 3x3 lineage, between ShuangRen V2 and JieYun.
  TheCubicle's own product page frames it against its predecessor directly: "The FangShi
  GuangYing is now available! It features an assembly similar to that of the FangShi ShuangRen,
  but with some major differences in the pieces that are widely expected to make it perform
  even better than the FangShi ShuangRen" (thecubicle-fangshi-guangying). That "major
  differences in the pieces" language is the mechanical, not-producible-from-one-design
  difference DATA_MODEL §4.2 treats as decisive for a separate line rather than a
  configuration of ShuangRen.

  Cubezz.com draws the same boundary independently through its own structured catalogue field,
  "Brand: Funs Puzzle(GuangYing)" — distinct from the plain "Brand: Funs Puzzle" carried by its
  ShuangRen listings — and sells it under its own SKU, FUNSGY0B, unrelated to any ShuangRen SKU
  (cubezz-fangshi-guangying). Four independent tier 2 retailers on three continents carry the
  name with identical manufacturer attribution: TheCubicle (US), Cubezz (CN), LighTake (CN/HK)
  and speedcube.com.au (AU).

  57mm only. No "Mini GuangYing" was found at any of the four retailers, unlike ShuangRen and
  JieYun, which both have a documented 54.6mm Mini sibling.

  **Why this family was missing.** No FangShi- or Funs-branded official domain has ever been
  located by any pass, so the evidentiary ceiling for this entire manufacturer is tier 2. Pass
  2's FangShi enumeration did not reach a non-US retailer, which is where this line's clearest
  attribution evidence lives. RESEARCH_SPEC §3.6a now makes that check mandatory; it was added
  2026-09-03, after Pass 2 completed. See ledger P26-3.
status: sourced

