      thecubicle-us-moyu-early-3x3-lines); the wiki's own 'WeiLong created after HuanYing'
      narrative and its listing of 'WeiLong V2' before 'WeiLong GTS (2016)' place the original
      WeiLong at approximately 2014. No source states an exact date, so recorded `circa`."
