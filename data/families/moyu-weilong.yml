# family: moyu-weilong
# Pass 2 (family enumeration). MoYu's continuously-succeeding flagship 3x3 line, the most
# historically significant MoYu family in this archive's 2016-2026 scope. Treated as one
# family across GTS/GTS2/GTS3/WR/WR M/V9/Super per the same "manufacturer/community numbered
# succession is one family" reasoning applied to gan-flagship-series in the GAN pilot — here
# the evidence is a single persisting name ("WeiLong") carried through every generation, which
# is more direct evidence than GAN's bare numerals.

id: moyu-weilong
