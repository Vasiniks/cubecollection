  - "Weilong"
introduced:
  value: "2014"
  precision: year
  qualifier: circa
positioning: flagship
description: |-
  MoYu's flagship 3x3 succession, sold continuously under the "WeiLong" name from its debut
  (as an explicit, deliberate improvement on moyu-huanying, per speedsolving-wiki-moyu) through
  at least the WeiLong V9 and WeiLong Super generations noted on the same wiki page (a March
  2024 capture). The name recurs across every generation found — WeiLong V2, WeiLong GTS
  (2016), GTS2 (2017), GTS3/3M/3LM (2018), WR/WR M (2019), WR M 2020, WR M 2021/2021 MagLev,
  V9 (2023), Super (late 2023) — all under one shared, manufacturer-given name, which is
  stronger direct evidence for treating this as one family than GAN's bare numerals (that
  family instead relied on a manufacturer-drawn navigation grouping). TheCubicle's own current
  "MoYu" brand collection independently confirms "WeiLong" as a live, retailer-recognised
  family name as of a 2021 capture (thecubicle-com-moyu-3x3-collection-2021), listing GTS2 M,
  GTS3 M, GTS3 LM, and WR M generations concurrently on sale.

  **MoYu WeiLong AI**, described by the wiki as MoYu's first smartcube, sharing pieces with the
  WR M 2020 generation, is treated here as a smart variant/model within this family rather than
  a separate family — its own name carries "WeiLong" and its mechanism is explicitly the WR M
  2020's. This is a pass-3 model-boundary question, not resolved further at this pass; flagged
  in research/notes/models/global-pass2-families.md as a lead. `moyu-ai` (MoYu AI, released
  2023) is deliberately kept as its own separate family — the wiki's own text states "Not to be
  confused with the WeiLong AI" and describes a from-the-ground-up different app and product,
  not a WeiLong-branded item.

  Generation names, dates, and mechanism details above are pass-3 (model enumeration) material,
  not resolved here — only the family boundary is decided at this pass.
status: drafted

