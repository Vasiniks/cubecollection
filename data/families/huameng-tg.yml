description: |-
  TheCubicle's own product description (thecubicle-huameng-tg-3x3-ball-core): "The HuaMeng TG
  is the most feature-rich 3x3 we've seen so far! With 1620 different adjustment combinations
  you can find one that fits your turning style. It has hand-adjustable compression settings
  and a tool to adjust tensions and magnet strength. It has 6 tension settings, 9 compression
  settings, 5 edge magnet adjustments, and 6 corner/core magnet adjustments." Sold in at least
  four configurations found this pass — a standard/ball-core version, a "Maglev + Ball-Core"
  version, a "Maglev + Ball-Core UV" version, and a "Spirit Pearl Limited Edition" (banner
  copy: "Limited to 999 worldwide!") — plus a second-generation "TG V2 (20-Magnet, Ball-Core)"
  found in a 2026-05-06 capture (`huameng-tg-v2-3x3-20-magnet-ball-core`, product slug only,
  not fetched this pass; a pass-3 generation question, not resolved here). None of this
  configuration/generation detail is enumerated further at this pass.
