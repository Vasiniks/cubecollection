# Pass 2 (family enumeration). Cube4You's generic, own-branded "3x3x3 DIY Speed Cube" —
# the only 3x3x3 named product line this pass found being sold by Cube4You itself (as
# distinct from the DaYan/QJ/ShengShou/other-brand stock the same storefront also resells)
# within this archive's 2016-2026 window. Treated the same way `fanxin-3x3` was: a genuine,
# named, manufacturer-sold base 3x3 that is not marketed under any fancier model name.

id: cube4you-3x3
