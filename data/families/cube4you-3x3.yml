positioning: budget
description: |-
  Cube4You's own house-brand 57mm ABS 3x3x3, sold unassembled ("DIY") in a range of colours
  (Black, Blue, Glow Blue, Green, Orange, Pink, Transparent, White) via its own storefront,
  cube4you.com (cube4you-3x3x3-diy-speed-cube-2017). A 2016-09-21 capture of the same category
  page (browsed this pass but not separately cited, identical listing) shows the same product
  under the near-identical name "Cube4you 3x3x3 Speed Cube (NIB)" — treated as the same family
  under a minor naming variation, not a new product. This is a generic budget cube with no
  further model-name branding beyond the manufacturer's own name; it is listed for sale
  alongside a much larger reseller catalogue of DaYan, QJ, ShengShou, Diansheng and other
  brands' cubes on the same storefront (not part of this family — those are separate
  manufacturers' own products).

  No source found this pass documents a specific launch date for this exact product name, nor
  an exact discontinuation date. The last capture found this pass of Cube4You's own 3x3x3
  category page (under this URL structure) is 2017-04-22; by later captures (2019 onward) the
  storefront had migrated to a WordPress-based site emphasising 3D-printed novelty puzzles
  (per data/manufacturers/cube4you.yml's own notes), with no equivalent house-brand 3x3
  speed-cube category found in the time available this pass. `discontinued` is left `unknown`
  rather than guessed from this absence — a further, deeper prefix sweep of the 2019+ site
  structure was not run this pass.
