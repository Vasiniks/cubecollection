# family: gan-flagship-series
# Pass 2 (family enumeration). GAN's numbered top-tier 3x3 succession: GAN 11 M Pro (2020)
# through GAN12, GAN13, GAN14, GAN15, GAN16, and GAN17 (2026). THE central, hardest boundary
# call of this pass. Full reasoning, including the alternative reading this record rejects, is
# in research/notes/models/gan-pass2.md — read that before treating this record's boundary as
# settled. GAN V100 is deliberately excluded; see research/staging/models/gan-v100.yml.

