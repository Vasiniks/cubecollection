description: |-
  GAN's continuously-succeeding top-tier 3x3 line, sold under bare numbers (11 through 17)
  with no shared name-word of its own beyond the numeral, distinct from the "356"-prefixed
  mainline (gan-356) that continues to be sold in parallel throughout this family's entire
  span. Treated as one family, not seven (or more) single-generation families, on the strength
  of a manufacturer-drawn boundary found on GAN's own site in two independent forms:

  1. GAN's own English-language storefront (gancube.com) carries a site-navigation dropdown
     literally labelled "Flagship Series" that, as of August 2026, lists GAN16 Maglev, GAN15,
     GAN14, GAN12, and "GAN11 Series" (with its own M Pro/M/Air/M Duo sub-variants) together —
     excluding every 356-branded product from that same grouping.
  2. GAN's Chinese-domestic site (gancube.cn) independently carries a "旗舰魔方" (Flagship
     Cube) navigation category that, in an August 2025 capture, lists GAN16 Maglev, GAN15
     Maglev, GAN14 Maglev Pro, GAN14, GAN13, GAN12 together.
  3. GAN's own technology-history page explicitly calls the 2020 GAN 11 M Pro the "year's
     heavyweight flagship" (年度重磅旗舰) in the same breath as describing the magnetic-core
     technology that the 2021 MagLev generation and (per its own current product copy) GAN17
     MagDrive continue to build on ("GAN17 MagDrive is GAN's flagship maglev 3x3 speed cube").

  This reading is a judgement call, not a mechanical fact. Two complications are recorded
  honestly rather than smoothed over:

  - GAN's own "Series"/collection labelling is not perfectly stable. An older (November 2024)
    gancube.com collection at a different URL ("flagship-speed-cubes", page title "GAN Flagship
    Series Speed Cubes") mixed in 356-branded products (GAN356 M E, GAN356 RS2, GAN356 Maglev)
    alongside the numbered line, and a separate "Advanced Series" collection from the same
    period listed nearly the same numbered models (GAN11 M Pro through GAN15 Maglev) *again*,
    under a different tier label. The cleaner, exclusive "Flagship Series" grouping used as this
    family's primary evidence is the 2026 site-navigation dropdown specifically, not either of
    these older merchandising collections, which read as relative, shifting price-tier buckets
    rather than a stable family boundary. See research/notes/models/gan-pass2.md for the full
    comparison.
  - GAN13 appears in the August 2025 gancube.cn "Flagship" grouping but is absent from the
    August 2026 gancube.com "Flagship Series" dropdown — a discontinued-generation lead for
    pass 3, not resolved here.

  GAN V100 is deliberately excluded from this family. See
  research/staging/models/gan-v100.yml for the evidence and open question.
