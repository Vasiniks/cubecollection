# family: particula-gocube
# Pass 2 (family enumeration). Particula's own smart/electronic 3x3 line, sold under the
# "GoCube" name across at least three named models found this pass (Basic, Edge, X) since at
# least December 2019. The Rubik's-branded smart cube Particula manufactures separately
# ("Rubik's Connected") is a distinct family under the Rubik's manufacturer record
# (data/families/rubiks-connected.yml, created independently of this session, not restated
# here per this session's own task brief) — GoCube is Particula's own independently-branded
# product, and the two are never merged despite sharing a manufacturer and, per Particula's
# own current site navigation, a shop-category grouping.

