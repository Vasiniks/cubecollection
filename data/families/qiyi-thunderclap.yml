# family: qiyi-thunderclap
# Pass 2 (family enumeration). QiYi's earliest sustained named 3x3 line, an "improved version"
# of the earlier Bullfight (see qiyi-bullfight.yml), carried through at least three named
# generations.

id: qiyi-thunderclap
