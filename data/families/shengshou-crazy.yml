# family: shengshou-crazy
# P26-5 remediation (ledger P26-10, tranche 2 / probable, authorised 2026-09-08).
# The third "Crazy" family in this archive, after mf8-crazy-3x3x3 and calvins-crazy-3x3. That is
# the established precedent: a shared, generic locked-ring mechanism made by several
# manufacturers gets a family per manufacturer, not one cross-brand family.
id: shengshou-crazy
entity: family
manufacturer_id: shengshou
name: "ShengShou Crazy"
positioning: special
description: |-
  A pillowed 3x3 with rings on each face that do not rotate with their faces. TheCubicle: "The
  ShengShou Crazy 3x3 is a pillowed 3x3 with rings on each face that do not turn with their
  respective faces. This leads to interesting situations that you would not normally see on a
  3x3. This crazy 3x3 is built for speed. While performance isn't as good as standard 3x3s, it is
  well ahead of other 'crazy' puzzles" (thecubicle-shengshou-crazy-3x3-generations-2026).

  **Two generations, separated by a documented mechanism change rather than a version label.**
  The base generation carries eight pieces per ring; V2's own product copy states it "has more
  pieces (9 total) in each ring, adding yet another layer of difficulty." That is an
  internal-geometry difference and satisfies DATA_MODEL §4.2's model-identity test independently
  of the "V2" name. Base: 60.5mm, product id 6670615871571. V2: 60.0mm, product id 7049644212307.

  A **"Jelly LE"** — transparent stickerless plastic, "limited to 1400 units worldwide" — is a
  **pass 4 variant**, not a third model: it states no mechanism claim of its own, only a material
  and a production figure. Which generation it belongs to is **not established** by anything found
  and is flagged rather than assumed.

  Cross-range naming confirms line identity: Crazy spans 2x2/3x3/4x4/5x5/Magic Tower/Megaminx at
  TheCubicle, plus Pyraminx and Mirror at SpeedCubeShop.

  **A retailer inconsistency, noted not resolved:** TheCubicle types the base generation as "Shape
  Mods" but V2 as "3x3". The two generations are the same mechanism; the classification differs
  between the retailer's own pages. This does not change either model's `scope_class`, which is
  decided on the archive's own §2.2 test below, not on a retailer's category field.
status: sourced

