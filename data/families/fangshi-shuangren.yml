      a successor to ShuangRen specifically — 'an assembly similar to that of the FangShi
      ShuangRen, but with some major differences in the pieces' — and speedcube.com.au's JieYun
      copy names 'its predecessors (GuanYing and Shuangren)', placing both later lines after
