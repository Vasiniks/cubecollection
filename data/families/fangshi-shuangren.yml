description: |-
  Per the Speedsolving wiki (speedsolving-wiki-fangshi, created in pass 1): "Fangshi ShuangRen
  3x3 — Regarded as an excellent cube on its first release... The ShuangRen has since been
  released in new sizes, and some cube retailers offer it in numerous colour combinations,"
  followed by a listed "Fangshi ShuangRen V2 3x3" entry (no further description given). TheCubicle's
  own product listing for the V2 (thecubicle-fangshi-shuangren-v2, created in pass 1) states:
  "The FangShi ShuangRen V2... is the latest 57mm 3x3 by the Funs Puzzle manufacturer. It
  features a few minor improvements in design over the original FangShi ShuangRen, which has
  been discontinued."

  Kept as one family across both generations, unlike this pass's other "improved version"
  successions, because the name itself persists unchanged ("ShuangRen" → "ShuangRen V2") rather
  than changing to a new name — the same reasoning that keeps moyu-weilong and gan-flagship-
  series as single families across their own numbered generations.

  The wiki's own "Contents" list also names "FangShi GuangYing" and "FangShi JieYun" as headers
  with no body text under either — not chased further this pass, recorded as open leads.
