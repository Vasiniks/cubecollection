# family: x-man-xt3
# Pass 2 (family enumeration). A separate, newer X-Man Design 3x3 line positioned explicitly by
# the retailer as a lower-cost alternative to Tornado, with a distinct, simpler adjustment
# system per both retailer copy and customer description.

id: x-man-xt3
