    sources: [thecubicle-guoguan-yuexiao-2025, thecubicle-guoguan-yuexiao-pro-2018]
    note: "No source calls this line 'flagship' by name; inferred from it being GuoGuan's only
      documented 3x3 line, continuously updated across at least three generations with
      competition-oriented features (adjustable magnets, reduced-friction mechanism)."
  /description:
