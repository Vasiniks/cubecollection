    note: "A companion product page's own prose calls the original YueXiao 'one of the most
      iconic cubes of 2016' — a specific, if brief, retailer statement. No tier 1 GuoGuan/MoYu
      first-party source with an exact date was found this pass, hence `reported` and `circa`
      rather than `confirmed`/`exact`."
  /positioning:
