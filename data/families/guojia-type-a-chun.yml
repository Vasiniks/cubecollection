    sources: [thecubicle-guojia-type-a-chun2-2020]
    note: "TheCubicle's own 'Added: 2018-11-07' field is this specific listing's catalogue
      date at TheCubicle, not GuoJia's own release date for either the Chun1 or Chun2
      generation — GuoJia's brand history (per data/manufacturers/guojia.yml) traces to 2006,
      so an earlier real release for at least Chun1 is plausible but not established. Recorded
      at year precision, `qualifier: circa`, with `confidence: uncertain` doing the real work
      of signalling this is a retailer-listing date standing in for an unknown manufacturer
      date, not a rounded-but-trusted approximation."
  /positioning:
