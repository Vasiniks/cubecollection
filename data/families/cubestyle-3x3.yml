      CubeStyle 3x3-shaped listing checked, is deliberately not used — see
      thecubicle-mojue-m3-2020's reliability_note for the recurring-date pattern found across
      many unrelated products in this register. Recorded at the weakest defensible year,
      `circa 2020`, splitting the difference between the suspect date and the confirmed
      capture."
