# family: qiyi-warrior
# Pass 2 (family enumeration). QiYi's budget 3x3 line named "Warrior" (YongShi), the longest
# concurrently-sold named QiYi budget line found this pass, still current as of 2024-2025.

id: qiyi-warrior
entity: family
