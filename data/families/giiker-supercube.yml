# family: giiker-supercube
# Pass 2 (family enumeration). GiiKER's smart/electronic 3x3 line — the product that made the
# manufacturer, per its own history ("2018 ... SUPERCUBE(R) i3 released - The world's 1st smart
# cube"). Kept as its own family, separate from giiker-m3, because smart/electronic capability
# is treated as always family-relevant in this archive (the same call the pilot made for GAN's
# i Series/i Carry/ui Series against its mechanical flagship line, and that a parallel pass-2
# thread made for Rubik's Connected against the classic mechanical line) — not a variant-level
# configuration difference chosen at assembly, but a stated deliberate product split
# (electronics present vs. explicitly absent) documented directly by a retailer source on the
# sibling record.

