description: |-
  GiiKER's flagship smart/electronic 3x3 line, and by its own account the product that
  established the company: GiiKER's own "About Us" timeline (giiker-about-us-2022, tier 1)
  states "2018 January: Smart cube technology and applications presented at Nuremberg toy fair;
  March: SUPERCUBE(R) i3 released - The world's 1st smart cube," followed by "2019 Supercube
  series presented at CES, New York and Nuremberg toy fair. A global leader in developing and
  manufacturing smart cubes." At least two named generations are independently attested: the
  original "Giiker Super Cube" (i3) and the "Giiker Super Cube i3S," which TheCubicle's own
  product copy (thecubicle-giiker-super-cube-i3s-2019, tier 2) describes directly as "an updated
  version of the previous Giiker Super Cube," with "updated software, Bluetooth v. 4.0, and
  bright vibrant stickers" — a manufacturer-external source independently corroborating the
  succession the timeline implies.

  No dedicated product page for the plain "i3" (pre-S) generation was found at GiiKER's own
  site, TheCubicle, or SpeedCubeShop in this pass's wayback coverage — only the i3S survives in
  every retailer catalogue captured (giiker-com-supercube-i3s-product-2022,
  thecubicle-giiker-super-cube-i3s-2019, and a SpeedCubeShop 2020 capture of the same product
  found during discovery but not separately sourced here). The i3S product page itself persisted
  on GiiKER's own site from at least 2022 through an 2026-08-19 capture
  (giiker-com-supercube-i3s-2026-soldout), by which date it is marked "Sold out" and the
  standalone "SUPERCUBE" entry has dropped out of the site's primary shop navigation (present as
  late as a 2025-07-17 capture of a different page on the same domain). This reads as a line in
  decline by 2026, not a confirmed discontinuation — no source states the line has formally
  ended, so `discontinued` is left unset rather than inferred from stock status.

  **GiCUBE, an open lead, not built into this family.** GiiKER's own timeline separately states
  "2014 GiCUBE(R) released and birth of the idea of smart cube later on" — a single ambiguous
  sentence that does not itself claim GiCUBE was an electronic/app-connected product (if
  anything, "birth of the idea... later on" implies the smart-cube concept came *after*
  GiCUBE). No product page, specification, or retailer listing for GiCUBE was found anywhere in
  this pass. Not built into this family or given its own record on evidence this thin; flagged
  here as an open lead for a future pass with more source material, rather than silently dropped
  or guessed into a "precursor model."

  **GiiKER Super Cube i2 (2x2, tiled) excluded** — out of this archive's 3x3x3 scope by puzzle
  category, not a boundary call; found at both TheCubicle and SpeedCubeShop alongside the i3S.
status: drafted

