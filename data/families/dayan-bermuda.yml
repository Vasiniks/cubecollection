# P26-5 remediation (ledger P26-10, tranche 1 / confirmed, authorised 2026-09-08).
# See research/qc/p26-5-family-adjudication.md and research/qc/p26-5-agent-b-bermuda.md.
#
# DaYan's own 2012 site carries "Dayan Bermuda Cube" as a TOP-LEVEL product category beside the
# numbered flagship line, with five officially-named sub-products under it. That is
# manufacturer-declared line structure, and it is why this is a family rather than a product.

