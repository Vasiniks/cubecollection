description: |-
  A bandaged 3x3x3 line: ordinary and shape-modified 3x3 bodies with certain pieces fused so
  each turns differently. TheCubicle's own description: "The DaYan Bermuda series features a
  variety of common 3x3 puzzles and shape-mods but with certain parts 'bandaged' to make each of
  them a unique challenge to solve" (thecubicle-dayan-bermuda-cube-2020).

  DaYan's own 2012 category page (dayancube-official-bermuda-category-2012, tier 1) lists
  "Dayan Bermuda Cube" in its main product navigation alongside "Dayan Crazy Cube / DaYan II
  GuHong / DaYan III LingYun / DaYan IV LunHui / DaYan V ZhanChi / DaYan Gem Cube" — a top-level
  category, not a sub-item of the flagship line. Under it, five officially-named sub-products:

  - **Bermuda Triangle** — sold as eight planet names (Earth, Jupiter, Mars, Mercury, Neptune,
    Saturn, Uranus, Venus), each in Black and White. Those sixteen listings are **colourways of
    one product** and are pass 4 variant material, not models.
  - **Bermuda House I** · **Bermuda House II** · **Bermuda Column** · **Bermuda Star** — four
    further officially-named sub-products, each in Black and White.

  A 2013 individual product page shows Column and Triangle cross-linked as concurrently-sold
  siblings, so these are **parallel products, not a generation sequence**. No `generation` is set
  on any of the five, following the archive's `witeden-mixup-3x3` precedent (four concurrent
  moulds under one family, generation deliberately unset).

  **What is NOT established, recorded honestly.** The five sub-products are manufacturer-named,
  which is what this family rests on. The stronger claim — that House I, House II, Column and
  Star are four *visually distinct exterior moulds* — was formed by a researcher viewing
  TheCubicle product photography that **was never preserved as a citable source**. The names
  themselves and TheCubicle's "variety of ... puzzles and shape-mods" phrasing support it, but no
  archived image comparison backs it, so the geometry descriptions on the individual model
  records are attested at `reported`, not asserted as fact. A future pass should preserve the
  photography or find a source that states the shapes directly.

  Retailer circulation runs well past the manufacturer's own captures: TheCubicle 2019–2026 and
  Cubelelo 2020–2025+, independently, with distinct product ids per shape and different slug
  conventions — checked for the retailer-rename failure mode that produced the HaiTun/ZhanLang
  false positive, and clear of it.
status: sourced

