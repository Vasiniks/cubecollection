# family: dayan-panshi
# Pass 2 (family enumeration). "Dayan 6" per DaYan's own numbering (confirmed at tier 1 by
# dayancube-official-2013: "Dayan VI Panshi"), explicitly described by the wiki as the product
# that ended DaYan's period of market dominance.

id: dayan-panshi
entity: family
manufacturer_id: dayan
name: "DaYan PanShi"
aliases:
  - "Dayan VI Panshi"
introduced:
  value: "2013-02"
  precision: month
  qualifier: circa
positioning: mainline
description: |-
  DaYan's sixth numbered product, per the Speedsolving wiki's numbered product history
  (speedsolving-wiki-dayan-products): "Dayan 6: PanShi — Released February 2013. Considered a
  disappointment, this cube saw the end of Dayan's dominance in 3x3 market. Out of the box it
  was clicky, slow, and rough... It is currently quite hard to find." DaYan's own official 2013
  site lists "Dayan VI Panshi" directly (dayancube-official-2013), confirming DaYan's own
  numbering and that the product was on sale by the site's August 2013 capture.

  No later generation and no retailer capture from 2019 or later were found this pass; recorded
  as a single-generation historical family — explicitly significant despite (indeed because of)
  its poor critical reception, per the wiki's own framing that it marked a turning point in
  DaYan's market position.
status: drafted

attestations:
  /introduced:
    confidence: probable
    sources: [speedsolving-wiki-dayan-products, dayancube-official-2013]
    note: "DOWNGRADED from `confirmed` on 2026-09-03 (Pass 2 adjudication gate). The confidence
      contradicted this note's own admission. The exact February 2013 month comes solely from
      speedsolving-wiki-dayan-products, a tier-4 community wiki. The tier-1 source
      dayancube-official-2013 is a 2013-08-05 capture of DaYan's own site already listing
      'Dayan VI Panshi' for sale — which establishes only that the product existed *by August
      2013*, an upper bound, and does not corroborate February specifically. Rule 9 was
      satisfied structurally (a tier-1 source is present) but not substantively (that source
      does not support this claim), so validation could not catch it. `probable` reflects a
      plausible, bounded date from a single tier-4 origin. A tier 1-2 source stating the month
      would restore `confirmed`."
  /positioning:
    confidence: reported
    sources: [speedsolving-wiki-dayan-products]
  /aliases:
    confidence: confirmed
    sources: [dayancube-official-2013]
  /description:
    confidence: reported
    sources: [speedsolving-wiki-dayan-products, dayancube-official-2013]
