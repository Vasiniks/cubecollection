# family: moretry-tianma-x3
# Pass 2 (family enumeration). MoreTry's sole 3x3 speedcube product line found this pass — every
# one of its 24 3x3 SKUs at TheCubicle (per thecubicle-moretry-live-2026, pass 1) and every
# MoreTry 3x3 product found at SpeedCubeShop this pass carries the "Tianma X3" name, in a
# manufacturer-numbered generation sequence (V1 through at least V4, plus "V3 Plus" and a
# "ZCube Edition" collaboration). This is the single clearest, richest family evidence found
# across this session's queue: not a retailer collection page or loose marketing wording, but a
# real, sustained, versioned product lineage independently corroborated at two separate
# retailers over roughly 2022-2025.

