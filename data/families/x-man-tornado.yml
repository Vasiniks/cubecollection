description: |-
  X-Man Design's flagship 3x3 succession.

  **Evidence withdrawn and confidence reduced 2026-09-03 (issue Q1).** This description
  previously rested on theqiyi-about-us, described as "QiYi's own first-party About Us page",
  quoting "[X-Man Design] includes some of our most advanced competition hardware, especially
  the Tornado series" and "The Tornado line of 3x3 flagships...". That page has since been
  established as an **Amazon-affiliate site, not QiYi's own** (see
  research/qc/pass2-human-review.md, issue Q1), so those quotations are no longer tier-1
  first-party evidence and are not treated as evidence of anything here.

  Unlike data/manufacturers/qiyi.yml and x-man-design.yml, **no replacement first-party evidence
  for Tornado was found** on QiYi's genuine corporate site (qiyitoys-company-history) this pass.
  The family's flagship positioning therefore now rests on tier-2 retailer evidence alone, and
  the confidence has been reduced accordingly rather than re-sourced. The family itself is not
  in doubt — the products are real and durably listed — only the "X-Man Design's own flagship
  line" characterisation, which currently has no first-party support.

  TheCubicle's own "x-man-designs" collection (thecubicle-x-man-designs-collection-2025) shows
  the succession concurrently as V3 (Standard, Magnetic Core, Pioneer UV, and a "Pioneer 3x3
  Revived Limited Edition" reissue) and V4 (M/Flagship, Pioneer UV, and V4 AI — a smart/electronic
  sibling with a UV finish and charging base). GAN356 XS and MoYu WR M MagLev 2021 are named
  alongside "the Tornado v4" in one customer review found this pass
  (thecubicle-x-man-xt3-v1-3x3-flagship-product) as contemporary flagship-tier peers, consistent
  with the flagship positioning QiYi itself states.

  **Tornado V4 AI is treated here as part of this family, not split out**, on the same reasoning
  DATA_MODEL section 4.2 and the GAN pilot's smart-line treatment give: whether it belongs as a
  smart model/variant within Tornado or should be split into its own family (parallel to GAN's
  separately-named smart collections) is a pass-3 question this pass does not resolve, flagged
  in research/notes/models/global-pass2-families.md. No dedicated "X-Man smart cube" collection
  name (analogous to GAN's "i Series"/"ui Series") was found this pass, which is why it was not
  pre-emptively split.
status: drafted

