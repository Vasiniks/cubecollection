# Pass 2 (family enumeration). WitEden's specialism, per pass 1's own finding (corroborating
# the Speedsolving wiki), is "unusual designs such as Crazy cubes, Super cubes, cuboids etc."
# since 2010, not standard WCA-legal 3x3 speedcubes — this family and its two siblings
# (witeden-super-3x3x3, witeden-camouflage-3x3) are the three 3x3-mechanism product lines found
# across a ~65-slug catalogue that carry genuinely distinctive, specifically-described
# mechanisms. Every accepted family here will need its own `scope_class: conditional`
# justification at the model/variant level in a future pass, per DATA_MODEL §1.4.

