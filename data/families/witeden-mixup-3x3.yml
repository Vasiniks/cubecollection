positioning: special
description: |-
  A persisting WitEden product-line name applied to a well-known twisty-puzzle type, the "Mixup
  Cube" (a 3x3x3-shaped puzzle whose deep-cut mechanism allows edge and center pieces to swap
  positions, unlike a standard 3x3). TheCubicle's own catalogue carries at least four named
  variants under this shared name, each with its own described mechanical detail
  (thecubicle-witeden-mixup-3x3-variants, tier 2):
  - **"WitEden & Oskar 3x3x3 Mixup"** — credited to a named designer ("Oskar," read as Oskar van
    Deventer, a widely recognised twisty-puzzle designer, though this specific attribution was
    not independently verified beyond the retailer's own product title this pass): "looks on the
    outside just like any 3x3x3 puzzle with bigger outer layers. But the mechanism allows it to
    be manipulated in many more ways compared to an ordinary 3x3x3."
  - **"3x3x3 Mixup (Edge-Split)"** — "features split edges that can separate when all are
    correctly aligned along the equator... adds a new layer of complexity through its hidden
    edge mechanics."
  - **"3x3x3 Mixup (30-Degree Turn)"** — "turns like a standard 3x3 puzzle until you figure out
    how to unlock the inner layers."
  - **"3x3x3 Mixup Plus"** — already sourced in pass 1 (thecubicle-witeden-mixup-plus), no
    further description text retrieved this pass.

  **Kept as one family, not four**, because all four share the same manufacturer-declared
  "3x3x3 Mixup" name and the same base turning concept, differing only in a specific added
  mechanical wrinkle (edge-splitting, a 30-degree unlock, or a named designer's variation) — read
  as the model/variant-level distinctions DATA_MODEL §4.2 describes, deferred to pass 3 rather
  than decided here. This is different from the "same word, different object" cases rejected
  elsewhere this pass (e.g. Calvin's `calvins-crazy-3x3` vs. `calvins-crazy-mirror-3x3`): here
  every variant is explicitly the same base "Mixup" puzzle type with an added twist, not a
  differently-shaped or differently-purposed object.

  Almost certainly non-WCA-legal; the `scope_class: conditional` justification and admission for
  any specific variant is deferred to pass 3/4 per DATA_MODEL §1.4.
status: drafted

