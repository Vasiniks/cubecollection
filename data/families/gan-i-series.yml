description: |-
  GAN's original smart-cube line. GAN's own technology-history page dates it explicitly: "2019
  was GAN's Year One of intelligence... the first-generation competitive-tier smart cube, the
  GAN356 i, arrived," built around a "smart ball axis" that let the cube pair with GAN's
  companion app. The line continued through GAN356 i2 and GAN356 i3 (product names seen in
  GAN's own site navigation during discovery; not yet independently sourced as their own
  records) and is current as of 2026 as "GAN i4" — the "356" prefix has been dropped from the
  current generation's own name, a naming-convention shift for pass 3 to record at the model
  level.

  GAN's own current storefront serves this line from a collection literally titled "i Series",
  distinct from two sibling smart collections, "i carry Series" (gan-i-carry-series) and
  "GAN ui Series" (gan-ui-series) — treated as the manufacturer's own drawn boundary between
  three related but separately-named smart lines, per RESEARCH_SPEC's guidance to read a
  manufacturer's own collection structure as family evidence.
