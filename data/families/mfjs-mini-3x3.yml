  No manufacturer-first-party source or exact launch date was located; `introduced` left unset
  rather than inferred from a retailer capture date. Recorded `positioning: special` rather than
  `budget`, since a compact/novelty size range is a distinct market segment from MFJS's
  ordinary-sized budget catalogue, the same reasoning applied to yj-zhilong.
