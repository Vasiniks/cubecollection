# family: shengshou-tank
# P26-5 remediation (ledger P26-10, tranche 2 / probable, authorised 2026-09-08).
# The weakest of the six admissions on publisher breadth (one publisher), and recorded as such
# on /name below. The Tank-versus-Gem identity question is RESOLVED — see the description. Admitted because it meets the same evidentiary bar
# as the five pre-existing ShengShou families, not because the case is strong in absolute terms.
id: shengshou-tank
entity: family
manufacturer_id: shengshou
name: "ShengShou Tank"
positioning: budget
description: |-
  An economy line. TheCubicle: "The ShengShou Tank 3x3 is a new economy 3x3 speed cube that
  features a vibrant color scheme, frosted exterior, and black internals"
  (thecubicle-shengshou-other-3x3-lines-2026, capture 2020-09-18, Type "3x3", 56.0mm, Gross
  Weight 100g).

  **The broadest cross-range name found in this batch, and the thinnest publisher base.** A CDX
  sweep returned eighteen distinct TheCubicle URLs spanning nine puzzle types — 2x2, **3x3**, 4x4,
  5x5, 6x6, 7x7, 8x8, Megaminx, Pyraminx (shengshou-gem-tank-metal-cross-retailer-sweep-2026).
  That is a stronger line-identity signal than any other candidate produced. But **SpeedCubeShop
  and Cubelelo both returned clean negatives**: neither has ever stocked a ShengShou Tank under
  that name as far as the CDX index shows. Everything here comes from one retailer.

  **An open question deliberately left open.** The Speedsolving wiki says: "ShengShou Tank 3x3 — A
  3x3 similar to the Gem." Two independent adjudication lanes flagged that sentence and both
  declined to merge on it, and a third adversarial pass pushed on it specifically without
  resolving it. It is a single dismissive tier-4 clause, far too thin to collapse a line on, and
  the textual evidence leans away from a merge — Tank is 100g/56.0mm with a *frosted* exterior
  against Gem's 104g *shiny* exterior and "3-piece cap design", and the two names run parallel
  across overlapping size ranges rather than succeeding one another.

  **RESOLVED 2026-09-08 (ledger P26-12): DISTINCT, at `probable`.** The question above was
  settled by preserved product photography — the technique three earlier lanes had not applied.
  The decisive evidence is the packaging itself: **Gem's box prints "GEM" with the Chinese
  characters 宝石** (gem, precious stone) while **Tank's prints "TANK" with 坦克** (the
  armoured-vehicle word). Two unrelated native names, read directly off the box art and recorded
  as directly observed rather than as an assumed transliteration
  (shengshou-gem-3x3-product-photography-2026, shengshou-tank-3x3-product-photography-2026, both
  preserved with sha256 hashes of the retrieved files). A renamed product does not carry a
  different native name on its own packaging.

  Two supporting findings. Gem's absent dimension is explained rather than merely missing:
  TheCubicle's own catalogue JSON tags Gem's dimension facet with the literal fallback
  `Dimensions_Other` against Tank's `Dimensions_56.0`, so the retailer never assigned Gem a size
  (shengshou-gem-tank-catalog-facets-2026). And the two ranges are independently managed rather
  than sequential — Gem's own 4x4 SKU was added three months *after* Gem 3x3 was marked
  discontinued, which is not the shape of a rename or hand-off.

  **What remains unproven, stated plainly:** the mould comparison itself was **inconclusive**.
  Both photographs show the same generic rounded-corner budget stickerless silhouette common to
  many unrelated cubes of that era, and no macro shot of edge or corner-cut geometry exists in
  any crawled asset. The naming evidence is what carries this, not the geometry — which is why it
  closes at `probable` rather than `confirmed`.
status: sourced

