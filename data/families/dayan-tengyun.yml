description: |-
  DaYan's eighth numbered product, per the Speedsolving wiki's numbered product history
  (speedsolving-wiki-dayan-products): "Dayan 8: TengYun M — TengYun M Version 1 ... Released
  January 2019. Considered a comeback for Dayan and their first competitively viable 3x3 in
  about 6-7 years... the first mass-produced Dayan 3x3 with magnets," followed by "TengYun M
  Version 2 ... released in early 2020, and featured customization options, such as adjustable
  springs, and magnet strength... for the first time, DaYan has a competitively viable cube."
  The wiki's own page-level summary independently states DaYan "is making a comeback in the
  speedcubing world with the TengYun 3x3 and 2x2 cubes" — explicit flagship-comeback framing,
  not merely this pass's inference.

  TheCubicle's own product history for the "dayan" collection (thecubicle-dayan-collection-2025)
  shows a third generation beyond the wiki's September 2023 coverage: "dayan-tengyun-v3-m-3x3",
  first captured April 2024 — the line continuing at least five years past its debut. A separate
  "Tengyun 2x2 M" / "Tengyun 2x2 V2 M" succession exists in the same wiki section but is a
  different puzzle category, out of this archive's 3x3 scope.
