description: |-
  YJ's earliest documented 3x3 per the Speedsolving wiki's own product history
  (speedsolving-wiki-yongjun-products): "YJ SuLong Released October 2013. Considered a good
  budget cube, with a unique light, smooth, and crispy feel and had very good corner-cutting for
  the time... Considered a very 'safe' first cube for YJ at the time, unlike the MoYu cubes
  produced at the time... It was uniquely offered as a glow in the dark cube which made up a
  large chunk of the sales."

  No successor carrying the "SuLong" name was found this pass, and no retailer capture from
  2020 or later lists it — recorded as a single-generation, likely-discontinued family per the
  standing instruction to preserve historical families rather than omit them for absence from
  current catalogues.
