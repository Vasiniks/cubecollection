description: |-
  A "bandaged" 3x3 (a recognised twisty-puzzle category in which certain pieces are physically
  restricted from moving independently), described directly in TheCubicle's own product copy:
  "The Calvin's Bandaged 3x3 (Maze-300 Cube) is a standard 3x3 with 3D printed tiles attached to
  the pieces. These tiles bandage some of the pieces, restricting movement. This cube is almost
  as difficult to scramble as it is to solve!" (thecubicle-calvins-bandaged-3x3-maze-300, tier
  2). TheCubicle's own "Type" field files this under "Shape Mods."

  **A possible modification/service question, flagged rather than resolved.** The source
  describes this as physically "a standard 3x3 with 3D printed tiles attached" — closer in
  description to a base cube with an added modification than a from-scratch different design. A
  future model/variant pass should consider whether DATA_MODEL §4.3's `modified_from`/`service`
  framing (with Calvin's Puzzle as `kind: service` for this specific product) is a better fit
  than treating this as an independent Calvin's-designed model, since the base 3x3's own
  manufacturer is not stated by this source. Not resolved here; the family record is created
  under `calvins-puzzle` per the retailer's own attribution and product naming, which is the
  operative fact at this pass.

  Almost certainly non-WCA-legal; the `scope_class: conditional` justification and admission is
  deferred to pass 3/4 per DATA_MODEL §1.4.
