# Pass 2.6 family-gap remediation (ledger P26-1, authorised 2026-09-07). Established by Pass
# 2.6; did NOT exist during Pass 2 or Pass 3. See research/qc/pass2.6-family-gap-sweep.md and
# research/qc/pass2.6-agent-e-lost-lanes.md.
#
# This family is the archive's clearest case of a finding that was MADE and then LOST. A 474-URL
# non-truncated CDX sweep committed on 2026-09-03 recorded, verbatim, that YuFeng "and ShengShou
# Crazy 3x3 are both demonstrably real, currently-sold ShengShou 3x3 product lines with NO
# corresponding family record in data/families/". That escalation sat unpropagated at
# `status: sourced` because the Pass 3 lane that wrote it was killed by a rate limit before its
# report existed. See ledger P26-2 — the roll-up defect, not the research, is what hid this.

