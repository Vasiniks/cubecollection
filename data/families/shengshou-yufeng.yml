positioning: mainline
description: |-
  A two-generation magnetic-core 3x3 line, and — unlike the other three families added by this
  remediation — not a historical one: it was still selling through a 2025-11-29 capture.
  TheCubicle carries both generations as its own product pages: the YuFeng 3x3 M (magnetic
  core, 56mm, $19.99, thecubicle-shengshou-yufeng-3x3-m-2023) and the YuFeng V2 3x3 M
  (56mm, $22.99, thecubicle-shengshou-yufeng-v2-3x3-m-2023). SpeedCubeShop carries the line
  independently (speedcubeshop-shengshou-products-prefix-2026).

  None of the seven pre-existing ShengShou families accommodates it: `shengshou-3x3`,
  `shengshou-legend`, `shengshou-aurora`, `shengshou-fangyuan`, `shengshou-wind`,
  `shengshou-pearl` and `shengshou-mr-m` are each their own separately named line, and YuFeng
  is a wholly new name rather than a version suffix on any of them — the same naming behaviour
  that keeps those seven apart from one another.

  **A claim deliberately NOT recorded.** TheCubicle's URL slug for the first generation contains
  "magelev", but a first-hand customer review on that same page disputes the MagLev claim, and
  ShengShou's own marketing reportedly dropped it after it was contested. A URL slug is not a
  specification, and a contested claim is not a confirmed one, so **no MagLev configuration is
  recorded on this family or its models**. This is left as a pass-4 question with the conflict
  documented rather than silently resolved in either direction.

  **Why this family was missing.** ShengShou's official domain is dead, so its retail catalogue
  is the whole evidentiary channel. Pass 2 read TheCubicle's `/collections/` page, which
  "filters differently than the raw /products/ prefix and missed a live, dated 3x3 catalogue"
  (thecubicle-shengshou-products-prefix-2026, in its own words). The `/products/` prefix sweep
  that RESEARCH_SPEC §3.6a now makes mandatory finds it immediately. See ledger P26-3.
status: sourced

