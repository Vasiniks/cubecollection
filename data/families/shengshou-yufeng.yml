      the product existed and was for sale by then. Recorded `qualifier: before` per the Pass 3
      admission policy §3. TheCubicle's own 'Added:' field was available and is REFUSED — that
      field class is categorically inadmissible as a release date in this archive, with four
      documented catalogue-migration artifacts behind the rule."
