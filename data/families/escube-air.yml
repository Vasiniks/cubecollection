description: |-
  TheCubicle's own product description (thecubicle-escube-air-3x3-20-magnet-ball-core):
  "ESCube Air 3x3 is a new core-magnetic speedcubing on a budget. This latest release from
  ESCube features a fully magnetic ball-core design, providing enhanced stability and turning
  control for speedcubers of every skill level. Fine-tune your solving experience with the
  innovative numerical tension adjustment system... This is the 20 magnet version, meaning
  that the corners attract to the core in the aligned state and repel it around the 45 degree
  mark. Please note that, unlike other cubes with 20 magnet cores, this one does not have edge
  foot magnets." Framed as ESCube's "latest release" relative to `escube-es3`, its earlier
  debut line, but no source states Air is a direct design successor to ES3 specifically (a
  different name, not a version-numbered continuation) — kept as its own family rather than a
