description: |-
  TheCubicle's own description of the first generation: "The Waverider V1 is a new 3x3
  speedcube by the emerging brand Haitun Cube" (thecubicle-haitun-waverider-v1-2024, Added
  2024-01-17), sold in at least Flagship, Standard, and a Limited Edition configuration (plus
  a dedicated adjustment tool accessory) — pass-3/4 configuration material, not enumerated
  further here. A second generation directly and explicitly succeeds it: "the HaiTun Waverider
  V2 3x3 (Standard), the highly anticipated **second generation** from boutique manufacturer
  HaiTun" (thecubicle-haitun-waverider-v2-standard-2026, Added 2026-02-03), itself sold across
  at least Standard, Pioneer, Flagship, and an "Ultimate" top tier — "the crown jewel of the
  Waverider V2 series" per its own page (thecubicle-haitun-waverider-v2-ultimate-2026, Added
  2026-03-07). Both generations are explicitly described as HaiTun's own design ("by the
  emerging brand Haitun Cube"; "Crafted by boutique manufacturer HaiTun") — no rebrand or
  aftermarket claim was found for any HaiTun product this pass, unlike this session's CubeStyle
  finding.

  No further HaiTun product line beyond Waverider was found this pass — on current evidence,
  Waverider appears to be HaiTun's entire product range, consistent with `data/manufacturers/
  haitun.yml`'s own framing of this as "a genuinely new... entrant" rather than a historical
  brand with a wider back-catalogue.
