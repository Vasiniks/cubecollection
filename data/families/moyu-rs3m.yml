positioning: budget
description: |-
  MoYu's budget/value 3x3 succession, sold under the "RS3M"/"RS3 M" name from its 2020 debut
  through at least "RS3M V5" (late 2023, per speedsolving-wiki-moyu) and confirmed still
  current at TheCubicle as of a 2021 capture alongside the flagship WeiLong line
  (thecubicle-com-moyu-3x3-collection-2021: "MoYu RS3 M 2020 3x3", "Angstrom RS3 M 2020+ 3x3",
  etc.). The wiki describes it as "Considered one of the best 3x3s of all time" at a "cheap
  price point of only $9" and separately notes the line's own branding straddles MoYu and its
  sub-brand MFJS ("the tremendously popular 'RS' line of puzzles from MoYu/MFJS", in the wiki's
  own Skewb section) — this ambiguity is recorded here rather than resolved; `manufacturer_id`
  is kept at `moyu` on the strength of TheCubicle's own retailer attribution
  (thecubicle-com-moyu-3x3-collection-2021 files every RS3M product under its "MoYu" brand
  collection, not under a separate MFJS collection), but a future pass revisiting MFJS
  specifically should check this again.
status: drafted

