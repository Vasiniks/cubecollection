description: |-
  ShengShou's first stickerless 3x3 line. SpeedCubeShop's own copy states it directly:
  "ShengShou Rainbow 3x3x3 is ShengShou's first stickerless cube. This item is a bargain for the
  amount of performance that you get" (shengshou-rainbow-independent-multi-retailer-2026, capture
  2016-01-08, listed at $5.95). TheCubicle carried it as Type "3x3", 56.2mm
  (thecubicle-shengshou-other-3x3-lines-2026), and Cubelelo carried it in India from 2016-04.

  **Why this is a family and not a stickerless variant of an existing line** — the obvious
  competing reading, tested and rejected. DATA_MODEL §4.2 does list stickerless as a variant axis,
  so the hypothesis deserved a real test. The discriminator is TheCubicle's own catalogue
  convention: it marks a stickerless *variant* with an `-unstickered` suffix on the base product
  slug, as in `shengshou-aurora-3x3-unstickered`. **Rainbow is never suffixed that way anywhere**
  — it is always its own top-level product name, exactly like Aurora, Wind, Legend and Mr. M. A
  Rainbow 2x2 sibling at Cubelelo (2017) confirms the name carries across sizes, which a
  finish-option would not.

  The Speedsolving wiki lists it as "ShengShou Rainbow (CaiHong)" in the same enumeration, at the
  same level, as the five families this archive already accepts — with a native Chinese name in
  the same style (speedsolving-wiki-shengshou-products, tier 4, corroborating only).

  **An unresolved spec conflict, recorded not reconciled.** SpeedCubeShop's structured product
  data gives a weight field of 119 (unit unstated on-page); TheCubicle's 2020 capture gives
  "Gross Weight 100g" for the same nominal product. The two are left in conflict rather than
  averaged or silently preferred, and no `weight_g` is recorded on the model.
status: sourced

