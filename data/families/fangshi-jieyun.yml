description: |-
  The fourth and last documented generation of FangShi's flagship 3x3 lineage, succeeding
  GuangYing. TheCubicle's own page states a physical difference in the mould itself: "It
  features an assembly similar to that of the FangShi GuangYing, but with some major
  differences in the pieces that are expected to make it perform even better than the FangShi
  GuangYing. **It also features minor grooves on the pieces where the stickers are placed**"
  (thecubicle-fangshi-jieyun). Different mouldings are a new line under DATA_MODEL §4.2
  "whatever the marketing says" — this is not a configuration choice made at assembly.

  Cubezz.com corroborates the design claim from an unrelated catalogue, calling it a "Funs
  Puzzle new design" under its own brand field "Brand: Funs Puzzle(JieYun)" and its own SKU
  FUNSJY0B (cubezz-fangshi-jieyun). Five independent tier 2 retailers carry it: TheCubicle
  (US), Cubezz (CN), LighTake (CN/HK), speedcube.com.au (AU) and SpeedCubeShop (US).

  Contemporary reviews on TheCubicle's own page treat it as distinct from and better than its
  predecessors — "unlike the flimsier feeling GuangYing and ShuangRen", "much less sandy than
  previous FangshiCubes", "The cube feels much heavier than the fangshi shuangren v2", "By far
  the best cube in the fangshi line".

  A 54.5–54.6mm "Mini JieYun" was sold alongside the 57mm original. Following the archive's own
  `dayan-zhanchi` 42mm precedent, a Mini is treated as a within-family size variant and is
  **pass 4 material**, not a separate family. One open question is deliberately left for pass
  4: whether Mini JieYun shares the grooved-piece mould that defines this line at a different
  scale. No source found at any of the five retailers states either way, and the two pages that
  would settle it are unrecoverable (see research/qc/pass2.6-agent-a-fangshi.md §7).
status: sourced

