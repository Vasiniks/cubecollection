# family: calvins-crazy-3x3
# Pass 2 (family enumeration). Calvin's Puzzle's specialism, per pass 1's own finding, is
# non-WCA shape mods, cuboids, and novelty twisty puzzles, not standard speedcubes — this
# family and its two siblings (calvins-crazy-mirror-3x3, calvins-bandaged-3x3-maze-300) are the
# only 3x3-mechanism products found across a ~90-slug catalogue that carry a genuinely
# distinctive, specifically-described mechanism, rather than a bare decorative name. Every
# accepted family here will need its own `scope_class: conditional` justification at the
# model/variant level in a future pass, per DATA_MODEL §1.4 — deliberately not decided here.

id: calvins-crazy-3x3
