positioning: special
description: |-
  A "Crazy" 3x3 mechanism variant, described directly in TheCubicle's own product copy: "The
  Full-Function Crazy 3x3 is a puzzle from Calvin that has circles on the center of each face.
  These circles do not turn when you turn the face, they're 'locked' into place. It can still be
  fully scrambled and offers quite the challenge if you're never solved a Crazy puzzle before"
  (thecubicle-calvins-full-function-crazy-3x3, tier 2). TheCubicle's own "Type" field files this
  under "Shape Mods," consistent with pass 1's characterisation of this manufacturer.

  The same retailer's catalogue also carries "Full-Function Crazy Megaminx (Center-Locking)" and
  "Full-Function Crazy Tetrahedron (Center-Locking)" — the same named mechanism concept applied
  to other puzzle shapes, out of this archive's 3x3x3 scope and not otherwise investigated this
  pass; noted here only to record that "Full-Function Crazy... Center-Locking" reads as a
  persisting Calvin's Puzzle design concept across shapes, not a name unique to the 3x3.

  Almost certainly non-WCA-legal (a "crazy" mechanism with locked, independently-non-turning
  center circles is not a standard 3x3x3 by WCA regulation); the `scope_class: conditional`
  justification and admission is deferred to pass 3/4 per DATA_MODEL §1.4.
