description: |-
  A plain, no-frills Maru 3x3, described directly in TheCubicle's own product copy: "The VX-3 is
  an airy puzzle from the famous brand Maru. This puzzle has no frills or fancy features, just a
  plain 3x3 with a modern design" (thecubicle-maru-vx-3, tier 2) — read as a deliberate
  budget/entry-level positioning relative to the design-credited, flagship-framed `maru-cx3`,
  though no source uses the word "budget" directly.

  **Magnetic configurations exist as later variants of this same base model, not separate
  families.** The same CDX prefix sweep this pass found "Maru VX-3 Core M" and "Maru VX-3 Core M
  MagLev" product pages at this retailer — read per DATA_MODEL §4.2 as a magnetic-core
  configuration choice sold as options of the same underlying VX-3 design, not a distinct
  design/mould/mechanism, and therefore left as pass-4 (variant enumeration) leads on this
  family record rather than built into new models here. Their own product-description text was
  not independently retrieved this pass.

  **Deliberately kept as its own family, not merged with `maru-3x3` or `maru-cx3`.** See
  `maru-3x3.yml`'s own header comment for the shared reasoning applied across all three of this
  manufacturer's 3x3 lines found this pass: no source states any succession between them.
