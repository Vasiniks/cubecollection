      per the confidence table, not `probable`, since no second source was found at all (not
      merely uncorroborated agreement)."
  /positioning:
    confidence: uncertain
    sources: [thecubicle-giiker-m3-3x3-2020]
    note: "No source states a positioning label directly; `special` is this record's own
      best-fit reading of the retailer copy's framing (a mechanical variant of the smart-cube
      shell, not a standard mainline product), recorded at `uncertain` rather than left
      unset because the field is not critical (not on the §7.2 rule 6 list) and a stated,
      flagged best-fit reading is more useful to a future researcher than silence — a human
      should revisit this label once more evidence exists."
  /aliases:
