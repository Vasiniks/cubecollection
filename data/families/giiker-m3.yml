# family: giiker-m3
# Pass 2 (family enumeration). GiiKER's mechanical, non-electronic 3x3 sharing the SUPERCUBE
# shell/tooling — kept as its own family rather than folded into giiker-supercube, because the
# evidence found describes it as a deliberate parallel product ("without the internal
# electronics"), not a checkout-time configuration of the smart cube. This is the sibling case
# the giiker-supercube.yml header comment reasons about; see that file for the fuller
# smart-vs-mechanical boundary discussion applied identically across this manufacturer's two
# families.

id: giiker-m3
entity: family
manufacturer_id: giiker
name: "GiiKER M3"
aliases:
  - "Giiker M3 3x3"
introduced:
  value: "2018"
  precision: year
  qualifier: circa
  note: "TheCubicle's own catalogue records 'Added: 2018-10-30' — a retailer catalogue-add date,
    not a stated manufacturer release date, hence `circa` rather than `exact`."
positioning: special
description: |-
  A mechanical, non-electronic 3x3 built on the same shell/tooling as GiiKER's SUPERCUBE smart
  cube line. TheCubicle's own product copy (thecubicle-giiker-m3-3x3-2020, tier 2) states
  directly: "The Giiker M3 3x3 retains the feel and sound of the original Giiker Smart Cube but
  without the internal electronics. It features strong magnets and a classic color scheme on
  black plastic." The same source's specification table records it as added to the catalogue on
  2018-10-30, with its own weight and dimension figures distinct from the i3S's.

  `positioning: special` is recorded here rather than `mainline` or `smart`: it is explicitly
  *not* the smart line (it is defined by the electronics' absence), and no evidence found this
  pass positions it as GiiKER's standard/default 3x3 offering the way `mainline` would imply —
  it reads, on the evidence available, as a dedicated mechanical spinoff of the smart-cube shell
  for buyers who want the physical object without its electronics, a genuinely different market
  proposition from either a flagship or a budget line.

  Only a single generation/product page for this line was found across TheCubicle,
  SpeedCubeShop, and GiiKER's own site (which does not list "M3" among its current products at
  all — it appears only at third-party retailers). Whether the "same shell/tooling" claim in the
  source excerpt means the mechanism is, at the model level, literally the identical mold with
  the electronics bay left unpopulated, or a genuinely different internal geometry, is
  explicitly left open for pass 3 — this family record only establishes that M3 is a real,
  separately named, separately specified product warranting its own family, not a claim about
  the underlying tooling.
status: drafted

attestations:
  /introduced:
