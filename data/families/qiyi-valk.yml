description: |-
  QiYi's flagship 3x3 line designed in collaboration with former world-record holder Mats Valk,
  persisting under the "Valk" name across generations documented at TheCubicle
  (thecubicle-products-valk-prefix-2025): Valk2 M, Valk 3 (with M, Elite, Power, Power M, and
  Mini sub-versions), Valk 4 M (Standard and Strong), and Valk 5 M — the last still resolving
  live product pages as of a November 2025 capture, i.e. the line remained current at least
  through late 2025. The Speedsolving wiki independently corroborates the origin and the
  earliest generation's significance (speedsolving-wiki-qiyi-products): "TheValk is a sub-brand
  created for the release of the Valk 3, a 3x3x3 cube designed by former world record holder
  Mats Valk that he used to set a former world record single of 4.74 seconds. It was the main of
  a large percentage of speedcubers after its release."

  A 2018 QiYi storefront capture (qiyicube-storefront-2018, created in pass 1) shows "The Valk"
  already a headline product ("QiYi Cube – The Valk, MoFangGe, X-Man Design Speed Cube") selling
  Valk 2 M and Valk 3 variants, consistent with `introduced` circa 2018 or slightly earlier
  (Valk2 M implies an unlisted original Valk/Valk 1 that this pass did not chase further).

  **Boundary call: manufacturer_id set to qiyi, not x-man-design — RESOLVED 2026-09-03.**
  QiYi's own corporate history (qiyitoys-company-history) states that in 2016 *the company*
  partnered with Mats Valk to found the "The Valk" brand, which settles this directly in favour
  of `qiyi`; see the /manufacturer_id attestation. The paragraph below records the reasoning as
  it stood before that evidence was found, and is retained for provenance. It was the pass's
  least certain family-boundary decision and is recorded in full in
  research/notes/models/global-pass2-families.md. The Speedsolving wiki's own "Sub-Brands"
  section lists "X-Man Design" and "TheValk" as two parallel, separately-headed entries under
  QiYi (not nesting Valk inside X-Man Design), and the 2018 QiYi storefront page title likewise
  names "The Valk" and "X-Man Design" as two separate items rather than one containing the
  other. Against that: QiYi's own current (2026) "family of brands" page
  (theqiyi-about-us) does not mention Valk by name at all, only X-Man Design — Valk may have
  been folded administratively into X-Man Design's product range since 2018, or may simply have
  been omitted from a marketing page that is not an exhaustive brand list. No source located
  this pass states either reading directly. Recorded at `qiyi` on the strength of the two
  parallel-listing sources found; flagged for a human reviewer.
status: drafted

