      QiYi's genuine corporate site carries a dated 2016 company-history entry stating verbatim:
      「公司携手著名魔方选手 Mats Valk 创立专业速拧魔方品牌「The Valk」」 — *the company [QiYi]
      partnered with the well-known cuber Mats Valk to found the professional speedcubing brand
