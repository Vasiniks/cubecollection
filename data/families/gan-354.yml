# family: gan-354
# Pass 2 (family enumeration). A compact-format (54mm) GAN 3x3 line, sold under its own bare
# number since at least 2018, independent of both the GAN356 and GAN Flagship Series naming
# patterns. GAN's own product page for the "v2" generation confirms this is a persisting,
# multi-generation named line, not a one-off SKU. See research/notes/models/gan-pass2.md.

id: gan-354
entity: family
manufacturer_id: gan
name: "GAN354"
introduced:
  value: "2018"
  precision: year
  qualifier: circa
positioning: budget
description: |-
  A compact-format 3x3 line (54mm, versus GAN's standard ~56mm), sold under the bare number
  "354" rather than as a 356 or numbered-flagship sub-variant. TheCubicle's earliest capture of
  a GAN354 M listing (2018) describes it as "a new miniature, magnetic 3x3 that emulates the
  flagship performance of the Air SM" — framing it explicitly as a smaller-format alternative
  to the mainline 356 Air SM rather than a successor to it. GAN's own product page for a later
  "GAN354 M v2" generation, captured in 2024 and still headed "GAN354 M", confirms the line
  persisted across at least two generations under this name.

  `positioning: budget` is the archive's own inference from price point (roughly $22-40 across
  the captures found) and market framing ("comfortable, compact feel... ideal for
  one-handed enthusiasts and cubers with smaller hands"), not a manufacturer self-description;
  recorded at reduced confidence accordingly.
status: drafted

attestations:
  /introduced:
    confidence: uncertain
    sources: [thecubicle-gan-354-m]
    note: "DOWNGRADED from `probable` on 2026-09-03 (Pass 2 adjudication gate). The sole
      evidence was TheCubicle's 'Added: 2018-09-11' spec-table field, which has since been
      established as a catalogue-migration artifact rather than a per-product date: the same
      literal string appears 29 times across 22 source records spanning 13 unrelated brands
      (CubeStyle, GAN, GuoGuan, GuoJia, KungFu, Maru, MoHuanShouSu, MoJue, NewIsland, QJ,
      SenHuan, YanCheng, Z-Cube). A single date cannot be the true listing date for products
      from 13 brands, so it cannot support a `probable` introduction date for the GAN 354.
      Every later Pass 2 record deliberately refuses this field; this record and
      data/models/gan/gan-354-m.yml predate that discovery and were missed at the time. The
      2018 value is retained as a weak upper bound only — the line demonstrably existed by
      then. GAN's own product page (gancube-gan354-m-v2-product) states no introduction date.
      A tier-1 date remains unfound."
  /positioning:
    confidence: uncertain
    sources: [thecubicle-gan-354-m]
    note: "Inferred from price point and marketing framing on a single tier-2 source; no manufacturer statement of positioning was found for this line specifically."
  /discontinued:
    confidence: unknown
    note: "Researched and not found. TheCubicle's listing for this product persists in captures through at least 2025-05-25, and GAN's own site was still selling a 'v2' generation as of December 2024; no evidence of discontinuation was found this pass, so the field is left unset rather than asserting ongoing production without a positive statement to that effect either."
