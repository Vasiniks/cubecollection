# manufacturer: verypuzzle
# Pass 1 (manufacturer register). Long-tail candidate; a specialty shape-mod / non-3x3 twisty
# puzzle maker. Included per the "enumerate broadly" instruction — no standard WCA-legal 3x3
# product was found under its own name this pass, so any admitted product would need
# `scope_class: conditional`, decided at pass 2/4, not here. Also resolves "Geranium Puzzles"
# (a separate pass-0 long-tail candidate) as a VeryPuzzle product line.

id: verypuzzle
