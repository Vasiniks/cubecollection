# manufacturer: particula
# Pass 1 (manufacturer register). Israeli smart-toy company; maker of GoCube (its own brand)
# and, in partnership with Rubik's, the manufacturing entity behind "Rubik's Connected" — a
# direct, sourced answer to part of the manufacturing-entity question left open in
# data/manufacturers/rubiks.yml. Smart 3x3s are explicitly in scope per PRODUCT.md §2.1.

id: particula
