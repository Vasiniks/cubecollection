notes: |-
  **Identity and history.** Speedsolving wiki (speedsolving-wiki-eastsheen, tier 4): "East
  Sheen (or Eastsheen) is a puzzle manufacturer based in Taiwan founded by Chen Sen Li,"
  founded 1981, based in Kaohsiung, "Years Active: 1981-Present." Historically known for
  "Magic Cubes (commonly known as Eastsheen cubes), which are similar to Rubik's Cubes" but
  "lighter, smaller and cheaper," recognisable by a purple/pink face replacing the usual
  orange.

  **Still sold within the archive window, contradicting a stray impression that Eastsheen
  makes no 3x3s.** TheCubicle's own structured spec table for the "Eastsheen 3x3x3 Cube with
  Wall Stickers" (thecubicle-eastsheen-wall-stickers, tier 2) reads "Manufacturer: Eastsheen"
  and its own product description calls it "a standard Eastsheen 3x3" — captures of this exact
  listing span 2021 through 2025, squarely inside this archive's window. This is treated as the
  operative fact over the (undated, possibly outdated) wiki characterisation.

  **Own-domain evidence is inconclusive, not contradictory.** eastsheen.com is a parked
  domain-for-sale page in every capture checked across 2011-2016 (and frame-based/unreadable
  in 2009), meaning the company's own website was not actively representing it for most, if
  not all, of the years immediately preceding this archive's 2016 start. This does not
  establish the company itself ceased operating — Chinese/Taiwanese toy manufacturers of this
  era frequently sold through distributors without maintaining an English-language storefront
  — but it does mean no first-party Eastsheen source was reachable this pass, and `ceased` is
  left unknown rather than inferred from a dead domain alone.
