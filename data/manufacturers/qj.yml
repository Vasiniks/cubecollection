notes: |-
  **Identity and founding.** QJ's own official site states: "QJ toy factory is located in
  Guangdong province. We have been doing magic cubes for ten years... we build our own mould,
  design department, injection and packaging workshop" (qjcube-official-2013) — tier 1,
  first-party.

  **Distinct from QiYi.** "QJ" and "QiYi" are separate companies despite both being Guangdong
  puzzle manufacturers with overlapping initials; TheCubicle's own site maintains separate
  manufacturer filters for "QJ" and "QiYi MoFangGe" (general web search), and QJ's own site
  content, product range (classical NxN cubes, Pyraminx, Megaminx, Tetraminx, SSQ, Skewb,
  timers) and self-description are independent of QiYi's own "About Us" page and its "family of
  brands" (see data/manufacturers/qiyi.yml). Not merged; flagged explicitly given the naming
  similarity, the same caution already applied to "MoYou"/"MoYu" at data/manufacturers/cyclone-
  boys.yml.

  **Current status uncertain.** No capture of qjcube.com after 2013 was found in the CDX index
  checked this pass; `website` is left `unknown` rather than citing a domain whose current
  operation was not verified. Whether QJ is still active within the 2016-2026 scope window is
  an open question for pass 2 (family/model enumeration) to establish from product evidence.
