# manufacturer: fanxin
# Pass 1 (manufacturer register). Chinese manufacturer of budget puzzles and novelty shape
# mods, seen at SpeedCubeShop in the pass-0 sweep.

id: fanxin
entity: manufacturer
name: "FanXin"
kind: manufacturer
country: CN
aliases:
  - "Fanxin"
  - "FanXin Toys"
  # Chinese name, found 2026-09-19. The search key that matters: searching "FanXin" alone
  # returns a Shanghai exhibition-props firm (凡欣) and a Ningbo kitchenware trader, neither
  # of them this manufacturer.
  - "泛新"
notes: |-
  **Identity.** TheCubicle's own product spec table for the FanXin 3x3 gives "Manufacturer:
  FanXin" (thecubicle-fanxin-3x3) — tier 2 retailer, the only source located this pass directly
  naming FanXin as a manufacturer. No independent FanXin-branded domain, About page, community
  wiki article, or company-registration record was located in the time available this pass —
  general web search returns only retailer listings (TheCubicle, SpeedCubeShop, ZiiCube,
  MasKeCubos, China Magic Cube) and no first-party source. This is the weakest-evidenced of the
  14 strong candidates this pass was asked to canonicalise, recorded at `drafted` rather than
  `sourced` accordingly. A general web search summary (not independently verified or cited)
  suggested the brand emerged around 2015 in Guangzhou, specialising in non-WCA novelty and
  shape-mod puzzles rather than competitive speedcubes — recorded here as an unconfirmed lead
  for a future pass, not as a sourced fact.

  **"HuDong" is a FanXin product line, not a separate manufacturer — with a flagged internal
  contradiction.** TheCubicle's product page for the "HuDong Light 3x3" is titled and
  URL-prefixed "fanxin-hudong-*" and its own prose reads "The FanXin HuDong is a huge step for
  FanXin hardware," but the same page's structured "Manufacturer" spec field reads "HuDong"
  alone, not "FanXin" (thecubicle-fanxin-hudong-2024). This register treats HuDong as a FanXin
  product/model line (the more specific and informative prose reading, consistent with how
  "Guhong" and other model-family names are handled elsewhere in this register) rather than
  creating an independent "HuDong" manufacturer record, but the contradiction itself is
  preserved rather than silently resolved — a future researcher with better evidence (e.g. a
  FanXin or HuDong first-party source) may find the two are in fact separate companies in a
  supply/OEM relationship, which would need a `rebrand_of` or similar evidenced relationship,
  not an assumption from this single ambiguous retailer field.
status: drafted

