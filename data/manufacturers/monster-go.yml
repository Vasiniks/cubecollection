notes: |-
  **Parent relationship, established two independent ways.** (1) GAN's own brand-story page
  names Monster Go under a section literally headed "Our Sub-brands": "Monster Go is a
  brain-training puzzle toy brand with cultivating children's motors as its center"
  (gancube-brand-story-about-us). (2) Monster Go's own official site independently states
  "Powered by GANCUBE" in its own page title and describes itself in GAN's voice ("As a
  World-Leading speedcube brand, GANCUBE has created... we insist on GAN's outstanding
  quality"), AND its footer carries the identical registered legal entity
  (广州淦源智能科技有限公司) and the identical ICP filing number (粤ICP备16068632号) as GAN's
  own Chinese-domestic site (monster-go-official-home). An ICP filing is issued to a specific
  registered operator, so this is documentary, not resemblance-based. (3) GAN's own
  international storefront lists "Shop Mosnter GO" [sic, GAN's own typo] as one of only three
  top-level shop sections on gancube.com itself, alongside GANCUBE and Swift Block
  (gancube-collections-swift-block).

  "Mosnter GO" is recorded as an alias because it appears verbatim in GAN's own live site
  navigation (a first-party typo, not a third-party misspelling) and is exactly the kind of
  variant that could otherwise read as a phantom brand.

  No native-language (Chinese) name for Monster Go was located in this pass; only
  English-language self-description was found on monster-go.com.
