  actively developed 3x3 line (multiple magnet/core/maglev/coating configurations across at
  least two named product lines, TG and YS3M) as of 2025 captures. This is pass-2 material and
  not enumerated further here.

  **Country.** No first-party HuaMeng site or About page was located this pass (no independent
  `huameng`-branded domain confirmed; `website` left blank rather than guessed). `country: CN`
