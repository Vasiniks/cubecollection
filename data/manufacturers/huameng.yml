  the near-universal pattern among the other budget/mid-tier 3x3 makers found in this sweep —
  flagged as inference, not a stated fact, and should be corrected if a direct source turns up.

  **No relationship to any other registered manufacturer was found or claimed anywhere in this
  pass's sources.** Recorded as an independent `kind: manufacturer`, distinct from the
  MoYu-sub-brand pattern established for PBCube (see data/manufacturers/pbcube.yml) even though
  both were found via the same product-prefix sweep.
