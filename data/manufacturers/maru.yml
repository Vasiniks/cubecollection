notes: |-
  **Identity.** Speedsolving wiki (speedsolving-wiki-maru, tier 4, unusually thin even for
  this tier): "Maru is a Taiwanese puzzle manufacturer," with founding and years-active both
  marked "unknown" by the wiki's own infobox. Independently corroborated by TheCubicle's own
  structured spec field (thecubicle-maru-3x3, tier 2): "Manufacturer: Maru." A `maru.tw` domain
  capture from 2020 (title "MARUCUBE小丸號官方網站") is consistent with a Taiwan-based,
  cube-branded website still resolving at that date, though no further page content survived
  the capture to serve as a usable source.

  **Historical and discontinued.** TheCubicle's "Maru 3x3" listing (thecubicle-maru-3x3)
  describes it as "one of the first cubes ever released by Maru several years ago," long
  discontinued by the time of the (2023-captured) listing, which was liquidating old stock. A
  customer review independently dates the original product to approximately 2011 ("get it if
  you want a tast[e] of 2011... the weilong hadn't come out yet"). This places Maru's known
  flagship 3x3 product before this archive's 2016 start; whether Maru had later, in-window
  3x3 products is unresolved — the domain capture (2020) suggests the company or its site
  persisted into the archive window, but no specific later product was located this pass.
