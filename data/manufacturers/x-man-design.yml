notes: |-
  **Parent relationship — re-sourced and factually corrected 2026-09-03 (issue Q1).**
  QiYi's genuine corporate site (qiyitoys-company-history) carries a dated 2015 company-history
  entry stating verbatim: 「奇艺首席设计师张小静创立「XMD」品牌」 — *QiYi's chief designer Zhang
  Xiaojing (张小静) founded the "XMD" brand*. XMD is therefore a house brand founded **internally,
  by QiYi's own chief designer**, in 2015.

  **This corrects, not merely re-sources, the previous framing.** This record formerly described
  X-Man Design, on the authority of theqiyi-about-us, as "a premium sub brand created in close
  collaboration with an independent designer known as X-Man". That page has since been
  established as an Amazon-affiliate site rather than QiYi's own (see
  research/qc/pass2-human-review.md, issue Q1), and its "independent designer" characterisation
  is **contradicted** by QiYi's own corporate history, which names an internal chief designer.
  The sub-brand relationship itself is unchanged and is now better evidenced; only the
  "independent outside collaborator" reading is withdrawn.

  Corroboration, unchanged: an earlier QiYi storefront (2018) already carried "X-Man Design"
  alongside "The Valk" and "MoFangGe" in its own page title (qiyicube-storefront-2018), showing
  the association predates any current page by years. The Speedsolving wiki lists X-Man Design
  under QiYi's own "Sub-Brands" heading (speedsolving-wiki-qiyi) — tier 4, corroborating only.

  **No independent legal entity or domain was located.** X-Man Design appears to be a QiYi house
  brand rather than a separately registered company, consistent with its founding by a QiYi
  employee. `website` is left unresolved rather than assumed; `country: CN` is recorded insofar
  as XMD was founded inside QiYi's own Guangdong operation, not as an independently confirmed
  fact about a separate legal entity.

  A person record for 张小静 (Zhang Xiaojing) is **not** created here — that is a later-pass
  decision, noted so the lead is not lost.

  **Tornado is a product line, not a further sub-brand.** The withdrawn theqiyi-about-us page treated
  "Tornado" as "the Tornado series" and "the Tornado line of 3x3 flagships" within X-Man Design,
  not as a separately named brand — confirming the pass-0 brief's existing classification
  (product_lines_not_manufacturers). No manufacturer record is created for Tornado; it belongs
  to pass 2 as a family under x-man-design.
status: sourced

