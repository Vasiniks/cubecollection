notes: |-
  **Identity, founding, and parent/brand distinction.** ShengShou's own "About Us" page states:
  "Our company, Hui Qijia Toys was founded in 2000... located in ChengHai area ShanTou city
  GuangDong province, China... we created our proprietary brand 'ShengShou' in 2009"
  (shengshoutoys-about-us-2018) — tier 1, first-party. The Speedsolving wiki independently gives
  the native name "圣手" (shèngshǒu, "divine hand") (speedsolving-wiki-shengshou) — tier 4,
  corroborating only.

  **Domain correction — important false lead avoided.** `shengshou.com` looks like the obvious
  official domain and was carried in the pass-0 candidate list without a domain check. Every
  archive.org capture of `shengshou.com` found this pass (spanning 2003-2017) is either a
  parked/portal page or unrelated Chinese-language content — never the cube manufacturer. The
  actual historical site is `shengshoutoys.com`, found via general web search rather than domain
  guessing. `website` is left `unknown` on this record rather than pointing at either domain:
  `shengshoutoys.com` no longer resolves to the manufacturer as of 2026 (a live fetch attempt
  returns a TLS certificate for an unrelated site, xjtianshan.com), and no current official
  domain was confirmed this pass. This is recorded as a caution for any future researcher
  tempted to guess `shengshou.com` again.
