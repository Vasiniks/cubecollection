notes: |-
  **Parent relationship.** MoYu's own official site, in its own page title, names "魔方教室"
  (MoFang JiaoShi) among a short list of its own house/sub-brand names, alongside its numbered
  cube product range (moyucube-official-home-2022) — first-party, tier 1. The Speedsolving wiki
  independently states MoFang JiaoShi ("Cubing Classroom") "is a sub-brand of Moyu"
  (speedsolving-wiki-mofang-jiaoshi) — tier 4, corroborating only. A EU retailer's own catalogue
  structure files "Cubing Classroom (MFJS)" as a category nested under a "moyu" brand path
  (cuboss-mfjs-brand-page) — tier 2 retailer taxonomy, corroborating only. No independent MFJS
  legal-entity page, About page, or standalone domain was located this pass; MFJS products are
  sold under moyucube.com and via retailers using the "MoYu MoFang JiaoShi" or "MFJS" naming,
  consistent with an in-house label rather than a separately registered company — the same
  reasoning applied to GAN's Swift Block (data/manufacturers/swift-block.yml). `website` is
  therefore left `unknown` rather than pointing at moyucube.com, which is MoYu's own site, not
  a separately identifiable MFJS site.

  **Founding.** No source states an explicit founding date; the Speedsolving wiki gives "active
  2016-present" with founding itself marked "unknown" on that page. Recorded here as `circa
  2016` with `confidence: uncertain` on the attestation, since it is a single tier-4 source
  describing activity rather than a stated founding fact.

  **Meilong is a product line, not a further sub-brand.** Both the Speedsolving wiki
  (speedsolving-wiki-mofang-jiaoshi) and retailer/marketplace listings found in general web
  search (e.g. "CuberSpeed Moyu MoFang JiaoShi Meilong ... MFJS MEILONG ... Cubing Classroom")
  consistently present Meilong as a named product-line catalogue *within* MoFang JiaoShi's own
  range, sold under the MFJS/Cubing Classroom name, not as a separately branded or separately
  identified company. No manufacturer record is created for Meilong; it belongs to pass 2 as a
  MFJS family. This directly answers the pass-0 brief's open question ("Meilong may be a product
  line rather than a sub-brand") — the evidence supports product line.
status: sourced

