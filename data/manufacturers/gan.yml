notes: |-
  **Naming decision.** GAN's own brand-story page states outright that "the cube brand,
  GANCUBE, made its debut" in 2014 (gancube-brand-story-about-us) — GANCUBE is GAN's own name
  for itself as a corporate/storefront brand, and gancube.com's own page titles read "GANCUBE
  Official Website". Community and retail usage is overwhelmingly "GAN": every product name in
  every source located this pass reads "GAN 356 Air", "GAN 11 M Pro", "GAN12/13/14/15/16",
  "GAN V100" — never "GANCUBE <product>" — and the Speedsolving wiki's own article is titled
  simply "GAN". This record uses `name: "GAN"` as the archive's house style (§4.5: "normalized
  to a house style"), with "GANCUBE" recorded as the top alias and the manufacturer's own
  self-naming preserved here rather than silently discarded. This is a judgement call the
  archivist may want to revisit.

  **Legal entity.** GAN's Chinese-domestic site names the operating company as
  广州淦源智能科技有限公司 (Guangzhou Ganyuan Intelligent Technology Co., Ltd.), founded by
  Jiang Ganyuan (江淦源) — per gancube-cn-about-us-en, "the first NR holder of SpeedCubing in
  China" — per gancube-cn-introduction-zh.

  **Two official sites, two audiences.** gancube.com (international, English-first storefront,
  used as `website` above) and gancube.cn (Chinese-domestic; English and Chinese versions at
  /en/about/ and /introduction/ respectively) are both first-party GAN sites. Both carry the
  same legal-entity name and, per the Monster Go footer comparison, the same ICP filing number
  (粤ICP备16068632号), which is documentary evidence they are operated by the same company
  rather than merely resembling each other.

  **Disputed founding date — four candidates, genuinely different events.** This pass located
  the predecessor brand's own site directly (ganspuzzle.com, archived from 2011-10-27), which
  changes this from a two-candidate to a four-candidate question and moves the earliest
  candidate from tier 4 (a wiki's summary) to tier 1 (the predecessor brand's own
  self-description). None of these four sources contradicts another about its own specific
  claim; they disagree about which event is "the founding" of the organisation this record
  represents:

  1. **2010 — brand founding.** ganspuzzle.com's own "品牌介绍" (Brand Introduction) page,
     archived 2011-10-28: "GANSPUZZLE 淦源 是由国内资深魔方玩家江淦源创立的自主品牌。成立于2010年"
     ("GANSPUZZLE is an independent brand founded by veteran domestic speedcuber Jiang Ganyuan.
     Established in 2010.") — tier 1, first-party, for the *brand's* founding
     (ganspuzzle-brand-intro-2011).
  2. **2011 — first product.** speedsolving-wiki-gan (tier 4): "released their first cube in
     2011, the Ganspuzzle I." Not independently confirmed at tier 1-3 in this pass, but a
     companion product page from the same October 2011 ganspuzzle.com capture describes "GAN2"
     as designer Jiang Ganyuan's "第二款自主设计魔方" (second independently designed cube),
     which corroborates *that* an earlier design already existed by that date without dating it
     itself (ganspuzzle-gan2-product-2011).
  3. **2013 — a copyright-range start.** gancube.com's own earliest archived capture
     (2016-08-08) footer: "Copyright © 2013-2016 GAN Cube Inc." — tier 1, first-party, but a
     copyright range is a weaker and more ambiguous signal of "founding" than an explicit
     founding statement; it may mark when this corporate name or this specific site began
     rather than when the brand or company did (gancube-2016-earliest-capture). The same
     capture's ICP filing number (粤ICP备16068632号-1) shares its base registration with the
     number used later on gancube.cn and monster-go.com, tying this early identity to the
     entity researched elsewhere in this file.
  4. **2014 — formal incorporation.** Three independent tier-1 GAN pages state "GANCUBE Inc. was
     founded in 2014" / "由创始人江淦源先生于2014年创立" (gancube-brand-story-about-us,
     gancube-cn-about-us-en, gancube-cn-introduction-zh). This is the most explicit, most
     corroborated "founded" statement of the four, and is the value retained in the main
     `founded` field below — not as an adjudication of which event the organisation's true
     founding date is, but as the best-attested single candidate pending a decision.

  A fifth, unexplained data point: gancube.cn's own footer (both /introduction/ and /en/about/)
  reads "© 2011-2023", a year that matches neither 2010, 2013, nor 2014 exactly, and is closest
  to the wiki's 2011 first-product claim. Recorded in the sources themselves; not treated as a
  fifth independent candidate here because no source explains what the 2011 in that copyright
  range refers to.

  **This record does not adjudicate.** `founded` carries `confidence: disputed` with all four
  candidates and their sources in the attestation. Whether "GAN" the organisation this register
  represents began as the 2010 GANSPUZZLE brand, the 2011 first product, the 2013 corporate
  identity, or the 2014 incorporation is a genuine historical question this pass could not
  settle, and per instruction it is left disputed rather than settled by preference. Pass 2
  should treat "Ganspuzzle"/"GANSPUZZLE"/"淦源魔方" (2010-2014ish) as the immediate predecessor
  brand of GAN/GANCUBE when enumerating the earliest families, since GAN1 and GAN2 (the
  ganspuzzle.com product names) plausibly precede the family/model naming scheme used from
  GAN356 onward.

  **Sub-brands.** GAN names Monster Go and Swift Block as its own sub-brands; see
  data/manufacturers/monster-go.yml and data/manufacturers/swift-block.yml for the evidence
  chain establishing each.
