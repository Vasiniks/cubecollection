notes: |-
  **Identity.** TheCubicle's own manufacturer-filter page treats "Calvin's Puzzle" as a distinct
  manufacturer (thecubicle-calvins-puzzle-manufacturer-filter) — tier 2, first-party retailer
  categorisation — and the same brand is independently filed as a manufacturer at several other
  retailers (general web search of retailer collection pages, not independently captured this
  pass): SpeedCubeShop, MasKeCubos, Cuboss, CubeIn, Cubewerkz, JPearly. The brand's own
  storefront, hknowstore.com ("Now Store"), lists "Calvin's Puzzles" as its own top product
  category alongside "Calvin's Lubes", and references a social handle "calvin.nowstore"
  (hknowstore-calvins-puzzle-storefront) — consistent with a single named individual ("Calvin")
  behind both the brand and its storefront, though no source located this pass gives a full
  name, nor states outright whether Calvin's Puzzle is manufactured by this individual/company
  directly or designed by them and manufactured elsewhere under their direction. The
  Speedsolving.com wiki's "List of manufactures" page separately lists "Now Store (Calvin)"
  among cube manufacturers, corroborating the same identity (general web search of that wiki
  page; not independently captured as its own source this pass beyond what is already recorded
  generally for that page).

  **Country left unknown — a genuinely ambiguous single source.** hknowstore.com's own storefront
  carries Hong Kong branding in its domain and site name ("HK Now Store") but lists a mainland
  Chinese contact phone number (+86, not Hong Kong's +852) alongside WeChat/QQ contact channels
  (hknowstore-calvins-puzzle-storefront). This is one source with internally conflicting signals,
  not two sources in disagreement, so it is not recorded as a `disputed` attestation (rule 11
  requires distinct sources per candidate); `country` is left `unknown` rather than guessing
  between Hong Kong and mainland China from an ambiguous domain name and a phone country code.

  **Scope note, not resolved here.** General web search characterises Calvin's Puzzle as
  specialising in "non-WCA twisty puzzles," "licensed designer twisty puzzles," shape mods, and
  cuboids (e.g. 3x3x2, 3x3x4, 3x3x5, 3x3x7 "full functional" cuboids) rather than standard
  WCA-legal 3x3 cubes. This register does not decide `scope_class` (a model/variant-level field);
  it records the manufacturer so that if a specific Calvin's Puzzle product proves historically
  or collector significant, pass 2/4 can admit it under `scope_class: conditional` with its own
  justification rather than the brand being invisible to the archive entirely.
