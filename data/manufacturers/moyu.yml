notes: |-
  **Identity.** MoYu's own site (moyucube.com), captured 2022, gives its legal/brand name as
  "魔域文化传播有限公司" (MoYu Culture Communication Co., Ltd.) and lists 2x2 through 15x15
  cubes, shape mods, and magnetic cubes among its own products in its own page title
  (moyucube-official-home-2022) — direct, first-party evidence of `kind: manufacturer`. An
  earlier capture (2015, content dated 2013) shows the same legal name and two domains,
  moyucube.com and moyutoys.com, both recorded as aliases (moyucube-doc-2013-earliest). Baidu
  Baike separately gives the legal entity as "Shantou Chenghai District Moyu Culture Co., Ltd.",
  registered 2016-08-25, legal representative Chen Yonghuang (baike-baidu-moyu) — tier 4,
  corroboration only.

  **Relationship to YJ (Yongjun).** The Speedsolving wiki states MoYu began around 2012 "as a
  platform for external designers to provide designs to YJ for production, marketing, etc." —
  i.e. started life as a YJ-affiliated design label — and "parted ways [from YJ] by 2019 at the
  latest", after which the two operated as separate companies with separate factories
  (speedsolving-wiki-moyu). This is tier 4 only; no tier 1-2 source corroborating or
  contradicting it was located this pass. It is recorded here as a documented lead, not acted
  on: MoYu is recorded as an independent `kind: manufacturer` for the whole 2016-2026 scope
  window, since even the wiki's own account places any YJ dependency before 2019 and this
  archive's period begins 2016. If a tier 1-2 source later establishes a YJ/MoYu manufacturer
  relationship as a manufacturer-level lineage, DATA_MODEL currently has no field for a
  manufacturer-to-manufacturer `succeeds`/spinoff relationship (see the GAN pilot's F2 finding
  in docs/pilot-audit.md) — this would need the same schema extension.

  **Own-stated sub-brands — resolved (2026-09-02).** MoYu's own site title tag
  (moyucube-official-home-2022) lists, by Chinese name, alongside its numbered-cube product
  range: 魔方教室 (MoFang JiaoShi — see data/manufacturers/mfjs.yml), 洋葱设计 (Cong's/Onion
  Design), 国冠 (GuoGuan), 魔爵 (MoJue), 魔幻手速 (MoHuan ShouSu), 乐涛 (LeTao), 森幻 (SenHuan),
  and 燕成 (YanCheng). This pass individually canonicalised five of the seven as
  `kind: sub_brand`, `parent_id: moyu`:

  - **GuoGuan** (data/manufacturers/guoguan.yml) — the one name with a dedicated Speedsolving
    wiki page stating the relationship directly ("a MoYu sub-brand"), used as the evidentiary
    template for the rest.
  - **MoJue, SenHuan, MoHuanShouSu, YanCheng** (their own records) — no dedicated wiki page or
    direct relationship statement exists for any of these four; each is recorded `sub_brand` by
    structural analogy to GuoGuan (a standalone product name, no "moyu-" retailer-slug prefix,
    grouped in this same title tag) at `confidence: uncertain`, with the open question stated
    explicitly in each record's notes rather than silently resolved. YanCheng's evidence is the
    thinnest (a single, unconfirmed product slug).

  **洋葱设计 (Cong's/Onion Design) and 乐涛 (LeTao) remain unresolved, no record created.**
  Cong's Design has a real product range at TheCubicle (`congs-design-meichen-skewb`,
  `-meichi-pyraminx`, `-meiying`, `-meiyu-4x4`, plus its own `congs-design-t-shirt` merch line)
  but no 3x3 product was found among the slugs enumerated this pass, and no wiki page or direct
  relationship statement was located — it is plausibly a designer/shape-mod sub-line rather
  than a 3x3-relevant sub-brand, but this is not established. LeTao has no product-slug
  evidence at all beyond appearing in this same title tag; nothing else was found this pass.
  Both remain in research/staging/manufacturers/global-pass0-candidates.yml as open leads
  rather than being force-fit into a record.

  **Product lines, not sub-brands.** WeiLong, AoLong, AoSu, AoChuang, TangLong are MoYu product
  lines (design/model families), not separate brands or companies — consistent with the
  pass-0 finding already recorded for WeiLong/TangLong. They belong to pass 2, not this
  register.
status: sourced

