notes: |-
  **Identity, tier 1.** Meffert's own official site (mefferts-official-site-2024, archived
  2024, tier 1): "Our story began in 1970 when our founder Uwe Meffert, a German puzzle
  designer and inventor created his first puzzle, the Pyraminx. Though it was not until 1981,
  that he finally shared his invention with the world." The company is based at "2008 Remex
  Centre, 42 Wong Chuk Hang Rd, Aberdeen, Hong Kong" — recorded as `country: HK` (the operating
  entity's location), distinct from Uwe Meffert's own German origin (recorded in `aliases` and
  prose, not as `country`, since no source states the company itself was ever legally based in
  Germany). Still active and selling as of the 2024 capture ("© 2023 - Mefferts.com All
  rights reserved," "The Meffert Family").

  **Founding-date nuance, not a dispute.** 1970 is the year the founder created his first
  puzzle (the Pyraminx) per the company's own account; the puzzle itself was not commercially
  released until 1981. Recorded `founded: 1970` per the company's own framing of "our story
  began," with the distinction preserved in prose rather than forced into a false
  multi-candidate dispute (only one source addresses this).

  **Product scope.** TheCubicle's own manufacturer-filtered product-slug enumeration (this
  pass's second-layer sweep, 49 `mefferts-*` slugs) shows Meffert's is overwhelmingly a
  shape-mod specialist: Pyraminx variants, Skewb variants, Gear Cube, Ghost Cube, Fisher Cube,
  Megaminx, Mastermorphix, and similar — consistent with the company's own "twisty puzzle"
  positioning. Two slugs suggest non-standard 3x3 variants (`mefferts-hollow-cube-3x3`,
  `mefferts-kokonotsu-pillow-3x3`); no standard WCA-legal 3x3 flagship was found. Any
  `scope_class` decision for a specific Meffert's product is deferred to pass 2/4.
