# manufacturer: rubiks
# Pass 1 (manufacturer register). A licensed toy brand, not a Chinese speedcube-focused
# manufacturer like the rest of this pass — the eponymous puzzle and the only 3x3 brand in this
# archive whose corporate ownership changed hands within the 2016-2026 window. See
# research/notes/manufacturers/global-pass0.md for the broader method this pass used.

id: rubiks
entity: manufacturer
name: "Rubik's"
kind: manufacturer
country: GB
founded:
  value: "1980"
  precision: year
  qualifier: circa
  note: "Multi-candidate, not a single clean date — see the /founded attestation and /notes.
    1980 is when the product now called 'Rubik's Cube' was renamed from 'Magic Cube', per the
    brand's own history page. Three other dated events for this brand's history are recorded
    rather than picked from silently: 1974 (Ernő Rubik's prototype, Hungary), 1975 (the
    mechanism patent), and 2013-03-06 (incorporation of the current legal entity, Rubik's Brand
    Limited, in England)."
aliases:
