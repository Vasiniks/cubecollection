# Pass 1 (manufacturer register). Long-tail candidate. Historically significant (one of the
# earliest sellers of Chinese-manufactured speedcubes internationally, active before this
# archive's 2016 window opens) and still operating a storefront within the window, though its
# later product range shifted toward novelty/specialty puzzles. Weakly sourced — recorded at
# `drafted`.

