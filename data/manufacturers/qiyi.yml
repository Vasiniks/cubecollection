notes: |-
  **Identity and founding.** QiYi's genuine corporate site states verbatim
  「广东奇艺魔方格科教实业有限公司成立于1998年」 — the company was founded in 1998 — and gives the
  legal entity name and an address in Chenghai District, Shantou, Guangdong, under ICP filing
  粤ICP备2021105271号 (qiyitoys-company-history). Tier 1, first-party. The Speedsolving wiki gives
  the native names "奇艺" (QiYi) and "魔方格" (MoFangGe) (speedsolving-wiki-qiyi).

  **NARRATIVE REWRITTEN 2026-09-03 (issue Q1, completed under D-B1).** This section previously
  attributed the founding narrative and a "family of brands" list to `theqiyi-about-us`,
  described as "QiYi's own About page — tier 1, first-party". That page has since been
  established as an **Amazon-affiliate site, not QiYi's own**, and demoted to tier 4. The Q1 fix
  re-sourced this record's attestations but left this prose behind, so the notes went on
  narrating a withdrawn source as authoritative. That is corrected here.

  Two specific claims are **withdrawn, not merely re-sourced**:

  1. The description of X-Man Design as "created in close collaboration with an independent
     designer known as X-Man" is **factually wrong**. QiYi's own corporate history records that
     in 2015 「奇艺首席设计师张小静创立「XMD」品牌」 — XMD was founded by QiYi's own **chief
     designer**, Zhang Xiaojing, an internal employee, not an unaffiliated outside collaborator.
     data/manufacturers/x-man-design.yml withdrew this on 2026-09-03; this record now agrees
     rather than contradicting its own sibling.
  2. The "family of brands" list ("QY Cube", "QY Toys", "MoFangGe", "X-Man Design") came solely
     from the affiliate page and has **no first-party corroboration**. The underlying
     classification decision is unchanged and still sound on other grounds: MoFangGe is
     independently attested as a QiYi brand name by qiyicube-storefront-2018 and the Speedsolving
     wiki, and no independent legal entity, founder, or domain was found for any of QY Cube, QY
     Toys or MoFangGe — so they remain **aliases** rather than separate manufacturer records.
     "QY Cube" and "QY Toys" specifically are retained in `aliases` on the withdrawn page's
     authority alone and should be re-verified or removed by a future pass; they are flagged in
     the /aliases attestation.

  **X-Man Design is still treated as a separate sub_brand record** — see
  data/manufacturers/x-man-design.yml — but now on the correct basis: QiYi's own dated 2015
  company-history entry naming it as an internally-founded house brand with a name-carrying
  flagship line (Tornado) distinct from QiYi's own numbered range.

  **An earlier QiYi storefront (qiyicube.com, captured 2018)** carried the page title "QiYi Cube
  – The Valk, MoFangGe, X-Man Design Speed Cube" and sold Valk-branded 3x3s directly
  (qiyicube-storefront-2018). "Valk" does not appear in the 2026 About page's "family of
  brands" list. This is recorded as a lead, not resolved further this pass: Valk is treated as a
  QiYi product line (per the pass-0 brief and Mats Valk's well-documented collaboration with
  QiYi), and whether that line is still active, was folded into another line, or lapsed is a
  pass-2/family-enumeration question, not a manufacturer-identity one.

  **Domain correction.** An earlier pass-0 domain sweep recorded `qiyicube.com` as a miss
  ("domains_guessed_no_hit"). It in fact has multiple captures back to 2018 — a false negative,
  corrected in the backlog file per the brief's standing warning about that sweep. `qy-toys.com`
  was also checked this pass and found to be an unrelated, apparently hijacked domain (spam
  content, no QiYi connection) despite the superficially matching name — not recorded as an
  alias or a lead.
status: sourced

