notes: |-
  **Identity and founder.** DaYan's own official site states: "Dayan Cube is a Chinese brand
  designed by Daqing Bao. DaYan is the pinyin of his username '大烟头' (Da Yan Tou)"
  (dayancube-official-2013) — tier 1, first-party. The Speedsolving wiki gives a different
  account of the brand-name character, "大雁" (a wild goose, using a different "yan" character
  than the designer's username) (speedsolving-wiki-dayan) — tier 4, and not necessarily in
  conflict with the pinyin-origin story (a brand can be *named after* a homophone of a founder's
  username while formally using different, more auspicious characters), but not resolved
  further this pass. Both spellings are recorded as aliases; `native_name` is left unset rather
  than picking one, since neither source states outright which characters DaYan itself uses as
  its formal brand name (dayancube.com's own site is entirely in English/pinyin in the capture
  reviewed).

  **Founding.** DaYan's own site footer reads "© Copyright 2011" (dayancube-official-2013) — a
  copyright-range signal, not a founding statement, and consistent with the brand's documented
  product history beginning with GuHong (2011) and ZhanChi (2012). The Speedsolving wiki instead
  states "Founded: 2004" with no citation trail (speedsolving-wiki-dayan). Recorded as `circa
  2011` with the 2004 claim noted as disputed rather than adopted, since it predates every other
  piece of evidence found this pass by years and no source explains what "founded" refers to at
  that date (e.g. the founder's own puzzle-modding activity versus the DaYan brand's commercial
  debut).

  **Relationship to MF8.** DaYan's own product list includes "DaYan+MF8 4x4", and the
  Speedsolving wiki states "Dayan collaborated with MF8, another Chinese company, to produce a
  4x4x4 Cube" (dayancube-official-2013, speedsolving-wiki-dayan). This documents MF8 as a
  distinct, independent company from DaYan — relevant corroboration for
  data/manufacturers/mf8.yml — rather than a DaYan sub-brand or vice versa.

  **Guhong lead, closed — no identity movement found.** A previous pass-0 pass flagged "Guhong"
  as possibly having moved from DaYan to QiYi, reasoning from a bare collection-tag slug
  (`guhong-pro-m-3x3`) seen in an alphabetised list of retailer collections. Re-examining that
  list (research/staging/manufacturers/thecubicle-collections-archived.txt) shows the slug
  sitting between `geranium-puzzles` and `haitun-waverider-v1` — ordinary alphabetical
  adjacency, not adjacency to `x-man-designs` (which sorts under "x"), so the original
  "may have moved" hypothesis rested on a misread of the source list rather than any actual
  co-location. Positive evidence points the other way: TheCubicle's own *product* URLs (not
  collection tags) for every GuHong-named cube found in captures spanning 2019-2026 — the
  original GuHong, GuHong V4 M, GuHong Pro, GuHong Pro M, in 54/55/56mm and maglev/magnetic/
  standard variants — are consistently path-prefixed `dayan-guhong-*`
  (thecubicle-dayan-guhong-product-urls), and general web search of speedsolving.com community
  threads titled "DaYan GuHong Pro M" and "DaYan GuHong Pro+" corroborates the same continuous
  DaYan attribution (general web search summary, not independently captured or cited as a
  source). No source located this pass names a "QiYi Guhong" product at all. This lead is
  closed: GuHong is a continuous DaYan model-family name from its 2011 debut (DaYan II GuHong)
  through at least the Pro M generation, with no evidence of the name moving to another
  manufacturer. Family/model-level enumeration of the GuHong line is pass 2's work, not this
  register's.
