excerpt: |-
  CDX prefix enumeration of https://www.thecubicle.com/products/mofang-jiaoshi-mf3 returns 3x3
  product paths spanning 2019-07-16 (mofang-jiaoshi-mf3rs) through 2026-06-26
  (mofang-jiaoshi-mf3-3x3, still resolving with a live srsltid tracking parameter), including:
  mofang-jiaoshi-mf3-3x3 and mofang-jiaoshi-mf3-3x3-unstickered (both still resolving as of
  2026-02-20/2026-06-26 captures), mofang-jiaoshi-mf3rs (2019-07-16), mofang-jiaoshi-mf3rs2
  (2019-05-12), mofang-jiaoshi-mf3rs3 (2020-09-20, still resolving as of a 2024-09-05 capture),
  mofang-jiaoshi-mf3s (2020-09-18) — no "mf3rs4" or later-numbered path was found under either
  the "mofang-jiaoshi-mf3rs4" or bare "mf3rs4" prefix (both queried directly, zero rows). Also
  present under the same root but out of this archive's 3x3 scope: mf2/mf2s/mf2c (2x2),
  mf4/mf4s (4x4), mf5/mf5s (5x5), mf7s (7x7), mfsq1 (Square-1), and several shape mods (mirror
  cube, fisher mirror cube, dice cube, mastermorphix, pyraminx, skewb, megaminx, windmill mirror
  cube).
