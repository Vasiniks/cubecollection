reliability_note: |-
  A Taiwanese specialist cube retailer's own brand taxonomy. Tier 2 for the name mapping: the
  store maintains 樂方 and Lefun as one brand entry, in its document title, its heading, and the
  manufacturer id its product links carry. That is a structured assertion, not a passing mention.

  Traditional characters 樂方 are the Taiwanese rendering; the simplified form is 乐方. The two
  are the same name — see taobao-lefun-stickerless-3x3-2026, an independent publisher using the
  simplified form on a 3x3.

  IT DOES NOT ESTABLISH COUNTRY OR CORPORATE IDENTITY. A Taiwanese store selling the brand says
  nothing about where LeFun is based or who owns it; `lefun.yml` keeps /country at `unknown`.
