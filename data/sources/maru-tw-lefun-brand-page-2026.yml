excerpt: |-
  Visited 2026-09-19 in a rendering browser. The page is this store's brand entry for
  manufacturer_id=55.

  Document title, verbatim: "樂方 Lefun".
  Brand heading on the page, verbatim: "樂方 Lefun" and "樂方 LEFUN".
  Canonical URL as declared by the page:
  "https://store.maru.tw/index.php?route=product/manufacturer/info&manufacturer_id=55".

  One product is bound to this manufacturer id:
  "樂方 - 異形方塊 - 鬼魔金字塔" (LeFun - shape mod - ghost pyraminx), product_id=2409,
  linked as /index.php?route=product/product&manufacturer_id=55&product_id=2409.
  It is a pyraminx, not a 3x3, and is therefore out of this archive's scope; it is recorded
  here only because it demonstrates the brand entry carries a real product rather than being an
  empty label.

  WHAT IS DELIBERATELY NOT QUOTED FROM THIS PAGE. The page also renders about twenty products
  under "猜你喜歡" (you may like), "最新商品" (newest) and "最熱賣" (bestsellers) — YuXin,
  ShengShou, MuGua, DianSheng, YongJun, MoYu, QiYi and GanYuan items. Those are STORE-WIDE
  RECOMMENDATION PANELS and belong to other brands; none is a LeFun product. Reading them as
  this brand's catalogue is the recommendation-panel error this archive documents, and an
  extraction pass on this page did exactly that before the products were checked by hand
  against their brand labels.
