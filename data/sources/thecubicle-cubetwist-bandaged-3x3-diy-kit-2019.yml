reliability_note: "TheCubicle's own structured spec table and product-description prose, tier
  2. No base-model/rebrand claim is made — this reads as CubeTwist's own base mould used for a
  bandaging accessory kit, not a documented aftermarket product. A bandaged cube is its own
  recognised non-WCA-legal puzzle category (movement deliberately restricted), filed by the
  retailer under 'DIY Kits' rather than its own '3x3' category. No documented historical or
  collector significance was found beyond generic novelty description, so this does not clear
  RESEARCH_SPEC §2.2's conditional-admission bar either. Used to support the `cubetwist`
  zero-family finding."
