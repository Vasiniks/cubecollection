excerpt: |-
  Product Description: "The CubeTwist Bandaged 3x3 DIY Kit features a non-tiled CubeTwist 3x3
  with a full set of special colored tiles that are designed to latch onto the cube. The tiles
  can be latched onto the cube in any pattern to design just about any kind of bandaged 3x3,
  which is a normal 3x3 that has its movement restricted based on how the tiles are arranged."
  Structured "Specifications": "Manufacturer: CubeTwist / Type: DIY Kits / Gross Weight: 231g /
  Added: 2018-10-14 / Dimensions: 57.0mm³." Filed under TheCubicle's own "DIY Kits" category,
  not "3x3".
