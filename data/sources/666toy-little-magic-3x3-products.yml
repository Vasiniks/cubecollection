# Pass 3 (model enumeration). YuXin's own site (666toy.com), the Little Magic Series category
# and individual 3x3 product pages. Tier 1, first-party manufacturer product copy — establishes
# three distinct 3x3 item-number designs within the Little Magic line: 1513 (base), 1673M
# (explicitly "V2" in the manufacturer's own copy), and 1722 "Small Magic" (MagLev).
