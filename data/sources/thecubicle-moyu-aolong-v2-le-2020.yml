reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that MoYu sold a limited-edition AoLong V2 as a collector's set; that the set
  included a large display box, a transparent green cube stand and a collectible card naming
  Lucas Etter; and that the puzzle shipped UNSTICKERED with a set of factory stickers included.
  DOES NOT ESTABLISH: a run size, a release date, the WCA result itself, or that MoYu rather than
  the retailer authored the Lucas Etter association. "LE" is the title's own abbreviation.
  NOTE THE UNSTICKERED DETAIL, because it is a configuration claim and not decoration: "fully
  unstickered right out of the box, and it includes a set of factory stickers" is the same
  factory surface state recorded this session for moyu-weilong-gts--unstickered, and it is
  recorded on this variant for the same reason.
