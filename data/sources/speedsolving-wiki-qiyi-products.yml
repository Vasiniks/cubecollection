  family-boundary structure (which named lines persisted across generations) and as a lead for
  dating, corroborated where possible against TheCubicle's own retailer captures. The wiki's own
  'Sub-Brands' heading lists X-Man Design and TheValk as parallel, separate QiYi sub-brands
