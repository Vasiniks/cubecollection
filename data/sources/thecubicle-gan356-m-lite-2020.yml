excerpt: |-
  Product Description, verbatim: "The GAN 356 M Lite is a modern, mid-range magnetic 3x3 speed
  cube by popular manufacturer GAN. This version comes with GAN's unique hand adjustable
  Numerical IPG Core and blue GES nuts installed. Out of the box, the GAN 356 M Lite has a fast,
  stable feel that is very reminiscent of a mix between the GAN XS and GAN X V2..."

  Product Specifications table: "Manufacturer: GAN", "Dimensions: 56.0mm3", "Item Weight: 74.0g".

  WHY THIS IS A CONFIGURATION AND NOT A SEPARATE MODEL. "This version comes with..." is the
  retailer's own framing, and what it names as distinguishing the Lite is which GES NUTS are
  installed — blue rather than the standard set. GES nuts are GAN's user-swappable tension
  hardware, so this is one design shipped with a different factory setup, not a different design.
  The base GAN356 M page describes the same "hand-adjustable Numerical IPG Core" and ships "a set
  of spare GES nuts".
