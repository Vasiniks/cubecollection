excerpt: |-
  **Gem 3x3** (snapshot above, captured 2020-09-18 21:04:36 UTC): embedded product JSON tags
  read verbatim: "Availability_Discontinued", "Color_Stickerless (Bright)",
  "Dimensions_Other", "Manufacturer_ShengShou", "Type_3x3". Price field: "price":399 (i.e.
  $3.99). Weight field: "weight":104.

  **Tank 3x3** (separate snapshot, https://web.archive.org/web/20200918210120id_/https://www.thecubicle.com/products/shengshou-tank-3x3,
  captured 2020-09-18 21:01:20 UTC, six minutes apart from the Gem snapshot): embedded product
  JSON tags read verbatim: "Availability_Available", "Color_Stickerless (Bright)",
  "Dimensions_56.0", "Manufacturer_ShengShou", "Type_3x3". Price field: "price":399 (i.e.
  $3.99, identical to Gem). Weight field: "weight":100.

  **On the dimension question**: TheCubicle's own catalogue used a fixed facet vocabulary for
  "Dimensions" (values like "56.0", "Other", etc., used across its whole 3x3 catalogue). Gem's
  page carries the literal fallback value "Other", not a blank/missing field — i.e. the
  retailer itself never assigned a specific millimetre bucket to this product, rather than the
  figure simply not having been transcribed by a prior researcher. This is retailer-side
  non-classification, not evidence that Gem's size is unusual or that it necessarily differs
  from Tank's 56.0mm; it just means no numeric value exists at this source and none should be
  guessed.

  **On concurrency**: at the same six-minute-apart snapshot moment, Gem 3x3 was already tagged
  "Discontinued" while Tank 3x3 was tagged "Available", both still priced identically at $3.99
  and both still live product pages on the same retailer. Read together with the cross-range
  capture dates already documented in shengshou-gem-tank-metal-cross-retailer-sweep-2026 (Gem's
  own 4x4 SKU was captured 2020-12-03, three months AFTER this Gem 3x3 "Discontinued" snapshot,
  meaning TheCubicle was still actively carrying/adding new Gem-line SKUs after the 3x3 unit
  sold out), this reads as ordinary per-SKU stock exhaustion within a still-active parallel
  line, not as a line-level rename or succession event.
