reliability_note: "TheCubicle's own 'Manufacturer' field names 'XiaoMi' rather than 'GiiKER' —
  the same retailer filing convention noted in thecubicle-giiker-super-cube-i3s-2019, not
  independent evidence of a different manufacturer. The key fact this source backs is the
  design relationship: a mechanical, non-electronic 3x3 built on the same shell/tooling as the
  electronic SUPERCUBE line ('retains the feel and sound of the original Giiker Smart Cube but
  without the internal electronics'), which is why this is treated as its own family rather
  than a bare configuration of the smart cube — see data/families/giiker-m3.yml's header
  comment for the boundary reasoning."
