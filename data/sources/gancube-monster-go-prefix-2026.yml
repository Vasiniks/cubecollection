excerpt: |-
  CDX prefix enumeration of gancube.com/products/monster-go, 14 distinct product URLs,
  not truncated. Reproducible with `npm run wayback -- prefix gancube.com/products/monster-go
  --limit 150`. This is the MANUFACTURER'S OWN storefront, not a retailer's.

  The distinct product paths, verbatim:

    monster-go
    monster-go-251-standard-2x2-puzzle-cube
    monster-go-3-ai-smart-puzzle-cube
    monster-go-328-spelling-cube-set
    monster-go-352-m-beginner-magnetic-cube
    monster-go-3x3-magnetic-cube
    monster-go-cloud-rainbow-ut-3x3-magnetic-speed-cube
    monster-go-cube-premium-set
    monster-go-flower-twist-puzzle
    monster-go-mirror-shape-mods-cube
    monster-go-skewb-cube
    monster-go-standard-3x3-speed-cube
    monster-go-twist-puzzle-24-blocks
    monster-go-twist-puzzle-set-24-blocks

  WHAT THIS ESTABLISHES FOR monster-go-352-m. Exactly ONE path exists for this model,
  `monster-go-352-m-beginner-magnetic-cube`, with no coated, edition or configuration sibling
  anywhere on the manufacturer's own site.

  WHY THAT IS A RESULT AND NOT A FAILED SEARCH. The same enumeration DOES separate products where
  GAN separates them: the 3x3 line alone carries `monster-go-3x3-magnetic-cube`,
  `monster-go-standard-3x3-speed-cube`, `monster-go-cloud-rainbow-ut-3x3-magnetic-speed-cube` and
  `monster-go-3-ai-smart-puzzle-cube` as four distinct paths. A method that distinguishes four
  siblings in one line and finds one path in another is measuring something real.

  OUT OF 3x3 SCOPE, listed so the sweep is reproducible and complete: the 2x2 (251), skewb,
  mirror, flower twist, the 24-block twist puzzles, the spelling cube set and the premium set.
