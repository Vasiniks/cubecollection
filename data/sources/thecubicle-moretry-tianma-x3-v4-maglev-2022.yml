excerpt: |-
  "The Moretry Tianma X3 V4 (MagLev) is a 3x3 from the new company that features traditional
  corner/edge magnetization along with corner base/edge magnets. This version includes enlarged
  corner base magnets, allowing them to interact with a repelling magnet in the centers to aid
  with alignment. The MagLev version replaces the traditional spring with a magnetic levitation
  system that has 6 magnetic rings instead of 2 for a more linear tensions." Product
  Specifications: "Manufacturer: Moretry / Type: 3x3 / Added: 2022-03-14 / Gross Weight: 294g /
  Dimensions: 55.5mm 3 / Magnets: Magnetic".
