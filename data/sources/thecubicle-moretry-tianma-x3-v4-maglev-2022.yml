reliability_note: "Tier 2, retailer. Directly documents a mechanism-level change (spring
  replaced by a 6-magnet MagLev system) introduced at the V4 generation of the same persisting
  'Tianma X3' name — the strongest single piece of evidence this pass found that later
  'versions' within this family are genuine design-level changes, not merely configuration
  differences, though the exact model/variant boundary for each version is left to pass 3 per
  DATA_MODEL §4.2. Same 'Added: 2022-03-14' templating artifact noted on the V1 and V3 sources
  applies here too."
