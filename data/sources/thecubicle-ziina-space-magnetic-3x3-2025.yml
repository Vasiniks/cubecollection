reliability_note: |-
  Tier 2, first-party retailer product page, and specifically the retailer's OWN structured
  "Manufacturer" field rather than a brand inferred from the product title. The vendor field in
  the same storefront's products.json independently reads "Ziina", so two separate structures on
  one retailer agree — which is corroboration of the ATTRIBUTION but NOT independent evidence of
  the brand, since both come from TheCubicle.
  ESTABLISHES: that a base 3x3 speedcube is sold under the Ziina name with those specifications,
  and therefore that Ziina is not merely a decorator.
  DOES NOT ESTABLISH: who manufactures it, whether Ziina is a house brand of an existing
  manufacturer, a release date, or whether Ziina warrants its own entity record. A retailer's
  "Manufacturer" field records who the brand is sold as, not who made it — the archive's own
  rebrand and OEM rules (RESEARCH_SPEC 2.3) exist precisely because those differ.
