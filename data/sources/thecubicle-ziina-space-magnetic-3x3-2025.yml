excerpt: |-
  Product Description: "The Ziina Space Magnetic 3x3 is a budget-friendly 3x3 with great turning
  right out of the box. But as with most budget puzzles, a little set-up goes a long way. Give
  this one a try and see what all of the buzz is about!"

  Product Specifications table, transcribed verbatim from the capture: "Manufacturer: Ziina",
  "Dimensions: 56.0mm³", "Item Weight: 68.0g", "Gross Weight: 123g". The gross figure is recorded
  only so a future reader can see which number was NOT taken as a product weight.

  WHAT THIS SETTLES. The description contains no reference to printing, decoration or artwork,
  and the page carries a full specification table for the puzzle itself. This is a base
  speedcube sold under the Ziina name, not a decorated cube made by someone else — which is the
  question P4-10 could not answer from vendor strings alone. Ziina's other ~50 listings at this
  retailer ARE printed themes (World Map, Christmas, Halloween, Emoji, Chemistry, Mahjong), and
  a brand that sells both a base cube and printed editions of it is doing what LeFun does, which
  this archive already models as a manufacturer with variant-level print themes.
