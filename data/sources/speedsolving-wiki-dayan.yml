excerpt: |-
  "Founded: 2004". "DaYan is a Chinese brand designed by Daqing Bao (包大庆)." States the brand
  name is properly "大雁" (a wild goose), using a different "yan" character than the designer's
  username "大烟头" that dayancube.com's own site cites as the pinyin origin. "Dayan
  collaborated with MF8, another Chinese company, to produce a 4x4x4 Cube." Aliases listed:
  "大雁, DY, Big Goose, DaiYan, and TaiYan".
