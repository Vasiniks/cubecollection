reliability_note: "Tier 4, community-edited, no citation trail for the 2004 founding date, which
  predates DaYan's own documented product history (GuHong/ZhanChi era, early 2010s) by several
  years and is in tension with dayancube-official-2013's own '© Copyright 2011' footer.
  Recorded as a disputed candidate rather than adopted outright — see the /founded attestation
  on data/manufacturers/dayan.yml. Also gives a competing account of the brand-name character
  (大雁 vs. dayancube.com's own '大烟头' pinyin-origin story) — both recorded."
