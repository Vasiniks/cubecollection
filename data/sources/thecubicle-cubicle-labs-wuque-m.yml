excerpt: "The Cubicle Labs WuQue M is a premium-made 4x4 with a set of medium magnets installed in the pieces. The magnets inside the cube act as a positioning system that greatly enhances puzzle stability and compliance when turning quickly. The Cubicle Labs WuQue M is lubed with a combination of Cubicle silicone weight 4, Lubicle Silk, and DNM-37 on the pieces for a quick, smooth, and controllable cube. [...] Original puzzle made by QiYi MoFangGe. It features a Cubicle Labs logo with three orbitals on the white side."
