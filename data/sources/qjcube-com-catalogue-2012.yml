  Category and product-detail URL slugs captured under qjcube.com/categories/qj-magic-cube
  and qjcube.com/categories/qj-profiled-cube (2012-2015), including: "qj-3x3-speed-cube-black-
  5-7cm-detail" / "qj-3x3-speed-cube-white-5-7cm-detail" (a 5.7cm "speed cube," the same
  57.0mm dimension later stated for TheCubicle's 2018 "QJ Candy 3x3" listing, though no source
  found this pass states these are the same product under a renamed listing — recorded as an
  unconfirmed naming lead, not a claim); "qj-3x3-magic-cube-4-8cm-{black,blue,pink,white}-
  detail" (a separate, smaller 4.8cm "magic cube" line); "qj-3x3x3-pillow-shaped-magic-cube-
  detail" (QJ's pillowed 3x3, the same shape later sold as TheCubicle's 2018 "QJ Pillowed
  3x3"); and "qj-king-kong-puzzle-cube-{black,white}-detail" (a non-standard, pull-apart
  puzzle variant of the 3x3x3, later sold via SpeedCubeShop in 2016 as "QJ KingKong Puzzle" /
  "The Armadillo Cube").
