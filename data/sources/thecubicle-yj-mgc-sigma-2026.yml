  no specification rows beyond the manufacturer — no dimensions, no weight, no magnet
  description, no date. Title, canonical URL, product id, price and colourway are the whole of
  it.
  THIS RECORD DELIBERATELY ADMITS NOTHING. The archive holds nine YJ MGC models — original, V2,
  EST, Evo, Evo II, Repulsion, Elite, Elite V2 and MGC3 Beta — and no Sigma. Creating one on the
  strength of a single retailer title, with no description and no specification, would be a
  model-layer change to a FROZEN inventory. The page is preserved now, while the capture
  resolves, and the decision is left to the taxonomy owner.
  IT FITS THE P4-9 PATTERN EXACTLY, which is why it is filed there rather than treated as a
  one-off: first observed 2026, a current generation of a line the archive already holds, missed
