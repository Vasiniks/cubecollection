excerpt: |-
  PRODUCT: cubein.cn's own listing "Ziina Heat Printed Calendar Cube", vendor field "Ziina Star",
  body_html reading (verbatim) "Brand Name: Ziina<br>Item name: Calendar Cube UV printed<br>
  size: 5.6cm, 6.2cm<br>weight: ~90g, 120g<br>Retail packing may vary". Note the retailer's OWN
  body copy calls it "Ziina" while the same retailer's structured vendor field says "Ziina Star"
  - the two-form ambiguity this archive already tracks, now seen inside a SINGLE listing rather
  than only across retailers.

  NINE IMAGES IN THE PRODUCT JSON, at native 800x800 (verified by decode). Eight show the
  assembled cube (CubeIn-watermarked), unbranded plain-colour center caps, no logo of any kind on
  the mechanism - UNLIKE the TheCubicle "Space Magnetic" base cube, whose center cap carries a
  hand-drawn "Ziina Star" star logo (see ziina-star-packaging-photography-2026-09). This is
  consistent with the archive's existing understanding that the base speedcube carries the brand
  mark while printed-theme variants do not.

  THE NINTH IMAGE IS THE PACKAGING SHOT, AND IT IS UNEXPECTED. It shows a retail box next to the
  finished cube, and the box carries NO "Ziina" OR "Ziina Star" text or logo anywhere on the
  visible front or side. The front reads only "SPEED CUBE" in a plain red-to-blue gradient
  design over a diamond pattern - a generic, undifferentiated toy-box style, not the
  brand-specific "Ziina Star ... Space" box design photographed at TheCubicle.
  The visible SIDE PANEL carries a standard small-parts/regulatory label: a CE mark, a "UKCA"
  mark, a choking-hazard warning triangle reading "WARNING: CHOKING HAZARD - Small parts, Not
  for children under 3 years", a "PRECAUTIONS" block, a recycling arrows symbol, a green oval
  icon (a generic recycling/compliance mark, not a specific company logo), matching Arabic-script
  text alongside each English block (aimed at a Middle Eastern export market), and "MADE IN
  CHINA" printed vertically along the box's spine.
  NO COMPANY NAME, FACTORY NAME, OR ADDRESS IS LEGIBLE ANYWHERE ON THIS PANEL, even after 6-10x
  Lanczos enhancement with contrast/sharpness adjustment. Two small icon+text blocks at the top
  of the label (rounded-rectangle outlines with tiny interior text) remain unreadable at native
  resolution - a genuine legibility floor, not a content gap being asserted.

  WHY THIS MATTERS BEYOND "still no name found": this is the first evidence in the whole P4-10
  investigation that a "Ziina"-vendor-tagged product ships in packaging carrying NO Ziina
  branding at all. Two readings are both consistent with this one data point and neither is
  established: (a) cubein.cn repackages a stock/generic "Speed Cube" box for a themed variant
  while TheCubicle's base-cube box is the brand's own dedicated tooling; or (b) "Ziina"/"Ziina
  Star" is a storefront-level label applied over an anonymous, genuinely unbranded factory
  product, which would tilt toward the OEM/private-label hypothesis (outcome 2) rather than an
  independent manufacturer (outcome 1). This record does not adjudicate between them - it only
  preserves the observation, which is new and was not visible from either retailer's structured
  fields.
