reliability_note: |-
  Tier 3: retailer product photography, examined directly. First-party for what cubein.cn
  actually photographed and shipped in one case; NOT first-party for who manufactures the
  product - a generic regulatory label of this kind is standard across countless unrelated
  Chinese toy exports and identifies a compliance regime, not a company.
  ESTABLISHES: that at least one cubein.cn "Ziina"-vendor product ships in a box with no Ziina
  branding on the visible front/side, generic CE/UKCA/recycling marks, a choking-hazard warning,
  Arabic-script export text, and "MADE IN CHINA" - and that no manufacturer name or address is
  legible on the panel photographed.
  DOES NOT ESTABLISH: who manufactures it.
  THE LISTING ITSELF SAYS "Retail packing may vary", which is the retailer stating outright
  that the box photographed may not be the box shipped - the strongest single caution against
  reading anything about manufacture from this image, and it comes from the same body_html
  quoted in the excerpt above.
  A generic box does not prove OEM sourcing by itself -
  retailers routinely repackage - and the illegible top-left icon blocks are an unresolved gap,
  not a confirmed absence of text. Two small label elements remain unread at this photo's native
  resolution; a higher-resolution or physical-copy inspection could still recover them.
