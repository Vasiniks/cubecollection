  Page-level summary: "MF8 (中国魔方俱乐部 - China Cube Club) is a Chinese speedsolving forum, and
  the largest cubing community. MF8 also manufacture and sell their own range of MF8-branded
  puzzles." "A partial list of MF8 puzzles ordered by year of release": 2010 includes "MF8 Crazy
  3x3x3 series" and "MF8 Crazy 4x4x4 series" (alongside Gigaminx and Teraminx, the same year);
  2011 includes "MF8 Legend 3x3x3" (alongside Square-1 and Helicopter Dodecahedron variants);
  2013 includes "MF8 Legend V2 3x3x3" (alongside Megaminx V3, Eitan's Star, Curvy Starminx).
  Every other dated entry (2007-2016) is a shape mod, Megaminx/Square-1/Gigaminx/Teraminx
  variant, or novelty puzzle, out of this archive's 3x3x3 scope.
