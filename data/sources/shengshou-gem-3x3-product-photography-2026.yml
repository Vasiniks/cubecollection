excerpt: |-
  A four-panel composite product photograph, sha256 of the retrieved file:
  b1f60d74ddbf7775af335f47d80e58aaa042fe9030285687ec54979bc63e2500. Panel 1 (top): the
  packaging box, printed "GEM" with the Chinese characters "宝石" (the tagline "Every gem has
  a legend" and "THREE-LAYER MAGIC CUBE" also print on the box), next to a cube shown with its
  top layer lifted off in a standard layer-separation merchandising shot (orange/white/yellow
  faces visible). Panel 2 (bottom-left): a stickerless cube, red/green/yellow faces, standard
  rounded-corner piece geometry with a small dark bowtie/hourglass-shaped centre-cap mark on
  each face centre; glossy surface with visible specular highlights consistent with the
  retailer's "shiny exterior" description. Panel 3 (bottom-right): the same cube with its
  middle slice twisted 45 degrees, exposing black internal plastic at the core and on the
  hidden faces of the displaced pieces, directly confirming the retailer's "black plastic
  interior" description. No panel resolves the retailer's "3-piece cap design" claim to a
  visibly distinct centre-cap assembly beyond the ordinary bowtie logo-plate mark common to
  many stickerless budget cubes of this era; the claim is neither confirmed nor contradicted by
  this photograph at the resolution available (max asset height 767px, JPEG-compressed).
