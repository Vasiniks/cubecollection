reliability_note: |-
  Tier 2, first-party retailer catalogue structure.
  ESTABLISHES: the set of MoYu-prefixed product paths this retailer has carried, and therefore a
  recorded 3.6a discovery sweep for the archive's most heavily cited manufacturer.
  DOES NOT ESTABLISH: that MoYu's catalogue is complete. This is ONE retailer in ONE market, and
  the audit's own breadth check counts MoYu as ALSO having no non-US source — this sweep does not
  fix that half. Ledger P26-3 records that slug form differs per brand, so a sweep of the `moyu-`
  form is not a sweep of every form MoYu products appear under.
