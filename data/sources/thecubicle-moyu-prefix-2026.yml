preservation_note: >-
  CDX output, not a page capture; the enumeration is the evidence and is reproducible from the
  URL above. Individual product pages named here were fetched separately where they were acted
  on. Paths for puzzles other than 3x3, and for apparel, spinners, bundles, tools, stands and
  sticker sets, were excluded from the listing above — this retailer sells MoYu hoodies,
