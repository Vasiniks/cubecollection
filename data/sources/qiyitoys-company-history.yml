  Dated company-history entries relevant to this archive:

  - 2015: "奇艺首席设计师张小静创立「XMD」品牌" — QiYi's **chief designer** Zhang Xiaojing (张小静)
    founded the "XMD" brand. XMD is therefore an internally-founded house brand created by
    QiYi's own chief designer, NOT a collaboration with an unaffiliated outside designer.

  - 2016: "公司携手著名魔方选手 Mats Valk 创立专业速拧魔方品牌「The Valk」" — the company
    [QiYi] partnered with the well-known cuber Mats Valk to found the professional speedcubing
    brand "The Valk". The Valk is thus QiYi's own brand, founded by QiYi in partnership with
    Mats Valk — it is not a line under XMD / X-Man Design.

