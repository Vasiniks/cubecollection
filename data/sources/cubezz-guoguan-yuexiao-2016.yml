reliability_note: |-
  Tier 2, first-party retailer listing, non-US (China-based, English-language storefront), the
  same source type and site already used for the Cyclone Boys FeiChi precedent this register
  (cubezz-cyclone-boys-feichi). Genuine capture 2016-02-27, an "existed by" upper bound only,
  not a release date — but a real, specific product listing (not a bulk catalogue date), and
  the earliest capture of this product found across any retailer this pass. States "Yuexiao is
  the first product of GuoGuan brand" directly, corroborating (independently of TheCubicle) the
  family's own understanding that YueXiao is GuoGuan's original 3x3. Gives "Size: 55*55*55mm /
  Weight: 80g" — a earlier-generation spec reading that differs slightly from TheCubicle's later
  (2025-capture) "Dimensions: 56.0mm / Item Weight: 86.0g" for the same nominal product; recorded
  as a disputed spec at the model level rather than silently preferring one figure, since a 1mm/
  6g difference across nine years of production could reflect either measurement rounding or an
  undeclared production revision, and no source resolves which.
