reliability_note: |-
  Tier 2 retailer, structured spec table, but the product description itself is a placeholder
  ("more details coming soon!") — no mechanism/mould-difference language is available from this
  page beyond the "V2" naming and the "20-Magnet Ball-Core" configuration name. Per DATA_MODEL
  §4.2, a manufacturer's own version number is treated as a strong (though not conclusive)
  signal of a design-generation change; this is the sole basis for treating "TG V2" as a
  candidate new model rather than a configuration of the base "HuaMeng TG" model this pass.

  The in-page "Added: 2026-05-01" field is NOT used as an introduction date — it is a
  TheCubicle catalogue "Added" field, the same class of artifact documented elsewhere in this
  archive as unreliable for dating (see thecubicle-mf8-legend-v2's reliability_note); it is used
  only as an upper bound on when this listing existed, consistent with the Wayback capture date.
