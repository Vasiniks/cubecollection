excerpt: "TheCubicle.com is a leading USA-based online specialty cube store committed to providing customers with a superior online shopping experience, excellent puzzle variety, and an innovative cubing experience. TheCubicle operates in New York and has served thousands of puzzle fans from beginners to world champions. [...] TheCubicle was launched in August of 2011 with a handful of popular World Cubing Association puzzles and a variety of hand-done custom mods. [...] TheCubicle.com is owned and operated by Cubicle Enterprises LLC."
