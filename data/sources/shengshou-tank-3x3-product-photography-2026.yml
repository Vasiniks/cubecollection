reliability_note: |-
  Tier 2, first-party retailer product photography, directly retrieved and visually inspected
  this session. The box art's Chinese characters ("坦克") are a directly read fact, not an
  inferred transliteration. Sufficient to corroborate the finish description at `probable`, and
  to support the general mould-silhouette comparison against Gem recorded in
  research/qc/p26-12-tank-gem-identity.md — that comparison is NOT decisive: both cubes show
  the generic rounded-corner stickerless silhouette common to numerous budget ShengShou-class
  3x3s of this era, and no photograph obtained resolves fine mould detail (e.g. exact corner-cut
  angle, screw/core architecture) at a level that could confirm or rule out a shared mould.
