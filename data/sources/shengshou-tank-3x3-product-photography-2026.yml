# P26-12 (Tank vs Gem identity investigation). Product photography for the ShengShou Tank 3x3,
# fetched directly from the Shopify CDN. Two asset versions were retrieved and compared frame-
# for-frame to confirm they show the same photograph (an older crawl of the pre-Feb-2020 asset
# version, and a newer crawl of the v=1581454432 version actually embedded in the product page
# captured 2020-09-18 by thecubicle-shengshou-other-3x3-lines-2026); both are the same box/cube
# photograph at different resolutions, confirming the image the 2020 page displayed.
