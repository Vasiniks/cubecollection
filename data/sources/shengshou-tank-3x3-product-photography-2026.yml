excerpt: |-
  A single-scene product photograph (box beside an assembled cube), sha256 of the retrieved
  580x387 file: dce48dd63e9ae187f6c80ba26c1d19de58070dc5638ad5269c7578f262457d12. Confirmed
  identical in composition to the v=1581454432 asset actually embedded on the 2020-09-18
  product-page snapshot, retrieved separately at
  https://web.archive.org/web/20210831164402id_/https://cdn.shopify.com/s/files/1/0035/5205/1273/products/shengshoutank3x3b1_d3907d91-55d0-4fbd-b59b-48f5689a6285_250x@2x.jpg?v=1581454432
  (sha256 of that file: 71ae33e58b31531c6039d617e422c6997101c26cb1ceb594667ec4698ad05eca) — same
  photograph, later crawl, smaller/differently-cropped render.

  The packaging box prints "TANK" with the Chinese characters "坦克" (the tank/armoured-vehicle
  word; this is a directly observed fact from the box art, not an assumed transliteration) and
  the English tag line "Stickerless Cube", "3X3X3". The cube shown is stickerless with
  white/yellow/red/green/blue/orange faces, standard rounded-corner piece geometry with a small
  dark bowtie/hourglass-shaped centre-cap mark on each visible face centre — the same style of
  centre-cap mark observed on the Gem 3x3 photograph (see
  shengshou-gem-3x3-product-photography-2026). Surface finish reads as slightly less glossy
  than the Gem photograph's highlights, loosely consistent with the retailer's "frosted
  exterior" description for Tank versus "shiny exterior" for Gem, but this distinction is not
  strong at the JPEG compression and resolution available and is reported as a weak
  observation, not a confirmed finish measurement. No exploded/internal shot of Tank was found
  in any crawled asset version, so the "black internals" claim could not be visually confirmed
  or compared against Gem's confirmed black interior the way Gem's own claim was.
