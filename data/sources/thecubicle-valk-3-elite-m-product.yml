excerpt: |-
  Product Description: "The Valk 3 Elite M is the long-awaited flagship from the famous Valk line by QiYi MoFangGe. Light and fast with a smooth, comfortable feel, the Valk 3 Elite M is favored by many cubers who enjoy fast turning with a uniform, consistent magnetic feel. The Valk Elite M comes with clear nuts (standard strength) and clear magnets in the center caps (standard strength). This cube features a brand new magnetic system with three different levels of strength. The moderate and strong versions feature a \"twin-magnetic\" scheme and use \"center-edge\" plus \"corner-edge\" magnetism for positioning. Additionally, QiYi introduced its own version of an elasticity adjustment system that also conveniently reduces spring noise." Product Specifications: Manufacturer QiYi MoFangGe; Type 3x3; Gross Weight 272g; Dimensions 55.5mm; Magnets Magnetic; Item Weight 76.0g.
