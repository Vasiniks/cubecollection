  returns only five products, all shape mods or big cubes, no 3x3: shengshou-3x3-mirror-blocks
  (a mirror-block shape mod, not a standard 3x3x3), shengshou-6x6-mastermorphix,
  shengshou-7x7-mastermorphix, shengshou-mr-m-megaminx, shengshou-teraminx-v2. No ordinary
  ShengShou 3x3 product (Wind, Aurora, Legend, FangYuan, Pearl, or Mr. M 3x3) appears in this
  retailer's catalogue as of the 2025 captures found.
