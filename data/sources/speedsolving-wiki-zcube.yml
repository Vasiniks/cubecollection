excerpt: |-
  "Z, also known as ZCube or Z, is a twisty puzzle company that mainly sells budget puzzles and
  novelty cubes. They often, but not always, repackage cubes from other brands such as QiYi and
  sell them under a different name. For example, the Z Carbon Fiber 3x3 is a QiYi Warrior W
  restickered with carbon fiber-style stickers (that are in fact made of vinyl). Their
  repackaging of puzzles and their use of the term 'carbon fiber' has become controversial."
