excerpt: |-
  "Celebrate world-record-shattering speed with the GAN16 MagLev MAX UV 3x3 (Dual-WR Limited
  Edition)! Crafted to commemorate Team GAN's superstar XuanYi Geng, this exclusive release
  honors his iconic 3x3 World Records — a 3.05s single (Shenyang Spring 2025) and the current
  World Record 3.84s average (Beijing Winter 2026). Each unit comes in a dual-WR laser-engraved
  collector's case proudly displaying Geng's Chinese signature and both record times. Also
  included is a commemorative postcard featuring his official WR scrambles, signed by Geng
  himself — the perfect centerpiece for any serious cube collection. Limited to just 1,111
  units worldwide, the GAN16 MagLev MAX UV 3x3 (Dual-WR Limited Edition) is your chance to own
  a piece of speedcubing history." Listed price (Stickerless option): $84.99 USD.
