reliability_note: "Retailer URL enumeration, tier 2. Establishes what TheCubicle stocked under
  the LanLan brand across 2019-2026, which is strong negative evidence for a standard 3x3x3
  given LanLan's confirmed retail presence there, but it is one retailer: it cannot prove LanLan
  never produced a standard 3x3x3 for another market. It raises the LanLan zero-family finding
  to the same evidentiary standard as its seven sibling zero-family cases; it does not make the
  finding absolute."
