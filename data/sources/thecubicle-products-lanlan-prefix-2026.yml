# source: thecubicle-products-lanlan-prefix-2026
# TheCubicle's own product-URL structure under /products/lanlan-*, enumerated via wayback CDX
# `prefix` on 2026-09-03 during the Pass 2 adjudication gate. Tier 2, first-party retailer
# naming. Created specifically to close an evidentiary gap: LanLan's zero-family conclusion was
# the only one of eight reached without the retailer prefix sweep applied to every sibling case.
# The sweep confirms the conclusion — no standard 3x3x3 LanLan product exists in the catalogue.
