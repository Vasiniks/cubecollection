reliability_note: |-
  Tier 2, first-party retailer product pages.
  ESTABLISHES: that the Super WeiLong was sold in a "Lite" packaging configuration distinguished
  by a smaller box; that the Lite range covered three mechanisms — 8-magnet ball core with spring
  tension, 8-magnet ball core with MagLev, and 20-magnet ball core with MagLev; and that corner
  magnets are user-adjustable across the line.
  DOES NOT ESTABLISH: a release date, the puzzle's mass, what else differs between the Lite and
  full boxes beyond size, or MoYu's own name for the packaging. The word "Lite" is in the
  retailer's title; no first-party MoYu source was located this pass.
  THE THREE-WAY COMPARISON IS THE METHOD. Reading one listing alone could not distinguish a
  mechanism claim from boilerplate. Reading all three shows the descriptions are word-for-word
  identical except in the clause naming the mechanism, which is what makes each clause load
  bearing rather than decorative.
