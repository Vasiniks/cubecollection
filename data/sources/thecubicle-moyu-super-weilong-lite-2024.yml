excerpt: |-
  THREE SEPARATE LISTINGS, all captured 2024-04-15, all with distinct Shopify product ids.

  (1) "MoYu Super WeiLong 3x3 Lite (8-Core Magnetic + Spring Tension)", product id 7189067497555.
  Description, verbatim: "The Super WeiLong is MoYu's ultimate 2023 flagship 3x3. This model
  features an 8-magnet ball core and piece-to-piece magnetization. In addition, the magnets
  embedded in each corner foot are adjustable, allowing you to customize the level of magnetism
  with the core. Elasticity is adjustable using MoYu's new multipurpose tool. This is the lite
  version which comes in a smaller box. Comes with: Super WeiLong 3x3, Adjustment tool, Carrying
  watch[case]..."

  (2) "MoYu Super WeiLong 3x3 Lite (8-Core Magnetic + MagLev)", product id 7189067563091.
  Description, verbatim, differing from (1) in ONE clause: "This model features A MAGLEV TENSION
  SYSTEM, an 8-magnet ball core, and piece-to-piece magnetization." The rest, including "This is
  the lite version which comes in a smaller box", is word for word identical.

  (3) "MoYu Super WeiLong 3x3 Lite (20-Core Magnetic + MagLev)", product id 7189067661395.
  Description, verbatim: "The MoYu Super WeiLong is MoYu's ultimate 2023 flagship 3x3. This new
  model features A 20-MAGNET BALL CORE, giving the cube superior stability and hand feel. In
  addition, the magnets embedded in each corner foot are adjustable... This is the lite version
  that comes in a smaller box."

  Specifications table, identical across all three: "Manufacturer: MoYu", "Type: 3x3",
  "Added: 2024-03-13", "Gross Weight: 387g", "Dimensions: 55.0mm3".

  WHAT "LITE" MEANS HERE IS STATED, NOT INFERRED: "This is the lite version which comes in a
  smaller box." The distinguishing axis is packaging, not mechanism — each Lite listing names the
  same mechanism as one of the three full listings.
preservation_note: >-
  All three captures fetched 2026-09-12 with content-encoding negotiation and read in full.
  "Gross Weight: 387g" IS NOT RECORDED and is doubly unusable here. It is a packaged figure, the
  rule-45 class, and it is IDENTICAL on all three listings including the two that differ in magnet
  count — and identical to what a "smaller box" is supposed to distinguish. A single figure
  repeated across three products it cannot describe is a catalogue default, not a measurement.
  "Added: 2024-03-13" is a catalogue-ingestion stamp, identical across all three, and is not a
  release date; MoYu's Super WeiLong is a 2023 product by the retailer's own first sentence.
