excerpt: |-
  "The GAN V100 Leap Year of the Horse is a 55mm magnetic speed cube built for stable,
  controlled performance. It features a spring-based GES system (no maglev) for a more
  grounded and consistent turning feel. With 64 magnets, a lightweight 64g build, and a refined
  frosted finish, it delivers reliable alignment and smooth control, finished with a
  distinctive Chinese New Year special design." FAQ: "The GAN V100 Leap focuses on stable,
  grounded turning thanks to its spring-based GES system and magnetic alignment... If you
  prefer a faster, floating feel, GAN's Maglev version might suit you better." A second FAQ
  entry states the cube weighs "62 grams" (the body copy above states "64g"; both figures
  appear verbatim on this same page and are not reconciled by any source found this pass). Site
  navigation's own "3x3" listing shows "GAN V100 Leap Year of the Horse" and "GAN V100" as two
  separate entries. Regular/sale price both $29.99.
