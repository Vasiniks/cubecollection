excerpt: |-
  Page title as captured: "DaYan GuHong - DIY Kit – TheCubicle".

  Product Description, verbatim: "This is the Do-It-Yourself (DIY) version of this product. To see
  the Assembled version of this product, please click here. This is the cube that launched DaYan's
  presence into the market. Despite the introduction of many additional cubes in the DaYan line,
  the GuHong remains a top choice..."

  Product Specifications table: "Manufacturer: DaYan", "Dimensions: 57.0mm3".

  THE RETAILER PAIRS THE TWO ITSELF. "This is the Do-It-Yourself (DIY) version of this product. To
  see the Assembled version of this product, please click here" is the strongest kind of evidence
  for a configuration boundary: the seller explicitly naming this as one of two forms of ONE
  product, rather than the archive inferring it from similar names.

  WHICH GUHONG. The title carries no version suffix and the description calls it "the cube that
  launched DaYan's presence into the market", which is the original. The 57.0mm dimension
  corroborates it against dayan-guhong-v3-m, which this archive records at 54mm. The page's
  mentions of V3, V4 and Pro appear in recommendation panels, not in its own copy.

  NO ITEM WEIGHT is stated, only the dimension. Recorded as absent rather than filled from a
  sibling page.
