reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that the WeiLong GTS was sold in an UNSTICKERED factory configuration — assembled,
  supplied with stock stickers and logo not applied, and not pre-lubricated; that it was offered
  in five body colours; and an item weight of 79.5g and a 56.5mm dimension for the GTS.
  DOES NOT ESTABLISH: a release date for the configuration, or MoYu's own name for it —
  "Unstickered" is the retailer's product title.
