excerpt: |-
  Product Description: "The GAN 356 i Carry 2 (UV Coated) has the same long battery life as the
  standard GAN i Carry 2! Race your friends on the free app 'CubeStation', or refresh some of
  your algorithms and improve your solving. You can do it all with this slick smart cube."

  Product Specifications table, transcribed verbatim: "Manufacturer: GAN", "Dimensions: 56.0mm³",
  "Item Weight: 88.0g", "Gross Weight: 240g". The gross figure is recorded only so a reader can
  see which number was NOT taken as the product weight.

  WHY THIS ESTABLISHES A CONFIGURATION AXIS RATHER THAN A SEPARATE PRODUCT. The copy contrasts
  this cube with "the standard GAN i Carry 2" in its own first sentence and claims the same
  battery life — the retailer is describing one puzzle offered coated and uncoated, not two
  puzzles. It is sold under its own product handle (gan-356-i-carry-2-uv-coated) distinct from
  the base handle (gan-356-i-carry-2), so this is not one listing with a dropdown, which is the
  dedup test this archive applies before admitting any variant.
