excerpt: |-
  CDX prefix enumeration of https://www.thecubicle.com/collections/dayan returns 3x3 product
  paths including: dayan-zhanchi and dayan-zhanchi-2018 (2019-07-18), dayan-zhanchi-pro-m-3x3
  (2021-09-18), dayan-tengyun-m-3x3 and dayan-tengyun-v2-m-3x3 (2021-09-18),
  dayan-guhong-3x3-v4-m (2021-09-22), dayan-guhong-v3-m (2024-04-15),
  dayan-guhong-pro-m-3x3-{54,55,56}mm-{standard,maglev} (2024-04-15/20, six size/configuration
  paths), dayan-tengyun-v3-m-3x3 (2024-04-15), dayan-zhanchi-v5-m-3x3-{standard,premium,fancy}
  (2025-04-13/14/17, three configuration paths) — the last two representing generations newer
  than the Speedsolving wiki's own coverage (speedsolving-wiki-dayan-products, last edited
  2023-09-01). Non-3x3x3 items in the same collection (Megaminx, Bermuda Cube, Gem Cube, Skewb,
  Tangram, Wheels of Wisdom, FTO, NeZha 5x5, 12/16/30-axis puzzle balls) excluded from this
  archive's scope.
