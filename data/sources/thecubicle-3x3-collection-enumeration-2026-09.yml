reliability_note: |-
  Tier 2, first-party retailer catalogue structure, and specifically the retailer's OWN
  structured `vendor` field rather than a title parsed by this archive — which is what allows
  manufacturer attribution here to be read off the source instead of inferred. That distinction
  matters for this record: parsing titles alone would have counted "Griesser's WeiLong V11" and
  "Tommy Cherry's WeiLong WRM V10" as manufacturer products when they are TheCubicle's own
  custom setups.
  ESTABLISHES: that a named product line was on sale at this retailer, and from when it was
