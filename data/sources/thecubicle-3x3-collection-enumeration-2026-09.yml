  WHY THE published_at DATES MATTER. They are Shopify listing dates, not release dates, and are
  not used as release evidence anywhere. They establish one thing only, and it is the point of
  this record: MoYu WeiLong WRM V10 was listed 2024-05-09 and MoYu WeiLong V11 on 2025-06-06,
  so both were on sale at this retailer for well over a year before Pass 3's MoYu lane ran on
  2026-09-03 and recorded a "full WeiLong succession" ending at V9. This is not a gap that
  opened after enumeration closed.

  CONTROL. The same enumeration confirms the archive is right about a great deal: MoYu RS3 M V5,
