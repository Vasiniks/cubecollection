reliability_note: |-
  Tier 2, first-party retailer catalogue structure, NON-US market.
  ESTABLISHES: the set of MoYu-prefixed paths an Indian retailer has carried; that MoYu's
  GuoGuan and HuaMeng sub-brands are sold under the MoYu name in that market; and that the
  P4-9 candidate generations are present outside the US market.
  DOES NOT ESTABLISH: that this catalogue is complete, or that any listed product is a distinct
  model. A retailer's parent-brand prefix is a merchandising choice, and this archive has a
  documented false positive from reading retailer taxonomy as lineage evidence.
