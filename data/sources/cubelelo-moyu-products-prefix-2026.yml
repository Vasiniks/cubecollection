excerpt: |-
  CDX prefix enumeration of cubelelo.com/products/moyu-, run 2026-09-12, collapsed on urlkey and
  filtered to status 200. 132 distinct paths after discarding query-string and file-extension
  duplicates. Reproducible with
  `npm run wayback -- prefix cubelelo.com/products/moyu- --limit 800`.

  WHAT A NON-US CATALOGUE ADDS THAT THE US ONE DID NOT.

  Sub-brands sold UNDER THE MOYU PREFIX here, which TheCubicle files separately:
    moyu-guoguan-yuexiao-3x3-black, moyu-guoguan-yuexiao-e-3x3-black
    moyu-huameng-ys3m-maglev-3x3-cube, moyu-huameng-ys3-m-3x3-magnetic-refurbished
    moyu-huameng-tg-3x3-magnetic-ball-core-maglev-uv-coated-limited-edition
  This is independent corroboration of the GuoGuan and HuaMeng affiliations with MoYu, from a
  retailer in a different market that chose the same parent attribution.

  P4-9 CANDIDATES PRESENT AT A SECOND RETAILER IN A DIFFERENT MARKET, verbatim:
    moyu-weilong-v11-3x3-magnetic, moyu-weilong-v11-3x3-18th-anniversary-magnetic,
    moyu-weilong-v11-se-magnetic, moyu-weilong-ai-3x3-v11-magnetic-maglev,
    moyu-weilong-v10-ai-gyroscope-core-charging-uv-coated-version,
    moyu-super-weilong-v2-ai-gyroscope-smart-cube, moyu-super-weilong-v2-magnetic,
    moyu-rs3m-v5-se-magnetic, moyu-super-rs3-m-3x3-magnetic-ball-core-uv-coated
  These are NOT admitted here. They matter because P4-9's candidates were found at US retailers,
  and a reader could reasonably ask whether they were a US-market artefact. They are not.

  A CONFIGURATION OF A MODEL THE ARCHIVE HOLDS:
    moyu-aolong-v2-3x3-transparent-green-limited-edition — see
    cubelelo-moyu-aolong-v2-le-2021, recorded separately.

  "-refurbished" PATHS ARE STOCK CONDITION, NOT CONFIGURATION, and this retailer has many of
  them (rs3m-2021, rs3m-v5, super-rs3m x3, wr-m-2021-lite, huameng-ys3-m, guoguan-yuexiao).
  The same reasoning rejected Cubelelo's DaYan "-refurbished" paths on 2026-09-11.
