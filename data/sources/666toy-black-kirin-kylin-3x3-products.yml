# ESCALATION-ADJACENT FINDING, not a taxonomy change: this category page itself mixes "Black
# Kirin" and "Black Kylin" spellings across its own product titles for what the evidence below
# shows is the same underlying line, and separately carries a plain "Kylin" (no "Black") 3x3
# line. This source is used to populate BOTH of two already-frozen, separate families
# (yuxin-black-kirin and yuxin-kylin) without merging them — see reasoning in the excerpt below
# and in research/qc/pass3-b2-agent-a-yuxin.md.
