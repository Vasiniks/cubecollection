reliability_note: |-
  Tier 2, first-party retailer listing, non-US (China-based, English-language storefront).
  "The world's smallest cube (mass production)" independently and closely echoes TheCubicle's
  own "the smallest mass-produced 3x3 cube in the world" claim (thecubicle-maru-nano-3x3) from
  a fully separate company — two independent tier 2 sources making the same specific,
  falsifiable production-first claim, which is treated as `confirmed` per rule 9 for the
  existence/significance claim (not for the WCA-legality question, which neither source
  addresses). Size (15mm) matches thecubicle-maru-nano-3x3 exactly; weight (30g here, for a
  "Luminous" colourway, vs. 26g "Gross Weight" at TheCubicle for the plain edition) is close but
  not identical — plausibly a colourway/finish difference rather than a contradiction, not
  investigated further this pass. This capture (2015-05-13) is a genuine, much earlier
  "existed by" bound than TheCubicle's own 2020 capture; still not used as a release date, per
  the standing rule against treating crawl timestamps as such.
