reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that a UV-coated configuration of the GAN356 MagLev was sold, in the retailer's
  own words — "This version is UV-coated which aids with grip and gives the puzzle a glossy
  finish" — and, for the model generally, a 56.0mm dimension and corner/core magnetisation.
  DOES NOT ESTABLISH: a release date, the puzzle's mass, or GAN's own name for the
  configuration. "UV" here is the retailer's product-title suffix.
