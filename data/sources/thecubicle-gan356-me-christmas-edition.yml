excerpt: |-
  "Celebrate the holiday season with the exclusive GAN356 ME 3x3 (Christmas Edition)! Specially
  designed for speedcubers and collectors, this limited edition cube features festive green
  internals, eye-catching red magnet capsules, and a unique red logo. It maintains all the
  advanced features of the original GAN356 ME, including a robust 48 magnetic capsule system
  and the precise GES Pro+ tension adjustment for a smooth, customizable solving experience.
  This holiday edition also includes a Christmas-themed sticker to personalize one side of your
  cube, as well as a vibrant red GAN Cube bag with a seasonal design." Listed price
  (Stickerless): $24.99 USD. A verified customer review independently confirms "The red logo
  and green internals are visually pleasing... and the bag with the cube riding a snowboard in
  gold/red."
