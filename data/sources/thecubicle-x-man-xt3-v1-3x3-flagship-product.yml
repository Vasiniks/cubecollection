excerpt: |-
  Product Description: "The X-Man XT3 V1 3x3 (Flagship) is a 3x3 release from X-Man that gives
  you flagship features without the flagship price. Adjust the tension and compression and make
  this puzzle fit your turning style perfectly! This is the Flagship version that has springs
  and a matte outer finish." Versions offered on this page: "Flagship", "Flagship + UV",
  "Pioneer MagLev + UV". Customer reviews (verbatim, representative): "it feels like a tv3 was
  combined with a qiyi m pro (it even has the same pieces as tv3)"; "This cube is awesome. It
  feels like a Tornado V3 but lighter"; "It is Like a Tornado but without all the adjustments for
  the Magnets and because of that it is very light"; a staff reply states "This cube has a
  simpler adjustment system than the Tornado that makes this cube both cheaper and more
  durable".


  SPEC TABLE PRESERVED 2026-09-09. The figures this archive relies on from this page were read
  off it and never written down here, so the excerpt did not carry the claim without the page —
  the one thing an excerpt exists to do. Re-fetched from the archive_url already on this record
  and transcribed verbatim: "Dimensions: 55.0mm" (TheCubicle renders it "55.0mm³", its own notation for
  a cube's edge length), "Item Weight: 65.0g", "Gross Weight: 188g". The gross figure is recorded
  here only so a future reader can see which number was NOT taken as the product weight.
