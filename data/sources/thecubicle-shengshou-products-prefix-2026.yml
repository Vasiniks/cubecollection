# Pass 3 (model enumeration), agent D. A full, non-truncated wayback CDX `prefix` sweep of
# thecubicle.com/products/shengshou* (474 distinct captured URLs, 2019-2026), run specifically
# because RESEARCH_SPEC section 3.6a and this pass's brief flag ShengShou as a manufacturer
# whose official domain is dead but whose retail catalogue is demonstrably current. This sweep
# directly supersedes the narrower finding in thecubicle-shengshou-collection-2025 (a
# collections-page-only crawl that found "no ordinary ShengShou 3x3" and was current only as of
# that capture window): the /products/ prefix, run independently in this pass, surfaces
# persistent 3x3 product pages for all seven families this agent was assigned
