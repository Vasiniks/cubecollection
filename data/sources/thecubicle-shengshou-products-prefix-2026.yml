reliability_note: |-
  Tier 2, first-party retailer catalogue structure. RESEARCH_SPEC section 3.6a compliance record
  for this pass: this is the required "archived retailer /products/ prefix sweep, even when the
  official site is healthy" check (ShengShou's official site is in fact dead, per
  data/manufacturers/shengshou.yml) — outcome: SWEPT, MUCH FOUND, not "nothing new". It directly
  overturns the pass-2 ShengShou method note's premise that current ShengShou 3x3 presence had
  "genuinely receded" — the /collections/ page used in pass 2 filters differently than the raw
  /products/ prefix and missed a live, dated 3x3 catalogue.

  IMPORTANT ESCALATION, not resolved by this source or this pass: ShengShou YuFeng (a magnetic-
  core/maglev-marketed flagship 3x3, first captured 2023, still selling in 2025) and ShengShou
  Crazy 3x3 (a shape-mod line) are both demonstrably real, currently-sold ShengShou 3x3 product
  lines with NO corresponding family record in data/families/ (only 7 ShengShou 3x3 families
  exist, all assigned to this agent, none named YuFeng or Crazy). Family creation is frozen for
  Pass 3 per the taxonomy-freeze rule; this is recorded here and in this agent's report as a
  finding for pass-2 re-opening, not acted on.

  PARTIALLY RESOLVED 2026-09-08 (Pass 2.6, ledger P26-1). The escalation above was correct and
  is preserved verbatim as the record of how the gap was found. YuFeng is now the family
  `shengshou-yufeng`, with both generations enumerated as models. The rest of the escalation is now
  also resolved (P26-5, 2026-09-08): Crazy, Rainbow, Gem and Tank are all families, Crazy's
  scope_class question being settled as reference_only for its first generation and conditional
  for V2. Metal Cube alone was REFUSED — no cross-range naming, a single publisher, and
  marketing copy that fails RESEARCH_SPEC §2.2's documented-significance bar. This record's own statement that only seven
  ShengShou families existed was true when written; after the P26-5 remediation of 2026-09-08
  there are twelve — YuFeng, plus Rainbow, Gem, Tank and Crazy, all four of which were named in
  the excerpt above and are now families.

  This source is also the archive's worked example of ledger P26-2: the escalation survived only
  because it was written into a canonical record's notes. The Pass 3 lane that found it was
  killed by a rate limit before its report existed, so nothing else carried the finding.
