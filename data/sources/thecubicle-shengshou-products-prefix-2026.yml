excerpt: |-
  CDX prefix enumeration of https://www.thecubicle.com/products/shengshou (2019-2026 captures,
  474 distinct URLs, not truncated) returns, among many non-3x3 ShengShou products (big cubes,
  Megaminx, Pyraminx, Square-1, clocks, shape mods), the following 3x3-relevant product paths:
  shengshou-3x3 (2020-09-22), shengshou-wind-3x3 (2020-12-03), shengshou-aurora-3x3 (2019-07-18)
  and shengshou-aurora-3x3-unstickered (2020-09-20), shengshou-fangyuan-3x3 (2019-07-16),
  shengshou-fangyuan-3x3-gift-box (2019-07-18), shengshou-fangyuan-v2-m (2019-09-22),
  shengshou-legend-3x3 (2019-07-16), shengshou-legend-3x3-unstickered (2021-09-21),
  shengshou-legend-3x3-metallic (2024-02-20), shengshou-legend-3x3-m-metallic (2024-04-19),
  shengshou-big-legend-3x3-7-0cm (2020-09-18), shengshou-mr-m-3x3 (2019-07-16),
  shengshou-mr-m-v2-3x3 (2020-09-23, still resolving as of a 2026-02-25 capture),
  shengshou-mr-m-s-3x3 (2022-03-23), shengshou-pearl-3x3 (2019-08-24) — plus, outside this
  pass's seven assigned families entirely, shengshou-crazy-3x3/-jelly-le/-v2 (a shape-mod line)
  and shengshou-yufeng-3x3-m-magnetic-core-magelev (2023-02-05) and shengshou-yufeng-v2-3x3-m
  (2023-06-03, still resolving as of a 2025-11-29 capture) — a "YuFeng" flagship 3x3 line with
  no corresponding family record anywhere in data/families/. Also present: shengshou-rainbow-3x3,
  shengshou-gem-3x3, shengshou-tank-3x3, shengshou-metal-cube-3x3, and several 46mm/keychain/
  novelty 3x3 SKUs not chased this pass.
