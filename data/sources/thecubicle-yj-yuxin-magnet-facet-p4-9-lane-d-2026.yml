# `speedcubeshop-yj-yuxin-magnet-facet-p4-9-lane-d-2026`, same purpose, at TheCubicle: settles
# whether a NON-magnetic "YJ YuLong V2", "YuXin Little Magic V2", or "YuXin Little Magic V3" was
# ever sold under those exact bare names, per the ambiguity
# `research/qc/p4-9-alias-blindness-2026-09-12.md` refused to resolve.
