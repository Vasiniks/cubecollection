reliability_note: |-
  Tier 2, first-party retailer catalogue structure, vendor-gated.
  ESTABLISHES: TheCubicle sells no product titled bare "YJ YuLong V2", "YuXin Little Magic V2",
  or "YuXin Little Magic V3" without an explicit magnetic/MagLev designator, as of 2026-09-19 —
  resolving the ambiguity in p4-9-alias-blindness-2026-09-12.md. Also establishes that
  TheCubicle's own naming for the V2 M and V3 MagLev lines already matches (V2 M) or is token-
  identical modulo word order and the non-discriminating "3x3" token to (V3 MagLev) the
  archive's existing model names, once the catalogue-gap script's bracket-truncation of the
  full title is accounted for (see report).
  DOES NOT ESTABLISH: that no non-magnetic V2 or non-MagLev V3 was EVER sold by any retailer at
  any time — a single live snapshot, not a historical sweep.
