excerpt: |-
  "One of the first smart cubes ever released, The GoCube Edge is a magnetic 3x3 equipped with
  Bluetooth 5.0. This model features a novel pillowed design, giving it a cool, futuristic
  appearance. GoCube's accompanying app allows you to race with cubers around the world, play
  mini-games, learn, and compete in speedcubing events. The GoCube Edge 3x3 comes with a USB
  charger, a charging stand, a high quality cube pouch, and a 1-year warranty by the
  manufacturer." Product Specifications: "Manufacturer: GoCube / Type: 3x3 / Added: 2020-09-01 /
  Gross Weight: 436g / Dimensions: 60.0mm 3 / Magnets: Magnetic / Item Weight: 125.0g".
