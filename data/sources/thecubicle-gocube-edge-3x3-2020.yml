reliability_note: "Tier 2, retailer. The 'one of the first smart cubes ever released' framing
  is treated as a comparative/marketing claim (tier-4-for-comparative-claims rule), not a
  specification fact — used descriptively, not to date GoCube's actual founding. 'Added:
  2020-09-01' is TheCubicle's own catalogue-add date, not necessarily GoCube Edge's original
  release date (getgocube-com-2019-basic-edge-skus already shows Edge on sale in December
  2019); recorded on the family record as the retailer's own attested date only, not conflated
  with a first release."
