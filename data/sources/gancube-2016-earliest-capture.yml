reliability_note: "GAN's own site footer, tier 1 for GAN's own copyright/operating claims, but a copyright-range start year is a weaker and more ambiguous signal of 'founding' than an explicit founding statement — it may mark when this specific corporate name or site was first used rather than when the underlying brand or company began. Recorded as a third candidate date (2013) in the disputed /founded attestation on data/manufacturers/gan.yml, distinct from the 2010 brand-founding claim (ganspuzzle-brand-intro-2011) and the 2014 incorporation claim (gancube-cn-about-us-en, gancube-cn-introduction-zh, gancube-brand-story-about-us). The ICP filing number '粤ICP备16068632号-1' is the same base registration number (粤ICP备16068632号) used, without the '-1' sub-suffix, on gancube.cn and monster-go.com in later captures — documentary evidence that the same registered operator ran gancube.com by August 2016 already, tying this early corporate identity to the entity researched elsewhere in this register. The product line named here (GAN356 Air, GAN356sV2, GAN357U, GAN357) is a lead for pass 2's family/model enumeration, not resolved here."
