  Product Description: "The HuaMeng TG is the most feature-rich 3x3 we've seen so far! With
  1620 different adjustment combinations you can find one that fits your turning style. It has
  hand-adjustable compression settings and a tool to adjust tensions and magnet strength. It
  has 6 tension settings, 9 compression settings, 5 edge magnet adjustments, and 6 corner/core
  magnet adjustments. This is the MagLev + Ball-Core + UV version. It uses opposing magnets
  instead of a traditional spring, a ball-core for a stronger magnetic feel and auto-alignment,
  and a UV coating that adds a glossy finish that can aid with grip." Structured "Product
