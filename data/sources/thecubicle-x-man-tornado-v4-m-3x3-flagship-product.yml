reliability_note: |-
  Tier 2, first-party retailer description. "a successor to the Tornado V3" is explicit succession language, and "This one has a ball-core" names a specific core-system change from V3 (which the V3 page above does not describe as ball-core), the basis for model-level (not configuration-level) treatment. No Dimensions row appears at this capture, so `specs.size_mm` for this model instead relies on thecubicle-x-man-tornado-v4-ai-3x3-uv-product's "Standard 55.5mm size" statement for the same V4 platform (see that source's own reliability note).
