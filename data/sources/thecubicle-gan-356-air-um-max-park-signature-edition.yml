excerpt: |-
  "The GAN356 Air UM Max Park Signature Edition is a replica of the cube used by Max Park in
  his recent 6.39 World Record 3x3 average. This cube is tuned to Max's exact specifications
  and comes with yellow GES nuts pre-installed, a lube combination of Cubicle Weight 5 on the
  core and Lubicle Silk on the pieces, and slightly looser tensions. Max's setup accentuates
  the Air UM's speed and freedom of turning, producing a cube with maximum quickness and
  smoothness. This cube comes with a tensioning tool, a special Max Park Signature VIP card, a
  package containing the six other GES nuts, and an exclusive pamphlet with biographical
  information on Max. Limited Edition: To commemorate Max Park's 6.39 WR average, only 639 of
  the GAN 356 Air UM Max Park Signature Edition will be available. Each puzzle will ship with a
  numbered VIP card, with numbers from 50001 to 50639." Listed price at this capture: $46.39
  USD. Filed by TheCubicle under its own "Signature Series" navigation category. A verified
  customer review states: "This cube is a UM with the setup of Max Parks WR cube, setup from
  Cubicle Labs."
