reliability_note: "TheCubicle's own retail copy, tier 2, for the specific, non-superlative run-size and numbering claim (639 units, numbered 50001-50639), which RESEARCH_SPEC §3.3 treats as an admissible specification-like fact rather than comparative marketing copy. A customer review (tier 5, inadmissible on its own) independently names Cubicle Labs as the party that performed the tuning setup, consistent with thecubicle-gan-356-air-um's own statement that Cubicle Labs and GAN collaborated on the Air UM generally; relied on here only as corroborating context for the aftermarket/collaboration reading, not as a standalone fact source. A second, contradicting customer review claims a run of 'just over 400' units sold; this is unsourced anecdote and is not recorded as a candidate value, per the hard rule against inferring run size from informal claims."
