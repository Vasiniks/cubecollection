  ESTABLISHES: that a named "Brainstorm Voyage Edition" of the GAN356 i Carry was sold, what it
  contained, and the base puzzle's dimensions and item weight.
  DOES NOT ESTABLISH: a release date, a production run size, or that the edition was limited in
  number. "Special edition" describes the packaging, not the scarcity, and `edition.limited` is
  left unset rather than inferred from the phrase.
