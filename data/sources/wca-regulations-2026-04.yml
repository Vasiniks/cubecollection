excerpt: |-
  Fetched live 2026-09-11. The page identifies itself as "Version: April 1, 2026 [official:
  415be08]" — a dated version with a commit hash, so the text below is attributable to a specific
  revision rather than to "the regulations" in general.

  ARTICLE 3, PUZZLE REGULATIONS, the clauses bearing on surface appearance, verbatim:

  3d) "Puzzles must have colored parts, which define the color scheme of the puzzle and must be
  one and only one of the following: colored stickers, colored tiles, colored plastic, or
  painted/printed colors. All colored parts of a puzzle must be made of a similar material.
  Exception: for Clock, puzzles do not have colored parts."

  3d2) "The colors of the colored parts must be solid, with one uniform color per face. Each
  color must be clearly distinct from the other colors."

  3h) "Modifications that enhance the basic concept of a puzzle are not permitted. Modified
  versions of puzzles are permitted only if the modification does not make any additional
  information available to the competitor (e.g. orientation or identity of pieces), compared to
  an unmodified version of the same puzzle."
  3h+) CLARIFICATION: "Puzzles may be refined internally by sanding, lubrication, or modifications
  which improve stability (e.g. magnets)."

  3a+) CLARIFICATION: "Competitors may use puzzles of any reasonable size, at the discretion of
  the WCA Delegate."

  3d1b+) CLARIFICATION, on the colour-blind exception: "Pieces must not have any features (e.g.
  textures, pattern irregularities) that significantly distinguish them from similar pieces."

  WHY 3a+ IS RECORDED HERE. It states there is NO fixed size limit — size is "any reasonable
  size, at the discretion of the WCA Delegate". This archive has cited that fact before
  (mfjs-mini-3x3-50mm's own scope reasoning paraphrases it) without ever holding the regulation
  text. It does now.
