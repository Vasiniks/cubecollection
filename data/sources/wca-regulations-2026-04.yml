reliability_note: |-
  Tier 1. The WCA is the governing body and this is its own governing document — for questions of
  WCA competition legality there is no higher source.
  `kind: standards_body` was ADDED to vocab/source-kinds.yml on 2026-09-11 for this record.
  It was first filed as `manufacturer_official` with an explicit tier-1 override and a note
  calling that a compromise; the vocabulary now has the right value, so the tier DERIVES
  correctly and no override is needed. A governing body is not a manufacturer, and for questions
  of competition legality it outranks one.
  ESTABLISHES: what the April 2026 Regulations require of a puzzle's coloured parts, modifications
  and size.
  DOES NOT ESTABLISH: whether any particular product complies. Applying 3d2 to a thermochromic or
  iridescent surface is an inference from the regulation to the object, and any record making it
  must show that step rather than cite this source as though it named the product.
