excerpt: |-
  SWEEP RUN 2026-09-12 for P4-10, covering the task brief's avenues 2-4 after avenue 1
  (packaging photography) was worked separately (see ziina-star-packaging-photography-2026-09
  and ziina-cubein-calendar-cube-packaging-2026-09).

  CHINESE-LANGUAGE SEARCH. Queries "Ziina Star 魔方 厂家" (manufacturer) and "Ziina 魔方 1688"
  surfaced only the same English-language retailer listings this archive already knows
  (SpeedCubeShop, cubein.cn) plus unrelated 1688/Alibaba category pages for "魔方" in general and
  the UAE payments company's Wikipedia entry. No native Chinese brand or company name for
  Ziina/Ziina Star was found by search. This is a search-engine-coverage result, not proof no
  such name exists.

  TWISTYPUZZLES.COM. A direct fetch of the museum search CGI endpoint returned HTTP 403
  (blocked, not 404 - recorded as blocked/unverified per the failed-fetch discipline). A
  site-restricted web search ("site:twistypuzzles.com Ziina") returned only unrelated forum and
  museum pages (Atlasminx, Zettaminx, Void Dino Cube, YiSen Mixup, etc.) with no Ziina content of
  any kind - no museum entry, no forum thread. Combined with the earlier sweep's Speedsolving
  wiki 404s (ziina-first-party-sweep-2026-09) and a fresh site-restricted search here
  ("site:speedsolving.com wiki Ziina", surfacing only unrelated method/wiki pages and the
  already-known SpeedSolving forum thread), NEITHER of the two named specialist databases has any
  Ziina entry reachable by search.

  1688.COM RETRY, STILL BLOCKED. An offer id (2207525125403) present in this scratchpad from
  earlier in this session was retried twice - once by direct curl, once by WebFetch - and BOTH
  attempts hit 1688's anti-bot interstitial (a captcha/"punish" redirect page, verbatim script
  fragment beginning `window._config_ = {"action":"captcha", ...}`). NEITHER attempt reached the
  actual listing, so IT IS UNKNOWN whether this offer is even Ziina-related - it is recorded as
  blocked and unverified, not as a lead, and should not be treated as evidence of anything.

  A METHODOLOGY CAVEAT WORTH RECORDING: a general web-search tool's own generated summary, when
  asked about "Ziina Star speed cube manufacturer OEM", asserted "CubeIn is listed as the
  manufacturer/distributor for Ziina Star products". THIS IS A SEARCH-SUMMARY INFERENCE, NOT A
  FOUND FACT - no page in the underlying result set makes that claim, CubeIn (cubein.cn) is a
  retailer/storefront in this archive's own evidence (see
  ziina-cubein-calendar-cube-packaging-2026-09, which fetches its product JSON directly), and the
  claim is REJECTED here rather than propagated. Recorded because it is exactly the kind of
  plausible-sounding but unsourced claim that could get miscited as evidence if not flagged.
