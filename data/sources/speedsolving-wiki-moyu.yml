excerpt: |-
  States MoYu "was created around 2012 as a platform for external designers to provide designs
  to YJ for production, marketing, etc.", i.e. began as a YongJun (YJ) sub-brand, and "parted
  ways [from YJ] by 2019 at the latest, although an exact date is unconfirmed", after which the
  two operate as separate entities with different factories. States the brand name combines
  "Mo" (magic, as Rubik's Cubes are called Magic Cubes in China) and "Yu" (region/land), and
  that the marking "魔域文化" ("MoYu Culture") appears on cubes. Lists sub-brands/designer
  labels: MoFang JiaoShi ("Cubing Classroom", "the most successful MoYu sub-brand"), Cong's
  Design (Fucong Fei), GuoGuan (Guoquan Zhang), MoHuan ShouSu (Haixu Zhang, who later founded
  the VIN brand), SenHuan, MoJue, YanCheng, MoYu Blocks. States website moyucube.com, years
  active "2013-present".

  3x3 PRODUCT SECTION ADDED 2026-09-11 (ledger P4-14). The excerpt above preserved only the
  page's BRAND HISTORY - founding, naming, sub-brands - while 169 of the 172 attestations citing
  this record make PRODUCT-level claims: coatings, magnet configurations, MagLev, release dates,
  edition designations. Those claims were correct and the page carries them; they simply were
  never written down here, so the archive held the claim and a pointer but not the evidence.
  Re-fetched from the archive_url already on this record and transcribed verbatim:

  MoYu WeiLong V2 is the second revision of the tremendously popular MoYu WeiLong. The most
  notable change is how the pieces are put together. Other than this, the mechanism remains
  largely unchanged. MoYu WeiLong GTS The MoYu WeiLong GTS was released in 2016. It is fast and
  very smooth. It corner cuts nearly two pieces forward and one piece reverse, so that it rarely
  catches. It is designed with caps on the pieces rather than the pieces being split into
  multiple sections, meaning that a stickerless version would not be possible. MoYu WeiLong GTS2
  The MoYu WeiLong GTS2 was released in 2017. It is an improvement to the GTS1 with a 3-piece
  corner design that allows for stickerless versions, and a slightly better feel to the
  previous. It was widely considered one of the best speedcubes after its release. Moyu Weilong
  GTS3/3M/3LM Released May-September 2018, these cubes feature a new system in which it is
  possible to easily change the spring compression and therefore control how fast you want the
  cube to be, certainly one of the best cubes on the market as of September 2018. It combined
  the stability of the GTS2 and the flexibility of the GTS3 and came magnetic, nonmagnetic, or
  with light magnets. Moyu Weilong WR/WR M Released on 4/3/2019, is a GTS3 without ridges. The
  magnets were weaker, the same as the GTS3 LM. It was also widely popular and considered one of
  the best speedcubes, but many cubers complained that the magnets were just a tad too weak.
  Moyu Weilong WR M 2020 Released in 2020, the Weilong WR M 2020 was the successor to the
  popular WR M. The WR M 2020 featured a new color scheme and frosted plastic, along with the
  MoYu spring adjustment feature. It had an extremely smooth and fast feel. MoYu WeiLong WR M
  2021/2021 MagLev It was released in late 2021, as the name suggests. It featured virtually the
  same internal geometry as the 2020 but switched to using a capped design as opposed to a
  split-piece. It featured adjustable magnets across 5 settings, and as the name hints, the
  Maglev version sports magnetic levitation as well as purple internals. MoYu WeiLong V9
  Standard/Maglev/Ballcore Released spring 2023. It featured a split-piece design a la WR M
  2020, but the internal geometry is most similar to the WRM 2019, as a "back-to-basics" type
  design. So far, the Standard version is the cheapest of the Weilong series from the past few
  years, but it loses adjustable magnet strength. Maglev features maglev springs and purple
  corner/edge stalks, and the Ballcore features corner-core magnets as well as repelling edge
  magnets similar to that of the GAN 13. A 20-magnet Ballcore version was released in January
  2024, adding 12 more core magnets to attract to the edge-repelling magnets. Retails for
  $47.99. MoYu WeiLong Super Released late 2023. It featured a capped design similar to the WRM
  2021, departing from the V9, and shares a similar internal geometry. Coming in primary plastic
  internals only, it featured an 8-magnet ball-core with spring, 8-magnet ball-core with maglev,
  and 20-magnet ball-core with maglev. Magnet adjustment come with all versions, yet the dual-
  adjustment system from years ago still remains. Though it was a promising release, MoYu had
  packed so many extra accessories, including a rather gimmicky cube "wristwatch" holder, and an
  egregiously large box, that the price is astronomically high at upwards of $80 at most sites
  for the cheapest version and brushing up to the $100 mark for the most expensive. Considered
  inferior to the V9 in terms of price-to-performance. MoYu AoLong The Aolong improves on the
  Weilong's weak points. It is known for taking the mechanism of the MoYu Aosu, which many
  consider to be the best 4x4 speedcube. It is much more controllable while maintaining a decent
  amount of speed from the Weilong, even during first turns. Out of the box, it is very dry, and
  not unlike a WeiLong until you test out the corner cutting. The corner cutting is very good,
  with an easy 1 1/2 cubies, and 3/4 reverse. After breaking it in and lubing it, the corner
  cutting becomes much easier, and better, the dry feeling goes away a little (it’s still a
  little noisy), and it becomes very fast, though it is very easily gummed up by anything wrong,
  like excess lube, cube dust or water. The stickers are very durable. MoYu AoLong V2 The MoYu
  AoLong V2 is an updated version of the original MoYu AoLong. It was intended to reduce corner
  twists after Feliks Zemdegs received a DNF on a would-be world record due to a corner twist.
  However, "bad" Aolongs exist due to the V2 controversy in July 2014. MoYu decided to produce
  the first batch of Aolong V2s with a different plastic while discontinuing the V1. Once
  everyone noticed how poor the performance was on the new cubes, MoYu changed the plastic on
  all new V2s. All new V2s are made with the proper plastic. It was regarded as a brilliant cube
  that set the standard for speed cubes. MoYu AoLong GT Considered a failure by many cubers, and
  the Aolong V2 is recommended over it. Basically a worse Aolong V2 with square corners. It also
  had unusual sticker shades which MoYu claimed was for the square corners. MoYu LiYing MoYu
  DianMa Considered a failure by many cubers. The thin middle layer was awkward, the plastic
  molding was uneven and caused people to cut their fingers on the sharp points of the cubes'
  edges, and some of the cubes had popping issues. MoYu HuaLong The MoYu HuaLong was a rather
  unique, scratchy cube that gained popularity in late spring 2015. It was similar to the
  AoLong, and featured similar internal mechanism patterns as well as hollow corners. It was
  still not as popular as the AoLong at the time. MoYu TangLong The MoYu TangLong was released
  soon after the Gans 356 to compete with it. Its main differences from the Gans is that it is
  more stable, and is also slightly slower. This puzzle came in colors like blue, cyan, and
  pink, unlike former puzzles. MoYu YuLong This budget cube has a light, crunchy feel. The edges
  pop &amp; the corners twist fairly easily when set up loose. The pieces of the stickerless
  version are pressed together without glue and can fall apart when they pop out. If you're
  looking for an inexpensive cube with a pleasant crunch, this might work for you, despite the
  cheap construction. MoYu RS3M 2020 Considered one of the best 3x3s of all time, this puzzle
  features magnets, a dual adjustment system in which you could change the spring compression
  and a cheap price point of only $9. There is, however, a major problem being that the puzzle
  has very weak magnets. You can buy extra magnets that apply in minutes and help improve the
  overall feel of the puzzle. MoYu RS3M MagLev An updated version of the MoYu RS3M 2020. This
  puzzle uses MagLev technology, having 2 repelling magnets that replicate springs. The DAS
  works the same way, but instead of compressing the springs, the magnets come closer together,
  with the closer the magnets are, the more stable the puzzle is, and the further the magnets
  are, the more flexible the puzzle is. This puzzle is also very fast MoYu Super RS3M An updated
  version of the RS3M 2020/2021. This puzzle comes in stickerless only and comes in 3 versions.
  MoYu Super RS3M Standard: The first version of the Super RS3M that has a dragon scale design
  on the pieces and comes with the standard DAS of the RS3M. MoYu Super RS3M Maglev: The second
  version of the Super RS3M that has MagLev instead of springs. The internals of this puzzle are
  purple, much like the other MagLev puzzles from MoYu. MoYu Super RS3M Ball Core: The third
  version of the Super RS3M has MagLev and a ball-core that has corner-core magnets. The
  original batches were faulty due to the gold plastic used being very brittle and cracking.
  Currently the second cheapest mass-produced puzzle with corner-core magnets (with the DaYan
  GuHong Pro taking the first-place spot) and tied for the cheapest puzzle with both corner-core
  magnets and maglev tensioning (also with the GuHong Pro). MoYu RS3M 2020 UV: A slight update
  to the RS3M 2020 adding UV coating and slightly stronger magnets. It is currently the cheapest
  mass-produced UV-coated puzzle at 17.99 USD. MoYu Super RS3M V2 Standard/Maglev/Ballcore The
  second version (or fourth, fifth, and sixth?) versions of the Super RS3M and the fourth
  version of the RS3M, with a capped piece design (as opposed to split-piece with a separate
  corner stalk), an updated external piece design featuring UV coating and repelling edge
  magnets (Ballcore only). Released mid-2023. MoYu RS3M V5 Standard/DAS/DAS with Robot/ MagLev
  /Ballcore UV The fifth version of the RS3M lineup of cubes, released in late 2023. The cube
  returns back to the original Super V1 split-piece design, but borrowing some elements of the
  WeiLong WRM V9. It comes with either a spring, a spring-and-ratchet system with either a
  spring or maglev, and in the UV version, a core-magnetic system. This cube retails at 8.99,
  9,99, 12.99, 15.99, 17.99, and 24.99 for each respective version.
