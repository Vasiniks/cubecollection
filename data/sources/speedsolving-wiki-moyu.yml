excerpt: |-
  States MoYu "was created around 2012 as a platform for external designers to provide designs
  to YJ for production, marketing, etc.", i.e. began as a YongJun (YJ) sub-brand, and "parted
  ways [from YJ] by 2019 at the latest, although an exact date is unconfirmed", after which the
  two operate as separate entities with different factories. States the brand name combines
  "Mo" (magic, as Rubik's Cubes are called Magic Cubes in China) and "Yu" (region/land), and
  that the marking "魔域文化" ("MoYu Culture") appears on cubes. Lists sub-brands/designer
  labels: MoFang JiaoShi ("Cubing Classroom", "the most successful MoYu sub-brand"), Cong's
  Design (Fucong Fei), GuoGuan (Guoquan Zhang), MoHuan ShouSu (Haixu Zhang, who later founded
  the VIN brand), SenHuan, MoJue, YanCheng, MoYu Blocks. States website moyucube.com, years
  active "2013-present".
