reliability_note: |-
  Tier 4, community-edited wiki with no named author or citation trail for the YJ-origin claim
  specifically. Corroborates but does not alone establish the MoYu/YJ relationship or founding
  date; recorded as `reported`/`uncertain` accordingly on the citing records. Independently useful
  because it names several long-tail candidates already carried in
  research/staging/manufacturers/global-pass0-candidates.yml (MoHuanShouSu, SenHuan) as MoYu-
  affiliated designer brands rather than unrelated companies.

  TIER OVERRIDE TO 3, applied 2026-09-03 (issue E1). `kind: wiki` derives to tier 4 by default,
  and tier 4's definition targets 'unattributed wikis'. This specific page does not match that
  description, and does match RESEARCH_SPEC line 102's tier-3 definition, 'long-form community
  documentation': it is edit-protected rather than open-anonymous, revision-tracked, substantial,
  and carries dated product entries. It shows NO 'may be currently outdated' banner - checked on
  the LIVE page, not inferred from the archived excerpt.

  SOURCE-SPECIFIC, never a kind-wide rule. `kind: wiki` remains tier 4 archive-wide. Sibling
  Speedsolving pages that DO carry the staleness banner - speedsolving-wiki-witeden, -diansheng-
  products, -shengshou-products, -yuxin-products - were deliberately left at tier 4 and their
  dependent claims downgraded to `uncertain` instead. The discriminator is the banner and the
  protection status, both independently verifiable, not the publisher's name.

  This override cannot manufacture false certainty: tier 3 still fails rule 9, which requires a
  tier 1 source or two independent tier 1-2 sources for `confirmed`. What it does is make
  `reported` correct by definition for claims resting on this page - exactly what
  vocab/confidence.yml already required ('Tier 3 source, uncontradicted and plausible').

  PERMITTED claim types: product existence, naming, line membership, approximate chronology.
