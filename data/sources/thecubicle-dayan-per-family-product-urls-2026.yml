# source: thecubicle-dayan-per-family-product-urls-2026
# Pass 3 (model enumeration). CDX `prefix` enumerations of TheCubicle's own product-URL space
# for six DaYan 3x3 families, run individually per family (rather than one truncated
# collection-wide sweep) on 2026-09-03, to establish which named generations each family
# actually has a retailer SKU for. Existence-level evidence only; no product descriptions are
# quoted here (see the per-family *-descriptions.yml sources for those).
