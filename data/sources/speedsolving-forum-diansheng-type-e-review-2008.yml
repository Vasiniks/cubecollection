excerpt: |-
  Posted 2008-06-25. On the DianSheng Type E cube: "Comes assembled with correct color
  scheme -- and surprisingly they have stickers, not paint!" The plastic is "quite hard,"
  compared to a white "Type D" cube. "Unlubed, it sucks. Period." But after lubrication it
  "turns very well -- and that's with the screws at max tightness," with "great turning speed
  and very low POPiness." It "sounds most similar to a black Type D" and "feels pretty good
  too. It's kind of like an offshout of the Type D family." One flaw noted: "the orange and red
  stickers are similar in color tone, which can be off-putting." Priced at approximately $4
  USD: "Good value for money too, at only half the price of the D cubes. Recommended,"
  concluding it is "equal to the white Type D" with "main cube potential, or at least, a good
  backup cube."
