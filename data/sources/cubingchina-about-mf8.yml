excerpt: |-
  "Cubing China (cubingchina.com) is established by Mr. Fok (the founder of MF8), Baiqiang
  Dong (WCA Results Team member), and Ming Zheng (WCA Delegate for China). The predecessor of
  Cubing China was the MF8 cubing forum and its online competition registration system." States
  MF8 (bbs.mf8-china.com) was founded in January 2004 as "the earliest Chinese website
  specializing in Rubik's Cubes and other puzzles" and became "the largest and most
  professional cubing forum in the Chinese cubing community."
