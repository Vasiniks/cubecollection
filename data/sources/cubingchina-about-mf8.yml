reliability_note: "First-party for Cubing China's own founding narrative, in which it names MF8
  and Mr. Fok as its direct predecessor and founder — tier 1 for that organisational-history
  claim. It documents MF8's origin as a cubing forum/community rather than a puzzle
  manufacturing company, which is a distinct but related fact from MF8's later identity selling
  named puzzle products (see DaYan's own site listing 'DaYan+MF8 4x4' as a joint product,
  dayancube-official-2013). This source does not itself confirm MF8 the forum and MF8 the
  puzzle-selling brand are the same organisation, only that they share a name and a founder
  figure; recorded as `probable` rather than `confirmed` on data/manufacturers/mf8.yml
  accordingly."
