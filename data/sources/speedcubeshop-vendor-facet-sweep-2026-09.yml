excerpt: |-
  Each of the 42 manufacturers the archive holds models for was looked up as a SpeedCubeShop
  brand collection via that retailer's product JSON, 2026-09-12. Reproducible per brand with
  `https://speedcubeshop.com/collections/<brand>/products.json?limit=250`.

  MOST BRANDS RETURNED NOTHING, which is a fact about this retailer's collection slugs and not
  about the brands: GAN, MoYu, MFJS, Monster Go, X-Man Design, Rubik's, Maru, Moretry, Swift
  Block, GuoGuan, GiiKER, HuaMeng, KungFu, LeFun, Particula and others all returned zero
  products under their archive id. They are stocked; the collection is named differently.

  THREE BRANDS RETURNED 3x3 PRODUCTS WHOSE HANDLES DO NOT CONTAIN THE BRAND — the case 3.6a's
  third check exists for, since no prefix or keyword sweep can reach them:

    calvins-puzzle   23 of 23 typed-3x3 products, NONE containing the brand in the handle
    fanxin            1 of 4   (color-brick-speed-cube)
    qiyi              1 of 21  (bubble-3x3)

  THE CALVIN'S PUZZLE RESULT AGAINST THE ARCHIVE'S THREE MODELS, verbatim handles and titles,
  all carrying `"vendor": "Calvin's Puzzle"`:
    cfop-trainer-cube-cross / -f2l-1 / -f2l-2 / -f2l-3 / -oll / -pll  "CFOP Trainer Cube (...)"
    sudoku-cube-3x3-master / -ultra / -wisdom / -elite,
      3x3x3-sudoku-cube-pro-stickerless-version-5                    "Sudoku Cube 3x3 (...)"
    world-map-3x3, world-map-3x3-flag                                "World Map 3x3 (...)"
    calendar-cube-3x3-v1                                             "Calendar Cube 3x3 V1"
    blind-dice-3x3-cube-v2                                           "Blind Dice 3x3 Cube V2"
    christmas-cube-3x3, 3x3-gradient-cube                            "Christmas Cube 3x3" etc.
    yummy-cheeseburger-3x3-cube, yummy-french-fries-3x3-cube,
      yummy-popcorn-3x3, yummy-hamburger-3x3, yummy-truffle-3x3,
      yummy-waffle-3x3                                               "Yummy ... 3x3"

  AND THE SAME RETAILER'S "Ziina Star" COLLECTION, 14 typed 3x3, all "UV Printed": Calendar,
  World Map (V1, V3, 3D), Chemical Elements (types A and B), Dollar, 100 Dollar, Alien Graffiti,
  Love Heart Graffiti, Colorful Graffiti, Cheese, Milk, Clock & Calendar.

  THE TWO RANGES OVERLAP IN THEME AND DIFFER IN EXTENT. Both carry a World Map and a Calendar;
  both carry food themes (Ziina Star: Cheese, Milk — Calvin's: Cheeseburger, French Fries,
  Popcorn, Hamburger, Truffle, Waffle). Calvin's carries CFOP trainers and five Sudoku cubes,
  which Ziina Star does not. This is RECORDED AS AN OBSERVATION, NOT A CONCLUSION: two vendors
  selling world-map cubes is not evidence that one makes the other's, and the archive has a
  documented false positive from reading retailer taxonomy as lineage.
preservation_note: >-
  Live catalogue queries, not archive captures — a vendor facet has no Wayback equivalent. THE
  ENUMERATION PRESERVES NOTHING ON ITS OWN and this record therefore makes no specification,
  date or identity claim about any product listed. Each page needs capturing before anything is
  load-bearing.
  A NEGATIVE HERE IS WEAK. "Zero products" means the archive's manufacturer id is not this
  retailer's collection slug; it does not mean the brand is unstocked. The sweep was run on
  archive ids precisely because that is reproducible, and its misses are a property of that
  choice.
  QUANTIFIED 2026-09-12, AND THE COST IS LARGE. The P4-9 enumeration lane found that
  TheCubicle's QiYi collection slug is `qiyi-mofangge`, not `qiyi`. Verified: /collections/qiyi
  returns ZERO products at that retailer while /collections/qiyi-mofangge returns 247, of which
  57 are typed 3x3. So for the archive's single most-used retailer and one of its largest
  manufacturers, a sweep keyed on the archive's manufacturer id silently returns nothing at all.
  The caveat above was right in principle; this is what it costs in practice, and it means the
  "returned zero" list in this record must NEVER be read as "this retailer does not stock that
  brand". Any brand on it needs its real collection slug found before the negative means
  anything.
