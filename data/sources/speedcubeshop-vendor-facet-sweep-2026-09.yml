  Tier 2, first-party retailer catalogue structure.
  ESTABLISHES: that this retailer attributes 23 3x3 products to "Calvin's Puzzle" and 14 to
  "Ziina Star", and that 25 of those 37 are undiscoverable by any slug-based method.
  DOES NOT ESTABLISH: that any is a distinct model, who manufactures any of them, or that the
  thematic overlap between the two ranges means anything. A vendor string is retailer
  bookkeeping — P4-10 records that the same field reads "Spin Master" for Rubik's.
