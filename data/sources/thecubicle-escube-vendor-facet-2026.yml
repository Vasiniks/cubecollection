excerpt: |-
  Brand-collection enumeration via the retailer's own product JSON, fetched 2026-09-12. NINE
  products, every one carrying `"vendor": "ESCube"`. Reproducible from the URL above.

  THE FIVE TYPED "3x3", verbatim as handle and title:
    escube-es3-3x3-magnetic-8-magnet-ball-core
      "ESCube ES3 3x3 (Magnetic + 8-Magnet Ball-Core)"
    escube-es3-3x3-magnetic-20-magnet-ball-core-uv-coated
      "ESCube ES3 3x3 (Magnetic + 20-Magnet Ball-Core + UV Coated)"
    escube-air-3x3-8-magnet-ball-core
      "ESCube Air 3x3 (8-Magnet Ball-Core)"
    escube-air-3x3-20-magnet-ball-core
      "ESCube Air 3x3 (20-Magnet Ball-Core)"
    escube-air-3x3-20-magnet-ball-core-transparent-core-edition
      "ESCube Air 3x3 (20-Magnet Ball-Core + Transparent Core Edition)"

  The other four are ESTAR Clocks — "ESTAR Clock (Magnetic)", "(Magnetic + Bearings)",
  "(Magnetic + Bearings, LE)", "(Dubhe Red PiCube SE)" — typed "Clock" by the retailer and
  outside RESEARCH_SPEC 2.4's scope. Listed so the enumeration is complete.

  FOUR OF THE FIVE ARE CONFIGURATIONS THE ARCHIVE ALREADY HOLDS, across its two ESCube models.
  The fifth is not:

  THE TRANSPARENT CORE EDITION, in full. Product id 7770868940883, handle
  escube-air-3x3-20-magnet-ball-core-transparent-core-edition, vendor "ESCube", product_type
  "3x3", created 2025-12-03. One purchase option: "Stickerless", SKU 3KR2_1_153, 22.99 USD.
  Tags: "Availability_Available", "Color_Stickerless", "Manufacturer_ESCube".

  Description, verbatim: "The ESCube Air 3x3 (20-Magnet Ball-Core + Transparent Core Edition) is
  an innovative 3x3 designed for speedcubers seeking next-level performance and visual
  excitement. THIS SPECIAL EDITION FEATURES A STUNNING TRANSPARENT CORE WITH VISIBLE INTERNALS —
  highlighting its advanced engineering while adding a unique aesthetic appeal to your
  collection. Engineered with a robust 20-magnet ball-core system and double-layer magnetic
  force, the ESCube Air delivers ultra-smooth and stable turning, precise alignment, and
  effortless corner cutting. Adjustable tension and compression settings allow for fully
  customized feel..." (Emphasis marks the clause this record is cited for; the wording is the
  retailer's.)
preservation_note: >-
  Live Shopify collection JSON only, captured during the Internet Archive's day-long outage and
  flagged for re-verification.
  FLAG RESOLVED 2026-09-12. CDX recovered and was re-queried for this URL; it returns an EMPTY
  result set, while a control query against a known-archived URL in the same minute returned
  its capture, so CDX was answering. `/collections/<brand>/products.json` endpoints are
  parameterised storefront API paths and the Wayback crawler does not appear to collect them at
  all — which is a general limitation of preserving VENDOR-FACET enumerations, not a fact about
  ESCube. The excerpt is the preservation, permanently rather than provisionally, and it
  reproduces the enumeration in full. Nothing further to retry.
