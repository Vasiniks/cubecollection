reliability_note: |-
  Tier 2, first-party retailer catalogue structure plus one product's own JSON.
  ESTABLISHES: that TheCubicle attributes nine products to ESCube, five of them 3x3; that four of
  those five are configurations the archive already records; and that a fifth exists — an ESCube
  Air with a TRANSPARENT CORE, sold stickerless, alongside the 20-magnet ball core.
  DOES NOT ESTABLISH: a release date, any weight, any dimension, or that this is ESCube's whole
  range — it is ONE retailer, and ESCube's own site was not reached this pass. The four ESTAR
  Clock products confirm ESCube makes non-3x3 puzzles, which bears on how complete a 3x3-only
  reading of this brand can be.
