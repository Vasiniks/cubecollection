reliability_note: |-
  Tier 2, first-party retailer description and spec table. "It solves some small issues that were present in the V2 like replacing the rivets with screws" is direct, explicit evidence of a genuine mechanical change from Tornado V2 (rivets to screws), not merely a marketing version bump, and explicit succession language ("issues that were present in the V2"). `size_mm: 55.5` differs from V2's 55.0mm.
