excerpt: |-
  Product Description: "The X-Man Tornado V3 M is QiYi's new flagship 3x3 speedcube. This puzzle has amazing performance and easy customization. X-man has released 3 versions, introducing core magnets and maglev tech to the Tornado line. It solves some small issues that were present in the V2 like replacing the rivets with screws and allowing the center caps to fit from any orientation. The improved mechanism gives a more cohesive, smooth feel when turning." Product Specifications: Manufacturer X-Man Designs; Type 3x3 Speed Cubes; Gross Weight 233g; Dimensions 55.5mm; Magnets Magnetic; Item Weight 69.0g.
