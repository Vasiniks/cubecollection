# Pass 2.6 (Agent E, lost-lanes recovery). Resolves the "Dayan Crazy Cube" and "Dayan Gem Cube"
# names in DaYan's own tier-1 official 2013 site (dayancube-official-2013), which were flagged
# by an earlier pass as never chased. Both turn out NOT to be 3x3x3 puzzles. Also documents
# several further DaYan novelty-shape SKUs found in the full thecubicle-dayan-products-
# prefix-2026 sweep and checked for 3x3x3-ness, all of which are likewise out of this
# archive's scope.
