excerpt: |-
  Two CDX prefix enumerations of the MANUFACTURER'S OWN storefront, run 2026-09-11:
  gancube.com/products/gan-356-i and gancube.com/products/gan356. 16 distinct paths
  combined, neither truncated. Reproducible with `npm run wayback -- prefix
  gancube.com/products/gan-356-i --limit 100` and the same for gan356.

  The distinct product paths, verbatim:

    gan-356-i
    gan-356-i-carry-s-magnetic-puzzle-cube
    gan-356-i-carry-smart-magic-cube
    gan356
    gan356-air-m-3x3-advanced-puzzle-cube
    gan356-i-carry-2-cube-set-10-years-grand-gift-set
    gan356-i-carry-2-puzzle-cube-for-pros
    gan356-i-carry-4-smart-cube
    gan356-i-carry-4-smart-cube-chinese-new-year-edition
    gan356-i3-puzzle-speed-cube
    gan356-m-e-3x3-magnetic-speed-cube
    gan356-m-e-cube-set-10-years-grand-gift-set
    gan356-m-e-golden-chinese-new-year-edition
    gan356-m-e-golden-lunar-new-year-edition
    gan356-m-e-minions
    gan356-maglev-3x3-magnetic-speed-cube

  WHAT THIS ESTABLISHES FOR gan-356-i. Exactly ONE path corresponds to the base first-generation
  smart cube: `gan-356-i`. No coated, edition or configuration sibling of it exists under either
  slug form on GAN's own site. The other `gan-356-i*` paths are the i Carry and i Carry S, which
  are separate models this archive already holds, not configurations of the base i.

  WHY THAT IS A RESULT AND NOT A FAILED SEARCH. The same two sweeps return FIVE named editions of
  the 356 M-E alone (golden Chinese New Year, golden Lunar New Year, Minions, the 10-years gift
  set, and the base) and two editions of the i Carry 4. GAN publishes editions as separate paths
  when it has them, so a single path for the base i is a measurement, not silence.
