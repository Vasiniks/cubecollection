excerpt: |-
  Title: "ShengShou YuFeng 3x3 M (Magnetic Core) – TheCubicle". Price: "$19.99" (Stickerless
  Bright, the only option offered). Product Description: "The ShengShou YuFeng M is a new
  flagship 3x3 that features a magnetic core, piece feet magnets, and adjustable tension system.
  Everything can be tuned by hand! If you're looking for something a bit out of the mainstream
  but with all the features, look no further!" Product Specifications: Manufacturer ShengShou;
  Type 3x3; Added 2023-01-05; Gross Weight 223g; Dimensions 56.0mm; Magnets: Magnetic; Item
  Weight 76.2g.

  A single customer review (Michael W., United States) adds first-hand detail not in the
  manufacturer copy: "ShengSo is calling this a Maglev cube when it's nothin like what Moyu,
  Gan, or Qiyi has given us. When I got this cube and shortly found out that this was not
  Magleved I posted about it on Facebook and taged Phil. After he saw my post this cube's info
  was changed on this site to remove the Maglev title." This corroborates the URL slug's
  "-magelev" fragment as a discarded marketing claim, not an actual MagLev mechanism — the
  product is magnetic-core, not MagLev, contrary to what its own retailer URL still implies.
  The same review also names sibling "YuFeng 4x4 and 5x5" as existing cross-category products.
