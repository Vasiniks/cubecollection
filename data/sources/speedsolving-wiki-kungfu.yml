excerpt: |-
  "KungFu (Chinese name: YuMo 御魔) is a Chinese puzzle company based in Guangzhou. They began
  releasing cubes in 2016." Infobox: "Founded: unknown / Location: China / Years Active:
  2016-present / Areas served: Worldwide." Products listed: "KungFu CangFeng, KungFu JuQue,
  KungFu QingHong" (4x4 and 3x3 models) and others, including the 3x3s "KungFu QingHong" and
  "KungFu LongYuan" (described as "a budget cube from KungFu") and the 2x2 "KungFu YueHan".
  "The Chinese name YuMo (御魔) is a combination of the words Control and Magic... The label
  'KungFu' is used to identify the brand internationally."
