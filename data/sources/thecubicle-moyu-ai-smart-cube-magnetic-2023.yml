reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that a magnetic configuration of the MoYu AI Smart Cube was sold, stickerless, and
  that it was sold as one of at least two versions distinguished by magnetisation.
  DOES NOT ESTABLISH: the magnet layout — "Magnetic" and "the magnetic version" are all this page
  says, and neither names core, corner or edge placement — nor a release date, a mass, or MoYu's
  own name for the configuration.
