reliability_note: |-
  Tier 2, first-party retailer listing, non-US (China-based, English-language storefront),
  independent of TheCubicle. Confirms size (57mm, matching TheCubicle's 57.0mm exactly) and
  gives a close, non-identical weight figure (94.0g vs TheCubicle's 95g Gross Weight) — treated
  as ordinary catalogue rounding variance, not a genuine disagreement, per the same convention
  already applied to cyclone-boys-feiwu-original's 1mm size gap. The structured "Model:ShuangRen"
  field (without "II") on an otherwise "ShuangRen II"-titled listing is read as a static
  template field lagging the product name, a retailer templating quirk, not evidence the
  retailer considers this the same generation as the original.
