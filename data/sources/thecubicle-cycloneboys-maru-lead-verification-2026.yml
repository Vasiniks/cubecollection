excerpt: |-
  Two CDX prefix enumerations run 2026-09-09: thecubicle.com/products/cyclone-boys (37
  distinct URLs) and thecubicle.com/products/maru (38 distinct URLs). Neither truncated.
  Reproducible with `npm run wayback -- prefix thecubicle.com/products/cyclone-boys --limit 200`
  and the same for maru. The unhyphenated form `cycloneboys` returns one bare stub, so the
  hyphenated form is the right one for this brand - the opposite of the GAN and Monster Go lines,
  which is why the form has to be checked per brand rather than assumed.

  ALL SIX CYCLONE BOYS LEADS VERIFIED as real TheCubicle product paths:

    cyclone-boys-3x3-feihong-55mm
    cyclone-boys-3x3-feixuan-56mm
    cyclone-boys-3x3-jisuzhifeng-57mm
    cyclone-boys-3x3-jisuzhiyun-57mm
    cyclone-boys-3x3-xuanfeng-57mm
    cyclone-boys-feiku-3x3-tiled

  BOTH MARU MINI LEADS VERIFIED, and these two are also live at three retailers today
  ("Maru Mini 3x3 (30mm)", "Maru Mini 3x3 Keychain Cube"):

    maru-mini-3x3-30mm
    maru-mini-3x3-keychain-cube

  NOT FOUND AT THIS RETAILER: no path for "Maru ShenLan Luminous" or "Maru Maze". The Pass 3
  report cites cubezz product ids for both - Buy-3972/3981/3983 for ShenLan Luminous (2015
  captures) and Buy-4252/4261 for Maze - so their evidence is a different retailer and this sweep
  neither confirms nor contradicts them. It records a checked negative at ONE retailer, nothing
  more. The report also describes Maru Maze as a STICKER product, which would put it out of 3x3
  scope entirely; that is a scope question this record does not settle.

  INCIDENTAL AND MATERIAL TO P4-9: the same sweep returns FOUR Cyclone Boys Metallic 3x3 paths -

    cyclone-boys-metallic-3x3
    cyclone-boys-metallic-3x3-m
    cyclone-boys-metallic-3x3-m-gradient
    cyclone-boys-metallic-3x3-m-macaron

  - which reinforces the P4-9 adjudication of cyclone-boys-metallic-3x3, one of the archive's
  three deliberate ZERO-MODEL families, concluded as "'Metallic' is a finish treatment, not a
  model line". Four separately-pathed products is a harder fact for that conclusion than the two
  the adjudication already had.
