reliability_note: |-
  Tier 2, first-party retailer listing, independent of TheCubicle, cubezz.com, LighTake, and
  SpeedCubeShop. This is the clearest single-sentence statement found by this investigation of
  the full succession chain: JieYun is named as an improvement over "its predecessors (GuanYing
  and Shuangren)" — both named explicitly, in that order, by an independent Australian
  retailer, corroborating (without being copied from) TheCubicle's own narrower "assembly
  similar to that of the FangShi GuangYing" framing (thecubicle-fangshi-jieyun). Read plainly,
  this retailer's phrasing treats the whole ShuangRen-GuangYing-JieYun sequence as one lineage
  rather than asserting a single, exclusive immediate parent — it does not by itself resolve
  whether GuangYing specifically (rather than ShuangRen) is JieYun's most immediate design
  predecessor, a distinction this source does not draw as finely as TheCubicle's copy does.
