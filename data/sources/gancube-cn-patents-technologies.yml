excerpt: |-
  "TECH | GES — The leading tech GAN Elasticity System (GES+), which consists of patented
  numerical IPG and gan tension nut (GTN). The 0.6/0.8/1.0 3 gear distance, with 4 groups of
  elastic force, to create 12 typical numerical mode, tuning elasticity becomes so easy and
  accurate. Screw end needle-clip, lock on the nuts."

  "TECH | GMS — Benefitted by the invention of GAN Magnetic System, magnet strengths can be
  easily exchanged for the first time. The GMS consists of patented magnet slots and flash
  magnet capsules, including 3 sets of magnet capsules and one non-magnet capsule. Within 30
  seconds, you can exchange the magnet strength only by hand."

  Also describes a "2nd Generation Honeycomb" contact-surface design and states GAN led
  "positive 55°, reverse 30° corner cutting" as a speedcube-industry standard (a comparative/
  superlative claim, tier 4, not relied on as a specification here).

  Site navigation lists a "Limited Edition" category including (partial, as captured): Flora
  Blue, Love Pink, Ever Green, Crystal Blue, Vita Cube, Antique Rhyme, GAN11 Kun, GAN12
  Cheering, GAN12 Chan, GAN13 KUNLUN, GAN13 Coloré, GAN14 Maglev Galaxy, and further entries not
  individually enumerated in this capture.
