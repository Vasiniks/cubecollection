excerpt: |-
  Product Description: "The MsCube MS3L 3x3 (Enhanced) is a novel new 3x3 design by MsCube. This
  puzzle features a spiderweb pattern on the contact surfaces, swappable center/core pieces to
  adjust tension, a compression adjustment under each center cap, and the enhanced versions has a
  brand new magnetic layout that has magnets in the feet of the corners and edges. This version
  also has transparent blue corner stalks and torpedoes." Product Specifications: "Manufacturer:
  MsCube / Type: 3x3 / Added: 2021-09-07 (catalogue-migration-era field, not used for dating) /
  Gross Weight: 150g / Dimensions: 56.0mm3 / Magnets: Magnetic / Item Weight: 76.0g." A customer
  review dated to this capture window states directly: "Liked the V1 better ... bought this
  because I thought it'd be a lot of the same feel with colored internals ... The magnets are
  weaker" — read as corroboration (not sourcing, per this archive's standing rule on
  user-generated content) that Standard and Enhanced are perceived by buyers as differing
  configurations of the same design, not a "V1"/"V2" model generation (no source anywhere this
  pass calls Standard "V1" in its own official naming).
