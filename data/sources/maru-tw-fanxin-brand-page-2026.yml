reliability_note: |-
  A Taiwanese specialist cube retailer's own brand taxonomy. Tier 2.

  NAME. 泛新 is FanXin's Chinese name per this store's brand entry. NOTE ON A FORM NOT ADOPTED:
  a search-engine snippet for this page rendered the name 泛鑫, but 泛鑫 appears ZERO times in
  the page as actually loaded, so it is not recorded. A snippet is not the page.

  BEARS ON THE HUDONG CONTRADICTION, and this is the substantive part. 互動 (simplified 互动)
  is the ordinary Chinese word for "interactive", and "HuDong" is its pinyin. This store files
  三 products named "光三階 ... 互動方塊" ("Light 3x3 ... Interactive Cube") under the
  manufacturer 泛新FanXin. So a SECOND retailer, independently of TheCubicle, treats HuDong as a
  FanXin product line rather than as a manufacturer.

  That agrees with TheCubicle's PROSE ("The FanXin HuDong is a huge step for FanXin hardware")
  and disagrees with TheCubicle's structured "Manufacturer: HuDong" field. It does not RESOLVE
  the contradiction — both are retailer taxonomies, not first-party statements, and a retailer
  can file a sub-brand under its parent as a convenience. It does make the prose reading the
  better-corroborated one, and it explains how the error arises: 互動方塊 reads like a brand.

  THE THREE TIERS CORROBORATE THE ARCHIVE'S VARIANT STRUCTURE. This store lists exactly three
  configurations of the Light 3x3 — 標準版, 旗艦版, 至臻版 (standard / flagship / finest) — and
  the archive independently holds exactly three variants of fanxin-hudong-3x3 (standard,
  flagship-uv, ultra-maglev-uv), sourced from TheCubicle. The COUNT and ORDER correspond; the
  tier names are recorded verbatim above rather than mapped one-to-one onto the archive's names,
  because this page states no coating or core detail that would justify equating them term by
  term.

  IT ESTABLISHES NOTHING ABOUT COUNTRY OR OWNERSHIP. A Taiwanese store selling the brand says
  nothing about where FanXin is based or who owns it.
