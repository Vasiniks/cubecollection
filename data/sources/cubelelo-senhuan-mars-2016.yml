reliability_note: |-
  Tier 2, first-party retailer listing, non-US (India). Captured 2016-10-31, with the
  product's own status field reading "Pre-Order" — consistent with this being at or very near
  this product's actual introduction, nearly three years before TheCubicle's own earliest
  found capture (thecubicle-senhuan-mars-3x3-2019, crawled 2019-08-24). The description prose
  ("MARS is the first product of SenHuan brand, which uses [a] unique ultra-small inner circle
  design...") is near-identical in substance to TheCubicle's own description and most plausibly
  both derive from the same manufacturer-supplied copy — per RESEARCH_SPEC §3.2, this is NOT
  treated as independent corroboration of the description's content, only of the product's
  existence and this earlier date. The page's own "Brand: MoYu" categorisation field is noted,
  not acted on, per the same caveat recorded on cubelelo-mohuanshousu-chufeng-2016.
