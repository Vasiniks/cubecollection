excerpt: |-
  Product Description: "The GuoGuan YueXiao EDM is the latest 3x3 released by GuoGuan. This
  puzzle features fantastic innovations like the world's first adjustable (not interchangeable)
  magnetic system. This, mixed with the ultra-lightweight feel and top-of-the-line performance
  are sure to make for a great 3x3." Structured "Product Specifications": "Manufacturer:
  GuoGuan / Type: 3x3 / Added: 2019-06-19 / Gross Weight: 198g / Dimensions: 55.5mm³ / Magnets:
  Magnetic / Item Weight: 72.0g." A companion listing, "GuoGuan YueXiao E" (same Added date,
  189g gross weight, no `Magnets` field), is described on its own page as "the unmagnetized
  version of the YueXiao EDM ... retains the magnetic capsules found in the EDM, there are
  simply no magnets in them" — a variant-level (magnetized/unmagnetized) distinction, not a
  separate design, per DATA_MODEL §4.1.
