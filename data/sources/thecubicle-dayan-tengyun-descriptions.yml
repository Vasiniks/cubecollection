excerpt: |-
  DaYan TengYun M 3x3, captured 2020-09-27 (https://web.archive.org/web/20200927id_/https://www.thecubicle.com/products/dayan-tengyun-m-3x3):
  "The DaYan TengYun M is a smooth, 55 mm 3x3 speed cube that is one of the quietest 3x3's on
  the market. It has a unique design and feel that sets it apart from other modern 3x3's."
  "Comes with: DaYan TengYun M 3x3, Two extra sets of springs (standard and strong)."

  DaYan TengYun V2 M 3x3, captured 2020-09-21 (https://web.archive.org/web/20200921085730id_/https://www.thecubicle.com/products/dayan-tengyun-v2-m-3x3):
  "The DaYan TengYun V2 M is an exciting new magnetic 3x3 speed cube from classic manufacturer
  DaYan. Weighing in at a modest 83g, the TengYun V2 M features three magnetic settings that
  you can adjust by rotating a plate, as well as adjustable elasticities and tensions without
  having to switch out any components. Using DaYan's new adjustment tool, you can choose from
  four tensions and four elasticity settings. The TengYun V2 M's edge pieces have a similar
  wave-like design akin to the GuHong V3 M."

  DaYan TengYun V3 M 3x3, captured 2023-01-31 (https://web.archive.org/web/20230131032453id_/https://www.thecubicle.com/products/dayan-tengyun-v3-m-3x3):
  "The DaYan TengYun V3 M 3x3 is a great leap forward for DaYan's 3x3 design. This one uses
  tension/compression nuts that attach directly to the core. There are over 60 unique settings
  on the DaYan TengYun V3 M."
