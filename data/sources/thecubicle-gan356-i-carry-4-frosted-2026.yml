  .../products/gan356-i-carry-4-3x3-frosted-2026-year-of-the-horse-edition. Shopify product id
  7867597029459. Price 34.99 USD.

  Storefront listing carrying both at once, verbatim, from the first page's own navigation:
  "GAN356 i Carry 4 3x3 (Frosted, 2026 Year of the Horse Edition) $34.99 / GAN356 i Carry 4 3x3
  (Frosted) $34.99".

  THEY ARE TWO PRODUCTS, NOT ONE RENAMED. The product ids differ (7867596046419 against
  7867597029459), each page declares its own canonical URL, and the storefront offers both
  simultaneously at the same price. That test is applied here deliberately: the YJ Appari pair
  examined the same day looked like two products by their titles and proved to be ONE Shopify
  product renamed, with an identical product id and SKU.
preservation_note: >-
  Both captures fetched 2026-09-12 with content-encoding negotiation.
  WHAT THESE CAPTURES DO NOT CONTAIN, stated so nobody re-reads them expecting it. TheCubicle's
  2026 storefront is a JavaScript-rendered application, and neither capture preserves a product
  description or a specification table in retrievable form — no dimensions, no weight, no magnet
  description, no "Added" date. Title, canonical URL, product id, price and colourway option are
  the whole of the evidence. That is enough to establish that each configuration was sold and
  which is which; it is not enough for any specification, and none is attested from here.
