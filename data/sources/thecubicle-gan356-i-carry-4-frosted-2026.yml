reliability_note: |-
  Tier 2, first-party retailer product pages.
  ESTABLISHES: that a frosted-finish configuration of the GAN356 i Carry 4 was sold as a regular
  product; that a second, separate product paired that same frosted finish with a 2026 Year of
  the Horse edition; and that both were offered concurrently in early 2026 at 34.99 USD.
  DOES NOT ESTABLISH: any specification, any release date, or GAN's own naming — "Frosted" is
  the retailer's product-title suffix. It also does not establish that the frosted finish is
  exclusive to these two products rather than standard across the i Carry 4 line.
