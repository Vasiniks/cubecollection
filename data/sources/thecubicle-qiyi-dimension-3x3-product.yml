reliability_note: |-
  Tier 2, retailer product page with structured Shopify fields.

  ASSESSED AGAINST RESEARCH_SPEC 2.1/2.4, per P4-2's own recommendation. This reads as an
  ordinary-sized (56mm), standard-mechanism 3x3 whose only stated distinguishing feature is a
  surface treatment — "embedded plastic outlines instead of normal stickers" — which is closer
  to WCA regulation 3d's "colored tiles" category than to a shape or size departure. Nothing
  found suggests this is a shape mod, an oversized novelty, or a miniature: the retailer's own
  `product_type` is the plain "3x3" (contrast qiyi-fluffy-3x3's "Shape Mods", fetched the same
  session). On that basis this looks like an ordinary in-scope 3x3, not a candidate for
  `reference_only` under either reading of P4-16.

  WHAT THIS DOES NOT SETTLE. No existing QiYi model in this archive is described with an
  "embedded plastic outline" surface, so this does not read as an unattached configuration of a
  model already held — it reads as its own named product ("Dimension") with no frozen model to
  attach to. Under DATA_MODEL §4.2 a distinct piece-level surface treatment sold as its own
  named product, with no existing model it configures, is model-shaped evidence, not
  variant-shaped evidence. NO MODEL IS CREATED FROM THIS RECORD — the taxonomy is frozen at
  269 models — this source only preserves the evidence and the scope assessment for whoever
  next opens the QiYi model set.
