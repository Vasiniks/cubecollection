excerpt: |-
  Product Description: "The DaYan Bermuda series features a variety of common 3x3 puzzles and
  shape-mods but with certain parts 'bandaged' to make each of them a unique challenge to
  solve." TheCubicle's own prefix carries this series in at least ten named colourway/theme
  variants (a "barrel", eight planet names Earth/Jupiter/Mars/Mercury/Neptune/Saturn/Uranus/
  Venus, two "house" variants, and "sunflower") — read as decorative colourway naming across a
  shared bandaged-3x3 design, the same pattern already used for the Bermuda themed
  variants at Cubelelo (cubelelo-dayan-products-prefix-2026). Independently corroborated at
  Cubelelo under its own retailer naming ("dayan-bermuda-black-earth" etc., 2020 captures) —
  two independent retailers, no naming collision. This is a bandaged 3x3x3 puzzle series,
  directly comparable in kind to the already-admitted calvins-bandaged-3x3-maze-300 family
  precedent for how this archive treats bandaged-cube lines.
