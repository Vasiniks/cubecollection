reliability_note: |-
  Tier 2, first-party retailer catalogue/product-page evidence from three genuinely
  independent publishers (TheCubicle US, SpeedCubeShop US, Cubelelo India) across three
  separate domains, SKUs, prices, and capture years (2016, 2016-2017, 2019-2020) —
  satisfies DATA_MODEL rule 9's independent-tier-2-source bar for `confirmed` product
  EXISTENCE. The "ShengShou's first stickerless cube" DESCRIPTIVE CLAIM itself is near-
  identical in wording between SpeedCubeShop (2016) and TheCubicle (2020, per
  thecubicle-shengshou-other-3x3-lines-2026) and again nearly identical when TheCubicle
  restates it for the 2x2 sibling — consistent with a single underlying manufacturer/OEM
  description translated and republished by multiple retailers (RESEARCH_SPEC 3.2: "two
  listings with identical wording are one source"). Confidence on the SIGNIFICANCE claim
  itself ("first stickerless cube") is therefore recorded no higher than `probable`, while
  confidence on bare product EXISTENCE, across genuinely distinct listings, is `confirmed`.
  The two weight figures (100g TheCubicle vs 119 SpeedCubeShop, units unstated on the latter)
  are left as an unresolved discrepancy rather than reconciled by assumption.
