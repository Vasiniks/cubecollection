excerpt: |-
  **SpeedCubeShop** (http://speedcubeshop.com/products/shengshou-rainbow-3x3x3, capture
  2016-01-08, page text fetched directly this pass): "ShengShou Rainbow 3x3x3 is ShengShou's
  first stickerless cube. This item is a bargain for the amount of performance that you get."
  Listed price $5.95. Structured product JSON on the page gives a `weight` field of 119
  (unit not stated on-page; TheCubicle's later, 2020 capture states "Gross Weight 100g" for
  the same nominal product — the two figures are recorded here as a genuine, unresolved spec
  discrepancy, not silently reconciled). Image asset carries a cache-buster timestamp
  corresponding to approximately September 2015; this is a CDN asset-upload signal, not a
  dated release statement, and is NOT used to set any date field per the Pass 3 admission
  policy section 3 — recorded only as a lead that the product may have first circulated at
  this retailer some months before the earliest crawled page.

  **Cubelelo** (India; non-US/English retailer check per RESEARCH_SPEC 3.6a), found via a
  fresh CDX query of cubelelo.com for "shengshou-rainbow" (not covered by
  cubelelo-shengshou-products-prefix-2026's earlier unscoped sweep, whose excerpt does not
  mention Rainbow at all): two distinct captures,
  `cubelelo.com/classic-cubes/3x3/shengshou-rainbow-3x3-stickerless` (2016-04-08) and
  `cubelelo.com/2x2/shengshou-rainbow-2x2-stickerless` (2017-08-23, also
  `/new-arrivals/shengshou-rainbow-2x2-stickerless`, 2017-06-13). The 2016-04-08 3x3 page could
  not be re-fetched this session (Wayback returned a connection failure on retry); its
  existence, URL, and date rest on the CDX index record itself, which RESEARCH_SPEC 3.5
  permits as evidence not reducing to page text. This is a third, independent, non-US/English
  publisher corroborating the 3x3, and independently corroborates the 2x2 sibling product
  TheCubicle also carries.

  **TheCubicle "Rainbow 2x2"** (https://www.thecubicle.com/products/shengshou-rainbow-2x2,
  capture 2019-07-16, page text fetched directly this pass): "ShengShou Rainbow 2x2 is
  ShengShou's first stickerless 2x2 cube. It delivers solid cubing performance and a vibrant
  stickerless color scheme while coming at a very low price point." Spec table: Manufacturer
  ShengShou; Type "2x2"; Dimensions 50.0mm. This confirms "Rainbow" as a cross-puzzle-size
  ShengShou naming convention (2x2 and 3x3, at minimum), the same naming pattern already
  documented for Legend/Mr. M/Wind/Aurora across the archive's seven pre-existing ShengShou
  families. A CDX prefix check of thecubicle.com/products/shengshou-rainbow found no 4x4/5x5/
  Megaminx/Pyraminx Rainbow SKU; a separate "shengshou-rainbow-ball" product (first capture
  2022-10-01) is a distinct, non-cube novelty item (a "Rainbow Ball" puzzle) sharing the brand
  word, not a 3x3x3/2x2 cube sibling — noted for completeness, not treated as part of this
  cube line.

  **Structural naming check.** A full CDX enumeration of thecubicle.com/products/shengshou*
  (288 distinct URLs, run fresh this pass) found no "-rainbow" suffix appended to any of the
  seven other named ShengShou 3x3 family slugs (e.g. no "shengshou-aurora-3x3-rainbow" or
  similar) — "Rainbow" only ever appears as its own top-level product name
  (shengshou-rainbow-2x2/-3x3/-ball), structurally identical to how Aurora, Wind, Legend,
  Mr. M, FangYuan and Pearl are each named, and structurally distinct from this retailer's own
  variant-suffix convention (e.g. "shengshou-aurora-3x3-unstickered", "shengshou-legend-3x3-
  unstickered", "shengshou-4x4-v5-unstickered") for marking a stickerless configuration of an
  existing named line. This is used as evidence against reading "Rainbow" as a stickerless
  *variant slug* of another ShengShou family, and for reading it as its own distinctly-named
  product line.
