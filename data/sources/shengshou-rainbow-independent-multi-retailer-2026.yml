# P26-5 Agent C (ShengShou Crazy/Rainbow adjudication). Independence and cross-size-naming
# corroboration for ShengShou Rainbow 3x3, run specifically because
# thecubicle-shengshou-other-3x3-lines-2026 and the original Pass 2 finding
# (research/notes/models/global-pass2-families.md) both rest Rainbow's evidence on a single
# publisher (TheCubicle) plus one undated tier-4 wiki line. This source records three
# independent CDX findings: SpeedCubeShop's own 2016 capture (with page text fetched), a
# Cubelelo (India, non-US/English retailer per RESEARCH_SPEC 3.6a) capture pair from
# 2016-2017, and TheCubicle's own "Rainbow 2x2" sibling product — none of which any existing
# source record cites.
