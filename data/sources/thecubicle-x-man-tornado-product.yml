  Tier 2, first-party retailer description. "the first cube from X-Man Designs" is direct, explicit evidence this is the family's earliest (V1) design generation. `size_mm: 56.1` is taken from this table. Note: this page's own "an individual by the name of X-Man" phrasing is the same characterisation later corrected by qiyitoys-company-history (X-Man Design was founded by QiYi's own chief designer); not relied on here for anything beyond product identity and existence.
