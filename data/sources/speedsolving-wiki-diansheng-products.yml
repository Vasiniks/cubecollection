excerpt: |-
  Page-level summary: "DianSheng are a manufacturer formerly known for their Type-E 3x3x3 cube
  and other puzzles, but are now known for their 8x8-11x11 magnetic puzzles and for owning the
  Mscube line of puzzles." This is the first and only source found this pass directly stating
  the DianSheng/MsCube relationship — closing the lead flagged in this session's brief
  ("MsCube → reported as a DianSheng line but never sourced").

  3x3 section: "3x3x3 Cube 'Type-E' (Released c. 2008) ... Type E cubes are known as Diansheng
  (or DS) cubes. Out of the box they were quite bad, but after lubing with silicone they became
  much better ... Because of their very light weight, and very loose, smooth turning; DS 3x3x3's
  were often used in One-Handed cubing." "DianSheng Stickerless 3x3 — A very bad 3x3 from when
  Diansheng wasn't a reputable cube company. YouTuber Cubey Time used this puzzle for his very
  popular 'Will It Lube?' series." "DianSheng 3x3 M — A recent release from DianSheng. This a
  magnetized 3x3 that, much like its 2x2 counterpart, isn't all that great with cubes like the
  MoYu RS3M competing with the likes of GAN puzzles. This puzzle also has weird center caps that
  are reminiscent of the Rubik's first 'speed cube'." "DianSheng Solar S3M 3x3 — The latest
  flagship release from DianSheng. Very similar to the GAN 356X, with a scale pattern on the
  cubes and black internals with stickerless caps. This puzzle has interchangeable center caps
  that are the same as the DianSheng 3x3 M."
