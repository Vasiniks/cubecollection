excerpt: |-
  Product Description, verbatim as far as the capture's meta description preserves it:
  "Celebrate the Year of the Wood Snake with this adorable and festive 3x3 cube! This cube is a
  vibrant addition to your collection, perfect for honoring Chinese New Year. It comes with
  custom stickers adorned with charming designs, including a playful, cute snake mascot
  symbolizing wisdom and prosperity, surrounded by tra[ditional...]"

  Product Specifications table: "Manufacturer: GAN". NO item weight and NO dimension appear on
  this page — unlike the Brainstorm Voyage edition of the same model, which states both. That
  absence is recorded rather than filled from the sibling: restating another page's figures as
  though this source carried them is what rule 48 exists to catch.

  WHAT DIFFERS. Custom stickers on a Year-of-the-Wood-Snake theme, plus festive presentation. No
  mechanical difference from the base GAN356 ME is claimed.

  ON THE YEAR. "Year of the Wood Snake" is the 2025 zodiac year and the product name says 2025,
  so the edition's occasion is datable even though the page states no release date. The
  distinction matters: the occasion is 2025, which is not the same claim as "this product was
  released in 2025", and only the former is supported here.
