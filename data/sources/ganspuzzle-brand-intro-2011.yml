reliability_note: "Machine-translated working sense, original retained verbatim above per RESEARCH_SPEC §3.6/3.7: 'GANSPUZZLE (Ganyuan) is an independent brand founded by veteran domestic speedcuber Jiang Ganyuan. Established in 2010. Committed to independently developing new cube mechanisms, bringing cubers a new experience and better-level products.' First-party self-description of the brand that preceded GANCUBE/GAN, tier 1 for its own founding claim. This 2010 brand-founding date is a different claim from '2014' (GANCUBE Inc.'s stated corporate incorporation, per gancube-cn-about-us-en and gancube-cn-introduction-zh) and from the '2013' copyright-range start found on gancube.com's own earliest archived capture (see gancube-2016-earliest-capture) — three tier-1 GAN/predecessor sources giving three different years for three plausibly different events (brand founding vs. company incorporation vs. an unexplained copyright epoch). Recorded as a disputed candidate rather than adjudicated; see data/manufacturers/gan.yml /founded attestation."
