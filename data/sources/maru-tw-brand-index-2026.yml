reliability_note: |-
  Tier 2: a specialist retailer's own brand taxonomy, structured (each pair is an anchor with a
  manufacturer id, not prose).

  TRADITIONAL CHARACTERS. This is a Taiwanese store, so every Chinese form here is TRADITIONAL.
  Mainland Chinese manufacturers write their own names in SIMPLIFIED characters, and the two
  differ for several of these names (點盛/点盛, 藍藍/蓝蓝, 國冠/国冠, 夢圖/梦图, 奇積/奇积,
  聖手/圣手, 樂方/乐方, 裕鑫 is the same in both). What this source attests is the traditional
  form; a simplified form is the mechanical equivalent, but which form a given company uses of
  ITSELF is a separate question this page cannot answer.

  WESTERN BRANDS ARE TRANSLITERATIONS, NOT NAMES. 魯比克 (Rubik's) and 麥菲特 (Meffert's) are
  Chinese-market renderings of a Western name, not what those companies call themselves. They
  are useful search keys and nothing more, and must not be recorded as though the company chose
  them.

  A RETAILER'S BRAND LABEL IS NOT A COMPANY REGISTRATION. It establishes what this store calls
  the brand, which for a Chinese manufacturer is strong evidence of the common name and no
  evidence at all of the registered corporate entity.
