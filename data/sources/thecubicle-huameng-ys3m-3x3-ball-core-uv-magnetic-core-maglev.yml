excerpt: |-
  Product Description: "The MoYu HuaMeng YS3M is the latest flagship 3x3 release from the
  famous cube company. This puzzle features fantastic corner cutting, adjustable
  tensions/compressions, and a dragon scale pattern to reduce sticking, and is
  designed/endorsed by the 3x3 world record single holder YuSheng Du. This is the Ball-Core UV
  (Magnetic Core + MagLev) version with corner/core magnetization, 25 degrees of magnetic turn
  correction (auto-homing ability), and represents the pinnacle of MoYu 3x3 design. This one
  also has a UV coating or 'Magic Clothes' as MoYu puts it. This gives the outer layer of the
  puzzle a glossy finish which helps with grip and can aid in recognition." Structured
