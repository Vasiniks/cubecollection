  Product Description: "The YueXiao Pro by GuoGuan is the highly-anticipated update to the
  original YueXiao, one of the most iconic cubes of 2016. The YueXiao Pro features a brand new
  mechanism with more internal tracks to help reduce friction and a more rounded corner piece
  design that manages to preserve the anti-corner twisting characteristics of the original
  YueXiao. The YueXiao Pro features slots for magnets to be easily added, but this particular
  variant is not magnetized." Structured "Product Specifications": "Manufacturer: GuoGuan /
