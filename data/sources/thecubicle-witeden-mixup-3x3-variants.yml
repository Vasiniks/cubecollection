excerpt: |-
  Oskar variant (https://web.archive.org/web/20250801151456id_/https://www.thecubicle.com/products/witeden-oskar-3x3x3-mixup):
  "The WitEden & Oskar 3x3x3 Mixup looks on the outside just like any 3x3x3 puzzle with bigger
  outer layers. But the mechanism allows it to be manipulated in many more ways compared to an
  ordinary 3x3x3." Edge-Split variant (https://web.archive.org/web/20250802005751id_/https://www.thecubicle.com/products/witeden-3x3x3-mixup-edge-split):
  "The WitEden 3x3x3 Mixup (Edge-Split) features split edges that can separate when all are
  correctly aligned along the equator. It turns like a typical Mixup puzzle, but adds a new
  layer of complexity through its hidden edge mechanics." 30-Degree Turn variant
  (https://web.archive.org/web/20250801151223id_/https://www.thecubicle.com/products/witeden-3x3x3-mixup-30-degree-turn):
  "The WitEden 3x3x3 Mixup (30-Degree Turn) turns like a standard 3x3 puzzle until you figure
  out how to unlock the inner layers." All four pages' Product Specifications table reads
  "Manufacturer: WitEden".
