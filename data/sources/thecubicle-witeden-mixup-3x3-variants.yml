reliability_note: "Tier 2, retailer, covering four differently-mechanised variants sharing the
  persisting 'WitEden 3x3x3 Mixup' name. The 'Oskar' credit line names Oskar van Deventer, a
  widely recognised twisty-puzzle designer, though this pass did not independently verify that
  attribution beyond the retailer's own product title/copy. Each variant (Plus, Edge-Split,
  30-Degree Turn) is described with a genuinely distinct mechanical detail, not a bare
  configuration difference, but all four share the base 'Mixup' turning concept and the same
  manufacturer-declared family name — grouped here as one family per DATA_MODEL's family-level
  test ('a named product line persisting across designs'), with the actual model-vs-variant
  boundary between them explicitly deferred to pass 3. None of these pages' in-page 'Added'
  fields are used as dating evidence, per this pass's standing cross-agent finding on
  TheCubicle's repeating 'Added:' dates; the earliest genuine Wayback crawl timestamp found
  across all four (2020-08-04, for the Oskar variant) is used as the family's 'existed by'
  upper bound."
