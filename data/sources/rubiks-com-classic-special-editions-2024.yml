excerpt: |-
  Rubik's Phantom (rubiks.com/products/rubiks-phantom, captured 2024-06-19): "Thermochromic
  technology reveals the hidden fun in this innovative Cube. Touch the tiles to reveal the
  Phantom's colors with the heat of your touch!"

  Rubik's Crystal (rubiks.com/products/rubiks-crystal, captured 2025-08-31): "This transparent
  3×3 Cube takes you behind the curtain to see how the Cube works as you twist and turn."

  Rubik's Retro (rubiks.com/products/rubiks-retro, captured 2024-06-13): "Launched to
  celebrate Rubik's 50th anniversary, this special edition Rubik's Cube looks and feels like
  it came right out of a time capsule! ... classic boxy edges, slower turning, stickers, gold
  side, and special anniversary logo, presented in a retro plastic display case."

  Rubik's Re-Cube (rubiks.com/products/rubiks-recube, captured 2025-03-03): "The Rubik's
  Re-Cube is the world-famous puzzle made with 100% recycled plastic ... Rubik's Re-Cube is
  the same 3×3 Cube you know and love, created with sustainability as top of mind."

  Rubik's Coach Cube (rubiks.com/products/rubiks-coach-cube, captured 2024-10-05): "It's a
  Rubik's Cube with a simplified solving process designed for first-time solvers ... Your
  Coach Cube starts covered by black, numbered stickers. Follow along to remove the stickers
  and solve! Once you've solved you now have a regular 3×3 Cube to use!"

  Rubik's Impossible (rubiks.com/products/rubiks-impossible, captured 2024-11-02): "The
  Rubik's Impossible is a 3×3 Rubik's puzzle cube with a high challenge level. It's just like
  the classic Rubik's Cube, but it changes colors depending on the angle. The iridescent tiles
  change color when viewed from different angles."
