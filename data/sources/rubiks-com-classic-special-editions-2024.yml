# source: rubiks-com-classic-special-editions-2024
# Six of Rubik's own official product pages for named special/material/commemorative
# treatments of the classic 3x3 mechanism, captured via Wayback and bundled into one source
# record because each states the same underlying fact this record exists to support: that the
# product is "just like the classic Rubik's Cube" with a surface/material/sticker difference
# only, not a distinct mechanism. Used to support the model/variant-boundary reasoning in
# data/families/rubiks-classic.yml's description, not to attest individual per-product
# specifications (that is pass 3/4 work, one source per product at that point).
