excerpt: |-
  ASSEMBLED (product 3743, "...Assembled White", capture 2014-12-27, SKU 43547):
  "Specifications: Color: White / Brand: FS Puzzle / Weight: 82.0g / Cube Size: 54.6 x 54.6 x
  54.6mm / Packing Size: 56.0 x 56.0 x 56.0mm / Packing: Graphic carton." An earlier,
  plainer-named sibling listing (product 3724, "Funs Puzzle Mini ShuangRen 546mm 3x3 Magic
  Cube White", capture 2014-01-10, SKU 66079) gives: "Brand: FS / Type: 3x3x3 / Model:
  ShuangRen / Package Dimensions: 60*60*60mm / Weight: 84g" — same size class, no DIY/kit
  language, read as the same assembled configuration under an earlier SKU/listing.

  DIY KIT (product 3730, "...DIY Kit White", capture 2014-01-10, SKU 39632): "Specifications:
  Brand: FS / Type: 3x3x3 / Model: ShuangRen / Package Size: 190*130*40mm / Weight: 106g /
  Packing: OPP Bag" — a flat-pack parts weight and bag packaging, distinct from the assembled
  configuration's carton/cube-box packing. A later, differently-numbered DIY-kit SKU batch
  (products 4480-4494, "DIY Mini Funs Puzzle ShuangRen 546mm Speed Cube [body colour] Body
  [cap colour] Caps", captures 2015-02 to 2015-04) offers roughly a dozen body/cap colour
  permutations (White/Transparent, Black/Transparent, Pink/White, Pink/Blue, Blue/Black,
  Black/Blue, Blue/Pink, Pink/Transparent, Transparent/Pink, Blue/Transparent,
  Transparent/Blue, plus solid Blue/Transparent/Pink single-colour listings) at 54.6mm each
  (representative capture, product 4480: "Brand: Funs Puzzle (FangShi) / Color: White Body
  Transparent Caps / Size: 54.6*54.6*54.6mm / Weight: 72g", SKU FSDIYWT) — read as stock body/
  cap colour options of one DIY-kit product line, not separate products (anti-explosion; no
  source treats any specific colour combination as a separately named or marketed edition).
