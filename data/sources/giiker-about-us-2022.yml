excerpt: |-
  "GiiKER (derived from 'Geeker') is a technology company with a dedication to the development
  of smart and connected edutainment products... In 2018, we launched the world's first smart
  connected cube - SUPERCUBE(R)... Time Line: 2012 GiiKER team founded / 2014 GiCUBE(R)
  released and birth of the idea of smart cube later on / 2015 First Smart Core prototype came
  out, which can track each center's rotations / 2016 Smart cube product design, first molding
  and user testing / 2017 Puzzle School app released... / 2018 January: Smart cube technology
  and applications presented at Nuremberg toy fair; March: SUPERCUBE(R) i3 released - The
  world's 1st smart cube / 2019 Supercube series presented at CES, New York and Nuremberg toy
  fair. A global leader in developing and manufacturing smart cubes / 2020 More smart chess
  products presented at Nuremberg toy fair, app downloads exceed 15 millions." Page title and
  copyright footer both render the Chinese name "计客" alongside "GiiKER".
