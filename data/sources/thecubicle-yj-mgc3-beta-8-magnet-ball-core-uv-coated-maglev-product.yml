  Product Description: "The YJ MGC3 Beta is the latest 3x3 speedcube from YJ, featuring a brand
  new mechanism and philosophy. Designed by the same mind behind the legendary Alpha Cube, the
  Beta boasts a balanced magnetic feel, great corner cutting, and a wonderfully comfortable
  hand-feel. This version of the Beta has UV coating, maglev for extra speed, and an 8-magnet
  ball core for extra stability." The page's own "Versions" selector lists four sold
  configurations with distinct prices: "Magnetic" ($15.99), "8-Magnet Ball-Core + UV Coated"
  ($21.99), "8-Magnet Ball-Core + UV + MagLev" ($24.99, this page's own default selection), and
  "8-Magnet Ball-Core + MagLev (Limited Edition)" ($29.99). Product Specifications:
