excerpt: |-
  Fetched live 2026-09-11 from the storefront's own product JSON endpoint. Structured tag field,
  verbatim: "Availability_Discontinued, Color_Black, Color_White, Dimensions_57.0,
  Manufacturer_Maru, Type_3x3, Weight Range_90.0-94.9, Weight_93.7".

  "Weight_93.7" IS AN ITEM WEIGHT, and it is what the disputed record was missing. TheCubicle's
  tag taxonomy uses `Weight_` for the product and a separate "Gross Weight" spec-table row for
  the packaged figure — the same distinction this archive enforces through rule 45.

  WHAT THIS RESOLVES. maru-3x3-original carried `weight_g: 141` at `disputed`, between
  TheCubicle's "Gross Weight" of 141g and Cubezz's "Weight (including the packing)" of 84.0g. The
  adjudication note called the ~60g gap "too large to confidently attribute to packaging alone".
  BOTH FIGURES ARE PACKAGED WEIGHTS — Cubezz says so in the field name itself — so the archive was
  comparing two gross weights from retailers who package differently, and the top-level spec was
  asserting one of them as a product weight.
  93.7g sits between them and is consistent with both: TheCubicle adds ~47g of packaging, Cubezz
  reports a lighter package. The dispute dissolves rather than being adjudicated in favour of one
  side.
