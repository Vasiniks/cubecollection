excerpt: |-
  States MoFang JiaoShi (native name 魇方教室, also transliterated 魔方教室, marketed in English
  as "Cubing Classroom") is "a sub-brand of Moyu", founding date "unknown", active
  "2016-present", specialising in beginner-friendly and budget-tier cubes sold worldwide from
  China-based operations. Organises "Meilong" (2x2 through 7x7, Pyraminx and other shapes) as a
  distinct product-line catalogue section within MoFang JiaoShi's own listing, alongside the
  numbered MF/MF2/MF3/RS3M line.

  3x3 PRODUCT SECTION ADDED 2026-09-11 (ledger P4-14), the same repair applied to
  speedsolving-wiki-moyu the same day. The excerpt above preserved only BRAND-level facts -
  native name, parent, active years - while product-level attestations cited this record for MF3
  and MF3RS release dates. Those four /released attestations were already held at `uncertain`,
  correctly, but the evidence behind them lived only on the page. Re-fetched from the
  archive_url already on this record and transcribed verbatim:

  3x3 MF3 The MF3 was released 2016-10-11, it is only available in black and white and I would
  recommend against buying it. MF3S The MF3S was released 2017-02-21. MF3RS The MF3RS was
  released 2016-12-22. The MF3RS is a 3x3x3 cube from MoFang JiaoShi. It is very crispy out of
  the box, and turns fast. It can corner cut well over 45 degrees forwards and about one piece
  reverse. The MF3RS was considered one of the better budget cubes, but was outshadowed by the
  YuXin Little Magic. MF3RS2 The MF3RS2 was released 2017-09-29. It is an improved version of
  the MF3RS but is also more expensive. It had extremely smooth cornercutting, and when
  magnetized, it was able to outperform several flagships. It was stable, but also on the slower
  side. This cube received critical acclaim, as it offered great value. MF3RS3 The MF3RS3 was
  released in December 2018. It is an improved version of the MF3RS2 but is also more expensive.
  It is available in non-magnetic and factory-magnetic. It retained the same smooth
  cornercutting, but had a wider range. The cube had better shades and was faster, but it's
  relatively weak magnets were a problem. RS3M 2020 An updated version of the MF3RS3 released
  mid 2020. It is produced in stickerless only and factory-magnetized. Widely regarded as one of
  the best budget 3x3s, competing with even the most expensive flagship puzzles. For more
  information, see MoYu . RS3M 2021 (MagLev) An updated version of the RS3M 2020 featuring
  MagLev instead of springs, allowing for less friction and removing spring noise (a common
  problem in the 2020 version). For more infrormation, see MoYu . Super RS3M (2022) An updated
  version of the RS3M 2021, featuring 3 versions: Magnetic, Maglev, and Ball core, Ball core
  uses corner to core magnets to help stabilize and creates an auto-aligning feel. Added dragon
  scale on contact surfaces to help spread lubricant and make the cube smoother. Uses Weilong WR
  corner and edge feet design. For more infrormation, see MoYu . MoFang JiaoShi Mini 3x3 Series
  A series of smaller 3x3x3s that are produced in sizes of 50mm, 45mm, 40mm, 35mm and 30mm. They
  all have very similar mechanisms. Meilong 3x3 The Meilong 3 was released 2019-04-02. Meilong
  3x3 M An updated version of the Meilong 3 with magnets. This puzzle is not popular due to the
  RS3M 2020 existing, but is still used by some people, especially for one-handed. Meilong 3C
