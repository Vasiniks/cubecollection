  States MoFang JiaoShi (native name 魇方教室, also transliterated 魔方教室, marketed in English
  as "Cubing Classroom") is "a sub-brand of Moyu", founding date "unknown", active
  "2016-present", specialising in beginner-friendly and budget-tier cubes sold worldwide from
  China-based operations. Organises "Meilong" (2x2 through 7x7, Pyraminx and other shapes) as a
  distinct product-line catalogue section within MoFang JiaoShi's own listing, alongside the
  numbered MF/MF2/MF3/RS3M line.
