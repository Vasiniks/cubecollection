excerpt: |-
  Live Shopify product JSON, thecubicle.com/collections/dayan/products.json (fetched
  2026-09-12), product id 7639915364435, handle "dayan-void-cube-limited-edition", vendor
  "DaYan", product_type "3x3,Shape Mods".

  Title, verbatim: "DaYan Void Cube (Limited Edition)".

  Description (body_html), verbatim: "The Dayan Void Cube is a throwback to one of the most
  iconic 3x3 variations ever made. With no center pieces, it adds a fun twist to the classic
  puzzle and feels like a piece of cubing history. These are older versions that aren't made
  anymore, packaged in Calvin's Puzzle boxes. Great for collectors or anyone who remembers the
  early days of modern cubing. Very limited stock."

  Tags, verbatim: "Availability_Available", "Color_Green", "Color_Pink",
  "Color_Transparent Green", "Color_Transparent Pink", "Dimensions_57.0", "limitededition",
  "Manufacturer_DaYan", "Type_3x3", "Type_Shape Mods", "Weight Range_100.0-249.9",
  "Weight_112.0".

  Four colour variants, all priced $19.99, all "available": Green (sku 14305_1_52), Pink (sku
  14305_1_249), Transparent Green (sku 14305_1_138), Transparent Pink (sku 14305_1_158). First
  `created_at` 2025-06-27, most recent colour added 2025-09-30.

  THE PER-VARIANT FIGURES 125 / 129 / 127 / 127 ARE SHOPIFY `grams` AND ARE NOT PRODUCT WEIGHTS.
  This archive has a documented rule (the rule-45 class) that a Shopify `grams` field is a
  SHIPPING weight the merchant sets for postage, not a measurement of the article, and they are
  quoted here only so a later reader can see which numbers were refused. The tag-level
  "Weight_112.0" disagrees with all four of them, which is itself a reason to trust none of
  them as a mass.

  WHY THIS IS A MODEL QUESTION, NOT A VARIANT ONE: the description states directly that this
  SKU has "no center pieces" — the defining structural feature of a Void Cube mechanism (the
  core omits center pieces and the mechanism is reworked so the cube still functions), not a
  choice of magnet, coating, or size made on an ordinary DaYan 3x3 mould at assembly. No DaYan
  model in this archive (dayan-guhong-*, dayan-lingyun-*, dayan-lunhui-*, dayan-panshi-v1,
  dayan-taiyan-v1, dayan-tengyun-*, dayan-xiangyun-v1, dayan-zhanchi-*, dayan-bermuda-*) is a
  Void Cube, and none of their records mentions one.

  The retailer's own copy calls these "older versions that aren't made anymore, packaged in
  Calvin's Puzzle boxes" — old DaYan-made stock being cleared through Calvin's Puzzle's own
  packaging, not a Calvin's Puzzle design; the vendor field and the "Manufacturer_DaYan" tag
  both attribute manufacture to DaYan, not to Calvin's Puzzle or to TheCubicle.
