excerpt: |-
  3x3x3 section: "Some of their older models of 3x3 cubes include: Cyclone Boys FeiXuan.
  Released December 2013. Cyclone Boys XuanFeng. Released: January 2014. Cyclone Boys FeiHong.
  Released February 2014. Cyclone Boys JisuZhiYun. Released January 2015." (No further detail
  given for any of the four; not created as families this pass, recorded as leads.)

  "Cyclone Boys FeiWu — Released: March 2014. A cheap but very solid cube. The FeiWu was a
  popular beginners cube and was widely available on Amazon and similar stores. Only available
  as stickerless. It is very controllable and robust: it does not pop, doesn't really lock up,
  and the centre-caps never fall out... Cyclone Boys FeiChi — Released: October 2016. An
  improved version of the FeiWu, with improved turning and better colours. Cyclone Boys Mini 3x3
  — Released December 2016. A 40 mm cube. Cyclone Boys FeiJue M — Decent budget magnetic option,
  widely regarded as inferior to the Kylin V2 M and the Yulong V2 M. Cyclone Boys Metallic 3x3 —
  A 3x3 with a shiny metallic coating on the outside. JPerm really likes this puzzle."
