excerpt: |-
  CDX prefix enumeration of thecubicle.com/products/gan356 (captures through 2026), 33 distinct
  product URLs, NOT truncated - well under the 300 limit used. Reproducible with
  `npm run wayback -- prefix thecubicle.com/products/gan356 --limit 300`.

  WHY THIS SWEEP EXISTS. The obvious prefix, thecubicle.com/products/gan-356-i, returns 27 URLs
  of which all but two are the same two products repeated with tracking parameters. The hyphen
  is the whole difference, and a sweep on one form reports "swept, nothing found" while missing
  most of the line.

  The 33 distinct product paths, verbatim:

    gan356
    gan356-air-m
    gan356-i-carry-2-brainstorm-voyage-edition
    gan356-i-carry-2-uv-3x3-10th-anniversary-edition
    gan356-i-carry-4-3x3-frosted
    gan356-i-carry-4-3x3-frosted-2026-year-of-the-horse-edition
    gan356-i-carry-4-3x3-minions-edition
    gan356-i-carry-4-3x3-ssl-le
    gan356-i-carry-e-3x3
    gan356-i-carry-s-3x3
    gan356-i-charging-station
    gan356-i-play
    gan356-i2
    gan356-i3-v2-3x3
    gan356-m
