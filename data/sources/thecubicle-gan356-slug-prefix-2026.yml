    gan356-rs
    gan356-rs2-3x3
    gan356-x
    gan356-x-ipg-v5
    gan356-xs
    gan356-xs-project-

  WHAT THIS ESTABLISHES FOR THE SMART LINE. Exactly ONE product path exists for each of
  gan356-i-carry-e-3x3, gan356-i-carry-s-3x3, gan356-i2 and gan356-i3-v2-3x3 - no coated,
  edition or configuration sibling under either slug form. By contrast the i Carry 2 has three
  (base, UV coated, 10th Anniversary) and the i Carry 4 has four (frosted, Year of the Horse,
  Minions, SSL LE), so the enumeration DOES surface siblings where they exist. A single path is
  therefore a result, not a gap in the search.

  NOT IN THE ARCHIVE AND NOT ACTIONED HERE: gan356-i-play, gan356-m-lite, gan356-x-ipg-v5, and
  six named gan356-me editions (Christmas, 2025 Lunar New Year, Brainstorm Voyage, 10th
  Anniversary, UV Coated, plus the me-v2 UV). Recorded so they are findable; acting on them is
  model-layer work under P4-9, not this record's business. gan356-i-charging-station is an
  accessory, not a puzzle.
