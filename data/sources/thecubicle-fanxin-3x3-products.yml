excerpt: |-
  "fanxin-3x3" (first captured 2020-09-27): Product Description: "The FanXin 3x3 draws
  inspiration from other 3x3 cube mechanisms, yet it strikes a good balance between
  affordability and performance."

  "fanxin-magnetic-3x3" (first captured 2020-08-04): Product Description: "This Magnetic 3x3
  speed cube is FanXin's first attempt at a modern, magnetic puzzle. It is a classic design with
  a papery/scratchy feel."

  "fanxin-hudong-light-3x3-standard" (first captured 2024-10-09, also sold in "Flagship UV" and
  "Ultra Maglev UV" configurations, both first captured 2024-10-08): Product Description: "The
  FanXin HuDong is a huge step for FanXin hardware. This is an extremely modern and competitive
  flagship 3x3. Every version has tension and compression adjustments... This cube has
  piece-to-piece magnetization, an 8 magnet ball-core with repelling edge magnets, and corner
  foot-to-edge foot magnets."

  A CDX prefix enumeration of https://www.thecubicle.com/products/fanxin (reproducible via
  `npm run wayback -- prefix https://www.thecubicle.com/products/fanxin --limit 200`) also
  surfaces a wide range of non-standard-format 3x3 shape mods styled as fruit and objects
  (Apple, Banana 2x2x3, Orange, Peach, Pear, Lemon, Basketball 3x3, plus dinosaur-shaped
  puzzles, a Nautilus cube, and others), none individually dated or described beyond a bare
  product name — not chased further this pass, recorded as a group lead rather than
  individually assessed.
