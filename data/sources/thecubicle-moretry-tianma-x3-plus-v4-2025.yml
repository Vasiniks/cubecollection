  Tier 2, retailer product page with structured Shopify fields.

  WHY THIS IS A MODEL CANDIDATE AND NOT A COATING VARIANT, which is what the handle suggests.
  The handle reuses the V4 MagLev's path with "-uv" appended, and on that basis this looks like a
  UV configuration of `moretry-tianma-x3-v4`. The BODY CONTRADICTS THE HANDLE: it calls the
  product "the highly anticipated successor to the X3 V4" and describes "redesigned internals"
  and "innovative magnet pods". Under DATA_MODEL 4.2 redesigned internals are not a choice made
  at assembly from one design, so this reads as a distinct product rather than a configuration.
  The two also carry DIFFERENT Shopify ids (7504440787027 vs 6730997235795), which is this
  archive's own dedup test for "one product renamed" versus two products.

  WHICH LINE IT SUCCEEDS is the open question. The title says "X3+ V4" and the archive holds
  `moretry-tianma-x3-plus` = "X3+ V3" (TheCubicle: "MoreTry Tianma X3+ V3 3x3"), so the natural
  reading is that the X3+ line has moved to V4 and the archive stops at V3 — an ordinary recency
  gap. But the body says it succeeds "the X3 V4", the PLAIN line's V4, so the retailer may be
  merging the two lines under the "+" branding. Nothing here settles that, and it is exactly the
  question an admission decision would have to answer first.

  NO WEIGHT IS RECORDED. The JSON's "grams": 218 is a Shopify SHIPPING weight and is refused
  under the rule-45 class. The page states no item weight.
