excerpt: |-
  CDX prefix enumeration of thecubicle.com/products/swift-block, 8 distinct product URLs,
  not truncated. Reproducible with `npm run wayback -- prefix thecubicle.com/products/swift-block
  --limit 80`.

  The distinct product paths, verbatim:

    swift-block
    swift-block-355s-3x3
    swift-block-3x3-maglev
    swift-block-super-maglev-frosted-3x3
    swift-block-super-maglev-uv-3x3
    swift-block-wislide-klotski-number-pieces-set
    swift-block-wislide-smart-klotski-puzzle
    swift-block-wislide-smart-klotski-puzzle-uv-coated

  WHAT IT ESTABLISHES. `swift-block-3x3-maglev` stands alone with no coated or edition sibling,
  while `swift-block-super-maglev-frosted-3x3` and `swift-block-super-maglev-uv-3x3` are TWO
  configurations of the Super MagLev. The method therefore distinguishes one from many within
  the same sweep, which is what makes a single-path result evidence rather than a failed search.
  Out of 3x3 scope: the three wislide klotski paths are sliding puzzles, not twisty puzzles.
