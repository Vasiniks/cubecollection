excerpt: |-
  Product Description: "MoYu MeiLong 3x3 V2 (Magnetic) is a lightweight upgrade to one of the
  most popular entry-level cubes ever." Key features: "Factory-installed magnets for more
  control", "Reinforced core design", "Lightweight". A "Version comparison" table on the same
  page gives: V1 weight 69g, frosted finish, accessories included; V2 (Lite) weight 65g,
  frosted, no accessories; V2 (Standard) weight 65g, frosted, accessories included; V2 (UV
  Coated) weight 66g, UV coated, accessories included -- all four sharing the stated "Dragon
  scale" piece design and reinforced core listed under "Key features"/"Overview". Product
  Details block (for the specific V2 Magnetic/Standard SKU this page sells): "Type: 3x3",
  "Brand: MoYu", "Size: 55.5 mm", "Weight: 66 g", "Released: 2024-04-18".
preservation_note: "Fetched directly via `npm run wayback -- get` on 2026-09-03; excerpt
  reproduces the load-bearing product-description sentences, the version-comparison table, and
  the Product Details block verbatim/condensed."
