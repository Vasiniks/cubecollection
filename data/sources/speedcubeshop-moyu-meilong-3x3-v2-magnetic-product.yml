reliability_note: "Tier 2, first-party retailer product description and spec table. 'Dragon
  scale piece design' plus 'Reinforced core design', stated as differing from the V1 column in
  the same comparison table, is direct tier 2 evidence of a distinct design generation, not
  merely a sold configuration -- the basis for admitting V2 as a separate model under
  mfjs-meilong. The V1 weight given here (69g) conflicts with the 2.2oz (~62g) given by the
  original 2019 MeiLong 3x3 product page (speedcubeshop-mofang-jiaoshi-meilong-3x3-product);
  recorded as a disputed spec on the model record rather than silently reconciled, since it is
  unclear whether this reflects a genuine undocumented production change, a different weighed
  configuration (magnetic vs. non-magnetic), or simple retailer inconsistency six years apart.
  The 'Released: 2024-04-18' field is an explicit dated statement, distinct in form and value
  from this archive's documented 'Added:' artifact pattern, and treated as admissible."
