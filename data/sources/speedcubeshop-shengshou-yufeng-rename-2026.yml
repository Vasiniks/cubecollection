# Created 2026-09-11. This record exists to preserve a REJECTED finding. The archive's own lead
# counter surfaced four SpeedCubeShop YuFeng 3x3 paths against two held models, which looks like
# two missing configurations. It is not: the retailer renamed each listing, and the SKUs prove it.
# Evidence for a rejection has nowhere else to live, and without it the next pass re-derives the
# same false lead from the same sweep source.
