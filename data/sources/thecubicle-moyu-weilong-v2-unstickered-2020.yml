reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that the WeiLong V2 was sold in an UNSTICKERED factory configuration — assembled,
  supplied with stock stickers and logo not applied — in black and white bodies; a 57.0mm
  dimension; and, as a lineage claim, that the V2's piece assembly was changed in a way that
  "allows stickerless variants to be produced".
  DOES NOT ESTABLISH: a release date, the puzzle's mass, or MoYu's own name for the
  configuration. "Unstickered" is the retailer's product title.
