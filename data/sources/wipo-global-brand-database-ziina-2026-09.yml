reliability_note: |-
  Tier 1 for what it is: an official WIPO register aggregating 89 national and regional
  offices. It establishes the CONTENT of those registers directly.

  WHAT IT ESTABLISHES. The three UAE marks share one owner across classes 9 (software), 36
  (financial services) and 42 (technology services) — that is the profile of a payments company,
  and it positively identifies the entity behind ziina.com. The archive's standing rule never to
  cite ziina.com has until now rested on assertion; it now rests on the register. The two
  Austrian/EU marks are in unrelated classes (35/41/42 business-and-education, 16/21
  paper-and-household) and are likewise not puzzle marks.

  WHAT IT DOES NOT ESTABLISH, and this is the limit that matters: it does NOT show that no
  "Ziina" puzzle trademark exists, because CHINA IS NOT IN THE 89 OFFICES and every plausible
  manufacturer of these cubes is Chinese. A CNIPA-only registration would be invisible here.
  This is a bounded negative, not an absence of the fact.

  THE ONE INFERENCE IT DOES SUPPORT ABOUT CHINA is indirect and weak, and is stated as such: the
  Madrid international register IS covered, so a Chinese proprietor who had sought international
  protection for the mark would appear. None does. That is consistent with a domestic-only or
  unregistered brand; it is not evidence of who manufactures it.
