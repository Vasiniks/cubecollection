excerpt: |-
  Query run 2026-09-19 through a rendering browser (the database is an Angular SPA; its
  /api/search endpoint returns the HTML shell to a plain fetch, which is why two earlier
  sessions recorded this avenue as blocked rather than negative).

  Search: Brand name "ziina", strategy "Embedded (results contain entered term)" — so
  "Ziina Star" and any longer form containing the token would also match. No class, office or
  status filter applied. Database self-describes as "Covering 76,749,495 records from 89 data
  sources."

  RESULT: "Displaying 1-5 of 5 results". All five, verbatim:

  1. ZIINA — Owner "زينة منطقة حرة ذ.م.م" (UAE) — Nice class 42 — National Trademark
     Registration, UAE — Registered (April 24, 2023) — No. 378891
  2. ZIINA — Owner "Bianca Schönbichler" (Austria) — Nice classes 35, 41, 42 — Regional
     Trademark Registration, European Union — Registered (February 4, 2021) — No. 018310312
  3. ZIINA — Owner "زينة منطقة حرة ذ.م.م" (UAE) — Nice class 9 — National Trademark
     Registration, UAE — Registered (April 24, 2023) — No. 378889
  4. ZIINA — Owner "زينة منطقة حرة ذ.م.م" (UAE) — Nice class 36 — National Trademark
     Registration, UAE — Registered (April 24, 2023) — No. 378890
  5. ZIINA — Owner "IT-Consulting Christian Schuller GmbH" (Austria) — Nice classes 16, 21 —
     Regional Trademark Registration, European Union — Registered (October 16, 2021) —
     No. 018504285

  NOT ONE IS IN NICE CLASS 28, which is the class covering games, toys and playthings, where a
  twisty puzzle would be registered. No puzzle-class "Ziina" mark exists anywhere in this
  database.

  COVERAGE, read from the database's own /en/coverage page on the same visit and enumerated in
  full: 89 offices, which matches the "89 data sources" the search page states — the match is
  the control confirming the enumeration is complete and not truncated. The Asia region lists
  JPO (JAPAN), MOIP (KOREA), CGDPTM (INDIA), IPOS (SINGAPORE), IP VIET NAM, MyIPO (MALAYSIA),
  DGIP (INDONESIA), IPOM (MONGOLIA), DIP (THAILAND/CAMBODIA/LAOS/BHUTAN), NIPO (SRI LANKA),
  IPOPHL (PHILIPPINES), and several Gulf and Central Asian offices including MoE (UAE).
  CHINA IS NOT COVERED. There is no CNIPA entry, and no Hong Kong, Taiwan or Macao office.
  The international registers Madrid (WIPO), Lisbon (WIPO), 6ter (WIPO) and EUIPO ARE covered.
preservation_note: >-
