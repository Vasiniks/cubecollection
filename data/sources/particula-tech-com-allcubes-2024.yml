reliability_note: |-
  Tier 1, first-party. Absence of "GoCube-X" from Particula's own direct storefront by mid-2024
  is read as evidence that Particula itself had stopped selling this SKU directly by this date
  (consistent with getgocube-com-2021-gocube-x-product's "FIRST BATCH... SOLD OUT" framing of
  GoCube-X as a limited-run budget line, not a permanent flagship addition) — NOT read as
  evidence the product never existed, and not read as evidence it was "replaced" by anything
  named "X" on the Rubik's side, since "Rubik's Connected" (no suffix) is what remains listed
  here. This absence is used only to establish that neither "GoCube-X" nor "Rubik's Connected
  X" was part of Particula's own current catalogue at this date; both names continued to appear
  only via Rubik's own site (for Connected X) and third-party retailers (for both) — see
  research/qc/pass3-b4-agent-c-identity.md Question 2.
