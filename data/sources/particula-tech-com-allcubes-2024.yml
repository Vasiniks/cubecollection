# Pass-3-B4 identity investigation (Question 2: GoCube X vs Rubik's Connected X). Tier 1,
# first-party. Establishes what Particula itself was directly selling under its own "GoCube"
# shop category at this date: no "GoCube-X" and no "Rubik's Connected X" SKU appears anywhere
# on this page — only "GoCube Edge Full Pack," "GoCube 2x2," "Rubik's Connected" (no suffix),
# "GoCube Bundle Pack," and "Rubik's Connected BOGO DEAL."
