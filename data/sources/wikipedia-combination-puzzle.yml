excerpt: |-
  "Bandaged Cubes ... This is a simple example of one a large number of bandaged cube types that
  have been made. A bandaged cube is a cube where some of the pieces are stuck together." Also,
  in the general cuboid-notation discussion: "Puzzles which are constructed in this way are
  often called 'bandaged' cubes."

  "Commercial name: Mixup Cube ... Invented by Oskar van Deventer, it looks like a
  disproportional Rubik's Cube, but it allows the middle layer to turn 45 degrees and swap
  center pieces with edge pieces."

  Separately, under 4x4x4 puzzles: "Commercial name: Crazy cube type I / Crazy cube type II ...
  The inner circles of a Crazy cube 4x4x4 move with the second layer of each face. On a crazy
  cube type I, they are internally connected in such a way that they essentially move as 8
  distinct pieces, not 24 ... Solving the type II is much more difficult." Note: this
  description is specifically of the 4x4x4 "Crazy cube" (connected, still-turning inner
  circles), not the locked/non-turning center mechanism described for Calvin's Full-Function
  Crazy 3x3 (Center-Locking) — the two are not treated as the same documented category by this
  pass, see calvins-crazy-3x3's own scope_class reasoning.
