reliability_note: |-
  Tier 2, first-party retailer product page, NON-US market.
  ESTABLISHES: a product weight of 93 g and a 57 mm size for the AoLong V2 LE; that the cube
  itself is transparent green; and the set's contents — one cube, one manual, stickers and one
  stand.
  DOES NOT ESTABLISH: the Lucas Etter association or the WCA result, both of which are copied
  prose from TheCubicle and add nothing to it; a run size; or a release date.
