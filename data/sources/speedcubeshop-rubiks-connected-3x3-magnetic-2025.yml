excerpt: |-
  Page title: "Rubik's Connected 3x3 (Magnetic) - Bluetooth Smart Cube". Description: "Rubik's
  Connected 3x3 (Magnetic) - Bluetooth Smart Cube is the result of a partnership with the
  official Rubik's Brand company and smartcube pioneer, GoCube. While the exterior may appear
  to resemble an original Rubik's Cube, the mechanism features factory-installed magnets and
  amazing turning... This product is covered by a 1-year manufacturer warranty through GoCube."
  A "Version" selector on this listing offers two options: "Connected X" and "Connected" (this
  page being the "Connected" option; the "Connected X" option links to a separate product page,
  speedcubeshop-rubiks-connectedx-3x3-2025). Structured "Product Details" block: "Type: 3x3 /
  Brand: GoCube / Magnets: Moderate / Size: 57 mm / Weight: 110 g / Released: 2020-09-01."
