reliability_note: |-
  Tier 2 retailer, structured spec fields. "Released: 2020-09-01" matches TheCubicle's
  independently-recorded "Added: 2020-09-01" for its own long-running "Rubik's Connected 3x3"
  listing (thecubicle-rubiks-connected-3x3-2020-2025-continuity) almost exactly — both
  retailers' own catalogue-addition dates agree to the day, strong evidence this is the same
  underlying product SKU rather than a coincidence. "Brand:
  GoCube" (not "Rubik's" or "Spin Master") is SpeedCubeShop's own internal brand-taxonomy
  assignment for this generation — contrasted directly against "Brand: Spin Master" on the
  sibling "ConnectedX" listing found in the same session, a retailer-internal inconsistency
  used as one (non-decisive) discriminator in the Question 2 analysis, not treated as a claim
  about legal manufacturing. The "Version: Connected X / Connected" selector shared by both
  listings is read as a Shopify-theme cross-linking convenience between two separately-priced,
  separately-specified product pages, not as evidence the two are one variant-level SKU — see
  research/qc/pass3-b4-agent-c-identity.md Question 2 for the full reasoning.
