excerpt: |-
  Product Description, verbatim: "The GAN356 ME (Brainstorm Voyage Edition) is a special edition
  puzzle with cool packaging. This GAN356 ME has blue internals and orange magnet capsules. It
  comes with a set of fancy stickers for you to place on one side of the puzzle. Comes with:
  GAN356 ME (Brainstorm Voyage Edition), Brainstorm Voyage edition cube bag..."

  Product Specifications table: "Manufacturer: GAN", "Dimensions: 56.0mm3", "Item Weight: 78.0g".

  WHAT DIFFERS AND WHAT DOES NOT. The edition changes internal plastic colour (blue), magnet
  capsule colour (orange), packaging and an included sticker set. It claims NO mechanical
  difference from the base GAN356 ME, and the 56.0mm dimension matches the base product. This is
  a colourway-and-packaging edition of one design.

  NOTE THE SAME "Brainstorm Voyage" NAME appears on a GAN356 i Carry edition recorded separately
  as thecubicle-gan-356-i-carry-brainstorm-voyage-2025. They are different products sharing a
  promotional series name, not the same item — the i Carry edition is a smart cube at 79.0g under
  its own handle.
