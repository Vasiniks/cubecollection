excerpt: |-
  Fetched live 2026-09-11 from the storefront's own product JSON endpoint.

  Product Description, verbatim: "The GAN356 ME V2 3x3 (UV Coated) offers unmatched performance
  and value, making it the perfect choice for speedcubers seeking a quality GAN experience
  without breaking the bank. Featuring a factory-installed magnetic system for superior turning
  feel, this 3x3 boasts 4 elasticity settings and 3 center travel adjustments for a customized
  cubing experience. The UV coated outer surface provides enhanced grip and a sleek appearance,
  ensuring your solves look and feel as smooth as possible."

  Structured fields: vendor "GAN"; tags include "Manufacturer_GAN", "Magnets_Magnetic",
  "Color_Stickerless", "Type_3x3". One purchase option, "Stickerless".

  WHY THIS IS A CONFIGURATION OF THE ME V2 AND NOT A SEPARATE PRODUCT. The description repeats
  the base model's own feature language verbatim — "4 elasticity settings and 3 center travel
  adjustments" is what thecubicle-gan356-me-v2 says of the uncoated version — and the only
  difference it claims is the coating, described as a surface treatment giving "enhanced grip and
  a sleek appearance". Same design, different finish. It is sold under its own product handle
  (gan356-me-v2-3x3-uv-coated) distinct from the base handle (gan356-me-v2-3x3), so this is not
  one listing with a dropdown — the dedup test this archive applies before admitting any variant.

  NO WEIGHT OR DIMENSION IS RECORDED HERE. The listing's only numeric field is a 202 g shipping
  weight, which is a Shopify `grams` value covering the packaged product and is NOT a product
  weight. This archive has a documented defect class from exactly that confusion (rule 45), so
  the figure is named and refused rather than transcribed as a spec.
