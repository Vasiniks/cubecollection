excerpt: |-
  Page title as captured: "MoYu WeiLong WRM V9 3x3 (Ball-Core UV Special Edition) – TheCubicle".
  Shopify product id 7003444674643. Colourway option offered: "Stickerless (Bright)".

  Product description, verbatim and complete: "The MoYu WeiLong WRM V9 3x3 (Ball-Core UV Special
  Edition) is a LIMITED-EDITION cube from MoYu. This one features a BALL-CORE WITH SPRINGS (NO
  MAGLEV), UV COATING, a new LIGHT-BLUE INTERNAL COLOR, and NO EDGE-REPELLING MAGNETS. This is the
  perfect speedcube for all of you puzzle collectors out there! Comes with: WeiLong WRM V9, MoYu
  pamphlet, MoYu spacing tools, Extra tension nut, Extra PiCube center cap, Screwdriver."
  (Emphasis added on the four configuration claims; the wording is the retailer's.)

  Specifications table: "Manufacturer: MoYu", "Type: 3x3", "Added: 2023-07-06",
  "Gross Weight: 214g", "Dimensions: 55.x mm".

  THIS IS NOT ANY OF THE FOUR V9 CONFIGURATIONS THE ARCHIVE ALREADY HELD. The existing Ballcore
  variant records `maglev: maglev`; this page says "ball-core with SPRINGS (no MagLev)" in as many
  words. The combination of a ball core WITHOUT MagLev, plus UV, is what makes it a fifth
  configuration rather than a restatement.
preservation_note: >-
  Capture 20230816105700 fetched 2026-09-12 with content-encoding negotiation and read in full.
  "Gross Weight: 214g" is a packaged figure refused under the rule-45 class, and for this product
  it covers a pamphlet, spacing tools, a spare tension nut, a spare centre cap and a screwdriver
  as well as the puzzle. "Added: 2023-07-06" is a catalogue-ingestion stamp, not a release date.
  THE "no edge-repelling magnets" CLAIM IS PRESERVED BUT NOT MAPPED TO A VOCABULARY VALUE.
  vocab/magnet-configurations.yml has no term for edge repulsion — it is a MoYu feature name, not
  an archive concept — so forcing it into `core_corner` or `core_corner_plus_piece` would assert a
  layout the source does not describe. Recorded as text on the variant instead.
