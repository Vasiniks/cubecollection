reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that MoYu sold a limited-edition WeiLong WRM V9 configuration combining a
  spring-tensioned ball core, a UV coating, light-blue internals and no edge-repelling magnets,
  in a stickerless bright body, with a tool and spares pack.
  DOES NOT ESTABLISH: a run size, a release date, or a weight. "Special Edition" is in the
  retailer's title; the word "limited-edition" is in its description, and neither is a MoYu
  first-party statement located this pass.
