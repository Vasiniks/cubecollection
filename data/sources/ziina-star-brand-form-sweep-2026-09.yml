reliability_note: |-
  MIXED TIERS BY DESIGN; read each claim against its own source.
  Tier 2 (retailer, first-party for its own catalogue): the "Ziina Star" vendor string, the
  34-product and 13-product collections, the slug forms, and the stated sizes.
  Tier 3 (forum): both origin claims, which conflict, and neither of which offers evidence beyond
  one user's disassembly.
  Tier 3 but first-party for its subject: camcuber's statement about the SCS Pro, which is a
  retailer describing its own product and is good evidence FOR THE SCS PRO ONLY.
  ESTABLISHES: that the brand is presented as "Ziina Star" by at least two retailers; that the
  archive's earlier keyword sweep could not have found those listings; and that the community
  holds two incompatible beliefs about the brand's origin.
  DOES NOT ESTABLISH: who manufactures Ziina or Ziina Star; whether "Ziina" and "Ziina Star" are
  one brand; or whether either is an OEM rebrand. P4-10's admission question is UNCHANGED.
