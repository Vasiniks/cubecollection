excerpt: |-
  **Jelly LE's own page** (archived capture, 2026-07-18): badges "NEW" and "LIMITED EDITION";
  single purchase option "Transparent Stickerless" at $13.99 (compare-at $16.99). Body copy:
  "ShengShou Crazy 3x3 (Jelly LE) - limited to 1400 units worldwide!"

  The page carries TheCubicle's own "Versions" cross-product selector — a structured table this
  retailer uses site-wide to group sibling generations/configurations of the same product line
  (the same UI element already used as decisive evidence for `yj-mgc3-beta--limited-edition`'s
  model-vs-configuration attachment). This page's own Versions table reads, verbatim, in order:

    Versions
    V1                                $15.99
    V1 (Jelly Limited Edition)        $13.99  $16.99
    V2                                $21.99

  **Corroborating live fetch of the sibling V2 page** (https://www.thecubicle.com/products/shengshou-crazy-3x3-v2,
  fetched live 2026-09-12 because the V2 page's archived captures all predate the Jelly LE's
  2026-06-04 creation date and so could not show it): the identical Versions table appears there
  too, independently confirming the same three-way grouping and the same "V1 (Jelly Limited
  Edition)" label from the OTHER product's own page rather than a rendering artefact of the Jelly
  LE page alone:

    Versions
    V1                                $15.99
    V1 (Jelly Limited Edition)        $14.99  $16.99
    V2                                $21.99

  (The $1 price difference between the two captures, $13.99 vs $14.99, is an ordinary price
  change between the 2026-07-18 archived Jelly LE capture and the 2026-09-12 live V2 fetch, not a
  second product — both list the same compare-at $16.99 and the same "V1 (Jelly Limited Edition)"
  label.)

  THIS RESOLVES THE GENERATION-ATTACHMENT QUESTION LEFT OPEN BY
  thecubicle-shengshou-crazy-3x3-generations-2026 AND LEDGER P4-13: the retailer's own version
  grouping — the same mechanism this archive already treats as tier-2 first-party attachment
  evidence — places the Jelly LE under V1, explicitly labelled "V1 (Jelly Limited Edition)", not
  under V2. No page states a ring-piece count for the Jelly LE directly; the Versions-selector
  label is the evidence, exactly as it was for yj-mgc3-beta.
