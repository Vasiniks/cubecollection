excerpt: |-
  Product description: "GAN17 MagDrive is GAN's flagship maglev 3x3 speed cube, featuring the
  Celestial Magnetic-Dynamic System with 196 magnets, One Magnet Core and Three Magnet Realms
  for Full-Angle Navigation. It combines a 17.5 mm Micro Magnetic Core, Maglev, Omni-support
  Spherical Orbit and Full-Freedom Numerical Tuning to deliver adjustable magnetic guidance,
  stability and control for high-performance speedcubing."

  Site navigation, "Flagship Series" dropdown (verbatim entries, in order): "GAN16 Maglev",
  "GAN15", "GAN14", "GAN12", "GAN11 Series, GAN11 M Pro, GAN11 M, GAN 11 Air, GAN11 M Duo",
  followed by the non-3x3 siblings "GAN562 M", "GAN460 M V2", "GAN251 M Series".

  Site navigation, "3x3" flat listing (verbatim, in order, abridged to items relevant to this
  citation): "GAN17 MagDrive", "GAN16 Maglev", "GAN16 ui Maglev MAX", ... "GAN356 M e Minions",
  ... "GAN V100 Leap Year of the Horse", "GAN V100", "GAN15 NewBlack UV Coated", ... — GAN356
  and GAN V100 items appear in this flat "3x3" list but do NOT appear in the "Flagship Series"
  dropdown above, nor in a second, separate per-generation quick-nav list further down the same
  page ("GAN16 Maglev Series", "GAN15 Maglev Series", "GAN14 Maglev Series", "GAN13 Maglev
  Series", "GAN12 Maglev Series", "GAN11 Series").

  Site navigation, "Smart Cubes" dropdown (verbatim): "GAN ui Series", "i Series",
  "i carry Series".
