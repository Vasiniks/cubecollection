excerpt: |-
  Infobox: "Founded: 1981. Location: Kaohsiung, Taiwan. Years Active: 1981-Present. Areas
  served: Worldwide." Opening paragraph: "East Sheen (or Eastsheen) is a puzzle manufacturer
  based in Taiwan founded by Chen Sen Li. They specialized in developing Magic Cubes (commonly
  known as Eastsheen cubes), which are similar to Rubik's Cubes." The article further notes
  Eastsheen cubes "are also much lighter, smaller and cheaper however Eastsheen cubes have the
  habit to lock up sometimes. You can easily recognize Eastsheen cubes by their purple/pink
  face, which is orange on a regular cube."

  **The article states flatly: "East Sheen does not produce 3x3 cubes."** Its product listing
  covers only 2x2 cubes (Types A, C, E, M), 4x4 cubes (Types A, C, E, M, P), 5x5 cubes (Types
  A, C, E, M, P), Mini cubes (2x2 variants, S and R types), and Multi cubes (assembled 2x2
  combinations, S and R types). No 3x3x3 product of any kind is listed.
