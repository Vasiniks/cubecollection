# source: thecubicle-rubiks-connected-3x3-2020-2025-continuity
# TheCubicle's own "Rubik's Connected 3x3 Smart Cube" listing, captured at two widely-separated
# dates (2023-06-12 and 2025-06-14, spanning the period during which Rubik's own site
# (rubiks.com) renamed its smart-cube marketing page from "Rubik's Connected" to "Rubik's
# Connected X," see rubiks-com-connected-x-product-2025, captured 2025-02-25). Found during
# Agent C's Pass-3-B4 identity investigation (Question 2). Decisive continuity evidence: this
# single TheCubicle catalogue listing shows an unchanged title, unchanged "Added: 2020-09-01"
# catalogue date, and identical spec-table figures (57.0mm / 173g gross / 112.0g item /
# Magnetic) across both captures — TheCubicle never renamed this listing to "Connected X" and
# never changed its recorded specs through the period of Rubik's own rebrand.
