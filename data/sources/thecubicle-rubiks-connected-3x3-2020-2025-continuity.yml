reliability_note: |-
  Tier 2 retailer, structured spec table, unusually strong continuity evidence: the identical
  "Added: 2020-09-01" catalogue date and identical Dimensions/Weight/Magnets fields recur
  verbatim in a capture taken nearly four months AFTER Rubik's own site had already switched to
  calling the current generation "Rubik's Connected X" (rubiks-com-connected-x-product-2025,
  2025-02-25) — meaning TheCubicle continued selling and describing the same catalogue SKU
  under the un-suffixed "Rubik's Connected" name, with a USB-charger/rechargeable power
  description, throughout this period. This is read as evidence that TheCubicle's own inventory
  is the original magnetic/rechargeable generation and either (a) TheCubicle had simply not
  picked up the "ConnectedX" naming or a distinct ConnectedX SKU by this date (retailer lag), or
  (b) the "Connected"/"Connected X" split found at SpeedCubeShop
  (speedcubeshop-rubiks-connected-3x3-magnetic-2025 vs. speedcubeshop-rubiks-connectedx-3x3-2025)
  reflects two genuinely different SKUs that TheCubicle chooses only to carry one of — this
  source cannot itself distinguish between those two readings, and neither is asserted as
  settled. See research/qc/pass3-b4-agent-c-identity.md Question 2.
