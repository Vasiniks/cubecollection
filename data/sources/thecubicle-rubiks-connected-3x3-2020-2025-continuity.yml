excerpt: |-
  Page title (unchanged across the 2023-06-12 and 2025-06-14 captures checked): "Rubik's
  Connected 3x3 Smart Cube". Product Description: "The Rubik's Connected Cube is the newest
  smart cube on the market! Provided through an official partnership with Rubik's Brand Ltd.,
  this puzzle and accompanying app tracks all sorts of useful statistics... The Rubik's
  Connected Cube comes with a USB charger and a 1-year warranty by the manufacturer." Structured
  "Product Specifications" table, identical in both captures: "Manufacturer: Rubik's / Type:
  3x3 / Added: 2020-09-01 / Gross Weight: 173g / Dimensions: 57.0mm 3 / Magnets: Magnetic / Item
  Weight: 112.0g." A customer review present in both captures (David T., United States, Tier 5,
  not treated as a source claim): "I have both the GoCube and the Rubik's Connected Cube... I'm
  glad there is a regular shaped cube that uses the same technology as the GoCube."
