excerpt: |-
  "Master Version: This is the Master version of the Gans 356 Air. The Master version features
  the Gans half bright sticker set pre-applied to the cube. It also comes with the plastic
  adjusting tool and a set of Red (S6), Orange (S7), and Yellow (S9) GES Components. Advanced
  and Standard versions of the Gans 356 Air may become available in the future, but the Master
  version will be released first. Note: This DIY Kit actually comes assembled but without any
  stickers (Gans Half-Bright stickers + logo are included with the DIY Kit). This is ideal for
  someone who plans to resticker the cube anyway and doesn't want to take time removing the
  stickers."
