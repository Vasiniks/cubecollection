  Page title: "ShengShou Legend Plus Big 3x3 - 18cm | SpeedCubeShop".

  Description, verbatim: "ShengShou Legend Plus Big 3x3 - 18cm is a fantastic decoration and a
  fully functional speed cube! While the large size makes this cube harder to handle, the
  turning is smooth, and the screw/spring core allows for corner cutting!"

  Product Details table: "Type: 3x3", "Brand: ShengShou", "Magnets: None", "Size: 180 mm",
  "Weight: 920 g", "Released: 2024-11-04". Single sold option: "Stickerless", $37.95.

  180mm and 920g are both roughly 2.5x the archive's existing `shengshou-legend-big` (70mm,
  the largest ShengShou Legend-line model currently on file). No source found connects this
  product's mechanism, mould, or design lineage to either existing Legend model beyond the
  shared "Legend" name and a stated "screw/spring core" (a generic adjustment-system class, not
  a specific claim of shared tooling).
