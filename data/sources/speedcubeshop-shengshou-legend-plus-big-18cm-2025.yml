  MODEL-VS-VARIANT READING (DATA_MODEL §4.2): an 18cm/920g cube cannot be produced from either
  existing Legend model's mould (56.5mm or 70mm) by choosing different parts, materials, or
  treatment at assembly — the size difference is an order of magnitude greater than the
  56.5mm-to-70mm jump that already justified splitting shengshou-legend-big into its own model
  from shengshou-legend-original. This reads as a THIRD, larger design in the same naming
  family, i.e. a candidate for a new `shengshou-legend` family model, not a variant of
  `shengshou-legend-big`. THE TAXONOMY IS FROZEN; no model was created. Recorded here as
  evidence for a future pass with model-creation authority. See
