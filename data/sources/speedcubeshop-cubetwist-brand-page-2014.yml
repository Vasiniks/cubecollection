# P26-5 Agent A (CubeTwist 3x3x3 adjudication). Independent third-retailer brand recognition:
# SpeedCubeShop (a major US/Western speedcubing retailer, unrelated to Cubezz/Lightake's
# China-based dropship channel) carried a dedicated CubeTwist manufacturer/brand page and
# brand logo from at least 2012 (accessory listing) through 2014 (dedicated /cubetwist brand
# page), independent evidence that "CubeTwist" was a recognised brand name in the Western
# speedcubing retail market too, not solely a China-market wholesale label. Weaker evidence
# than the Cubezz/first-party findings for the specific standard-3x3x3 product, since the
# captured brand-page snapshot itself lists no live products under the brand at that moment.
