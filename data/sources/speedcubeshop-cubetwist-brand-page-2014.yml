excerpt: |-
  A dedicated manufacturer/brand landing page at path `/cubetwist` (OpenCart's standard
  `route=product/manufacturer` brand-page pattern), with its own brand logo asset
  (`image/cache/data/Brands/cubetwistLOGO-80x80.jpg`, first captured 2013-11-21) and its own
  listing in the site's "Brand" filter alongside the site's other named puzzle manufacturers.
