  Octahedron", "VeryPuzzle Clover Octahedron Fragmentation", "VeryPuzzle Eliac Puzzle", and
  others — no standard WCA-legal 3x3 among them, all shape mods, Megaminx-family ("Minx+"), and
  other non-3x3 twisty puzzle categories.
