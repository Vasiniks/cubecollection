reliability_note: |-
  Tier 2 retailer, structured spec-table field ("Manufacturer: ESCube") plus independent
  descriptive prose corroborating SpeedCubeShop's "dual-adjustment core for independent spring
  compression & tension" claim for the same ES3 line (speedcubeshop-es3-debut-brand-2025) —
  two independent Tier 2 publishers agreeing on the mechanism, per DATA_MODEL rule 9. Note this
  page's title uses "ESCube ES3" (brand-word "ESCube" prefixed onto the product name "ES3"),
  the same pattern TheCubicle uses on its "ESCube Air" listing — i.e. TheCubicle's own naming
  convention treats "ESCube" as a brand/manufacturer tag applied uniformly to both of its
  ES3 and Air product-line pages, not as a name asserting these are two unrelated brands. See
  research/qc/pass3-b4-agent-c-identity.md Question 1 for the full naming-boundary analysis.
  "Gross Weight: 122g" here is notably different from SpeedCubeShop's "77.6g" for what is
  presented as the same base/Standard configuration — consistent with the same gross-vs-item
  weight-convention gap already documented on escube-es3-v1.yml and escube-air-v1.yml; not
  adjudicated here.
