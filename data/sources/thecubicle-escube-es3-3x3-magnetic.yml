excerpt: |-
  Page title: "ESCube ES3 3x3 (Magnetic)". Product Description: "The ESCube ES3 3x3 (Magnetic)
  is a high-speed 3x3 built for competitive cubers, featuring a Dual Adjustment System for
  tool-free tuning of tension and spring compression. With track-shaped magnets and a 90° full
  corner-cutting design (55° forward 35° reverse), turning is ultra-smooth and precise. The
  ES3's Dual Adjustment System is specifically designed so that tension and spring compression
  are completely independent... omnidirectional magnetic system ensures perfect alignment
  between corners, edges, and core." Structured "Product Specifications" table: "Manufacturer:
  ESCube / Type: 3x3 Speed Cubes / Added: 2025-04-08 / Gross Weight: 122g / Magnets: Magnetic."
