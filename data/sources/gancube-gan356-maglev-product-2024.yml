reliability_note: |-
  Tier 1, the manufacturer's own product page.
  ESTABLISHES: a product weight of 81.2 g; a magnetic-levitation mechanism using attraction and
  repulsion in place of a spring; 6 elasticity levels and 6 centre-travel settings; and 76
  magnets distributed across the cube's axes, edges and corners.
  DOES NOT ESTABLISH: a release date, a size, or a coating. Note also that this page describes
  the GAN356 MagLev generally and says nothing about the UV-coated configuration, which is
  evidenced separately by thecubicle-gan356-maglev-uv-2023.
  MARKETING REGISTER, READ PER RESEARCH_SPEC 3.3. "Unleash Peak Performance" and "feather-light
  handling" are advertising and are not treated as specification; "81.2 grams", "76", "6 and 6"
  and "over 30°" are numeric claims about the product and are.
