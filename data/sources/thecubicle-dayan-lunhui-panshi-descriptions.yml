  DaYan LunHui 2017, captured 2020-09-20 (https://web.archive.org/web/20200920id_/https://www.thecubicle.com/products/dayan-lunhui-2017):
  "The DaYan LunHui 2017 is a new 3x3 that retains the same dense feel of the original LunHui."

  DaYan PanShi, captured 2020-09-22 (https://web.archive.org/web/20200922id_/https://www.thecubicle.com/products/dayan-panshi):
  "The DaYan PanShi is DaYan's highly anticipated 6th cube in its 3x3 series. As the name
  suggests, the PanShi is intended to be sturdy as a rock. As of early 2014, production of the
  DaYan PanShi has been stopped indefinitely by the manufacturer. As we are no longer able to
  obtain more of this product, it has been discontinued."
