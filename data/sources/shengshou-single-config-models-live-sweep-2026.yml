  belongs to shengshou-fangyuan-original (already a separate, multi-variant model, out of this
  lane's scope) — no equivalent gift-box slug exists for shengshou-fangyuan-v2-m specifically.

  **Full unscoped CDX prefix sweep, speedcubeshop.com/products/shengshou* (774 distinct URLs,
