excerpt: |-
  **Live TheCubicle Shopify JSON, fetched 2026-09-12, one per target model:**
  - shengshou-3x3 ("ShengShou 3x3"): options=[Color: Black, White]; two variants, same price
    ($4.99), same grams (104). COLOUR-ONLY split, no description differentiates them.
  - shengshou-big-legend-3x3-7-0cm ("ShengShou Big Legend 3x3 (7.0cm)"): options=[Color: Black,
    White]; two variants, same price ($7.99), same grams (141). COLOUR-ONLY.
  - shengshou-pearl-3x3 ("ShengShou Pearl 3x3"): options=[Color: Black, White]; two variants,
    same price ($13.99), same grams (100). COLOUR-ONLY.
  - shengshou-wind-3x3 ("ShengShou Wind 3x3"): options=[Color: Black, White]; two variants, same
    price ($6.99), grams 95/100 (shipping-weight noise, not a spec difference). COLOUR-ONLY.
  - shengshou-rainbow-3x3 ("ShengShou Rainbow 3x3"): options=[Color: "Stickerless (Dark)",
    "Stickerless"]; two variants, same price ($5.99), same grams (100). `body_html` reads only
    "The ShengShou Rainbow 3x3 is ShengShou's first stickerless 3x3 cube. It delivers solid
    cubing performance while coming at a very low price point" — no text distinguishes the two
    beyond the option label itself. COLOUR-ONLY (a darker vs. brighter stickerless plastic tone).
  - shengshou-fangyuan-v2-m ("ShengShou FangYuan V2 M 3x3"): options=[Color: Black] — a SINGLE
    value, not even a colour split. One sold configuration.
  - shengshou-gem-3x3, shengshou-mr-m-3x3, shengshou-mr-m-s-3x3, shengshou-tank-3x3,
    shengshou-yufeng-3x3-m-magnetic-core-magelev, shengshou-yufeng-v2-3x3-m: each options=[Color:
    Stickerless] — a single value. One sold configuration each.
  - shengshou-mr-m-v2-3x3 ("ShengShou Mr. M V2 3x3"): options=[Color: Black] — a single value.
    One sold configuration.

  Per DATA_MODEL §4.1/hard-constraint policy, a body-colour-only split (Black/White, or
  Stickerless "Dark"/plain) with no other stated distinction is NOT a variant-worthy axis
  ("Do not treat retailer SKUs as automatic variants" and the explicit colourway-only exclusion)
  — the precedent already applied archive-wide to e.g. DaYan Bermuda's Black/White collapse. All
  five colour-split findings above are REJECTED as configuration axes on this basis; the other
  eight targets show no split of any kind, colour or otherwise.

