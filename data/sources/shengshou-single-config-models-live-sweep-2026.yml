  2019-2026, re-run fresh this session as `npm run wayback -- prefix
  https://www.thecubicle.com/products/shengshou --limit 2000`):** grepped for every target
  model's slug family. Confirms exactly ONE 3x3 product path each for shengshou-3x3,
  shengshou-fangyuan-v2-m, shengshou-gem-3x3, shengshou-big-legend-3x3-7-0cm, shengshou-mr-m-3x3,
  shengshou-mr-m-s-3x3, shengshou-mr-m-v2-3x3, shengshou-pearl-3x3, shengshou-rainbow-3x3,
  shengshou-tank-3x3, shengshou-wind-3x3, shengshou-yufeng-3x3-m-magnetic-core-magelev,
  shengshou-yufeng-v2-3x3-m. No DIY, unstickered, size, magnet, UV, frosted, MagLev, ball-core
  or anniversary-named sibling slug exists for any of these 13 (a targeted grep for
  "diy|lite|uv|frosted|maglev|ball.?core|anniversary" across the full 474-URL list returns only
