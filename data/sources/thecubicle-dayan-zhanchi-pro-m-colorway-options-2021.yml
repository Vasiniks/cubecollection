reliability_note: |-
  Tier 2 for the price/options list -- TheCubicle's own structured selector and per-option
  pricing, first-party retailer data, strong evidence that three distinct colourways were sold
  as separately priced SKUs. The "[CPS Serviced]" pairing is read at face value from the page's
  own explanatory text ("these are set up by... with our in-house lubricants") and is NOT
  treated as a fourth or fifth colourway -- it is the checkout-time lube-service add-on
  DATA_MODEL §4.3 excludes from variant status ("An optional service selected at checkout on a
  cube the buyer already chose is not [a variant]").

  The customer-review text is user-generated content hosted on a retailer page, not the
  retailer's own copy -- held at tier 4 for that portion specifically (corroborates only, never
  establishes alone), independent of the tier-2 rating given to the structured price/options
