excerpt: |-
  Price/option list on the page: "Black - $34.99 USD", "Stickerless (Bright) - $34.99 USD",
  "Light Green - $37.99 USD", "Black [CPS Serviced] - $39.99 USD", "Stickerless (Bright) [CPS
  Serviced] - $39.99 USD". The page's own "Options" selector lists exactly three base colour
  choices -- "Black", "Stickerless (Bright)", "Light Green" -- with "SELECTED: Black" as the
  page's default. Directly beneath the price list, the page explains the two "[CPS Serviced]"
  entries itself: "With Lube Service (+$5.00) *These are set up by the Cubicle Pro Shop (CPS)
  with our in-house lubricants, and are ready for immediate shipment. Highly recommended when
  available!" -- an optional lubrication add-on layered on top of a chosen colour, priced at a
  flat +$5.00 over every base option, not a fourth DaYan-sold configuration.

  Customer reviews embedded in the same capture (TheCubicle's own review widget, attributed
  first-name + last-initial + country): Jarad L. (United States): "I got this cube in the green
  plastic with rubber stickers and it is amazing." W.T. (United States): "it's nice but be aware
  the black and green are not identical I just got the black one and it does not have the same
  rubbery tiles like the green one does."
