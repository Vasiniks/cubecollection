reliability_note: "Machine-translated working sense, original retained verbatim above: 'Ganspuzzle focuses on providing players with professional speedcubes; the Ganyuan No.2 (GAN2) is a cube designed for advanced players. [...] Designer: Jiang Ganyuan, online handle \"gan\", veteran speedcuber, champion of the 2006/07 Guangzhou Cube Open 3x3 speed event, first in China to publish the CFOP method, commonly known as the \"gan technique\". This cube is his second independently designed cube.' First-party product copy naming the founder and confirming, by stating this is his 'second' design, that an earlier cube (matching speedsolving-wiki-gan's tier-4 claim of a 2011 'Ganspuzzle I') already existed by this capture date. Not independent corroboration of the Ganspuzzle I release year on its own — it establishes relative sequence (a first design existed before this one), not an absolute date for it."
