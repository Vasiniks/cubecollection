reliability_note: |-
  Tier 2 retailer. The structured "Magnets: None" field is the key discriminator against the
  "Connected" (Magnetic) sibling's "Magnets: Moderate" — a real, structured, non-magnetic vs.
  magnetic hardware split under the same retailer's own taxonomy, not a wording difference.
  "No charging required. Battery included" mirrors GoCube-X's own manufacturer-stated CR1225
  coin-battery, non-rechargeable power architecture (getgocube-com-2021-gocube-x-product) in
  kind, though no source found this pass states the two use the identical battery part or
  identical dimensions — Size and Weight are simply not given for this listing. "Brand: Spin
  Master" (Rubik's/Spin Master's own corporate parent) rather than "Brand: GoCube" (used on the
  sibling "Connected"/Magnetic listing by the same retailer) is read as a retailer-internal
  taxonomy inconsistency and treated as weak, non-decisive evidence only — see
  research/qc/pass3-b4-agent-c-identity.md Question 2 for the full reasoning, including why this
  is NOT treated as sufficient to record a `rebrand_of` relationship to particula-gocube-x.
