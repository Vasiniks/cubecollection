excerpt: |-
  Page title: "Rubik's ConnectedX 3x3 - Bluetooth Smart Cube". Description: "Do you have what
  it takes to connect and solve the world's favorite puzzle? Evolve your solve with the Rubik's
  ConnectedX 3x3 Cube. Track your every twist and turn with ConnectedX's Bluetooth
  integration... With tracking accuracy of 0.001 seconds... Start solving right from the box,
  no charging required. Battery included." A "Version" selector offers "Connected X" (this
  page) and "Connected" (linking to speedcubeshop-rubiks-connected-3x3-magnetic-2025).
  Structured "Product Details" block: "Type: 3x3 / Brand: Spin Master / Magnets: None." Size,
  Weight, and Released fields are present as labels but left blank/unpopulated on this listing
  (checked again on a 2025-09-28 capture of the same URL — still blank). Price at this capture:
  $66.95, vs. $59.95 for the "Connected" (Magnetic) sibling listing.
