excerpt: |-
  "GoCube $79.95 $100.00 ... SKU: GC33A / Category: cube. Get GoCube and experience a new world
  of cubing. Learn, improve, play and battle with other Cubers around the world... Note: Get the
  Edge version to access the group and friends battle modes, accurate tracking, advanced
  statistics, and leaderboard. (please review the comparison table for details) GoCube kit comes
  with GoCube and a customized USB charger." Feature table "GoCube VS GoCube Edge": Tutorial
  (both), Mini Games (both), Online Battles "Limited*" for GoCube vs. full for GoCube Edge,
  Leaderboard, "Tracking accuracy 0.25 sec [GoCube] / 0.001 sec [GoCube Edge]", Advanced
  Statistics (Edge only). Footnote: "*Groups & friends modes are only supported by GoCube Edge
  (GoCube enables only battles with random players)."
