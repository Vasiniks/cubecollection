reliability_note: "Tier 1, first-party. This is the manufacturer's own direct feature
  comparison between 'GoCube' (this product, SKU GC33A) and 'GoCube Edge' (SKU GC33E, see
  getgocube-com-2019-gocube-edge-product): a 250x difference in stated tracking accuracy
  (0.25 sec vs 0.001 sec), consistent with different sensor/IMU hardware rather than a firmware
  difference alone, used as identity evidence for treating GoCube (Basic) and GoCube Edge as
  distinct models. No dimensions or weight are given on this page for the base GoCube; no other
  retailer (TheCubicle, SpeedCubeShop) was found in this pass to have carried a standalone
  'GoCube Basic' 3x3 listing, so this model's size_mm/weight_g remain unset."
