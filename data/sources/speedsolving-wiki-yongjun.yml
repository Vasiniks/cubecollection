excerpt: |-
  "YongJun (Chinese: 永骏, and often known as YJ)", also referred to as "Yongjun Plastic
  Products Factory". Founded "unknown", "Years Active: 2010-present". "Around 2012 they also
  created a separate sub-brand called MoYu as a production platform for third-party puzzle
  designers, which is why you can see a YJ logo on all MoYu boxes today." Describes the MGC,
  "released May 2018", as YJ's own budget-flagship line with "a strong magnetic positioning
  system", later followed by "MGC V2" and "MGC Elite".
