excerpt: |-
  Product Description, verbatim: "The GAN 356 M is a modern, mid-range magnetic 3x3 speed cube.
  This version comes with GAN's unique hand-adjustable Numerical IPG Core and a set of spare GES
  nuts. The GAN 356 M checks off all the needs speedcubers have for a nice magnetic 3x3, and
  makes a good cube of choice for cubers who like GAN engineering with a si[mpler...]"

  Product Specifications table: "Manufacturer: GAN", "Dimensions: 56.0mm3".

  NO ITEM WEIGHT APPEARS ON THIS PAGE, unlike the GAN 356 M Lite page which states 74.0g. That
  absence is recorded rather than filled from the sibling: restating another page's figure as
  though this source carried it is the defect class rule 48 exists to catch.

  A NOTE ON THE DESCRIPTION. The body copy is the BASE GAN 356 M description verbatim and does
  not mention the coating at all — only the product TITLE does. The coating claim therefore rests
  on the retailer's own product name and its distinct product handle, not on descriptive copy,
  and the variant record says so rather than implying the page describes the finish.
