excerpt: |-
  Fetched 2026-09-19 from the brand facet endpoint. The facet returned 82 products for the
  ShengShou collection, well under the 250 limit, so this is the COMPLETE current collection and
  not a truncated page.

  Filtering every returned product on "metallic" in its title or handle gives FOUR results, and
  these are all of them, verbatim with their Shopify product_type:

    "ShengShou Metallic Pyraminx (Magnetic)"        handle shengshou-metallic-pyraminx-magnetic
                                                    product_type: Pyraminx
    "ShengShou Metallic 5x5"                        handle shengshou-metallic-5x5
                                                    product_type: 5x5
    "ShengShou Mirror Cube 3x3 (Metallic)"          handle mirror-cube-metallic
                                                    product_type: Mirror Puzzle
    "ShengShou Mirror Cube 3x3 (Magnetic, Metallic)" handle mirror-cube-magnetic-metallic
                                                    product_type: Mirror Puzzle

  THERE IS NO PLAIN 3x3 UNDER THE "METALLIC" NAME. The only two carrying "3x3" in their titles
  are Mirror Cubes, typed by the retailer itself as "Mirror Puzzle".

  Direct product-handle fetches for shengshou-metallic-3x3, shengshou-metallic-3x3-magnetic and
  shengshou-metallic-cube-3x3 each returned HTTP 404 in the same pass.
preservation_note: >-
  Facet endpoints are never archived — measured archive-wide, 34 of 34 such URLs are
  excerpt-only and CDX returns nothing for them — so `preservation_method: excerpt` is correct
  and PERMANENT here, per RESEARCH_SPEC 3.6a. The excerpt reproduces the complete filtered result
  plus the unfiltered total, which is what that rule requires.
