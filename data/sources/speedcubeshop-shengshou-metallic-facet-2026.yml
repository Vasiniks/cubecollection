reliability_note: |-
  Tier 2, the retailer's own structured product feed rather than rendered marketing copy.

  WHAT IT SETTLES. P26-11 suspected, in its own counterevidence, that "Metallic" reads as a
  finish-naming convention rather than a metal-shelled novelty line. The facet supports exactly
  that: the name is applied across a Pyraminx, a 5x5 and two Mirror Cubes — different puzzle
  types sharing a finish word, not a product line with a 3x3 in it. Nothing in this archive's
  3x3 scope exists under the name.

  WHAT IT DOES NOT SETTLE, stated rather than glossed: this is TODAY's catalogue. The lead cited
  a 2023-09-28 first-capture date, so a since-discontinued Metallic 3x3 is not excluded by a live
  facet. Settling that would need an archived capture of this collection, and facet URLs are not
  archived — which is the same limitation recorded above, working against the question this time.
