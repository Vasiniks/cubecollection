reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: the product's existence and currency (2024-2025); its Shopify product id and SKU,
  which together establish that the two SpeedCubeShop paths are ONE product renamed; a
  core-corner magnet arrangement; 48 factory-installed magnets; 6 spring compression settings;
  and a stickerless body option.
  DOES NOT ESTABLISH: the corner-edge ("piece") half of the magnet configuration. This page says
  "core corner/core magnets" and gives a count; it is thecubicle-yj-appari-3x3-2024 that states
  "core-corner magnets, classic corner-edge magnets" explicitly. The two retailers use
  independent wording for the same mechanism — "Speed-Micro Actuator" against "Speed Micro
  Bearing" — which is what makes them independent corroboration rather than one copied listing
  (RESEARCH_SPEC 3.2), but only one of them carries the full magnet claim.
