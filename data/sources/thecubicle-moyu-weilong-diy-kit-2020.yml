reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that the original MoYu WeiLong was sold in a DIY (unassembled) configuration
  alongside an assembled one, and that the retailer treats them as two forms of one product.
  DOES NOT ESTABLISH: a release date, the puzzle's mass or dimensions, or what MoYu itself
  called the configuration — "DIY Kit" is the retailer's product title and category value.
