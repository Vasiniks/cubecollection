excerpt: |-
  Page title as captured: "MoYu WeiLong - DIY Kit – TheCubicle".

  Product Description, verbatim: "This is the Do-It-Yourself (DIY) version of this product. To
  see the Assembled version of this product, please click here. The MoYu WeiLong features a
  different internal design that makes it smoother and less clicky than the MoYu HuanYing."

  A DATED REVISION NOTE ON THE SAME PAGE, verbatim: "Note: As of December 12, 2013, the Black
  WeiLong DIY Kit now comes assembled but with the stickers on the side."

  Purchase options offered, verbatim: "MoYu WeiLong - DIY Kit - Black" and "MoYu WeiLong - DIY
  Kit - White".

  Specifications table, verbatim and complete: "Manufacturer: MoYu", "Type: DIY Kits",
  "Added: 2018-11-07", "Gross Weight: 114g". No dimension is given anywhere on the page.

  THE RETAILER PAIRS THE TWO ITSELF: "This is the Do-It-Yourself (DIY) version of this product.
  To see the Assembled version of this product, please click here" is the seller naming two
  forms of ONE product.
preservation_note: >-
  Capture 20200927015049 fetched 2026-09-12 and read in full. NEITHER "Added: 2018-11-07" NOR
  "Gross Weight: 114g" IS RECORDED AS A PRODUCT FACT, and this page is part of what proves both
  refusals rather than merely asserting them. The same "Added" day appears on four separate
  TheCubicle products read this session — this one, the DaYan LingYun V2 DIY kit, the DaYan
  LunHui DIY kit and the MoYu WeiLong GTS Unstickered — covering products released between 2011
  and 2016, so it is a catalogue-ingestion stamp. The same 114g gross weight appears on this page
  and on the DaYan LingYun V2 DIY kit, two different puzzles, which is the behaviour of a
  packaging figure and not of a measurement.
  THE 2013 REVISION NOTE IS PRESERVED BUT NOT ACTED ON. "As of December 12, 2013, the Black
  WeiLong DIY Kit now comes assembled but with the stickers on the side" describes the BLACK
  option only, and the page still sells the kit as a DIY Kit and still files it under "Type: DIY
  Kits". Splitting the variant on it would assert a boundary the retailer does not draw.
