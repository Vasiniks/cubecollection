reliability_note: |-
  Tier 2 retailer, structured spec content (Category/Size & weight/Core/Design block), naming
  this product "ES3 Air" — i.e. as a configuration/edition of the "ES3" line — where
  TheCubicle's independent listing for what is, on magnet-count and weight-class grounds,
  almost certainly the same physical product names it "ESCube Air" (a brand-scoped name,
  not an ES3-scoped one). Both agree on the "Air" name, the 20-magnet ball-core mechanism, and
  a similar timeframe (this capture 2026-04; TheCubicle's nearest capture 2026-02-28), which is
  why this source is used to CONFIRM `core_system: ball_core` for the escube-air model (two
  independent Tier 2 publishers agreeing, DATA_MODEL rule 9) — but the naming divergence itself
  is recorded as an unresolved family-boundary tension, not resolved by this agent (families
  are frozen for Pass 3; see the escalation note). The "~78g" weight figure is NOT treated as
  confirming or disputing TheCubicle's 132g "Gross Weight" for the same product — the two
  retailers appear to use different weight conventions (net item weight vs. gross/shipping
  weight), so both are recorded without adjudication and model-level `weight_g` is left unset.
