excerpt: |-
  "Particula, an Israeli startup creating connected toys that blend the offline and online
  worlds, has raised a $5 million Series A... With the new capital, the company will start
  production of several new consumer tech products, such as Rubiks Connected (in partnership
  with Rubiks), and GoDice... The connection with Rubiks goes back further. Particula's first
  product was a smart connected Rubiks cube known as the 'GoCube.' The toy... was used in the
  RedBull's Rubiks World Cup, a global virtual event. Founded in Netanya in 2018, the startup
  currently has 20 team members..."
