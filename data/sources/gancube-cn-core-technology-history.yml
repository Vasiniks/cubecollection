preservation_note: "Fetched directly via `npm run wayback -- get` on 2026-09-01 and confirmed to contain every dated passage quoted above verbatim, including the 2015/GAN356, 2018/GAN356 X, 2019/GAN356 i, 2020/GAN 11 M Pro '旗舰' (flagship), and 2021 magnetic-levitation-era passages. Note: the staging file `research/staging/variants/gan-axis-core-systems.yml` and others cite this content at the URL `gancube.cn/en/gancubes-core-technology/` (an /en/ path); that exact URL has no capture in the CDX index as of this pass (`npm run wayback -- list` on it returns no captures). Only the CN-language URL without /en/ (used here) is archived. This source record supersedes that citation for reconciliation purposes. RE-FETCHED AND REPAIRED 2026-09-12: the excerpt above previously preserved only the dated headline sentences, while three attestation notes in the archive quoted sentences from this page that the excerpt did not contain — the GAN356 X digital-adjustment sentence, the GAN356 X S wing-support sentence, and the GAN 11 M Pro omnidirectional-core-positioning clause. The capture was re-read in full and the excerpt extended so that every sentence the archive relies on is preserved here. The store navigation was added for the same reason: `families/gan-flagship-series` cites this source for a positioning claim that rests on GAN's own site navigation, which the earlier excerpt did not capture. No claim changed; the evidence for the existing claims is now actually present."
