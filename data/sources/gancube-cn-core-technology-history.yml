# research/notes/models/gan-pass2.md). The single richest tier-1 source located in this pass
# for dating the technology lineage that ties GAN356 (2015-2019), the GAN11-onward numbered
# flagship succession (2020-2021), and the GAN356 i smart line (2019) together as three
# distinct but chronologically interlocking design histories.
