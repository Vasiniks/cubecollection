reliability_note: |-
  Original Chinese retained verbatim above per RESEARCH_SPEC §3.6/3.7. Working translation of
  the load-bearing sentences: "From 2015, GAN first developed and fitted the first steel-plastic
  integrated IPG core on the GAN356." / "In 2018, the GAN356 X debuted the world's first
  digitally-adjustable core... in 2019 the GAN356 X S upgraded to a wing-shaped adjustable
  core." / "2019 was GAN's Year One of intelligence: the first-generation competitive-tier
  smart cube, the GAN356 i, arrived, and its most important smart hub was precisely this smart
  ball axis." / "This year [2020], GAN — the magnetic-force revolutionary — once again
  triggered a wave of magnetic-system change. The year's heavyweight FLAGSHIP (年度重磅旗舰),
  the GAN 11 M Pro, brought the global cubing community a long-awaited surprise: the magnetic
  core, fitted with 8 omnidirectional magnetic particles above the axis." / "In 2021, Magnetic
  Core 2.0 followed, announcing the beginning of the magnetic-levitation era." This is GAN's own
  first-party technology history and is tier 1 for its own product/technology dating; "旗舰"
  (flagship) applied to the GAN 11 M Pro is GAN's own positioning word for that product, not a
  third party's characterisation.
