excerpt: |-
  Product Description: "Get the QiYi Smart Cube 3x3 to step up your cubing game! This puzzle, alongside the free 'Smart Player' app, can help you improve with three different modes: individual exercise, global 1v1, and room competition. This cube has hand-adjustable tensions and comes with 48 magnets in the corners and edges. It boasts over 800 hours of battery life and comes with a spare set of springs to adjust elasticity. Get yours today and start improving now! The stickerless version is built for speed and has squared-off corners for more control. The black version is the \"Art Version\" which has rounded corners and gives you a very nostalgic, black plastic with stickers look." Product Specifications: Manufacturer QiYi; Type 3x3 Speed Cubes, Smart Cubes and Bluetooth; Gross Weight 160g; Magnets Magnetic.
