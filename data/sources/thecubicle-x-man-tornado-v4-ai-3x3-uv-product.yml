reliability_note: |-
  Tier 2, first-party retailer description. "the smart upgrade of the world-renowned Tornado V4" is treated as evidence this shares the V4 mechanical platform with electronics added (a variant-level smart/mechanical difference per DATA_MODEL section 4.1's explicit list, not a separate model), consistent with the qiyi-m-pro family's own precedent for QiYi/X-Man smart siblings. "Standard 55.5mm size" is used, at reduced confidence given it describes this specific smart variant rather than the mechanical V4 M Flagship page directly, as the basis for x-man-tornado-v4's own `specs.size_mm`.
