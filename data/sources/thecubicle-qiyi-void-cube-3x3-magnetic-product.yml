  "2025-03-17". body_html, verbatim: "The QiYi Speed Void Cube (Magnetic) is a unique twist on
  the classic 3x3 puzzle – literally! Unlike a standard 3x3 Cube, the Void Cube has no
  centerpieces, creating a hollow, ring-like appearance that's both visually striking and
  mechanically intriguing. This magnetic version has a 48-magnet edge/corner positioning system
  to make your puzzle more stable and allow for more control when turning. Despite its unusual
  design, the QiYi Speed Void Cube turns smoothly thanks to QiYi's signature engineering, making
  it great for both casual solving and cube collections. The absence of centers adds an extra
  challenge, as you'll need to rely solely on edge and corner positioning." One variant,
