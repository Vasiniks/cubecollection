reliability_note: |-
  Tier 2, retailer product page with structured Shopify fields.

  ASSESSED AGAINST RESEARCH_SPEC 2.1/2.4, per P4-2's own recommendation, AND NOT SETTLED —
  recorded honestly as such rather than guessed. Two things are clear from this source alone.
  First, this is a MODEL-layer question, not a variant-layer one: "no centerpieces" is a
  different internal geometry from every QiYi 3x3 model already in this archive, which under
  DATA_MODEL §4.2 fails the separability-at-assembly test outright — no choice of parts turns a
  solid-center 3x3 into one with none. Second, TheCubicle's own `product_type` here is
  "3x3,Shape Mods" (dual-tagged), unlike qiyi-fluffy-3x3's "Shape Mods" alone (fetched the same
  session) — the retailer itself treats this as partially a 3x3 and partially a shape mod, not
  cleanly one or the other.

  WHAT IS NOT SETTLED IS WCA LEGALITY, and nothing here should be read as answering it. This
  archive's own WCA primary source (wca-regulations-2026-04) holds Article 3 clauses on colour
  (3d/3d2), permitted modifications (3h), and size (3a+), but nothing yet held addresses the
  overall-shape/piece-completeness clause that would settle whether a Void Cube's missing
  centre pieces are WCA-compliant for the standard 3x3x3 event. Applying 3d2 or 3h here would be
  the same kind of regulation-to-object inference this archive made explicitly for
  rubiks-classic-cube--impossible/--phantom under P4-12 item (2) — and that inference is not
  made here because the specific clause it would rest on has not been located.

