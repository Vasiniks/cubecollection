excerpt: |-
  Page title as captured: "MoYu WeiLong GTS2 - DIY Kit – TheCubicle".

  Product Description, verbatim: "The MoYu WeiLong GTS2 is now available! This long-awaited remake
  of the WeiLong GTS features a more compact size, thinner and more vivid stickers, and an overall
  more comfortable handfeel, all while maintaining the enjoyable features of its predecessor. The
  GTS2 also features an all-new 3-piece corn[er design...]"

  WHAT THIS PAGE DOES NOT SAY, recorded because it bounds the claim. Unlike the DaYan DIY-kit
  pages (thecubicle-dayan-guhong-diy-kit-2020 and siblings), this page carries NO "This is the
  Do-It-Yourself (DIY) version of this product. To see the Assembled version... click here"
  sentence. Its body copy describes the GTS2 generally and never mentions assembly state at all.
  The DIY claim therefore rests on the product TITLE and the distinct product handle, not on
  descriptive copy — weaker evidence than the DaYan kits, and recorded as such.

  NO manufacturer, dimension or item weight field was present in the capture's spec table.
