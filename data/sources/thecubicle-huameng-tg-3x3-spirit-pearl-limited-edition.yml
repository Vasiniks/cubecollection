excerpt: |-
  Page title: "HuaMeng TG 3x3 Spirit Pearl (Limited Edition) [Pre-Order]". Product Description:
  "The HuaMeng TG 3x3 Spirit Pearl (Limited Edition) is a limited edition version of the
  recent HuaMeng TG flagship 3x3. This puzzle has a beautiful gold, red, and transparent theme
  that looks like fire directly from a dragon's mouth. The Spirit Pearl has stunning packaging
  and includes a custom cube box, custom inserts, an adjustment tool, and custom-cut stickers
  for all of you who enjoy solving your collector's puzzles. With only 999 being produced
  worldwide, this is something that will not be around for long." Structured "Product
  Specifications" table: "Manufacturer: HuaMeng / Type: 3x3 Speed Cubes / Added: 2025-07-22 /
  Gross Weight: 687g / Dimensions: 55.5mm3 / Magnets: Magnetic / Item Weight: 85.0g." (The 687g
  Gross Weight figure is anomalously high relative to every other TG configuration's ~218-226g
  and is almost certainly inclusive of the "stunning packaging" — custom cube box and inserts —
  described in the same paragraph, not a comparable product weight.)
