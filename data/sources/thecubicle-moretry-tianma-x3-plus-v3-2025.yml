reliability_note: "Tier 2, first-party retailer product-description prose. 'More precise
  molds' is a direct, specific tooling claim — per DATA_MODEL §4.2 ('Tooling differences ARE
  sufficient... if the internal geometry differs, it is a different design regardless of
  marketing'), this is model-identity-establishing evidence for treating TianMa X3+ as its own
  model rather than a configuration of the numbered V1-V4 line. No dimensions figure is given
  on this page. The customer review (tier 3 at best, corroboration only, not load-bearing on
  its own) is cited only to support the succeeds-V4 relationship, not any specification."
