excerpt: |-
  Product Description: "The Moretry Tianma X3+ is a more refined version of the original X3.
  This one has magnet capsules that are easier to install, more precise molds that make
  turning quieter and more predictable." Structured "Product Specifications": "Manufacturer:
  Moretry / Type: 3x3 Speed Cubes / Added: 2024-09-09 / Gross Weight: 310g / Magnets:
  Magnetic." Customer review (Torability): "I had installed core magnets [in the X3 V4] and it
  performed like a wrm v9... I ended up installing core magnets in this cube (tianma x3+) as
  well, then swapping the centers so I could keep the hefty maglev system which I had grown to
  love in the X3 V4" — independent (if informal) confirmation that the X3+ line carries over
  V4's MagLev centre system into a refined shell.
