excerpt: |-
  "Oskar van Deventer (born 1965) is a Dutch puzzle maker. He prototypes puzzles using 3D
  printing. His work combines mathematics, physics, and design, and he collaborates at academic
  institutions... Many of his combination puzzles are in mass production by Uwe Mèffert and
  WitEden... He was a Guinness World Record holder for his 17×17×17 'Over the Top Cube'
  Rubik's cube-style puzzle from 2012 to 2016... He has over 100 publications, over 80 patents
  applications, and hundreds of standardization contributions." Under "Mass-produced puzzles":
  "Mixup Cube: a 3×3×3 Rubik's cube that can perform 45° rotations on the middle layers,
  allowing centers interchange with edges. It was mass-produced by WitEden." — footnoted to
  "TwistyPuzzles.com > Museum > Mixup 3x3x3".
