excerpt: |-
  DaYan GuHong (V1), captured 2019-07-21 (https://web.archive.org/web/20190721124131id_/https://www.thecubicle.com/products/dayan-guhong):
  "This product has been discontinued indefinitely or we aren't sure when it will be back in
  stock." Listed under "Related Products in 'Discontinued'."

  DaYan GuHong V2, captured 2020-11-12 (https://web.archive.org/web/20201112id_/https://www.thecubicle.com/products/dayan-guhong-v2):
  "The GuHong returns with torpedoes! This more recent version of the DaYan GuHong feels
  smoother than its predecessor and does not pop."

  DaYan GuHong V3 M, captured 2020-09-27 (https://web.archive.org/web/20200927id_/https://www.thecubicle.com/products/dayan-guhong-v3-m):
  "The GuHong V3 M is a modernized version of the iconic GuHong 3x3 from DaYan. At just 54 mm,
  this cube is quite stable and features that swooshy TengYun feel that is quickly becoming a
  signature of DaYan puzzles."

  DaYan GuHong V4 M, captured 2020-11-18 (https://web.archive.org/web/20201118092650id_/https://www.thecubicle.com/products/dayan-guhong-3x3-v4-m):
  "The GuHong V4 M from Dayan is the latest in the GuHong series, a famous line of cubes dating
  back to 2010."

  DaYan GuHong Pro M 3x3 (54mm, Standard), captured 2024-01-26
  (https://web.archive.org/web/20240126030328id_/https://www.thecubicle.com/products/dayan-guhong-pro-m-3x3-54mm-standard):
  Product description: "The DaYan GuHong Pro M 3x3 is the latest release from the famous
  speedcubing brand. This 3x3 is magnetic, has a glossy outer finish, and turns well right out
  of the box. Choose between 5 different tension settings that you can adjust by hand! ... This
  is the 54mm standard version." Retailer's own spec table: Type "3x3", Dimensions "54.0mm",
  Item Weight "67.0g", Gross Weight "151g", Magnets "Magnetic". (The same table's "Added
  2023-08-31" field is a catalogue-entry date, not a release statement, and is not used as
  one — see RESEARCH_SPEC.md's forbidden "Added:" pattern.)
