reliability_note: |-
  Tier 2, first-party retailer listing, US-based but an independent publisher/catalogue from
  TheCubicle. Its own descriptive copy explicitly frames JieYun as breaking from typical FangShi
  characteristics ("defies every characteristic of a FangShi cube... traditional swishy feeling
  and light weight is not present here... core is very well reinforced") — independent,
  differently-worded corroboration that JieYun represents a substantive mechanical departure
  from its FangShi predecessors, not merely a sold configuration, consistent with (but not
  copied from) TheCubicle's "minor grooves on the pieces" and cubezz's "new design" language.
  This retailer also lists a "fangshi-jieyun-mini-3x3" product URL as of a 2022-12-05 crawl,
  but that capture resolves to a dead/redirected (HTTP 301) generic storefront page with no
  recoverable product content — recorded here as a lead (a Mini JieYun product slug existed on
  this retailer at some point) rather than cited as evidence of its content, since the claim
  cannot stand on this capture alone.
