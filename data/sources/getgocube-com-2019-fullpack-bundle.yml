reliability_note: "Tier 1, first-party, and dispositive on the model/variant boundary question
  for 'Full Pack': the page's own copy states the box 'Includes – GoCube EDGE' plus a charging
  stand, USB charger, and pouch — i.e. it is the GoCube Edge cube (SKU root GC33A, suffixed
  '-SP' for the bundle SKU) sold together with accessories, not a differently designed cube.
  Treated as packaging/bundle evidence only, per DATA_MODEL §4.1 ('packaging... only when it is
  the sole distinguishing feature of a separately marketed edition' — even then this stays a
  variant-level fact, never a model). No separate model record created for 'Full Pack' on this
  evidence."
