# source: speedcubeshop-yj-yuxin-magnet-facet-p4-9-lane-d-2026
# Created 2026-09-19, P4-9 Lane D, Task 1. Settles whether SpeedCubeShop ever sold a
# NON-magnetic "YJ YuLong V2" or "YuXin Little Magic V2" under those exact bare names — the
# ambiguity `research/qc/p4-9-alias-blindness-2026-09-12.md` refused to resolve, because YJ and
# YuXin both sell magnetic and non-magnetic lines. Queried live via the vendor/brand facet
# (`/collections/<brand>/products.json?limit=250`), the same method as
# `qiyi-yj-yuxin-shengshou-vendor-facet-lane-b-2026`, for the two brands that facet did not cover.
