reliability_note: |-
  Tier 2, first-party retailer catalogue structure, vendor-gated (filtered on Shopify's own
  `vendor` field via the collection itself, not on title parsing).
  ESTABLISHES: SpeedCubeShop sells no product titled bare "YJ YuLong V2" or "YuXin Little Magic
  V2" without an explicit magnetic designator, as of 2026-09-19 — resolving the specific
  ambiguity raised in p4-9-alias-blindness-2026-09-12.md (YJ and YuXin both sell magnetic and
  non-magnetic lines, so a bare "V2" title COULD have denoted a distinct non-magnetic product;
  it does not here).
  DOES NOT ESTABLISH: that no non-magnetic V2 was EVER sold by any retailer at any time — this
  is a single live snapshot, not a historical sweep. Nor does it establish anything about
  specification, price, or release date.
