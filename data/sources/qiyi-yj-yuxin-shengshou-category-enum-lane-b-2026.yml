excerpt: |-
  Queried 2026-09-12: `/collections/3x3-speed-cubes/products.json?limit=250&page=N` at both
  hosts (TheCubicle: 3 pages, 581 products; SpeedCubeShop: 2 pages, 265 products — the same page
  counts `scripts/catalogue-gap.mjs` uses), then filtered to `vendor` in {QiYi, YJ, YuXin,
  ShengShou} and `product_type == "3x3"`.

  LINE COUNTS AGAINST METHOD 2 (VENDOR FACET), same manufacturer, same host, same day:
    TheCubicle     qiyi 27/27  yj 18/18  yuxin 16/16  shengshou 10/10   (M3/M2, exact match)
    SpeedCubeShop  qiyi 14/16  yj  6/6   yuxin  3/4   shengshou  2/2

  AT THECUBICLE THE TWO METHODS RETURNED THE IDENTICAL LINE SET FOR ALL FOUR MANUFACTURERS —
  zero lines found by one and not the other, in either direction, checked by normalised-name set
  difference, not just by count. At SpeedCubeShop, Method 3 (this source) undercounts Method 2 by
  2 lines for QiYi and 1 for YuXin; Method 2 never undercounts Method 3 at either host for any of
  the four. See the companion vendor-facet source for what those lines are (QiYi M Pro V3
  Flagship, QiYi Bubble, YuXin Digital Puzzle Cube) and their classification in
  `research/qc/p4-9-enumeration-methods-lane-b.md`.

  This asymmetry is consistent with SpeedCubeShop suppressing at least one tag/stock state
  (observed: "Backordered") from its live category collection while still serving it through the
  brand collection — a retailer-specific behaviour, not a general property of category
  enumeration, since TheCubicle's own category page did NOT suppress its equivalent new listing
  (qiyi-m-pro-3x3-v3-flagship, published_at 2026-09-11, present in both TheCubicle collections
  checked here).

  Full per-manufacturer per-host line lists (used to compute the above) are retained in this
  agent's working notes and reproducible from the URL pattern above; they are not transcribed
  here in full to keep this record legible — the counts and the named exceptions are the load-
  bearing content.
