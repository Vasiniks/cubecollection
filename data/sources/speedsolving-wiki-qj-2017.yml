excerpt: |-
  "QJ (QíJī, 奇积, meaning 'odd solution') is a Chinese puzzle brand. They have produced most
  of the classic puzzles including 2x2, 3x3, 4x4, 5x5 cubes, as well as the Pyraminx,
  Megaminx, Tetraminx, Square-1, and Skewb. They also produce a QJ timer which includes a data
  port that can be connected with a computer." Location: Guangdong, China. Founded: unknown.
  Products list includes only a bare "QJ 3x3x3" line item, with no named sub-models or
  generations.
