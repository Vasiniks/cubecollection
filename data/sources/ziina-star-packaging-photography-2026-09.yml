excerpt: |-
  IMAGE EXAMINED: the sole product image in TheCubicle's own product JSON for
  ziina-space-magnetic-3x3, src
  "https://cdn.shopify.com/s/files/1/0035/5205/1273/files/Ziina_20Space_20Magnetic_203x3_8e36d4e8-6efd-43de-9b2b-7482ffcfcd7b.jpg?v=1709317346",
  alt "Ziina Space Magnetic 3x3 - Stickerless". Native resolution 900x600 (verified by direct
  decode, not by the width/height Shopify reports in the tag). This is a genuine box-and-cube
  product shot: a retail box stands at left, the assembled cube at right.

  WHAT THE BOX SHOWS, read directly and by 5x-8x Lanczos-resized crops with contrast/sharpness
  enhancement of the same source pixels (no external image substituted):
  - Top-left corner of the box carries a small red rounded-rectangle logo badge with a
    superscript "TM", containing a stylized red/orange hand-drawn wordmark and a star shape.
    AT NATIVE RESOLUTION THE BADGE ITSELF IS BELOW THE LEGIBILITY FLOOR: it is roughly 30x30
    source pixels, and no amount of resampling recovers detail that was never captured -
    enhancement was attempted and is recorded as unsuccessful, not as absence of content.
  - Immediately below that badge, in a separate, larger, plain sans-serif line, the box prints
    "ZIINA STAR" in white-on-blue. This IS legible at native resolution and matches the known
    brand name exactly - it does not introduce a second identity.
  - Lower on the box face, Chinese text reads "星际" (xingji, "interstellar") set above the
    English word "SPACE", and "磁力三阶" (cili sanjie, "magnetic third order [cube]") set below
    it. Both are descriptive product-name translations paralleling the English name ("Space
    Magnetic 3x3"), not a company, brand or manufacturer name in Chinese.
  - No manufacturer name, factory name, address, or ICP/3C regulatory block is visible anywhere
    on the single face this photograph shows. Retail product photography standardly shows only
    the front face; back/bottom panels (where Chinese consumer packaging most often carries a
    manufacturer/factory line) are simply not photographed here.

  WHAT THE ASSEMBLED CUBE ITSELF SHOWS: one visible center cap carries a hand-drawn logo reading
  "ZIINA STAR" in blue ink with a star flourish - the same brand mark as the box badge, printed
  directly on the mechanism rather than only on retailer-controlled packaging or web copy. This
  is stronger than a vendor field because it is physically part of the product as photographed,
  but it still names only the already-known brand, not a manufacturer.
