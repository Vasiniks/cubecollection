reliability_note: |-
  Tier 3: retailer product photography, examined directly rather than read from alt text or a
  spec table. First-party for what a retailer chose to photograph and how the box is printed;
  NOT first-party for who manufactures the product, since the photograph does not show whichever
  panel (if any) would carry a factory/manufacturer line.
  ESTABLISHES: that the packaging's visible branding is a stylized "Ziina Star" wordmark and
  star logo, reinforced by matching text and by a matching mark on the cube's own center cap;
  that the box's Chinese text is a product-name translation, not a company name; and that the
  one small badge element too low-resolution to read carries no legible content beyond what the
  clear text beside it already gives (the brand name), so packaging photography did not surface
  a second, distinct manufacturer identity - a negative result on the box's front face only.
  DOES NOT ESTABLISH: who manufactures the product. Only one face of one box was available for
  examination; no back panel, bottom flap, or regulatory/factory block was seen, so this is not
  a complete packaging inspection and does not rule out such text existing on a panel not
  photographed. A failed read of one badge is not evidence that the badge contains nothing.
