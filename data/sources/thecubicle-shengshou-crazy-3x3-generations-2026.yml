reliability_note: |-
  Tier 2, first-party retailer product pages with structured spec tables — sufficient for
  `probable` model-existence and specification claims per the Pass 3 admission policy. None of
  the three pages states a manufacturer-declared release date; all "Added:"/crawl-timestamp
  signals are treated as existed-by upper bounds only, never release dates. The V1/V2 ring
  piece-count difference is the strongest evidence found this pass for treating the two as
  distinct design generations (models) rather than a single model with a version-labelled
  variant; the Jelly LE's 1400-unit-worldwide claim is treated as a quantifiable production-run
  specification (not marketing superlative) per RESEARCH_SPEC 3.3, and is the only concrete
  documented-collector-market signal found for this line — see
  research/qc/p26-5-agent-c-shengshou-crazy-rainbow.md for how this weighs on the
  scope_class(conditional vs reference_only) question, left as a recommendation for human
  review rather than decided by this source record.
