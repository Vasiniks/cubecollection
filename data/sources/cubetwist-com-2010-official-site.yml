# source: cubetwist-com-2010-official-site
# P26-5 Agent A (CubeTwist 3x3x3 adjudication). Independent tier-1 discovery: cubetwist.com
# was a real, operating first-party manufacturer website (Guangzhou, China) from at least
# 2009 through late 2011, not merely a retailer-side product-title prefix. The site's own
# top-level navigation names "三阶梯色魔方" ("3rd-order/3x3x3 CubeTwist Magic Cube") as a
# first-class product category, structurally parallel to its "二阶" (2x2x2), "四阶" (4x4x4),
# and "七阶" (7x7x7) categories, and separate from its own "异形梯色魔方" ("shaped/novelty
# CubeTwist Magic Cube") category -- i.e. the manufacturer's own catalogue draws exactly the
# line this archive draws between a standard 3x3x3 line and CubeTwist's novelty/shape-mod
# catalogue. This resolves the family-vs-model / line-identity question at tier 1: the 3x3x3
# line is the manufacturer's own declared category, not a retailer's incidental filing choice.
