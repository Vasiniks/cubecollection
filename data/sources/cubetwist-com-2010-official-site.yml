  Page title: "梯色魔方三阶原色--cubetwist梯色魔方|梯色魔方--梯色魔方--Powered by MetInfo" --
  directly pairs the Latin brand name "cubetwist" with the Chinese brand name "梯色魔方" in
  the site's own <title> tag. Top-level site navigation (product.php?class1=7): "二阶梯色魔方"
  (2nd-order CubeTwist Magic Cube), "三阶梯色魔方" (3rd-order/3x3x3 CubeTwist Magic Cube),
  "四阶梯色魔方" (4th-order), "七阶梯色魔方" (7th-order), "异形梯色魔方" (shaped/novelty
  CubeTwist Magic Cube -- a separate category from the 3x3x3 line), "梯色魔板" (CubeTwist
  puzzle board), "梯色贴纸" (CubeTwist stickers), "梯色魔方配件" (CubeTwist cube parts/
  accessories), "梯色魔方教程" (CubeTwist cube tutorials). The "三阶梯色魔方" nav link resolves
