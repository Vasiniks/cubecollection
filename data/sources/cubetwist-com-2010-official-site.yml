reliability_note: |-
  Tier 1, first-party manufacturer source. cubetwist.com's root domain was independently
  confirmed live and content-bearing (not merely registered) across multiple Wayback captures
  from 2010-06-26 through 2011-10-22 -- the 2011-10-22 capture (`archive.org/web/20111022221235/
  http://www.cubetwist.com:80/`) still shows a live banner-ad storefront with contact details
  (MSN cubetwist@hotmail.com, Skype cubetwist1, QQ 549900658). By 2012-01-04 the domain begins
  returning HTTP 302s, and every capture from 2014 onward (checked through 2021) is a parked-
  domain landing page ("cubetwist.com -- For search results please CLICK HERE / Inquire about
  this domain"); as of this session's live check (2026-09-08) the domain redirects to a
  domain-marketplace listing (atom.com), i.e. it has been squatted/resold and is not a current
  first-party presence. Treated as `link_status: dead` accordingly -- the citation is to the
  preserved 2010 capture, not the live domain. This is the only first-party CubeTwist source
  found anywhere in this archive's CubeTwist research to date (the frozen `cubetwist.yml`
  manufacturer record's own attestations record `/website: unknown, "No domain checked or
  located this pass"` -- this source fills that gap). The 2010-07-28 "更新时间" (last-updated)
  timestamp on the companion product page (see `cubetwist-com-2010-3x3-listing`) corroborates
  the site was under active content maintenance at that date, not a dormant placeholder.
