excerpt: |-
  SWEEP RUN 2026-09-11 for P4-10, which requires FIRST-PARTY OR SPECIALIST evidence of who
  manufactures Ziina cubes. Every avenue below was checked and every one came back empty.

  SPECIALIST DATABASE — Speedsolving wiki, three title forms, all HTTP 404:
    ?title=Ziina · ?title=ZIINA · ?title=Ziina_Star

  CANDIDATE FIRST-PARTY DOMAINS — all no-connect:
    ziinacube.com · ziina-cube.com · ziinapuzzle.com · ziinatoys.com · ziina.cn · www.ziina.cn
  (ziina.com resolves but is a UAE payments company with zero occurrences of "cube" or "puzzle"
  — recorded under P4-10 as a namespace trap, never to be cited as a manufacturer source.)

  MANUFACTURER DIRECTORIES:
    ziina.en.made-in-china.com — HTTP 404.
    ziinacube.en.alibaba.com and ziina.en.alibaba.com return HTTP 200 and LOOK like supplier
    storefronts. THEY ARE NOT EVIDENCE. A control request to
    nonexistent-brand-xyzzy.en.alibaba.com returns a page of the same ~90KB size, so Alibaba
    serves a generic page for ANY subdomain and a 200 there establishes nothing whatsoever.
    Recorded explicitly because the 200 is inviting and wrong.

  CHINESE-MARKET RETAILER — cubezz.com keyword search for "ziina": zero occurrences.

  THE ONE STRUCTURED LEAD, AND WHY IT DOES NOT ANSWER THE QUESTION. TheCubicle's product JSON
  for ziina-space-magnetic-3x3 carries tags "Manufacturer_Ziina" AND "Supplier_REX" — a supplier
  field distinct from the manufacturer field, which is exactly the OEM/distributor axis P4-10
  asks about. Tested against known brands on the same retailer:
    GAN    -> Manufacturer_GAN    + Supplier_GAN
    Maru   -> Manufacturer_Maru   + Supplier_Maru
    Lefun  -> Manufacturer_Lefun  + Supplier_Wells
    MoYu   -> Manufacturer_MoYu   + (no Supplier tag)
  LeFun is an established manufacturer in this archive and still shows a third-party supplier, so
  `Supplier_` records WHO THE RETAILER BUYS FROM, not who makes the product. "Supplier_REX" is a
  distribution fact and carries no information about Ziina's manufacturer. Neither REX nor Wells
  is a recorded manufacturer in this archive.
  The second Ziina product (ziina-lite-super-3x3) carries no Supplier tag at all.
