excerpt: |-
  Page title as captured: "DaYan LingYun V2 - DIY Kit – TheCubicle".

  Product Description, verbatim: "This is the Do-It-Yourself (DIY) version of this product. To
  see the Assembled version of this product, please click here. This is the second version of the
  DaYan LingYun. It features torpedoes and has a distinct, crispy feel. This cube is light and
  quick after lubing and is slightly smaller than its cousins, the GuHong and Zhanchi."

  Purchase options offered, verbatim: "DaYan LingYun V2 - DIY Kit - Black" (SKU 505_1_1) and
  "DaYan LingYun V2 - DIY Kit - White" (SKU 505_1_2), both priced 13.99 USD.

  Specifications table, verbatim and complete: "Manufacturer: DaYan", "Type: DIY Kits",
  "Added: 2018-11-07", "Gross Weight: 114g". No dimension is given anywhere on the page.

  Frequently Asked Questions, verbatim: "Why does the DIY Kit cost more than the Assembled
  version? The DIY Kit contains many small and loose parts, so it requires additional labor
  compared to Assembled cubes, including screening them for missing, incorrect, or broken parts
  and providing after-sale service."

  THE RETAILER PAIRS THE TWO ITSELF, which is what makes this a configuration rather than an
  inference. "This is the Do-It-Yourself (DIY) version of this product. To see the Assembled
  version of this product, please click here" is the seller naming two forms of ONE product.
preservation_note: >-
  Capture 20200927033537 fetched 2026-09-12 and read in full; every passage above is quoted from
  it. TWO FIGURES ON THIS PAGE ARE DELIBERATELY NOT RECORDED AS PRODUCT FACTS. "Added:
  2018-11-07" is one of this archive's documented TheCubicle catalogue-ingestion artefacts, not a
  release date — the LingYun V2 dates to 2011 and the page itself calls it the second version.
  "Gross Weight: 114g" is a PACKAGED figure, the rule-45 class; the LingYun V2 is a 54.5mm-class
  puzzle and 114g is not its mass. Neither is attested anywhere.
  NOTE ON THE "Assembled version" LINK. Its href is the legacy catalogue page
  thecubicle.us/dayan-lingyun-p-156.html, which is the unsuffixed LingYun path rather than a V2
  one. The page's own sentence "This is the second version of the DaYan LingYun" is what
  identifies the product, and it is preferred over a stale link target.
