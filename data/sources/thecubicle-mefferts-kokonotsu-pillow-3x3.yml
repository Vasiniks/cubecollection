excerpt: |-
  "The Meffert's Kokonotsu Pillow 3x3 is a non-traditional 3x3 puzzle variant that uses
  solid-colored blocks as colors instead of stickers. There are 9 colors in total, and the
  blocks must be arranged such that each color only appears once on each side in order to solve
  the puzzle." Product Specifications: "Manufacturer: Meffert's / Gross Weight: 128g." Customer
  reviews (unattributed to named reviewers beyond a first name/initial): "like the molecube this
  is a molecube, but the turning is great" and "This puzzle looks to be the same as the molecube
  puzzle that is sold in many physical stores... The molecule [sic] is a puzzle that isnt very
  much fun to solve because it is loud and clicks with ball bearings, but this puzzle looks more
  smooth."
