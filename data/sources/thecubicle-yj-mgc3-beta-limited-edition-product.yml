excerpt: |-
  Product Description: "The YJ MGC Beta 3x3 (Limited Edition) is a collector's release of the
  popular MGC Beta 3x3, available in two stunning transparent colors: green and pink. It
  features the signature MGC Beta design and feel, but is simply a cool collector's item
  without stickers. We recommend applying this sticker set to improve color contrast and make
  the cube suitable for actual solving. This limited edition release is perfect for collectors
  looking to own a unique, visually striking version of a fan-favorite puzzle." Purchase
  options: "Transparent Green - $29.99 USD", "Transparent Pink - $29.99 USD". The page's own
  "Versions" selector lists this as one of four sold MGC3 Beta configurations: "Magnetic"
  ($15.99), "8-Magnet Ball-Core + UV Coated" ($21.99), "8-Magnet Ball-Core + UV + MagLev"
  ($24.99), "8-Magnet Ball-Core + MagLev (Limited Edition)" ($29.99, this page's own
  configuration -- named without "+ UV" unlike the non-LE MagLev option). Product
  Specifications: Manufacturer YJ; Type 3x3 Speed Cubes; Added 2025-04-24 (catalogue-migration
  field, not a release date); Gross Weight 147g; Dimensions 55.5mm^3; Item Weight 82.0g;
  Magnets: Magnetic.
