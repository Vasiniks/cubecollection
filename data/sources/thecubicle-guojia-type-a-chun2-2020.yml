  Product Description: "The Type A Chun2 is a 3x3 cube that features a unique internal
  mechanism and steel parts for the edge pieces. It is currently only available in DIY Kit
  form. Disclaimer: The steel parts provided are designed for the Type A Chun1 since the
  Chun2's steel parts are no longer in production. The steel parts still fit, but glue may be
  required to hold all of the steel pieces in place. The cube is usable without the steel
  parts, although the feel of the cube is different without them." Structured "Specifications"
  table: "Manufacturer: GuoJia / Type: DIY Kits / Added: 2018-11-07 / Gross Weight: 103g."
  Marked "Discontinued" on this and the only other capture found.
