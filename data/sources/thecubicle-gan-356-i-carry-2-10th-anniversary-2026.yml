excerpt: |-
  Product Description: "The GAN356 i Carry 2 UV 3x3 (10th Anniversary Edition) is a version of
  the puzzle that celebrates GAN's 10th anniversary. This puzzle comes with a special edition
  sticker set (one side) and cube bag. The GAN 356 i Carry 2 offers over 2x the batter[y life...]"

  Product Specifications table: "Manufacturer: GAN", "Gross Weight: 245g". No item weight or
  dimension is given on this page; the base product's figures are on
  thecubicle-gan-356-i-carry-2-uv-coated-2025 and are NOT restated here as though this page
  carried them.

  WHY THIS IS AN EDITION AND NOT A MODEL. The page calls it "a version of the puzzle" in its own
  words, and what differs is packaging and a sticker set — a special edition sticker set (one
  side) and a cube bag — not a mechanism. It is sold under its own product handle, distinct from
  both the base and the UV-coated handles, so it passes the dedup test as a separate offering
  while remaining the same underlying design.
