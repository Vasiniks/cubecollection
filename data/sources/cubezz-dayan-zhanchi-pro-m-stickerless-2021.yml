reliability_note: |-
  Tier 2, first-party retailer listing, non-US. The structured "Color: Stickerless" field and
  the distinct SKU (DYZCPMC, separate from DYZCPMG below) are the load-bearing facts: an
  independent second retailer selling this colourway as its own SKU. The "Soft silica pasters"
  feature bullet is CUBEZZ'S OWN TEMPLATED BOILERPLATE, not evidence about this specific SKU --
  it is reused verbatim on this retailer's Light Green ZhanChi Pro M listing too
  (cubezz-dayan-zhanchi-pro-m-light-green-2021), and a stickerless cube cannot literally have
  sticker "pasters" at all. This is flagged explicitly, per the mandate's evidence-discipline
  instruction to report a probe's false-positive behaviour: a naive keyword sweep for
  "silica"/"paster" text across Cubezz's DaYan catalogue would wrongly read this bullet as
  differentiating evidence on every SKU it appears on. It is NOT used to support any claim in
  this archive about this variant's sticker material.
