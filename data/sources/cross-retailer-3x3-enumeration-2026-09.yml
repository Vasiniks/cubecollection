reliability_note: |-
  Tier 2, two independent first-party retailer catalogues, one of them non-US (Cubelelo, India) —
  which is what makes this a corroboration of the TheCubicle enumeration rather than a repetition
  of it. `region: US` records the primary locator (SpeedCubeShop) because the field takes one ISO
  code; the Cubelelo half of this record is IN, and that half is the reason the record exists —
  RESEARCH_SPEC 3.6a's non-US retailer requirement is met by it, not by the US half.
  ESTABLISHES: that a named product line was on sale at these retailers, and from when it was
  listed. DOES NOT ESTABLISH: release dates, specifications, model-vs-variant boundaries, or
  whether any line here warrants its own model record.
