excerpt: |-
  CDX prefix enumeration of https://www.thecubicle.com/products/mofang-jiaoshi-mini-3x3 returns:
  mofang-jiaoshi-mini-3x3-5-0cm (2019-07-18), mofang-jiaoshi-mini-3x3-4-5cm (2019-09-15),
  mofang-jiaoshi-mini-3x3-keychain-cube-3-5cm (2019-08-18, still resolving as of a 2025-12-30
  capture), mofang-jiaoshi-mini-3x3-keychain-cube-4-0cm (2020-09-27) — four distinct compact
  sizes (50mm, 45mm, and two keychain-scale 35mm/40mm formats), consistent with the
  Speedsolving wiki's description of "A series of smaller 3x3x3s that are produced in sizes of
  50mm, 45mm, 40mm, 35mm and 30mm" (speedsolving-wiki-mfjs-products); a 30mm size was not
  independently found at this retailer this pass.
