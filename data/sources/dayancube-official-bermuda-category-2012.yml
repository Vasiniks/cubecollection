excerpt: |-
  Page 1 (2012-06-04, http://www.dayancube.com:80/dayan-bermuda-cube): main-nav "Products" list
  includes "Dayan Crazy Cube / DaYan II GuHong / DaYan III LingYun / DaYan IV LunHui / DaYan V
  ZhanChi / DaYan Gem Cube / Dayan Bermuda Cube" — "Dayan Bermuda Cube" is its own top-level
  official product-category entry, sitting beside the numbered flagship line, not a sub-item of
  it. Under that category page: "Dayan Bermuda Triangle Magic Cube Black (Earth)", "...White
  (Earth)", and the same Black/White pairing for Jupiter, Mars, Mercury, Neptune, Saturn,
  Uranus — eight planet names, each in both colors, all under the manufacturer's own
  "Bermuda Triangle" name (not "Bermuda Cube [planet]," which is a later retailer
  simplification — see thecubicle-dayan-bermuda-cube-2020).

  Page 2 (2012-07-17, http://dayancube.com:80/dayan-bermuda-cube?page=1): continues with
  "Dayan Bermuda Triangle Magic Cube White (Venus)", then four further officially-named
  sub-products, each in Black and White: "Dayan Bermuda House I Magic Cube", "Dayan Bermuda
  House II Magic Cube", "Dayan Bermuda Column Magic Cube", "Dayan Bermuda Star Magic Cube."

  Individual product page (2013-09-10, http://dayancube.com/Dayan-Bermuda-Column-Magic-Cube-
  Black): generic templated marketing copy shared across DaYan's whole catalog ("Brand new and
  high quality magic cube... Made of quality ABS material..."), no mechanism-specific
  (bandaging) description and no release date; "Price: $21.53"; cross-links to "Dayan Bermuda
  Triangle Magic Cube White (Jupiter) ($21.53)" as a related product, confirming Column and
  Triangle were concurrently on sale as siblings under the same official line.

  Retailer product photography (fetched directly this session from TheCubicle's own 2020-2021
  Shopify CDN image URLs, not reproduced in this excerpt) confirms these are not merely
  colorway names: "Column" (TheCubicle's "Barrel") is an octagonal-cylinder exterior shape,
  "House I" and "House II" are two distinct house/roofline exterior shapes, "Star"
  (TheCubicle's "Sunflower") is a star/flower exterior shape, and "Triangle" (TheCubicle's
  "Bermuda Cube [planet]") is a standard cube exterior shape with an irregular diagonal
  bandage-cut pattern — four genuinely distinct exterior molds under one official line, not
  colorway variants of a single mold.
preservation_note: "archive_url is the id_ (raw) Wayback capture of the 2012-06-04 page 1
