reliability_note: |-
  Tier 1, first-party manufacturer official site — stronger than dayancube-official-2013's
  bare front-page product-list mention of "Dayan Bermuda Cube," because this is a dedicated
  category page enumerating every named sub-product (Triangle/House I/House II/Column/Star) in
  the manufacturer's own words, not a single line in a navigation list. Sufficient on its own
  to confirm this is a genuine DaYan-official, multi-model product line (not a retailer
  category or fan-coined grouping), and to establish an "existed by 2012-06" upper bound for
  the line's introduction — earlier than any retailer capture found (TheCubicle's earliest
  Bermuda capture is 2019-09-15). Does NOT supply a stated release date, a bandaging-mechanism
  description in the manufacturer's own words, or WCA-legality language — those remain
  retailer-sourced (thecubicle-dayan-bermuda-cube-2020) or absent.
