# P26-5 Agent B (Bermuda adjudication). DaYan's own official site (dayancube.com) carries a
# DEDICATED product-category page for "Dayan Bermuda Cube" (distinct from the bare front-page
# product-list mention already recorded in dayancube-official-2013), captured 2012-06-04 and
# 2012-07-17 (page 2), plus an individual product page for one named sub-product
# (2013-09-10). This is materially stronger tier-1 evidence than a name-in-a-list: it is
# DaYan's own official site listing, by name, EVERY named sub-product of the Bermuda line —
# independently corroborating and substantially extending the retailer-sourced picture in
# thecubicle-dayan-bermuda-cube-2020 and cubelelo-dayan-products-prefix-2026.
