excerpt: |-
  CDX prefix enumeration of thecubicle.com/products/yj-mgc, run 2026-09-12, collapsed on urlkey
  and filtered to status 200. Reproducible with
  `npm run wayback -- prefix thecubicle.com/products/yj-mgc --limit 400`.

  Distinct product paths after discarding query-string and .js/.oembed duplicates, and after
  removing paths for puzzles other than 3x3 (2x2, 4x4, 5x5, Pyraminx, Square-1), verbatim:

    yj-mgc
    yj-mgc-3x3-sticker-set
    yj-mgc-est-3x3
    yj-mgc-est-3x3-customization-kit
    yj-mgc-evo-3x3
    yj-mgc-evo-ii-3x3
    yj-mgc-evo-ii-3x3-enhanced-core-positioning-edition
    yj-mgc-repulsion-3x3
    yj-mgc-sigma-3x3
    yj-mgc3-beta-8-magnet-ball-core-uv-coated
    yj-mgc3-beta-8-magnet-ball-core-uv-coated-maglev
    yj-mgc3-beta-limited-edition
    yj-mgc3-elite
    yj-mgc3-elite-v2-3x3
    yj-mgc3-ii

  WHAT THIS SWEEP FOUND THAT THE ARCHIVE DOES NOT HOLD, AND ALREADY KNEW IT DID NOT HOLD.
  `yj-mgc-sigma-3x3` names a product with no counterpart among the archive's nine MGC models —
  but this sweep did not discover that. Pass 4 Agent C had already found the Sigma, preserved it
  as `thecubicle-yj-mgc-sigma-3x3-product` (accessed 2026-09-03, with the fuller product
  description), and escalated it under ledger P4-9. This sweep independently reaches the same
  path, which is corroboration of the enumeration method and nothing more. `yj-mgc3-ii` is an open question:
  it may be this retailer's earlier path for the model the archive holds as yj-mgc-v2, for which
  no path appears in this sweep, and nothing here settles it.

  WHAT IT DID NOT FIND, which is equally the point of recording a sweep. No path in this
  enumeration corresponds to a coating, MagLev, size or edition configuration of the MGC
  original, EST, Evo, Repulsion, Elite or Elite V2 — six of the archive's nine MGC models that
  carry exactly one configuration each. Their single-configuration state is therefore SEARCHED
  at this retailer, not merely unexamined.
