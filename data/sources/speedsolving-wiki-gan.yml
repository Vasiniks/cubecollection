excerpt: "They released their first cube in 2011, the Ganspuzzle I and have since innovated in 3x3 [...] Gans was incorporated as a company in 2014, as Gancube [...] This includes putting magnets in 3x3s (which was a collaboration with Cubicle Labs to make the GAN 356 Air UM) [...] The GAN Air UM was released in January 2017. [...] It was the result of a collaboration between Cubicle Labs and GAN. Cubicle Labs did the magnetism, while GAN made the \"U\"."
