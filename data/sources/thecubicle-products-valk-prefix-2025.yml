excerpt: |-
  CDX prefix enumeration of https://www.thecubicle.com/products/valk returns captures spanning
  2019-01-29 through 2025-11-02, under a single "valk-*" naming pattern: valk2-m (2019-08-25),
  valk-3 (2019-01-29), valk-3-m (2019-05-12), valk-3-elite (2020-08-12), valk-3-power
  (2019-07-16), valk-3-power-m (2019-07-21), valk-3-mini-4-74cm (2019-12-15), valk-4-m-standard
  (2019-07-23), valk-4-m-strong (2019-12-09), valk-5-m (2019-10-20, still resolving 200 as of
  2025-11-02) — no "the-valk" or hyphenated "valk-3-mini-4.74cm" collection page was found under
  a dedicated /collections/valk or /collections/thevalk path in the same enumeration window,
  consistent with Valk being sold as a named product line via individual /products/ pages rather
  than its own standalone collection at this retailer as of the captures found.
