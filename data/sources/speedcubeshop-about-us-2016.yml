excerpt: |-
  "In 2009, Cameron Brown (owner), was growing tired of dealing with unreliable service and
  expensive shipping rates to order his cubes from Chinese stores. Cameron's dream was to start
  the first USA-based cubing store and help the cubing community get speedcubes quickly, and at
  low prices. ... Since 2009, SpeedCubeShop has continued to grow year after year, earning the
  trust of cubers world-wide. SpeedCubeShop is based in California."
