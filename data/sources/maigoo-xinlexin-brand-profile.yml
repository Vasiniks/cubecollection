  (Guangdong Xinlexin Science-Education Culture Co., Ltd. was established in 2000, headquartered
  in Chenghai District, Shantou City, Guangdong Province — known as "China's Toy City".) The
  page names "百变魔王" (Baibian Mowang) as one of Xinlexin's own brands, alongside "魔尺" (a
  twistable "magic ruler"/snake puzzle), "古迪积木" (Gudi building blocks), and spinning-top and
  yo-yo lines.
