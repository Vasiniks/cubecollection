reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that the GAN12 ui MagLev ships with a PowerPod charging case, and that the case
  differs in length and depth from the GAN12 ui FreePlay's while matching its height.
  DOES NOT ESTABLISH: any specification of the puzzle itself, or a release date.

  A SECOND PATH FROM THE SAME SWEEP IS LEFT OPEN, ON PURPOSE, AND IS NOT ADJUDICATED ABOVE.
  thecubicle.com/products/gan12-ui-maglev-3x3-powerpod-2026-edition (first capture 2026-06-16)
  is titled "GAN12 ui MagLev 3x3 (PowerPod, 2026 Edition)" and carries a different Shopify
  product id, 7995691008083, at 119.99 USD. Two distinct product ids means two listings — but
  TheCubicle's 2026 storefront is JavaScript-rendered and that capture preserves no description,
  so whether "2026 Edition" denotes an edition GAN itself declares or simply that year's stock
  of the same product is an open question. It stays a lead until a source settles it, and it is
  described here in wording chosen so that the lead counter continues to report it rather than
  treating this record as having disposed of it.
