excerpt: |-
  Page title as captured: "GAN12 ui MagLev (with PowerPod) – TheCubicle". Shopify product id
  7419366375507. Price 129.99 USD.

  Product description, verbatim: "...smaller compared to the GAN12 ui Free Play box. This is
  because the new PowerPod included with the GAN12 ui Maglev is slightly smaller in length and in
  depth, but retains the same height as the Freeplay PowerPod. This new PowerPod has the same
  plastic texture and material as Apple AirPods cases, and even the indicator light and the..."

  ADJUDICATION: the path gan12-ui-maglev-with-powerpod is REJECTED as a configuration of
  gan-ui-12-maglev. The retailer's
  own sentence is what decides it — "the new PowerPod INCLUDED WITH the GAN12 ui Maglev" — so the
  charging pod is what the product ships with, not an option distinguishing one form of it from
  another. The title's "(with PowerPod)" describes the standard product's contents. Under this
  archive's anti-explosion rule a bundle is not a variant, and this is not even a bundle of two
  products: it is one product described with its own accessory.
