reliability_note: |-
  Tier 4, self-assigned. This is the archive's own sweep record. It is admissible for exactly two
  things: (1) that distinct Alibaba.com wholesale product-detail pages for "Ziina"/"Ziina Star"
  exist and are search-indexed, across four regional subdomains, with OEM/ODM language and a
  shared "ZNX" model-number prefix - a genuinely new evidence class beyond the two retailers
  already on file; and (2) that a specific company attribution ("Shantou Chenghai District
  Paisier/Peisier Toy Firm") was investigated and found unverifiable, and must NOT be cited as
  fact.
  DOES NOT ESTABLISH: who manufactures Ziina, or whether the Alibaba account behind these listings
  is itself a factory or a trading company reselling factory output under its own label - the
  distinction P4-10's admission question turns on. Direct verification remains blocked by
  Alibaba's anti-bot layer, exhaustively re-tested this pass across both alibaba.com and its
  regional mirrors, desktop and mobile paths, and a third-party read-through proxy.
