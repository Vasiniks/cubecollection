reliability_note: |-
  Tier 2, first-party retailer product page — and first-party in the strongest sense here, since
  TheCubicle is describing a product its own staff made.
  ESTABLISHES: that TheCubicle produced and sold a black-with-white-caps shell-swapped WeiLong
  GTS, and the resulting cube's dimension and item weight.
  DOES NOT ESTABLISH: a release date, a production run size, or anything about MoYu's own
  colourway range. The source denies MoYu sold this configuration.
