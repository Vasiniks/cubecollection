excerpt: |-
  Page title as captured: "MoYu WeiLong GTS - Illusion – TheCubicle".

  Product Description, verbatim: "The MoYu WeiLong GTS - Illusion is the Black with White Caps
  version of the WeiLong GTS. This variant is not available from the manufacturer -- they were
  produced by our staff by swapping WeiLong GTS shells. Limited quantities available!"

  Product Specifications table: "Manufacturer: MoYu", "Dimensions: 56.5mm3", "Item Weight: 83.1g".

  THIS IS A RETAILER SERVICE PRODUCT, NOT A MOYU CONFIGURATION, and the page says so in its own
  words: "not available from the manufacturer -- they were produced by our staff by swapping
  WeiLong GTS shells." The spec table's "Manufacturer: MoYu" refers to who made the underlying
  cube, not who made this product. Recording it as a MoYu colourway would assert that MoYu sold a
  black-with-white-caps GTS, which this source explicitly denies.

  This is exactly the distinction the archive's `service` block exists for, and exactly the
  mis-reading its rules about retailer service tiers are meant to prevent.

  "Limited quantities available" is a stock statement, not a production run size. No number is
  given and none is inferred.
