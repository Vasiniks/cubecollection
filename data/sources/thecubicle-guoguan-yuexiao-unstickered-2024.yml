excerpt: |-
  Product Description: "The YueXiao is the first cube from GuoGuan, a new and exciting brand
  by MoYu. It features an appearance and design similar to that of the Cong's Design MeiYing,
  but with an all-new core design and more rounded edges. The cube turns very well right out
  of the box, and it has a slightly scratchy feeling to it. Note: This DIY Kit actually comes
  assembled but without any stickers (stock stickers + logo are included with the DIY Kit).
  This is ideal for someone who plans to resticker the cube anyway and doesn't want to take
  time removing the stickers. Please note that the cube is also not pre-lubricated from the
  factory to facilitate putting the stickers on." Structured "Product Specifications" table:
  "Manufacturer: GuoGuan / Type: DIY Kits / Added: 2018-11-07 / Gross Weight: 105g /
  Dimensions: 56.0mm3." Colour options offered: Black, White, Primary, Blue, Teal, Pink, Grey,
  Brown (all at the same clearance price, $4.99, discounted from $15.99).
