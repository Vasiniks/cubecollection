reliability_note: |-
  Tier 2, first-party retailer product page.
  ESTABLISHES: that the LunHui was sold in a DIY (unassembled) configuration alongside an
  assembled one; that the retailer treats them as two forms of one product; and that the DIY
  configuration was offered in black and white body colours at one price.
  DOES NOT ESTABLISH: a release date for either configuration, the puzzle's mass or dimensions,
  or what DaYan itself called the configuration — "DIY Kit" is the retailer's product title.
