reliability_note: "Tier 1, first-party. Resolves the pass-0 brief's open FZ/FangShi question:
  'FZ' at TheCubicle is a named in-house premium tuning/setup configuration applied to base
  cubes from other manufacturers (seen here on a GAN product; the pass-0 brief's fz-gan13-*,
  fz-gan15-* slugs are the same naming pattern), listed in TheCubicle's own navigation alongside
  other named tuning lines (Angstrom Research, Mystic, Cubicle Pro Shop) and its own Signature
  Series. It has no documented connection to FangShi (see data/manufacturers/fangshi.yml), an
  unrelated independent Chinese shape-mod puzzle manufacturer. Whether 'FZ' specifically stands
  for speedcuber Feliks Zemdegs is plausible (TheCubicle's Signature Series already credits
  named competitors elsewhere, per thecubicle-mattys-gan16-maglev-max-uv) but is NOT stated on
  this page or confirmed by any source found this pass — recorded as an open lead, not a fact."
