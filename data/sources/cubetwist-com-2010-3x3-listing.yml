reliability_note: |-
  Tier 1, first-party manufacturer source, same site and session as
  `cubetwist-com-2010-official-site` (see that record for the domain's live/dead history).
  No dimensions, weight, or explicit competition-legality statement is present on either page
  fetched -- this source establishes line identity, category placement, and the existence of
  multiple colour/finish configurations (original colour, black face, white face) plus a
  DIY-kit configuration, not physical specifications. Physical specs (57.0x57.0x57.0mm, 94.0g)
  for what appears to be the same or a closely related SKU come only from the later Cubezz/
  Lightake retailer listings (`cubezz-cubetwist-speed-3x3`, `lightake-cubetwist-speeding-3x3`);
  this source does not itself confirm those two figures refer to the identical physical product
  as "original colour"/"black face" -- recorded as a gap, not bridged by inference. The
  "三阶DIY散件" and "三阶白面" sibling items named in navigation were not independently fetched
  (their own showproduct.php?id= values were not captured by Wayback at the session's chosen
  timestamp) -- their existence is attested only via this page's own prev/next links, which is
  still first-party structured data, not a retailer's secondary claim.
