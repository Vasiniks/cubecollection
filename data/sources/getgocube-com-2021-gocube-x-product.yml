excerpt: |-
  "GoCube-X $39.95 [USD] $49.95 Sale! ... Gocube-X comes with: GoCube-X, Coin Battery included
  (secured). *FIRST BATCH of Products – SOLD OUT!* 2nd BATCH AVAILABLE IN EARLY NOVEMBER!...
  THIS IS the GoCube-X! A great starting point into the world of cubing! Now available in its
  classic shape at a great price! ... Smart Sensors Continuously track and measure activity.
  Bluetooth 5.0 Quality wireless connection. Low Power Battery Operated (Coin CR1225) Over 60
