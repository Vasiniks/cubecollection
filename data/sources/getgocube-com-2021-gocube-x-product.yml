  Tutorial, Mini Games, Speed Cube, Magnetic Cube, Online Battles, Lights, 3D Tracking listed
  per column; "Tracking accuracy: 0.001 sec" for all three; "Look & Feel: Classic shape, Neon
  stickers [GoCube-X] / Classic design, Stickers [Rubik's Connected] / Premium, stickerless
  [GoCube]." Site navigation at this capture: "Shop: GoCube / Rubik's Connected / GoCube 2x2 /
  GoCube-X / Accessories" — no separate 'Basic' or 'Edge' nav entries remain; 'GoCube' alone is
  now the flagship (formerly 'Edge'-branded) tier.
