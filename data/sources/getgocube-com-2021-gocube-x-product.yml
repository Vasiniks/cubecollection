reliability_note: "Tier 1, first-party. 'Now available in its classic shape' and the comparison
  table's own 'Classic shape... vs. Premium, stickerless' framing are read as GoCube-X using a
  standard (non-pillowed) shape against the then-current flagship 'GoCube' (Edge lineage)'s
  pillowed shape, though the word 'pillowed' is not used on this specific page (it is used on
  getgocube-com-2019-gocube-edge-product and thecubicle-gocube-edge-3x3-2020 for the Edge
  lineage). The CR1225 coin-cell power system is a stated hardware difference from GoCube/Edge's
  rechargeable-via-MicroUSB system (getgocube-com-2019-gocube-product); together with the
  dimensional difference already on record from thecubicle-gocube-x-3x3-2022 (57.0mm/103.0g vs.
  Edge's 60.0mm/125.0g), this is treated as design/mould-level identity evidence for GoCube-X as
  a separate model, not a configuration of Edge. 'FIRST BATCH... SOLD OUT... 2nd BATCH AVAILABLE
  IN EARLY NOVEMBER' establishes GoCube-X was already on sale and had sold out an initial batch
  before this 2021-10-27 capture, used only as a circulation `before` bound, not a release date."
