# GoCube's own official product page for "GoCube-X" at getgocube.com, captured via Wayback.
# Tier 1, first-party. Gives the key identity evidence distinguishing GoCube-X from GoCube
# Edge: a coin-cell (non-rechargeable) power system, "classic shape" (vs. Edge's pillowed
# shape), and a three-way "Compare cubes" feature/look-and-feel table.
