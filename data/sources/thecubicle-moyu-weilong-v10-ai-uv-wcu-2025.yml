  Capture 20250425092650 fetched 2026-09-12. The first fetch returned an undecoded body; the page
  was re-fetched with content-encoding negotiation before being read, which is why the title and
  specification table above could be quoted.
  "Gross Weight: 317g" IS NOT A PRODUCT WEIGHT — it is a packaged figure for a smart cube sold
  with a charging cable and box, and it is not attested anywhere. "Added: 2024-10-18" is a
  catalogue-ingestion stamp of the kind documented across this retailer and is not a release date.
  THIS RECORD DELIBERATELY ADMITS NOTHING. The archive's MoYu WeiLong line ends at
  moyu-weilong-v9; there is no V10, no WeiLong AI model, and therefore nothing for a "WCU Edition"
  variant to attach to. Creating any of them would be a model-layer change to a FROZEN inventory
  on the strength of one retailer title. This is exactly the class P4-9 adjudicated — it belongs
  with "MoYu WeiLong WRM V10", already classified confirmed_missing there — so the page is
  preserved now, while the capture resolves, and the decision is left to the taxonomy owner.
