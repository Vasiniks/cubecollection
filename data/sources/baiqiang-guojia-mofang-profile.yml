excerpt: |-
  "国甲魔方于2006年5月推出第一版" (GuoJia Rubik's Cube released its first version in May 2006),
  described as "国内最早专门针对魔方速度玩家推出的三阶魔方" (the earliest domestic 3x3 cube
  released specifically for speedcubing players), attributed to "昆明国甲体育用品有限公司"
  (Kunming GuoJia Sporting Goods Co., Ltd.). Historical framing: "Rubik's魔方的价格高昂，在国内
  不容易购买" (Rubik's-brand cubes were expensive and not easily purchasable domestically [at
  the time]) as the market gap GuoJia filled. States the brand developed 19 models across
  multiple series, including "甲二" and "甲五", becoming a professional-grade competitor
  alongside other domestic cube brands of the period.
