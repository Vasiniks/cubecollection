excerpt: |-
  CDX prefix enumeration of https://www.speedcubeshop.com/products/shengshou-yufeng (37 distinct
  URLs) independently corroborates the YuFeng 3x3 line found at TheCubicle, under this
  retailer's own slugging: shengshou-yufeng-3x3-magnetic-magnetic-core (first capture
  2023-03-06), shengshou-yufeng-v2-3x3-magnetic-magnetic-core (first capture 2023-09-21), and
  later re-slugged paths shengshou-yufeng-3x3-v1-magnetic-core-magnets (2025-04-22) and
  shengshou-yufeng-3x3-v2-magnetic-core-magnets (2025-05-14) — the same two generations
  (V1/V2) TheCubicle carries, still resolving as of 2025. Sibling cross-category YuFeng products
  also found: shengshou-yufeng-4x4-magnetic, shengshou-yufeng-5x5-magnetic,
  shengshou-yufeng-megaminx-magnetic(-ball-core), shengshou-yufeng-pyraminx-magnetic.

  A separate CDX prefix enumeration of https://www.speedcubeshop.com/products/shengshou-crazy
  (69 distinct URLs) independently corroborates the ShengShou Crazy 3x3 shape-mod line:
  shengshou-crazy-3x3 (first capture 2022-08-07),
  shengshou-crazy-3x3-v1 (2025-08-06), shengshou-crazy-3x3-v2 (2023-09-28) — again a two-
  generation (v1/v2) structure paralleling YuFeng's. The same "Crazy" naming spans
  ShengShou's 2x2, 4x4 (v1/v2/v3), 5x5 (v1-v4), Magic Tower, Megaminx (v1/v2), and Mirror
  3x3/Pyraminx lines at this retailer — a persistent, currently-active cross-category ShengShou
  product concept, not a one-off SKU.

  A third, narrower enumeration of https://www.speedcubeshop.com/products/shengshou-rainbow
  found only a single, much older pair of captures: shengshou-rainbow-3x3x3 (2016-01-08) and its
  .oembed variant (2016-01-09) — no later capture at this retailer, consistent with an early,
  possibly since-discontinued-at-this-retailer product (TheCubicle's own
  thecubicle-shengshou-rainbow-3x3-2020 source is the stronger, more recent evidence for this
  line's currency).
