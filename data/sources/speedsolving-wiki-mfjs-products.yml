excerpt: |-
  Infobox: "MoFang JiaoShi, Cubing Classroom... a sub-brand of Moyu. The brand focuses on
  making beginner-friendly puzzles. Their products are also considered budget cubes." Years
  Active: "2016-present". Products list includes "MF2S, MF3S, MF3RS, MF5, MF5S, MF7, and
  others".

  3x3 section, in order: "MF3 — The MF3 was released 2016-10-11... MF3RS — The MF3RS was
  released 2016-12-22... MF3RS2 — The MF3RS2 was released 2017-09-29... MF3RS3 — [released] in
  December 2018... RS3M 2020 — An updated version of the MF3RS3 released mid 2020... For more
  information, see MoYu. — RS3M 2021 (MagLev) — An updated version of the RS3M 2020... For more
  information, see MoYu. — Super RS3M (2022) — An updated version of the RS3M 2021... For more
  information, see MoYu. — MoFang JiaoShi Mini 3x3 Series — A series of smaller 3x3x3s that are
  produced in sizes of 50mm, 45mm, 40mm, 35mm and 30mm. — Meilong 3x3 — The Meilong 3 was
  released 2019-04-02. — Meilong 3x3 M — An updated version of the Meilong 3 with magnets...
  — Meilong 3C".

  The page explicitly redirects the reader to the MoYu wiki article ("For more information,
  see MoYu") for every RS3M-named generation from 2020 onward, while listing MF3/MF3RS/MF3RS2/
  MF3RS3 (2016-2018) without any such redirect — read as this wiki's own recognition that the
  RS3M-named generations are jointly associated with both MoYu and MFJS, while the earlier
  MF3/MF3RS generations are MFJS's alone.
