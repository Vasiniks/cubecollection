  Product Description: "The YJ MGC Evo II is YJ's new and improved version of their flagship
  3x3. This updated puzzle has hand-adjustable settings and screwdriver-adjustable magnets.
  Performance-wise, this new addition from YJ has a fast and stable turn that is sure to
  impress speedcubers of any skill level. This version has corner/core magnets to add stability
  to the puzzle. Please note: the center caps of this puzzle only fit in two directions." Only a
  single "Stickerless" purchase option is shown (no multi-version selector on this page,
  distinguishing this from the Meta3/MGC3 Beta pages' shared-listing pattern); at the time of
  this capture the page carries "This product has been discontinued indefinitely or we aren't
  sure when it will be back in stock." Product Specifications: Manufacturer YJ; Type 3x3 Speed
  Cubes; Added 2023-06-09 (catalogue-migration field, not a release date); Gross Weight 250g;
  Dimensions 55.0mm^3; Item Weight 74.0g; Magnets: Magnetic. The page's own "Similar Products"
  panel lists "YJ MGC Sigma 3x3" ($29.99) as a separate product.
