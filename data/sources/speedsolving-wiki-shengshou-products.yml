excerpt: |-
  Page-level summary: "ShengShou... is a Chinese company that first became widely known after
  the release of the high-quality 4x4 cube. Since then, they have expanded and have many
  high-quality cubes. Recently ShengShou seems to be appealing to cube collectors."

  3x3 section, in order: "ShengShou 3x3 — This was the first 3x3 from ShengShou, although not
  much is known about it. It has been discontinued for a long time. Many different ShengShou 3x3
  versions had been released prior to 2013. ShengShou Wind (Feng) — Released before June 2013.
  This cube is famous for being the quietest cube ever produced. However there is little
  corner-cutting with this cube and it is unsuitable as a speedcube. ShengShou Aurora (JiGuang) —
  Released June 2013. A highly regarded cube on its release. Almost as quiet as the Shengshou
  Wind, but with better corner-cutting. ShengShou Rainbow (CaiHong) — Shengshou's first attempt
  at a stickerless cube. ShengShou Legend (ChuanQi) — Released March 2016. Shengshou's attempt
  to produce a more modern cube. It is an underwhelming cube with rather poor corner-cutting.
  ShengShou FangYuan — Released August 2016. Released with little publicity, a good mid-price
  cube... ShengShou FangYuan V2 M — A magnetized version of the ShengShou FangYuan. Also
  released with little to no publicity. ShengShou Pearl (MingZhu) — Released June 2017. ShengShou
  Gem — One of the first 3x3s to have black internals with capped pieces... ShengShou Mr. M —
  ShengShou's first attempt at a magnetic cube... known for having VERY strong magnets. ShengShou
  Mr. M V2 — An updated version of the original Mr. M... rarely brought up, mostly because it
  sucks. Shengshou Mr. MS — Another updated version of the Mr. M... generally considered to be
  awful. ShengShou Tank 3x3 — A 3x3 similar to the Gem. It's a pretty average budget cube. With
  puzzles like the RS3M existing, why even bother buying this?"
