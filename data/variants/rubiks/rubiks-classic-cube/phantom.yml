# variant: rubiks-classic-cube--phantom
# Pass 4 batch 2, Agent E. "Rubik's Phantom" — a thermochromic-tile treatment of the classic
# mechanism, per the family record's own pass-2 boundary call (rubiks-com-classic-special-
# editions-2024: "just like the classic Rubik's Cube" with a stated surface/material
# difference only, no distinct mechanism claimed). Admitted as a variant of this model, not a
# separate model, per DATA_MODEL §4.2.
id: rubiks-classic-cube--phantom
