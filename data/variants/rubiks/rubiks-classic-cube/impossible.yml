# of the classic mechanism, per the family record's own pass-2 boundary call. Admitted as a
# variant, not a separate model, per DATA_MODEL §4.2. The family record itself flags a possible
# WCA-legality question for this colourway (colour depends on viewing angle, which could affect
# a scrambled-state check) but leaves it unresolved for pass 4/5; this record inherits the
# model's `core` scope_class per this batch's instructions (variant scope_class must match its
# model's) and does NOT independently reclassify it `conditional` — flagged as an escalation in
# the pass report instead of decided here.
