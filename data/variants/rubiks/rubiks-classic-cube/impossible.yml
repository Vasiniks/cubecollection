    kind: other
    description: "Iridescent tiles that change colour depending on the viewing angle."
legality:
  wca_status: not_legal
  basis: >-
    Iridescent tiles whose colour changes with viewing angle. Fails WCA Regulation 3d2, which requires colours to be solid and
    uniform per face. See the /legality/wca_status attestation for the full inference.
status: stub
attestations:
  /legality/wca_status:
    confidence: probable
    sources: [wca-regulations-2026-04]
    note: >-
      INFERRED FROM THE REGULATION, 2026-09-11, closing part of ledger P4-12. The family record
      rubiks-classic.yml flagged this as a 'Legality note for a future pass, not resolved here'.
      Regulation 3d2 requires that "The colors of the colored parts must be solid, with one
      uniform color per face. Each color must be clearly distinct from the other colors." An
      iridescent surface whose colour depends on viewing angle is not solid, and two such faces
      need not be clearly distinct from one another at a given angle. THE INFERENCE STEP IS THE
      CLAIM AND IS STATED RATHER THAN HIDDEN: the WCA does not name this product, and
      wca-regulations-2026-04's own reliability_note says applying 3d2 to a particular surface
      is an inference from the regulation to the object. Held at `probable`, not `confirmed` - a
      WCA Delegate ruling or a statement naming this product would raise it, and 3a+ shows the
      Regulations do leave some judgements to Delegate discretion.
      CONSEQUENCE NOT ACTED ON, and rule 27 is right to flag it. Recording this legality
      makes the record `scope_class: core` with `wca_status: not_legal`, which rule 27
      correctly reports as incoherent: a non-WCA-legal puzzle belongs under `conditional`
      with a significance argument. Resolving that means either promoting these two
      variants to `conditional` - and NO variant in this archive has ever diverged in
      scope_class from its model, per the convention lint-semantic.mjs states in its own
      rule 49 comment - or promoting the whole rubiks-classic-cube model, which would
      reclassify five sibling variants that are ordinary legal cubes. Both are
      frozen-taxonomy decisions. The evidence is recorded; the reclassification is
      escalated under P4-12 and left to a taxonomy pass.
  /edition/types:
    confidence: probable
    sources: [rubiks-com-classic-special-editions-2024]
    note: "Sold as an ongoing named catalogue product; no bounded-run language found. Recorded
      `standard`, not `limited`."
  /edition/designation:
    confidence: confirmed
    sources: [rubiks-com-classic-special-editions-2024]
    note: "Rubik's own product page name: 'Rubik's Impossible.'"
  /colorway/pattern/kind:
    confidence: probable
    sources: [rubiks-com-classic-special-editions-2024]
    note: "Rubik's own page: 'It's just like the classic Rubik's Cube, but it changes colors
      depending on the angle. The iridescent tiles change color when viewed from different
      angles.' No `iridescent` value exists in vocab/colorway-pattern.yml; recorded as `other`
      with the effect described in `description`."
  /scope_class:
    confidence: uncertain
    note: "The family record (data/families/rubiks-classic.yml) flags a possible WCA-legality
      question for this colourway ('may raise legality.wca_status questions at the variant
