# variant: yj-appari-original--standard
# Pass 4 BASELINE, created by the P4-3 normalisation (research/qc/p4-3-variant-semantics.md).
# This model was ASSESSED for configuration axes by pass4-agent-c-yj-mfjs and exactly one
# configuration was found. This record is that configuration - the model's regular retail
# form - and it exists because pricing, colorway, media, packaging, rarity, specimen
# ownership and the public bundle all attach to the variant layer, never to the model.
# A model with no variant cannot be exhibited at all.
#
# It does NOT assert that a product marketed as "Standard" was sold. It asserts that the
# model was researched and no differentiated configuration was established.
id: yj-appari-original--standard
entity: variant
model_id: yj-appari-original
name: "YJ Appari"
scope_class: core
edition:
  types: [standard]
config:
  magnet_configuration: core_corner_plus_piece
  adjustment_system: other
status: stub
attestations:
  /edition/types:
    confidence: reported
    sources: [thecubicle-yj-appari-3x3-2024]
    note: "ASSESSMENT RECORD, not a product claim. This model was assessed for
      configuration axes during Pass 4 batch 1 (pass4-agent-c-yj-mfjs); no magnetic,
      coating, size, stickered/stickerless or named-edition axis was documented by any
      source located, so the model's single regular retail configuration is recorded
      here. The cited source establishes the product itself; no source was found
      differentiating configurations of it. A later pass finding an axis should add
      variants alongside this one rather than replacing it."
  /config/magnet_configuration:
    confidence: probable
    sources: [thecubicle-yj-appari-3x3-2024, speedcubeshop-yj-appari-3x3-2024]
    note: >-
      TheCubicle carries the full claim in one sentence: "This model has core-corner magnets,
      classic corner-edge magnets, and 6 spring compression settings" — core magnets AND piece
      magnets, which is this vocabulary's `core_corner_plus_piece`.
      THE TWO SOURCES DO NOT CARRY EQUAL WEIGHT HERE and the split is stated rather than
      averaged. SpeedCubeShop independently describes "Magnetic core corner/core magnets" and
      "48 factory-installed magnets", which corroborates the CORE-CORNER half and the magnet
      count; it does not name corner-edge magnets, so the `plus_piece` half rests on TheCubicle
      alone. They are genuinely independent — different publishers using different names for the
      same mechanism, "Speed Micro Bearing" against "Speed-Micro Actuator" (RESEARCH_SPEC 3.2) —
      but independence corroborates only what both actually say, so this is `probable` and not
      `confirmed`.
  /config/adjustment_system:
    confidence: probable
    sources: [thecubicle-yj-appari-3x3-2024, speedcubeshop-yj-appari-3x3-2024]
    note: >-
      "6 Spring compression settings", in those words on both retailers' pages — the one claim
      here that both sources make identically.
      RECORDED AS `other` DELIBERATELY. `tension_compression` is defined in
      vocab/adjustment-systems.yml as INDEPENDENT tension and compression adjustment, and
      neither source establishes that tension is separately adjustable; both describe discrete
      compression settings only. Choosing the more specific value would assert something no
      source says. If a first-party YJ source later establishes independent tension adjustment,
      this should be revisited rather than left at `other`.
