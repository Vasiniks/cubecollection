# variant: moyu-aolong-v2--limited-edition
# Depth research 2026-09-12, from thecubicle-moyu-prefix-2026. The AoLong V2 is one of the most
# historically significant 3x3s in the archive and carried exactly one configuration until now.
id: moyu-aolong-v2--limited-edition
entity: variant
model_id: moyu-aolong-v2
name: "MoYu AoLong V2 (LE)"
scope_class: core
config:
  size_mm: 57.0
  weight_g: 93
colorway:
  designation: "Transparent Green"
  limited_name: "Transparent Green"
  scheme: custom
  body:
    plastic_color_name: "Transparent Green"
    translucency: transparent
edition:
  types: [limited, commemorative]
  name: "LE"
  limited:
    is_limited: true
    run_size: null
status: stub
attestations:
  /edition/name:
    confidence: probable
    sources: [thecubicle-moyu-aolong-v2-le-2020]
    note: >-
      "LE" is the retailer's own title abbreviation, expanded in its first sentence as "the
      limited edition version". No first-party MoYu source naming the edition was located.
  /edition/types:
    confidence: probable
    sources: [thecubicle-moyu-aolong-v2-le-2020]
    note: >-
      `limited` because the retailer calls it "the limited edition version" in its own words.
      `commemorative` because the set exists to mark a specific event and contains an artefact
      that does nothing else: "the official collectible MoYu card for Lucas Etter", alongside a
      display box and stand. A cube that ships with a card about a person and a box to display it
      in is not merely a differently-packaged cube.
  /edition/limited/run_size:
    confidence: unknown
    note: >-
      Searched and not found. The page says "limited edition" and gives no number, and no
      first-party MoYu source was located this pass. Recorded as unknown rather than omitted so
      that the search is on the record.
  /edition/commemorates:
    confidence: unknown
    note: >-
      DELIBERATELY LEFT UNSET RATHER THAN LINKED, and this is the substantive decision on this
      record. The source says the base AoLong V2 "was used by Lucas Etter to set the first sub-5
      official WCA 3x3 solve on November 21st, 2015", and the set includes a card naming him.
      That would justify BOTH an event record for the solve and a person record for Lucas Etter,
      and `/edition/commemorates` is the field that would point at the event.
      It is not created here because the evidence is a retailer's sentence. The archive's
      existing people and events — Max Park, XuanYi Geng and three world-record events — rest on
      stronger footing than that, and writing a person into the archive on a product blurb would
      lower a standard the archive has otherwise kept. The lead is recorded in the source's
      preservation_note; closing it means fetching WCA's own result for River Hill Fall 2015.
  /config/weight_g:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: >-
      Cubelelo's own structured table separates "Product Weight (in grams): 93" from "Package
      Weight (in grams): 146" — the rule-45 distinction drawn by the source itself rather than
      inferred here. 146g is the boxed collector's set, which contains a manual, stickers and a
      stand as well as the puzzle.
  /config/size_mm:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: '"Dimensions (in mm): 57 x 57 x 57", read as a 57.0mm edge length.'
  /colorway/designation:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: >-
      THIS RESOLVES AN AMBIGUITY RATHER THAN REPEATING A CLAIM. TheCubicle's sentence — "a large
      display box with a transparent green cube stand" — can be read as a transparent-green STAND
      or as a stand for a transparent-green CUBE, and on its own it does not say which. Cubelelo's
      title names the cube "Transparent Green" and its own structured "Color Scheme" field reads
      the same, which is a claim about the puzzle.
      CUBELELO IS NOT CITED AS CORROBORATION OF THE LUCAS ETTER CLAIM, and the distinction
      matters on this record. Its DESCRIPTION is word for word TheCubicle's, which under
      RESEARCH_SPEC 3.2 is one evidence chain written twice. Only its structured specification
      table, which has no counterpart on the other page, is independent — and that is all it is
      cited for here.
  /colorway/body/translucency:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: >-
      "Transparent Green" in the retailer's own Color Scheme field. `transparent` rather than
      `translucent` because the source says transparent; the archive does not soften a source's
      own word.
  /colorway/scheme:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: >-
      `custom`, on the same reasoning the archive applies to GAN's Crystal Blue and Love Pink
      colourways: a named, non-stock scheme sold as a distinct product.
  /colorway/body/plastic_color_name:
    confidence: probable
    sources: [cubelelo-moyu-aolong-v2-le-2021]
    note: >-
      "Transparent Green", the retailer's own descriptive term, kept verbatim as sourced.
