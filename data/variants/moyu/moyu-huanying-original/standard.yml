    note: >-
      TheCubicle's own 2013-06-22 product page sells this as one undifferentiated product with
      no separate tier or edition name found. SEARCH RECORDED 2026-09-12. A RESEARCH_SPEC 3.6a
      prefix sweep of this retailer's /products/moyu paths (thecubicle-moyu-prefix-2026)
      enumerated 303 distinct paths - the archive's first such sweep for its most heavily cited
      manufacturer. This model appears in that enumeration as a single bare path, with no suffix
      naming a coating, MagLev, size, assembly, sticker state or edition configuration, unlike
      several MoYu siblings in the same sweep that carry three or more. Its single-configuration
      state is therefore SEARCHED at this retailer and recorded as such, not merely unexamined.
      One retailer in one market is not the line: the audit still counts MoYu as having no
      non-US source, and ledger P26-3 records that slug form differs per brand. SECOND MARKET
      CHECKED 2026-09-12: cubelelo-moyu-products-prefix-2026, a CDX prefix enumeration of an
      INDIAN retailer's /products/moyu- paths (132 distinct). RESEARCH_SPEC 3.6a names Cubelelo
      as the example of a regional catalogue holding what the rest of the method never sees, and
      it closes the second half of MoYu's breadth gap. This model carries no configuration path
      there either. The two sweeps together are two markets, not one, which is the strongest
      statement this archive can currently make about a MoYu single-configuration model - though
      neither is a manufacturer source, and MoYu's own catalogue remains unswept.
