# variant: moyu-hualong-original--standard
# Pass 4. The single sold configuration found for MoYu HuaLong. TheCubicle's own sticker-page
# listing names it "3x3 Red 57mm - HuaLong" (the same generic per-SKU naming pattern used
# across this retailer's early MoYu sticker pages). The wiki's "scratchy... similar internal
# mechanism patterns" to AoLong is a mechanism description, not a second sold configuration.
id: moyu-hualong-original--standard
entity: variant
model_id: moyu-hualong-original
name: "MoYu HuaLong"
scope_class: core
edition:
  types: [standard]
status: stub
attestations:
  /edition/types:
    confidence: probable
    sources: [thecubicle-us-moyu-early-3x3-lines, thecubicle-moyu-prefix-2026, cubelelo-moyu-products-prefix-2026]
    note: >-
      TheCubicle's own sticker-page listing sells this as one undifferentiated product. 'Red' is
      this retailer's generic sticker-page naming convention, not a manufacturer-named
      colourway. SEARCH RECORDED 2026-09-12. A RESEARCH_SPEC 3.6a prefix sweep of this
      retailer's /products/moyu paths (thecubicle-moyu-prefix-2026) enumerated 303 distinct
      paths - the archive's first such sweep for its most heavily cited manufacturer. This model
      appears in that enumeration as a single bare path, with no suffix naming a coating,
      MagLev, size, assembly, sticker state or edition configuration, unlike several MoYu
      siblings in the same sweep that carry three or more. Its single-configuration state is
      therefore SEARCHED at this retailer and recorded as such, not merely unexamined. One
      retailer in one market is not the line: the audit still counts MoYu as having no non-US
      source, and ledger P26-3 records that slug form differs per brand. SECOND MARKET CHECKED
      2026-09-12: cubelelo-moyu-products-prefix-2026, a CDX prefix enumeration of an INDIAN
      retailer's /products/moyu- paths (132 distinct). RESEARCH_SPEC 3.6a names Cubelelo as the
      example of a regional catalogue holding what the rest of the method never sees, and it
      closes the second half of MoYu's breadth gap. This model carries no configuration path
      there either. The two sweeps together are two markets, not one, which is the strongest
      statement this archive can currently make about a MoYu single-configuration model - though
      neither is a manufacturer source, and MoYu's own catalogue remains unswept.
