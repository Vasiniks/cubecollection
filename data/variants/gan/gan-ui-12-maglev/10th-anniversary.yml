    confidence: probable
    sources: [thecubicle-gan12-ui-maglev-10th-anniversary-2024]
    note: >-
      The source calls it "a smart 3x3 released in celebration of GAN and their 10-year
      milestone", which is both the anniversary and the commemorative claim in the retailer's own
      words. NOT marked `limited`: nothing states a run size, and inferring scarcity from
      "special edition" is the fabrication this archive refuses.
  /edition/name:
    confidence: probable
    sources: [thecubicle-gan12-ui-maglev-10th-anniversary-2024]
  /colorway/designation:
    confidence: probable
    sources: [thecubicle-gan12-ui-maglev-10th-anniversary-2024]
