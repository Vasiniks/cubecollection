# configuration difference. This blends "GAN-branded/limited edition" and "Cubicle Labs
# aftermarket setup" in a way a human reviewer should examine directly (see
# research/notes/variants/gan-pass4.md).
#
# The single strongest documented run size and per-unit numbering scheme found anywhere in
# this pass: 639 units, numbered 50001-50639.
