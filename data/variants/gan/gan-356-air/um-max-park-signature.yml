# GAN-style product name on TheCubicle, with the tuning/lube setup credited to Cubicle Labs by
# an independent customer review; recorded as a `modified_from` aftermarket variant of the base
# Air UM per DATA_MODEL §4.3, since the distinguishing facts (specific lube combination, GES
