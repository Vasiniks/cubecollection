# variant: gan-flagship-16--maglev-max-dual-wr-limited-edition
# Pass 4. "GAN16 MagLev MAX UV 3x3 (Dual-WR Limited Edition)" — a limited, commemorative edition
# honouring Team GAN speedcuber XuanYi Geng's 3.05s single and 3.84s average World Records, sold
# both as a Version on GAN's own single GAN16 listing and as its own full listing on TheCubicle.
# Explicitly limited to 1,111 units worldwide; not individually numbered per unit (contrast the
# Max Park Signature Edition on gan-356-air, which is).
#
# edition.signature_of is left unset: Geng's Chinese signature is laser-engraved on the case and
# a signed postcard is included, which could support a `signature` edition type, but the cube
# itself is not described as tuned to a personal setup (contrast the Max Park edition, which
# explicitly is). Recorded as commemorative rather than signature; flagged as a judgement call
# in research/notes/variants/gan-pass4.md.
