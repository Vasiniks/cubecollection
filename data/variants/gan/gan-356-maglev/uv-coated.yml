  /edition/types:
    confidence: probable
    sources: [thecubicle-gan356-maglev-uv-2023]
    note: >-
      A regular retail configuration distinguished by a surface coating, not a limited or
      commemorative edition. The page carries no run size, no anniversary or festival naming and
      no collaboration.
  /config/maglev:
    confidence: probable
    sources: [thecubicle-gan356-maglev-uv-2023]
    note: >-
      "This one has repelling magnets in place of a spring", from the same page this variant is
      built on, and the model is named GAN356 MagLev.
      ADDED AS A CORRECTION 2026-09-12. This record was first written without it, on the mistaken
      reasoning that the value was inherited from the baseline variant. Inheritance runs from the
      MODEL, and this model carries no specs, so nothing was inherited — the record asserted a UV
      coating on a cube whose tension system it never stated. Found by a sweep for axes named in a
      record and absent from its machine-readable config.
