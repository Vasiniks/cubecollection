status: stub
attestations:
  /config/coating:
    confidence: probable
    sources: [thecubicle-gan356-maglev-uv-2023]
    note: >-
      The retailer states the treatment in a sentence of its own rather than leaving it to the
      product title: "This version is UV-coated which aids with grip and gives the puzzle a
      glossy finish." `uv` in vocab/coatings.yml is a manufacturer-applied UV-cured coating,
      which is what "this version" denotes — a factory configuration of the product, not an
      aftermarket service, so `aftermarket` would be the wrong value.
  /edition/name:
    confidence: probable
    sources: [thecubicle-gan356-maglev-uv-2023]
    note: >-
      "UV" is the retailer's product-title suffix. No GAN first-party source naming the
