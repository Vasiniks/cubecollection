# variant: gan-356-maglev--uv-coated
# Depth research 2026-09-12, from an unchased lead in thecubicle-gan356-slug-prefix-2026.
# CORRECTED the same day: this originally carried only `coating`, on the reasoning that the
# maglev value "sits on the baseline variant and is inherited". THAT REASONING WAS WRONG.
# Inheritance runs MODEL -> VARIANT, never variant -> sibling variant, and `gan-356-maglev` the
# model carries no specs at all. So this record — whose own name says "MagLev" — did not say the
# cube was MagLev anywhere. Rule 23 forbids restating the MODEL's value; it has nothing to say
# about a sibling's.
id: gan-356-maglev--uv-coated
