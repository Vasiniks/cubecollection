  on evidence rather than on DATA_MODEL §4.2's split-under-uncertainty default.

  The mould comparison remains inconclusive — both cubes show the same generic budget silhouette
  and no macro geometry shot exists — so the finding rests on naming and catalogue behaviour, not
  on geometry.
