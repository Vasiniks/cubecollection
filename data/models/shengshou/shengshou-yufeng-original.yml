description: |-
  TheCubicle's product page gives a 56mm dimension at $19.99, describing a magnetic-core 3x3
  (thecubicle-shengshou-yufeng-3x3-m-2023). SpeedCubeShop carries the line independently
  (speedcubeshop-shengshou-products-prefix-2026).

  **A claim deliberately refused.** TheCubicle's URL slug for this product contains "magelev",
  which would ordinarily suggest a MagLev spring-replacement system. A first-hand customer
  review on that same page disputes it, and ShengShou's own marketing reportedly dropped the
  claim after it was contested. A URL slug is not a specification. `specs.maglev` is therefore
  NOT set — neither to true on the slug's say-so, nor to false on a single review's. The
  conflict is recorded here so a later pass can resolve it with better evidence rather than
  rediscover it.
