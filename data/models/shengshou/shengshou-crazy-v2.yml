# model: shengshou-crazy-v2
# P26-5 remediation (ledger P26-10, tranche 2). Second generation, separated from the first by a
# documented mechanism change rather than a version label. scope_class conditional — unlike the
# first generation, this one clears the §2.2 bar; see /scope_justification.
id: shengshou-crazy-v2
entity: model
family_id: shengshou-crazy
manufacturer_id: shengshou
name: "ShengShou Crazy 3x3 V2"
generation:
  label: "V2"
  ordinal: 2
  basis: manufacturer_declared
scope_class: conditional
scope_justification: |-
  Admitted on a documented mechanism development within a named puzzle category, not on being
  unusual. The retailer's own product copy states this generation "has more pieces (9 total) in
  each ring, adding yet another layer of difficulty" — a specific, quantified change to the
  locked-ring mechanism over the eight-piece first generation, which is a documented design
  development rather than a marketing claim. It is accompanied by a documented collector-market
  signal in the same line: a "Jelly LE" edition stated as "limited to 1400 units worldwide", a
  quantified production figure of the kind §2.2 treats as evidence of a collector market. Neither
  ground rests on the puzzle being interesting or unusual. The first generation, which has
  neither, is held at reference_only rather than admitted alongside it.
scope_decided_by: "P26-5 adjudication, main session"
scope_decided_on: "2026-09-08"
specs:
  size_mm: 60.0
relationships:
  - type: succeeds
    target: shengshou-crazy-original
    target_entity: model
    note: "The V2 designation is carried in the product's own name and URL, and its copy
      describes its ring-piece count by contrast with the earlier generation."
description: |-
  The second generation. TheCubicle: "The V2 has more pieces (9 total) in each ring, adding yet
  another layer of difficulty. If you've mastered the [base] 3x3, this is a great next step"
  (thecubicle-shengshou-crazy-3x3-generations-2026, capture 2024-04-16, product id
  7049644212307, 60.0mm, Gross Weight 124.0g).

  The eight-to-nine ring-piece change is an internal-geometry difference and is what makes this a
  separate model under DATA_MODEL §4.2 — the "V2" label alone would not be sufficient.

  **A retailer inconsistency, noted not resolved:** TheCubicle types this generation "3x3" while
  typing the first "Shape Mods", despite both sharing the same locked-ring mechanism. The
  archive's `scope_class` is decided on §2.2's own test, not on a retailer's category field.
legality:
  wca_status: not_legal
  basis: >-
    Locked-ring construction, pillowed body: 'a pillowed 3x3 with rings on each face that do not turn with their respective faces', nine pieces per ring in this generation.
status: sourced

