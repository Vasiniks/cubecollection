description: |-
  The first generation: a pillowed 3x3 whose face rings do not turn with their faces, eight
  pieces per ring. TheCubicle lists it at $15.99, 60.5mm, product id 6670615871571, typed "Shape
  Mods" (thecubicle-shengshou-crazy-3x3-generations-2026, capture 2023-02-06).

  **Why `reference_only` and not `conditional`.** RESEARCH_SPEC §2.2 admits a non-WCA-legal 3x3
  only on **documented** significance — a production first, a documented influence on later
  designs, a documented collector market, or a documented place in the manufacturer's history.
  This generation has none of those. The locked-ring "Crazy" mechanism is generic and predates
  ShengShou's version at two other manufacturers already in this archive; nothing found claims
  ShengShou's is a first, an influence, or historically notable. That is materially weaker than
  `mf8-crazy-3x3x3`, which rests on a decade of documented circulation.

  The exact precedent is `calvins-full-function-crazy-3x3`, held at `reference_only` for the same
  reason: a real product, on a generic mechanism, with no significance claim. **Significance is
  not invented here to secure admission** — the record exists so a researcher can identify this
  product and move on.

  A "Jelly LE" (transparent stickerless, "limited to 1400 units worldwide") is a **pass 4
  variant**, not a model. Which generation it belongs to is **not established** by any source and
  is deliberately not assumed here.
