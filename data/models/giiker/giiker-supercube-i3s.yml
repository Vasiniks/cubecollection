# model: giiker-supercube-i3s
# Pass 3 (model enumeration), Batch 3 Agent A. HARD CALL, resolved by splitting rather than
# collapsing — see research/qc/pass3-b3-agent-a-smartcubes.md for the full reasoning.
#
# TheCubicle's own product copy: "The Giiker Super Cube i3S is an updated version of the
# previous Giiker Super Cube. This version comes with updated software, Bluetooth v. 4.0, and
# bright vibrant stickers" (thecubicle-giiker-super-cube-i3s-2019, tier 2). Read in isolation,
# that sentence describes exactly the kind of firmware/chipset/colourway refresh DATA_MODEL
# S4.2 treats as variant-level ("a different core assembly... sold as options of one product"),
# and this task brief names precisely this ambiguity (firmware/BT-chipset changes vs a genuine
# hardware model) as the hard problem of this lane. No source describes a mould, shape, or
# internal-geometry difference between i3 and i3S.
#
# Against that: GiiKER's own official site (giiker.com) carries "i3S" as its own standing,
# separately-named, separately-SKU'd product page (giiker-com-supercube-i3s-product-2022) — not
# a firmware push to existing i3 units, but a distinct manufacturer-declared generation you
# bought as its own product, the same identity path S6 policy class 3 permits ("a
# design/mould/mechanism difference, OR a manufacturer-declared generation"). DATA_MODEL S4.2
# itself says a version suffix is "a strong signal about design change and a weak one about
# configuration" — evidence, not proof, in either direction.
# Resolution: split. Admitted as a separate model on the manufacturer-declared-generation path,
# with the identity claim (not the existence claim) held at `uncertain` and a `succeeds`
# relationship to i3, exactly the DATA_MODEL S4.2 default for unclear cases ("When the evidence
# is unclear, default to new model... confidence: uncertain on the generation claim").
