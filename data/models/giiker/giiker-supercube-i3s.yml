description: |-
  GiiKER's own official product page names this "SUPERCUBE® i3S" (giiker-com-supercube-i3s-product-2022,
  tier 1): "Smart and Connected: App connected smart cube with real-time tracking technology...
  It's educational and innovative, endorsed by MoMA as the next generation cube for the 21st
  century" (the MoMA/"next generation" language is marketing copy, not treated as a
  specification fact). TheCubicle's own copy (thecubicle-giiker-super-cube-i3s-2019, tier 2)
  independently states: "The Giiker Super Cube i3S is an updated version of the previous Giiker
  Super Cube. This version comes with updated software, Bluetooth v. 4.0, and bright vibrant
  stickers," and gives a spec table: "Gross Weight: 213g / Dimensions: 56.5mm 3 / Item Weight:
  104.6g." SpeedCubeShop independently carried the identical product under the name "Giiker
  Bluetooth Super Cube i3S" (captured 2020-11-11, not separately sourced here beyond the URL
  itself, which corroborates the name and persistence of this generation at a second retailer).

  **Model-identity boundary call, made explicitly.** The only documented difference from the
  prior i3 generation is software, a Bluetooth radio revision, and sticker colour — on their own,
  exactly the class of change DATA_MODEL S4.2 assigns to `variant`, not `model` ("a different
  core assembly... sold as options of one product... are variants, however different they feel
  in the hand"). No source describes a mould, shape, or internal-geometry change. Admitted here
  as a separate model anyway because GiiKER's own site treats "i3S" as its own persisting,
  separately-SKU'd product (not a firmware update applied in place to existing i3 units), which
  is the S6-policy-permitted "manufacturer-declared generation" path to model identity
  independent of a shown mould difference — and because DATA_MODEL's own default for genuinely
  unclear cases is to split rather than collapse. The generation-identity attestation below is
  held at `uncertain` to keep this reasoning visible rather than silently promoting a naming
  convention into a settled hardware-design fact.

  This generation's own product page persisted on GiiKER's own site from at least 2022 through
  a 2026-08-19 capture (giiker-com-supercube-i3s-2026-soldout), by which point it is marked
  "Sold out" and has dropped from the site's primary shop navigation — see
  data/families/giiker-supercube.yml for the fuller decline discussion; no source states a
  formal discontinuation, so `discontinued` is left unset here.
status: drafted
