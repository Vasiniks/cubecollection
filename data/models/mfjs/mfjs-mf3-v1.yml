description: |-
  Per TheCubicle's own product page (thecubicle-mofang-jiaoshi-mf3-product): "The MoFang JiaoShi
  MF3 is a new MoYu sub-branded 3x3 in the Cubing Classroom series." Dimensions 56.0mm, item
  weight 79.7g. The base, unnumbered entry in the MF3/MF3RS/MF3RS2/MF3RS3 succession
  (thecubicle-mofang-jiaoshi-mf3-prefix-2026); the family's own frozen record already places
  this as the first entry.

  The Speedsolving wiki (speedsolving-wiki-mofang-jiaoshi, live-fetched 2026-09-03 and
  reconfirmed to carry a "may be currently outdated" banner, hence still tier 4 with no
  override) gives "The MF3 was released 2016-10-11, it is only available in black and white and
  I would recommend against buying it." Per the standing evidence-tier-remediation-matrix
  ruling on this exact source, only `existence_and_naming_at_uncertain_only` and
  `approximate_chronology_at_uncertain_only` claim types are permitted from it, and precise
  day/month dates are explicitly forbidden -- so the date below is recorded at year precision,
  `circa`, `uncertain` confidence, not as the wiki's own stated day.

  A separate, explicitly variant-level configuration, MF3S (stickerless, frosted-coated), is
  documented at thecubicle-mofang-jiaoshi-mf3s-product as "similar to the MF3 in design" and is
  correctly excluded here as a model candidate; see the family/model report.
status: drafted
