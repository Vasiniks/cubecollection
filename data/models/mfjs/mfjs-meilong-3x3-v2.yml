description: |-
  Per SpeedCubeShop's own product page (speedcubeshop-moyu-meilong-3x3-v2-magnetic-product):
  "MoYu MeiLong 3x3 V2 (Magnetic) is a lightweight upgrade to one of the most popular
  entry-level cubes ever," with key features "Factory-installed magnets for more control",
  "Reinforced core design", and a "Dragon scale" piece design named in the same page's own
  version-comparison table as shared across all V2 sub-variants (Lite, Standard, UV Coated) and
  distinct from the V1 column. "Dragon scale" piece design and "reinforced core" are read as a
  genuine tooling/mechanism difference from the earlier MeiLong generations, not a sold
  configuration -- the basis for admitting V2 as its own model. Lite/Standard/UV Coated are
  variant-level sold configurations of this one V2 design (differing by accessories and
  exterior coating), not further models.

  Named "V2" without the source stating whether it succeeds MeiLong 3x3 or MeiLong 3c directly;
  recorded here succeeding MeiLong 3c as the chronologically closer and most-recently-named
  prior generation, at `uncertain` confidence on that specific edge.

  `weight_g` is left unset in `specs`: the source's own Product Details block gives 66g for
  the specific UV-coated SKU it sells, but the same page's version-comparison table gives 65g
  for "V2 (Standard)" -- a real difference between two variants of this one model rather than
  a single model-level default, so it is left for variant-level records rather than guessed
  here.
