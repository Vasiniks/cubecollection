description: |-
  Per TheCubicle's own product page (thecubicle-mofang-jiaoshi-mf3rs3-product): "The
  differences from the MF3RS2 are more rounded off corners, a revamped mechanism with new
  anchor/torpedo design, and hardware in the corners! This puzzle also has slots for magnets in
  the pieces." This is direct, tier 2, first-party evidence of a mechanism-level difference from
  the immediately prior generation -- a genuine new design under this archive's model/variant
  boundary rule, not merely a resold configuration. Dimensions 56.0mm, item weight 84.0g.

  The Speedsolving wiki (speedsolving-wiki-mofang-jiaoshi, tier 4, see mfjs-mf3-v1.yml for the
  standing evidence-tier ruling) gives "The MF3RS3 was released in December 2018. It is an
  improved version of the MF3RS2 but is also more expensive. It is available in non-magnetic
  and factory-magnetic." The magnetic/non-magnetic split is read as a variant-level
  configuration of this one model, not a further model, consistent with this puzzle's own
  described "slots for magnets" (i.e. magnets are an add-on/factory option on one shared
  design). Recorded at year precision, `circa`, `uncertain`, per that ruling's ban on precise
  month dates from this source.

  `core_system` and `adjustment_system` are left unset: "anchor/torpedo design" names a real,
  specific mechanism feature but does not map cleanly onto this archive's controlled
  vocabulary, and guessing a vocabulary term for it risks misrepresenting the actual mechanism.
