  specialties (speedsolving-wiki-witeden) — but that source is held at tier 4 by a prior QC
  decision (issue E1, carries a live "may be currently outdated" banner) and corroborates only,
  per RESEARCH_SPEC's standing rule that tier 4 "corroborates only, never establishes."

  **scope_class decision.** Recorded `reference_only` rather than `conditional`: no tier 1-3
  source located this pass documents a named designer credit, a competitive use, a collector
  market, or a production-first claim for this specific mechanism (unlike the WitEden Mixup
  models' documented Oskar van Deventer lineage). A general web search for "Super cube" or
  "Supercube" as a named category found no coverage in the one general puzzle-reference source
  checked this pass (wikipedia-combination-puzzle). Real, identifiable, genuinely distinct
  mechanism from a standard 3x3 — but not documented as historically or collector significant,
  so `reference_only` is used rather than an invented justification.
