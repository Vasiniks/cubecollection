# model: fanxin-hudong-3x3
# Pass 3 (model enumeration), Agent D. Single model under `fanxin-hudong`. Sold in "Standard,"
# "Flagship UV," and "Ultra Maglev UV" configurations per the family record — treated as one
# model with three variant-level configurations (surface/UV treatment and a maglev-vs-standard
# core tier), not three models, per DATA_MODEL section 4.2's explicit text that "a different
# core assembly... sold as options of one product" is a variant difference even though maglev
# is substantial hardware. Pass 4's work to enumerate the three as variants.
id: fanxin-hudong-3x3
entity: model
family_id: fanxin-hudong
manufacturer_id: fanxin
name: "FanXin HuDong"
aliases:
  - "HuDong Light"
  - "HuDong Light 3x3"
scope_class: core
description: |-
  TheCubicle's own product page (thecubicle-fanxin-hudong-2024 / thecubicle-fanxin-3x3-
  products, tier 2, first captured 2024-10-08/09): "The FanXin HuDong is a huge step for FanXin
  hardware. This is an extremely modern and competitive flagship 3x3. Every version has tension
  and compression adjustments... This cube has piece-to-piece magnetization, an 8 magnet
  ball-core with repelling edge magnets, and corner foot-to-edge foot magnets." Sold in
  "Standard," "Flagship UV," and "Ultra Maglev UV" configurations per the same source — the
  "Ultra Maglev UV" tier swaps the ball core for a maglev core and adds UV coating, both
  configuration choices at assembly of the same underlying design per DATA_MODEL section 4.2,
  so this is recorded as one model.

  **2026-09-19, a second retailer weighs in, and it favours the prose reading.** Taiwan's
  store.maru.tw (maru-tw-fanxin-brand-page-2026) files three products named
  "光三階 ... 互動方塊" — "Light 3x3 ... Interactive Cube" — under the manufacturer entry
  "泛新FanXin". 互動 (simplified 互动) is simply the Chinese word for "interactive", and
  "HuDong" is its pinyin, which is how a product-line name comes to look like a brand in a
  Latin-script spec field. So a second, independent, non-US retailer treats HuDong as a FanXin
  line rather than a manufacturer. This does NOT resolve the contradiction — both are retailer
  taxonomies rather than first-party statements, and a retailer may file a sub-brand under its
  parent for convenience — but it makes the prose reading the better-corroborated one, and it
  explains the mechanism of the error. Still awaiting a FanXin or HuDong first-party source.

  **The same page corroborates this model's three-configuration structure**, from a publisher
  the archive did not previously have: it lists exactly three tiers of the Light 3x3 — 標準版,
  旗艦版 and 至臻版 (standard / flagship / finest) — matching in count and order the three
  variants recorded here from TheCubicle. The tier names are deliberately NOT mapped term by
  term onto the archive's variant names, because that page states no coating or core detail
  that would justify equating them.

  **Naming contradiction, preserved not resolved.** The dedicated product page's own structured
  "Manufacturer" spec field reads "HuDong" alone, while the same page's URL, title, and prose
  all read "FanXin HuDong" / "FanXin hardware" (thecubicle-fanxin-hudong-2024). This model
  record follows data/manufacturers/fanxin.yml's treatment (HuDong as a FanXin product line,
  not a separate manufacturer) as the more specific and informative reading, without erasing
  the contradiction — a future researcher with a first-party FanXin or HuDong source may find
  these are in fact separate companies in a supply/OEM relationship.
specs:
  core_system: ball_core
  magnet_architecture: dual_layer
