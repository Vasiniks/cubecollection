description: |-
  TheCubicle's own product copy (thecubicle-maru-3x3, tier 2): "The original Maru 3x3 was one
  of the first cubes ever released by Maru several years ago. While the puzzle has been
  discontinued for quite some time, we recently came across a limited number of them, which we
  are liquidating at a reduced price." A customer review on the same listing dates the original
  product to approximately 2011 ("the weilong hadn't come out yet"). An independent, non-US
  retailer (cubezz-maru-3x3, tier 2, China-based) sells a "Maru 56mm 3x3x3 Magic Cube" of
  essentially the same dimension (56.7mm vs. TheCubicle's 57.0mm) — read as the same base
  product, corroborating its existence from a second, independent source per RESEARCH_SPEC
  §3.6a, though its own generic templated description does not repeat the "one of the first
  cubes" historical framing.

  A sticker-treatment variant ("Special Patterns" edition, thecubicle-maru-3x3-special-patterns)
  is a decorative pass-4 lead on this model, not a separate model — its own copy states directly
  "The original Maru 3x3 is available with a variety of special patterns on the stickers." No
  further generation was found; this is the family's sole model.
