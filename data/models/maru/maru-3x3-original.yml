# Pass 3 (model enumeration), agent C. Maru 3x3's sole documented generation, already
# substantially researched at pass 1/2. A second, independent tier 2 non-US retailer
# (cubezz-maru-3x3) found this pass corroborates the base product's existence and approximate
# size, satisfying RESEARCH_SPEC §3.6a, but disagrees with TheCubicle on weight — recorded as
# `disputed` rather than resolved.
