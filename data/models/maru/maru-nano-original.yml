description: |-
  TheCubicle's own product copy (thecubicle-maru-nano-3x3, tier 2): "This one-of-a-kind cube
  comes with a little cube pouch, set of stickers, and also the cardboard cutouts to make your
  own nano cube box and nano cube stand... It also comes with a set of tweezers to help with
  assembly, and to help pick up the cube... Please note that assembly is required for this
  cube -- the kit includes all of the parts you need to assemble the cube by yourself." Sold as
  a self-assembly DIY kit, not pre-assembled. Cubezz.com's independent, earlier listing
  (cubezz-maru-nano, tier 2, non-US, captured 2015-05-13 — five years before TheCubicle's own
  2020 capture) confirms multiple colourways ("Red," "Yellow," "Luminous," "Blue," "White,"
  "Black") of the same 15mm product existed by that date. `piece_count` is left unset: this
  archive does not assume the ordinary 8-corner/12-edge/6-centre 3x3 default for a 15mm DIY-kit
  novelty product without a source stating it. No later generation was found; this is the family's sole model.
