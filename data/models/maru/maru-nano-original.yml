  - "Maru 15mm Nano Cube"
scope_class: conditional
scope_justification: |-
  TheCubicle's own product copy states directly: "At just 15mm across, the Maru Nano Cube is
  the smallest mass-produced 3x3 cube in the world!" (thecubicle-maru-nano-3x3, tier 2). An
  entirely independent retailer found this pass (cubezz-maru-nano, tier 2, China-based)
  separately and closely echoes the same specific claim: "This Maru Nano Cube is the world's
  smallest cube (mass production)." Two independent tier 2 sources making the same specific,
  falsifiable production-first claim is treated as a documented historical/collector
  significance per RESEARCH_SPEC §2.2 ("a documented production first... is" sufficient
  justification), not the bare "it is small" that the S6 policy explicitly rejects as
  insufficient.
scope_decided_by: model-researcher-agent-c
