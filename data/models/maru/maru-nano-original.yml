# model: maru-nano-original
# Pass 3 (model enumeration), agent C. Maru Nano Cube's sole documented generation. Explicit
# `scope_class: conditional` decision per the S6 admission policy: at 15mm this is almost
# certainly outside any reasonable WCA competition size (WCA Regulation 3a+ permits "puzzles of
# any reasonable size, at the discretion of the WCA Delegate" — no fixed minimum is specified,
# but a 15mm cube is a far larger deviation from typical practice than any borderline case this
# archive has otherwise admitted at `core`), and the significance justification rests on a
# specific, documented, and now twice-independently-corroborated production-first claim, not
# merely "it is small."
id: maru-nano-original
