description: |-
  TheCubicle's own product copy (thecubicle-maru-cx3, tier 2): "The Maru CX3 is a hotly
  anticipated, high-quality 3x3 speedcube. Its design was inspired by our friend Cyoubx, who is
  a speedcuber himself." Repeated, independent customer reviews on the same listing compare it
  favourably to the DaYan ZhanChi and MoYu WeiLong ("the reverse corner cutting... surpasses the
  Zanchi and it is more controllable than the Weilong"; "this cube is very fast... putting my
  ZhanChi to shame"), and several separately describe it as noticeably larger than a standard
  57mm cube ("slightly larger than a normal 57 millimeter," "a hair bigger than 57mm") — a
  qualitative, customer-sourced observation, not a structured retailer measurement, so no
  `size_mm` value is set from it. Sold in both an Assembled version (sourced here) and a
  separate DIY kit, with Glow-in-the-Dark and Transparent colour options using transparent
  stickers (pass-4 leads). `designer` is left unset: Cyoubx is named as a design inspiration in
  TheCubicle's own copy, but no `person` record for them exists in this archive and creating one
  is outside this pass's write lane. No later numbered generation was found; this is the
  family's sole model.
