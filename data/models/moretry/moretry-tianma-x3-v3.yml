  sequence on the same base shell with incremental magnet-system additions, matching the
  numbered "V" convention this family already uses consistently. A "Limited Edition"
  configuration of V3 was also found by URL (`moretry-tianma-x3-v3-3x3-limited-edition`) and is
  read as a variant, not investigated further this pass.
