description: |-
  TheCubicle's own product page (thecubicle-moretry-tianma-x3-plus-v3-2025, title "Moretry
  Tianma X3+ V3 3x3"): "The Moretry Tianma X3+ is a more refined version of the original X3.
  This one has magnet capsules that are easier to install, **more precise molds** that make
  turning quieter and more predictable." "More precise molds" is a direct tooling claim, the
  basis for treating this as its own model rather than a configuration of the numbered V-line —
  per DATA_MODEL §4.2, a different mould is a different design "regardless of marketing," and
  this is the only place in this family where a source states a tooling difference outright
  rather than only a magnet-hardware difference.

  A customer review on the same page independently reports retaining the numbered line's V4
  MagLev centre system when modifying an X3+ unit ("I ended up installing core magnets in this
  cube (tianma x3+) as well, then swapping the centers so I could keep the hefty maglev system
  which I had grown to love in the X3 V4") — read as the basis for a `succeeds` relationship to
  `moretry-tianma-x3-v4` specifically, at `uncertain` confidence given this is informal
  customer testimony, not retailer or manufacturer copy.

  **A genuinely unresolved naming question, left open rather than resolved by guesswork.** The
  product's own title is "Moretry Tianma X3+ **V3** 3x3" — i.e. the "+" line may itself carry
  its own internal version numbering parallel to (or continuing) the base line's V1-V4
  sequence, rather than being a single flat model. No other "X3+ V-number" SKU (a "+V1/V2/V4")
  was found anywhere this pass; the only other "+"-line SKUs found are configuration-named, not
  version-named ("Triple-Track Magnetic Frosted," "Double-Track Magnetic Frosted,"
  "Single-Track Magnetic Frosted," a UV-coated tier, and a "ZCube Edition" collaboration) — read
  as variants of this one model, not further generations, on the balance of evidence, but this
  is recorded as a real open question for a future pass, not a settled fact.
