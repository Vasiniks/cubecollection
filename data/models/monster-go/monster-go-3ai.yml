description: |-
  GAN's own product page: "Monster Go Smart Cube is the 3x3 cube with compatible app that helps
  you solve it as a beginner and improve yourself as a cuber. With inside replaceable battery,
  it offers a 280-hour play time... measures and saves your solve in 4 parameters:
  Time/Move/TPS/Fluency. Online battle is also available in MG3 Ai... Weight only 81g while
  adopting sensors, battery, circuit board inside" (gancube-monster-go-3ai-smart-cube-product).
  App-connected solve tracking (time/move/TPS/fluency), online battle matching, and a
  user-replaceable battery are the distinguishing features; no numeric size specification was
  found. Positioned by GAN's own copy as an educational/STEM toy as much as a speedcube ("Also
  a good cube for speed cubing"), consistent with the family's own `positioning: smart` and
  Monster Go's own children's/beginner brand positioning (see monster-go manufacturer record).
