  (thecubicle-eastsheen-wall-stickers, tier 2): "The Eastsheen 3x3x3 Cube with Wall Stickers is
  a standard Eastsheen 3x3 with stickers applied that have a marble texture look to them."
  Product Specifications table (re-fetched this pass from the same archive_url capture already
  cited on that source): "Manufacturer: Eastsheen / Type: 3x3 / Gross Weight: 100g / Dimensions:
  57.0mm / Item Weight: 98.5g." This is TheCubicle's ONLY 3x3x3 listing under the Eastsheen
  brand (confirmed by a dedicated `/products/eastsheen*` prefix sweep this pass, 11 distinct
  URLs, otherwise all 2x2/4x4/5x5) - no separately-sold plain, undecorated SKU was ever found;
  the "standard Eastsheen 3x3" phrase is the only evidence for a base design distinct from the
  Wall Stickers decoration, and that decorative sticker treatment is left as a pass-4 (variant
  enumeration) lead against this model, not folded into it as a second product.

  **Directly and squarely contradicted** by the Speedsolving wiki's dedicated Eastsheen page
  (speedsolving-wiki-eastsheen, held at tier 4 by this archive's own remediation record): "East
  Sheen does not produce 3×3 cubes," with its own product listing covering only 2x2/4x4/5x5 and
  Mini/Multi lines. Also worth recording, without concluding: no source found anywhere this
  pass suggests this product is an OEM/rebrand of a different maker's cube sold under the
  Eastsheen name at retail - the "standard Eastsheen 3x3" phrasing implies the retailer
  understood it as Eastsheen's own manufacture, not a third-party product relabelled - but this
  was not independently verified against any Eastsheen-manufacturer-side statement, since none
  was found (Eastsheen's own domain has been parked since at least 2011).
