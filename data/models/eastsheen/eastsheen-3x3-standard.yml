# Pass 3 (model enumeration), historic-makers lane. THE STANDING CONTRADICTION FLAGGED FOR THIS
# LANE IS NOT RESOLVED HERE - it is carried forward, unresolved, exactly as pass 2 left it.
#
# The boundary call: model EXISTENCE (S6 admission class 2) rests on a single tier 2 source,
# TheCubicle's structured "Manufacturer: Eastsheen" spec field on its "Eastsheen 3x3x3 Cube
# with Wall Stickers" listing, whose own prose calls the base object "a standard Eastsheen
# 3x3" - continuously listed across captures 2021-2025, not a one-off. This is directly
# contradicted by the Speedsolving wiki's dedicated Eastsheen page, which states flatly "East
# Sheen does not produce 3x3 cubes." Per this archive's own source-tiering, that wiki page is
# HELD AT TIER 4 (see its own reliability_note, issue E1: it self-flags as possibly outdated
# and was not given the tier-3 override six sibling wiki pages received) - a tier 4 source
# "corroborates only, never establishes" per RESEARCH_SPEC §5.1, so it cannot on its own defeat
# a tier 2 structured retailer claim, but it is a real, credible, direct denial and is recorded
# in full rather than quietly outweighed.
#
# A zero-model finding was seriously considered and rejected: rejecting the model here, with no
# new decisive counter-evidence beyond what pass 2 already weighed when it decided to keep
# eastsheen-3x3.yml as a real (if unusually thin) family, would silently overturn that pass-2
# judgement without new grounds. One model is admitted at `reported` confidence - matching the
# family's own confidence level exactly - rather than discarded or inflated.
#
# §3.6a compliance, done and its LIMITS recorded honestly: a Cubelelo (India)
# `/products/eastsheen*` prefix sweep and a cubezz.com (China) domain-wide CDX search for
# "eastsheen" BOTH returned zero captures of any kind. This is NOT strong 3x3-specific
# counter-evidence, because it is non-diagnostic: neither retailer carries ANY Eastsheen
# product at all (not even the brand's undisputed 2x2/4x4/5x5 lines), so this absence cannot
# discriminate "no 3x3" from "no Eastsheen presence whatsoever" at these two storefronts. A
# SpeedCubeShop `/products/eastsheen*` sweep (already run at pass 2, per eastsheen-3x3.yml)
# DOES carry other Eastsheen product lines (2x2/4x4/5x5) but no 3x3 - that remains the single
# most on-point piece of negative evidence, and it was already known before this pass.
