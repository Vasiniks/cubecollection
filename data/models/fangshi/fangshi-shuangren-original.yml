description: |-
  TheCubicle's own product page (thecubicle-fangshi-shuangren-v2, re-fetched this pass at its
  own archive_url for full page text): "The FangShi ShuangRen, 'frosted blade' in Chinese, is
  a recent 3x3 designed by Funs Puzzle. It is 57mm and boasts incredibly liberal corner cutting
  and easy, fluid movement." The same page: "Discontinued Product: This product is being
  replaced by the FangShi ShuangRen V2, and it will no longer be available once it is sold
  out." Product Specifications: "Manufacturer: FangShi / Type: 3x3 / Gross Weight: 95g /
  Dimensions: 57.0mm."

  Independently corroborated by cubezz.com (China, non-US, found this pass) under the
  manufacturer's "Funs Puzzle" branding: multiple listings for "Funs Puzzle ShuangRen 3x3
  Magic Cube" sold both as a DIY Kit (Black/White) and Assembled (White), plus a smaller "Funs
  Puzzle Mini ShuangRen 54.6mm 3x3 Magic Cube" size line (various body/cap colour
  combinations). DIY-kit-vs-assembled and the 54.6mm size line are read as sold configurations
  of the same underlying design per DATA_MODEL §4.2 ("size-only differences within one mould"
  and DIY-vs-assembled are both variant-level, not model-level) and left as pass-4 leads, not
  built into separate models - consistent with the Speedsolving wiki's own framing that "The
  ShuangRen has since been released in new sizes, and some cube retailers offer it in numerous
  colour combinations" (speedsolving-wiki-fangshi), which itself characterises sizes and
  colours as retailer-offered configurations rather than design generations.
