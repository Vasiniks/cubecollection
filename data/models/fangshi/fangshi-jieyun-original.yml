description: |-
  The base 57mm model of the JieYun line. Cubezz's own spec block gives "Size: 57*57*57mm...
  Weight: 91g" under SKU FUNSJY0B, and characterises the product as a "Funs Puzzle new design"
  (cubezz-fangshi-jieyun). TheCubicle states the physical difference that defines the line:
  "minor grooves on the pieces where the stickers are placed" (thecubicle-fangshi-jieyun).

  Contemporary reviews on TheCubicle's page consistently describe it as heavier and better
  finished than its predecessors — "The cube feels much heavier than the fangshi shuangren v2",
  "much less sandy than previous FangshiCubes", "unlike the flimsier feeling GuangYing and
  ShuangRen" — which is consistent with the 91g product weight against GuangYing's 86g.

  **Not recorded: a release date.** No explicit dated statement was found at any of the five
  retailers carrying this product. The family's `introduced` carries a `before 2015-09`
  circulation bound from Cubezz's earliest capture; that bound belongs to the family record and
  is deliberately not restated here as a model `released` value, because a circulation bound is
  not a release date and repeating it at model level would give it false weight.
