# generation (same "improvement over the discontinued original" framing, same 57mm size, same
# ~95g weight class) - two independent tier 2 sources agreeing a second generation exists
# satisfies rule 9's `confirmed` bar for model existence, even though neither individually
# proves the manufacturer's own official name is "V2" specifically rather than "II" or another
