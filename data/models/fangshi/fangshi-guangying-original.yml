description: |-
  The only model in its family. TheCubicle sold it at $14.99 in seven colourways, with a
  structured spec table giving "Manufacturer: FangShi, Type 3x3, Gross Weight 95g, Dimensions
  57.0mm", discontinued as of capture (thecubicle-fangshi-guangying). Cubezz sold the same
  product under SKU FUNSGY0B with its own spec block: "Size: 57*57*57mm... Weight: 86g"
  (cubezz-fangshi-guangying).

  The two weight figures are not in conflict: TheCubicle's 95g is labelled **Gross Weight** —
  the shipped package — while Cubezz's 86g is the product weight, the same distinction visible
  on HaiTun's records elsewhere in this archive, where gross and item weights are listed
  separately on one page. `weight_g` records the product weight.

  A customer review on TheCubicle's own page treats "the shuangren and the shuangren v2" and
  "the guangying" as three distinct products in a single sentence — a buyer's-eye confirmation
  of the family boundary this record sits inside.
