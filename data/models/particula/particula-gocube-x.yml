description: |-
  GoCube's own official product page (getgocube-com-2021-gocube-x-product, tier 1): "THIS IS the
  GoCube-X! A great starting point into the world of cubing! Now available in its classic shape
  at a great price!" with "Low Power Battery Operated (Coin CR1225) Over 60 hours of play" and
  "New Neon Colors." TheCubicle's own copy (thecubicle-gocube-x-3x3-2022, tier 2): "The GoCube-X
  3x3 is a new, less expensive smart cube from the famous brand. This one is non-magnetic, but
  still has all of the tracking of the original GoCube!" with a spec table: "Gross Weight: 134g /
  Dimensions: 57.0mm 3 / Item Weight: 103.0g" (no "Magnets" row, consistent with "non-magnetic").

  **Model-identity boundary call.** Three independent, stacking pieces of evidence support a
  distinct model rather than a checkout-time colour/battery option of GoCube Edge: (1) a
  different power architecture — a replaceable CR1225 coin cell, vs. Edge's built-in
  rechargeable-via-MicroUSB cell (getgocube-com-2019-gocube-edge-product) — which is a
  fundamentally different physical assembly (a battery compartment/door vs. a sealed rechargeable
  cell), not merely a component swapped at assembly time; (2) a stated "classic shape" contrasted
  against the flagship "GoCube"'s "Premium, stickerless" pillowed design in the manufacturer's own
  three-way comparison table on the same page; (3) different stated dimensions and weight (57.0mm
  / 103.0g vs. Edge's 60.0mm / 125.0g, per thecubicle-gocube-x-3x3-2022 and
  thecubicle-gocube-edge-3x3-2020 respectively) — a real, sourced dimensional gap consistent with
  different tooling, not just a config choice.

  **No succession relationship recorded, deliberately.** TheCubicle's "still has all of the
  tracking of the original GoCube" could plausibly refer to either GoCube Basic (the base 2019
  tier this X most resembles on price and specs) or the "GoCube" nav item current as of the
  X's own 2021 site captures (by then the former "Edge" line, consolidated under the plain
  "GoCube" name) — the sources do not disambiguate which, and no source states GoCube-X replaces
  or continues either specific prior SKU. Rather than assert an unsupported specific lineage,
  this model is recorded as a third, later, budget-tier sibling within the family with no
  `succeeds` relationship. A human reviewer with access to press coverage of GoCube-X's 2021
  launch could resolve this.
