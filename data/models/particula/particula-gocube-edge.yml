description: |-
  GoCube's own official product page (getgocube-com-2019-gocube-edge-product, tier 1) names
  this "GoCube Edge" (SKU GC33E), described as "the advanced Edge model." The manufacturer's own
  comparison table states a 250x tracking-accuracy advantage over the base "GoCube" (0.001 sec
  vs. 0.25 sec) plus exclusive Advanced Statistics and unrestricted Online Battles. A customer
  review on the same page names the "pillowed shape" directly, corroborated independently by
  TheCubicle's own later copy (thecubicle-gocube-edge-3x3-2020, tier 2): "a magnetic 3x3
  equipped with Bluetooth 5.0... a novel pillowed design, giving it a cool, futuristic
  appearance," with a spec table: "Gross Weight: 436g / Dimensions: 60.0mm 3 / Magnets: Magnetic
  / Item Weight: 125.0g." TheCubicle's copy also frames it (marketing language, not a
  specification) as "one of the first smart cubes ever released."

  **"GoCube Edge Full Pack" is this model, bundled, not a fourth model.** GoCube's own page for
  that exact name (getgocube-com-2019-fullpack-bundle, tier 1) states its box "Includes – GoCube
  EDGE, [a] charging stand... USB charger... [and a] Pouch" — a packaging bundle of this cube
  plus accessories, per DATA_MODEL §4.1's explicit exclusion of packaging/bundle differences from
  new-record status. Particula's current (2026) product page (particula-tech-com-gocube-2026)
  continues to market this same model under exactly that bundle name as its flagship SKU, so
  "GoCube Edge Full Pack" is carried here only as an alias, not a separate record.

  **Model-identity boundary call** (mirrored from particula-gocube-basic.yml): the stated 250x
  tracking-accuracy gap plus the pillowed shape (vs. Basic's apparently-standard shape, on which
  no source is explicit) are treated together as design-level identity evidence for a separate
  model from GoCube Basic, not a checkout-time accuracy/price tier of one design.
