description: |-
  GoCube's own official product page (getgocube-com-2019-gocube-product, tier 1) names this
  product plainly "GoCube" (SKU GC33A), and gives a direct first-party feature comparison
  against "GoCube Edge" (SKU GC33E): "Note: Get the Edge version to access the group and friends
  battle modes, accurate tracking, advanced statistics, and leaderboard." The comparison table
  itself states a stated 250x difference in tracking accuracy — "0.25 sec" for this product vs.
  "0.001 sec" for GoCube Edge — plus Edge-only Advanced Statistics and unrestricted Online
  Battles. Concurrent sale is established directly: getgocube-com-2019-basic-edge-skus (also
  tier 1) lists "GoCube Basic" ($69.95) and "GoCube Edge Full Pack" ($79.95) as two SKUs sold
  side by side in December 2019.

  **Model-identity boundary call.** No source states outright that this product uses a
  different mould than GoCube Edge, but the stated 250x tracking-accuracy gap is treated as
  evidence of a materially different sensor/IMU component (not merely a firmware setting), and
  GoCube Edge's own page and a customer review both independently describe Edge's shape as
  "pillowed" (getgocube-com-2019-gocube-edge-product; thecubicle-gocube-edge-3x3-2020's "novel
  pillowed design") — a feature never mentioned on this product's own page. Taken together, this
  is treated as sufficient identity evidence for two separate models rather than one model with
  a checkout-time accuracy/price tier, though no source directly states this product's own shape
  as `standard`, so `specs.shape` is left unset rather than inferred from the absence of the
  word "pillowed."

  No standalone "GoCube Basic" 3x3 product page was found at TheCubicle or SpeedCubeShop in this
  pass's discovery (both retailers' captured GiiKER/GoCube prefixes carry only Edge and X) — the
  only spec-bearing sources for this model are GoCube's own site, which gives no dimensions or
  weight for this SKU. `specs.size_mm` and `specs.weight_g` are therefore left unset rather than
  guessed from the Edge or X figures.
