description: |-
  TheCubicle (thecubicle-senhuan-mars-3x3-2019): "The Mars 3x3 is the first cube produced by
  the SenHuan brand. It uses a unique ultra-small inner circle design that is touted to
  increase stability and reduce turning resistance. It also features high-precision molded
  3-piece corners that allows for stickerless versions. The puzzle is packaged in a large
  plastic case." An independent non-US retailer (Cubelelo, India) found this pass carries this
  exact product in "Pre-Order" status as of 2016-10-31 (cubelelo-senhuan-mars-2016) — nearly
  three years before TheCubicle's own earliest found capture, and consistent with this being
  at or very near the product's actual introduction. Cubelelo's own description text
  ("MARS is the first product of SenHuan brand, which uses [a] unique ultra-small inner circle
  design...") is near-identical in substance to TheCubicle's and is treated as the same
  underlying manufacturer copy, not independent corroboration of content (RESEARCH_SPEC §3.2)
  — only of existence and this earlier date.

  Marked discontinued on every capture found this pass, at both retailers.
