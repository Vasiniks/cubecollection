description: |-
  TheCubicle's own product page (thecubicle-guojia-type-a-chun2-2020, tier 2, archived capture
  2020-09-20): "The Type A Chun2 is a 3x3 cube that features a unique internal mechanism and
  steel parts for the edge pieces. It is currently only available in DIY Kit form. Disclaimer:
  The steel parts provided are designed for the Type A Chun1 since the Chun2's steel parts are
  no longer in production. The steel parts still fit, but glue may be required to hold all of
  the steel pieces in place. The cube is usable without the steel parts, although the feel of
  the cube is different without them." Structured spec table: "Manufacturer: GuoJia / Type: DIY
  Kits / Added: 2018-11-07 / Gross Weight: 103g." Marked "Discontinued" on this and the only
  other capture found.

  Steel edge-piece hardware is described as a defining feature of this design ("unique internal
  mechanism and steel parts"), and the disclaimer's own account of Chun1's steel parts not
  perfectly interchanging with Chun2's ("still fit, but glue may be required") is read as
  evidence of a real hardware/tooling difference between the two named generations, not merely
  a sold configuration choice — the basis for admitting Chun1 and Chun2 as separate models
  under DATA_MODEL §4.2, connected by a `succeeds` relationship, rather than folding them into
  one model.
