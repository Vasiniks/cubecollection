# model: guojia-type-a-chun2
# Pass 3 final-seven lane, Agent A. The only GuoJia 3x3x3 with its own dedicated retailer
# product page found across this pass's sweeps. Its own page's disclaimer directly names a
# predecessor, "Type A Chun1" (see guojia-type-a-chun1), with a described hardware difference
# (steel edge parts) — the basis for treating these as two design generations rather than one.
id: guojia-type-a-chun2
