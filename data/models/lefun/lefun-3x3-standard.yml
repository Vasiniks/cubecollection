# model: lefun-3x3-standard
# Pass 3 final-seven lane, Agent A. LeFun's single base 3x3 mould, sold under dozens of
# individually-marketed print-theme/gift editions. Print themes (including the "V2" print
# revisions found on the Christmas and Periodic Table themes) are colourway/decoration
# variants of this one model per DATA_MODEL §4.1, not separate models — confirmed this pass by
# directly fetching one "V2" listing (Periodic Table 3x3 V2) and finding no mechanism claim
# whatsoever, only a content/print change ("a standard, non-magnetic 3x3 with different
# elements on each face"). Pass-4 territory, not enumerated further here.
