description: |-
  Four LeFun 3x3-shaped product pages were fetched in full this pass (not only their existing
  sources' own excerpts) specifically to test for a mechanism-level generation change: **Formula
  3x3** (thecubicle-lefun-formula-3x3, "Dimensions: 55.5mm³ / Gross Weight: 77g / Item Weight:
  65.3g"), **Sudoku 3x3** (thecubicle-lefun-sudoku-3x3-2022, "56.0mm³ / 78g gross / 66.3g
  item"), **Calendar Cube** (thecubicle-lefun-calendar-cube-3x3-2026, "56.0mm³ / 79g gross /
  70.0g item"), and **Periodic Table 3x3 V2** (fetched fresh this pass, no existing source
  record; "The Lefun Periodic Table 3x3 V2 is a standard, non-magnetic 3x3 with different
  elements on each face... 56.0mm³ / 79g gross / 70.0g item"). All four are described in
  identical generic terms ("a standard, non-magnetic 3x3") with the only stated difference
  being the printed face content — no core, mechanism, or tooling claim differs anywhere, and
  the "V2" suffix on Periodic Table (and, by the same evident pattern, on the "Christmas 3x3
  V2" theme) reads as a print-content revision of a decorated edition, not a manufacturer-
  declared generation of the underlying cube. This confirms, rather than merely assumes, the
  frozen family record's own one-base-mould reading.

  A large further range of print-theme editions (Dollar Cube, Hundred-Dollar Cube, Number
  Cube, Respect Cube, Gradient Cube, Halloween Cube, Blue Sudoku Cube, and the two "V2" themes)
  was found via the same prefix sweep but not individually fetched this pass — treated as
  further variants of this one model on the same evidentiary pattern, not tested individually.
