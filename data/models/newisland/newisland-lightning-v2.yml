description: |-
  TheCubicle (thecubicle-newisland-lightning-v2-2019): "The Newisland Lightning V2 is a
  high-quality 3x3 speedcube marketed and created exclusively by Newisland. It rotates very
  smoothly right out of the box, and comes pre-lubricated from the factory. It also comes with
  a mesh cube bag inside the sturdy box, as well as a maintenance/solution manual and an extra
  set of factory stickers." The wording is near-identical to the original Lightning's own
  description but for the added "created exclusively" phrase and a slightly different
  accessory bundle (no replacement edge/corner piece, per the family record's own comparison).

  **No source states a mechanism change** between this and the original Lightning — the only
  documented differences are the accessory bundle and the manufacturer's own "V2" version
  number. Per DATA_MODEL, a version number is evidence of a design change but weak evidence
  that a difference is "merely" a configuration; an accessory-bundle difference alone would
  ordinarily be a variant-level fact (packaging), not a model split. Given genuine uncertainty
  about whether "V2" reflects a real mould/mechanism revision or simply a repackaged bundle
  sold under a new marketing name, this pass follows RESEARCH_SPEC §4 worked decision G and
  splits into two models with a `succeeds` relationship, at `confidence: uncertain` on the
  identity claim, rather than collapsing what may be a real generation into a variant of the
  original — a human reviewer with time for a direct mechanical comparison should revisit this.

  The "created **exclusively**" phrasing is also some retailer-level counter-evidence against
  the same rebrand-of-QiYi-Thunderclap suspicion flagged on the original Lightning (see
  newisland-lightning-original.yml), though itself promotional copy, not a documented
  supply-chain fact — the suspicion is left exactly as open here as on the original.
