description: |-
  Cubelelo (cubelelo-mohuanshousu-chufeng-2016), captured 2016-10-30: "The first speed cube
  from MoHuanShouSu(MHSS) Brand, desined by ZhangHaiXu, try one now! Chufeng 3x3 is the first
  product of brand MoHuanShouSu, which is designed by former world record holder: Haixu Zhang.
  A conception, which is called ball-track, is applied in this cube, it makes every position of
  the cube has supporting point when turning the cube." TheCubicle's own, later and differently
  worded description (thecubicle-mohuan-shousu-chufeng-2020, crawled 2020-09-18): "The MoHuan
  ShouSu ChuFeng is a new MoYu sub-branded 3x3 that was designed by Zhang HaiXu, the former 4x4
  world record holder. The ChuFeng offers many premium design features at a mid-range price,
  and it has a unique crunchy feel." The two sources independently agree on the designer
  attribution (Zhang HaiXu / former [4x4] world-record holder), corroborating it across
  genuinely different retailer copy (RESEARCH_SPEC §3.2).

  Cubelelo's own capture (2016-10-30) is roughly four years earlier than TheCubicle's earliest
  found capture, moving the plausible circulation date to late 2016 or earlier — materially
  earlier than the family record's own "circa 2020" `introduced` reading (which rests on
  TheCubicle alone and is not altered here; families are frozen for this pass).

  **Designer lead, not actioned.** Both sources name the designer as Zhang HaiXu / ZhangHaiXu,
  a former world-record holder (4x4, per TheCubicle) — independently corroborated across
  genuinely different retailer copy. No `person` record for this individual exists in
  `data/people/` at the time of this pass, and creating one is out of this pass's write lane
  (models only); the `designer` field is left unset here rather than pointing at a
  not-yet-created id, and this is flagged as a lead for whoever researches people/designers.

  No second MoHuanShouSu-branded 3x3, predecessor, or successor was found this pass
  (`thecubicle.com/products/mohuan*` returns exactly this 3x3 plus one unrelated 2x2, out of
  scope). This is therefore both the family's founding and only model.
