description: |-
  Per the family record's own account (drawing on speedsolving-wiki-dayan-products): "ZhanChi
  42mm — Released 2012. This is a smaller version of the Zhanchi." SpeedCubeShop's own DIY-kit
  listing, captured 2015-11-13, independently corroborates existence and naming, and describes
  it as a genuinely miniature product rather than a minor size tweak: "The 42mm DaYan ZhanChi
  is the best performing miniature cube on the market. You really do not lose any performance
  by dropping down to a 42mm cube" (speedcubeshop-dayan-zhanchi-size-diy-kits). Recorded as a
  separate model from the standard-size ZhanChi (dayan-zhanchi-v1) rather than a variant of it,
  because it is sold from its own distinct product page/SKU rather than as a size choice on one
  listing — the opposite structure from GuHong Pro M/Pro+'s 54/55/56mm, which this archive
  treats as variant-level. No `succeeds` relationship is recorded: this is a contemporaneous
  alternate-mould size of the original ZhanChi, not a design generation that replaced it, and
  DATA_MODEL's relationship vocabulary has no type for "concurrent alternate mould, same
  family" — noted as a modelling gap in the pass-3 report rather than forced into `succeeds`.
