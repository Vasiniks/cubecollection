# Pass 3 (model enumeration). A reduced-size ZhanChi sold as its own SpeedCubeShop product
# page from at least 2015, described as "the best performing miniature cube on the market" --
# not a "choose your size" configuration option on the standard-size ZhanChi listing (contrast
# GuHong Pro M/Pro+, where 54/55/56mm are explicitly offered from one listing). Treated as a
# separate model per the boundary-call reasoning in research/notes/models/dayan-pass3.md: a
# drop from ~55mm to 42mm is a distinct mould/tooling scale, not an assembly-time parts choice,
# and the retailer structure (its own page, not a size selector) supports that reading.
