# Pass 3 (model enumeration). DaYan's first cube, single-generation. Existence corroborated by
# a TheCubicle product page; the naming-origin narrative rests on the Speedsolving wiki alone.
# Notably absent from dayancube-official-2013's own product list. See
# research/notes/models/dayan-pass3.md.
