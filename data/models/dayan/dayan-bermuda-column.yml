# model: dayan-bermuda-column
# P26-5 remediation (ledger P26-10, tranche 1). One of five parallel sub-products named by DaYan's
# own 2012 category page. No `generation` is set: these are concurrent products, not a sequence —
# the witeden-mixup-3x3 precedent (four concurrent moulds, one family, generation unset).
id: dayan-bermuda-column
entity: model
family_id: dayan-bermuda
manufacturer_id: dayan
name: "DaYan Bermuda Column"
aliases:
  - "DaYan Bermuda Barrel"
scope_class: conditional
scope_justification: |-
  "Bandaged" cubes are a recognised, named twisty-puzzle mechanism category with documented
  permutation-group significance, not a marketing label — the same basis on which this archive
  already admits calvins-bandaged-3x3-maze-300. This line clears the RESEARCH_SPEC §2.2 bar on
  two independent grounds. First, a documented place in the manufacturer's own history: DaYan gave
  Bermuda its own top-level product category on its own site in 2012
  (dayancube-official-bermuda-category-2012, tier 1), beside the GuHong/LingYun/LunHui/ZhanChi
  flagship line — not a one-off SKU but a named line the maker itself promoted. Second, a
  documented multi-year, multi-retailer collector market: TheCubicle carried the series from 2019
  to 2026 and Cubelelo from 2020 to 2025+, independently, more than a decade after the
  manufacturer's own captures. Significance here is documented, not asserted — this record does
  not rest on the puzzle being unusual or interesting.
scope_decided_by: "P26-5 adjudication, main session"
scope_decided_on: "2026-09-08"
description: |-
  A cylinder/barrel-form member of the line, named 'Column' by the manufacturer and carried as 'Barrel' by TheCubicle.

  A 2013 manufacturer product page cross-links Column and Triangle as concurrently-sold siblings, which is why no generation ordering is recorded between them.
legality:
  wca_status: not_legal
  basis: >-
    Bandaged construction, and a non-cubic exterior form named by the manufacturer.
