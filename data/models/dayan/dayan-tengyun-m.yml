# model: dayan-tengyun-m
# Pass 3 (model enumeration). DaYan's eighth numbered product and, per the wiki, "the first
# mass-produced Dayan 3x3 with magnets" -- the introduction of magnets to DaYan's lineup is the
# anchor fact used across this pass to infer that every earlier DaYan 3x3 model predates
# magnets. TheCubicle's own copy corroborates the 55mm size. See
# research/notes/models/dayan-pass3.md.
