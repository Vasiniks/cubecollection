description: |-
  DaYan's eighth numbered product. Per the Speedsolving wiki: "TengYun M Version 1 ...
  Released January 2019. Considered a comeback for Dayan and their first competitively viable
  3x3 in about 6-7 years... the first mass-produced Dayan 3x3 with magnets." TheCubicle's own
  copy corroborates the size and feel: "The DaYan TengYun M is a smooth, 55 mm 3x3 speed cube
  that is one of the quietest 3x3's on the market. It has a unique design and feel that sets it
  apart from other modern 3x3's" (thecubicle-dayan-tengyun-descriptions), and lists "Two extra
  sets of springs (standard and strong)" included in the box — spring-based, not maglev,
  tensioning for this first generation.
