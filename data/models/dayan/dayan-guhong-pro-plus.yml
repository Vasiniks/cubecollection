  - "GuHong Pro" # retailer URL slugs for this SKU drop the "+"; do not confuse with the
    # earlier, distinct "GuHong Pro M" (dayan-guhong-pro-m), which the retailer copy
    # consistently distinguishes from this generation by name.
scope_class: core
