description: |-
  TheCubicle's own copy: "The DaYan GuHong Pro+ 3x3 54mm (MagLev) is the next evolution of the
  legendary GuHong lineup, tailored for speedcubers who demand peak performance and
  flexibility. This Pro+ version introduces a suite of cutting-edge enhancements, including
  adjustable corner-core magnets, a fully magnetic core, and easy-to-use numerical tension
  adjustment settings... A truly worthy upgrade for loyal GuHong Pro users"
  (thecubicle-dayan-guhong-pro-plus-2026). SpeedCubeShop independently names and describes the
  same generation: "The DaYan GuHong Pro+ 3x3 (Magnetic, Core Magnets) – 54mm is a
  competition-ready 3x3 speed cube... corner-to-core magnets (core magnets) improve alignment
  control" (speedcubeshop-dayan-guhong-pro-plus). Sold in the same 54/55/56mm x
  magnetic/maglev configuration structure as GuHong Pro M, treated identically as
  variant-level per DATA_MODEL §4.2. No manufacturer-first-party or dated-press statement of a
  release date was found; the earliest retailer evidence is a 2025-11 CDX capture
  (thecubicle-dayan-guhong-pro-plus-2026's preservation_note) and an "Added 2025-10-08"
  catalogue field at TheCubicle, neither treated as a launch date, so `announced` is recorded
  only as a "before 2025-10" floor per the S6 policy's treatment of circulation-only evidence.
