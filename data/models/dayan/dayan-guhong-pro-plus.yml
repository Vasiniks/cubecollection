# model: dayan-guhong-pro-plus
# Pass 3 (model enumeration). Two independent tier-2 retailers (TheCubicle, SpeedCubeShop)
# both name this "GuHong Pro+" and both describe it as an upgrade from GuHong Pro (M):
# TheCubicle calls it "the next evolution of the legendary GuHong lineup ... a truly worthy
# upgrade for loyal GuHong Pro users," introducing "adjustable corner-core magnets" and
# "numerical tension adjustment settings" in place of Pro M's 5-position hand-adjustable
# tension. A mechanism/adjustment-system change under DATA_MODEL §4.2, not merely a
# reconfiguration. See research/notes/models/dayan-pass3.md.
