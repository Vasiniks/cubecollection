description: |-
  TheCubicle's own copy: "The DaYan TengYun V2 M is an exciting new magnetic 3x3 speed cube
  from classic manufacturer DaYan. Weighing in at a modest 83g, the TengYun V2 M features three
  magnetic settings that you can adjust by rotating a plate, as well as adjustable elasticities
  and tensions without having to switch out any components. Using DaYan's new adjustment tool,
  you can choose from four tensions and four elasticity settings. The TengYun V2 M's edge
  pieces have a similar wave-like design akin to the GuHong V3 M"
  (thecubicle-dayan-tengyun-descriptions). Per the wiki: "released in early 2020, and featured
  customization options, such as adjustable springs, and magnet strength... for the first time,
  DaYan has a competitively viable cube."
