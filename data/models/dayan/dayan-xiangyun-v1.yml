description: |-
  DaYan's seventh numbered product, the family's only generation. Per the Speedsolving wiki:
  "Dayan 7: XiangYun — Released March 2018. An improvement upon the ZhanChi 2017 design. It had
  a new capped design, rounded internal corners and a brighter color scheme. But still
  considered an unstable cube, with noticeable corner catching." TheCubicle's own product page
  ("dayan-xiangyun-3x3", earliest capture 2020-09-27) corroborates existence and naming at tier
  2 (thecubicle-dayan-per-family-product-urls-2026); TheCubicle's ZhanChi 2018 description
  independently references "Following the XiangYun" (thecubicle-dayan-zhanchi-descriptions),
  cross-confirming the sequencing the wiki gives. No manufacturer-first-party ordinal ("Dayan
  VII") was found; dayancube-official-2013 predates this product by five years.
