  Cubezz.com (cubezz-mojue-m3-2017), captured 2017-04-02: "MoJue M3 Speed Cube is the first
  product of MoJue brand, which has a great innovation. Unique round-square center combines
  with arc surface on the bottom, brings a good stability and corner-cutting, decreasing the
  frequency of corner-twist." The listing already carries a customer rating, an established
  SKU (MJ620100), and bulk-order pricing tiers at this capture — evidence of real, established
  retail circulation, not a pre-order.

  TheCubicle's own, much later capture (thecubicle-mojue-m3-2020, crawled 2020-09-27) instead
  frames the product as new: "an exciting new high-end MoYu sub-branded 3x3 that will soon hit
  the market and is now available for pre-order." Read together, this most plausibly reflects
  TheCubicle's own later pickup of an already-existing (2017) product — a restock or a first
  listing at that specific retailer — rather than a genuine ~2020 introduction. This model's
  `released` field follows the earlier, better-evidenced Cubezz date; the family record's own
  "circa 2020" `introduced` reading rests on TheCubicle alone and is not altered here (families
  are frozen for this pass).

  No second MoJue-branded 3x3, predecessor, or successor was found this pass (product-slug
  sweep of `thecubicle.com/products/mojue*` and a domain-wide term sweep of `cubezz.com`, both
  returning exactly one MoJue 3x3). This is therefore both the family's founding and only
  model.
