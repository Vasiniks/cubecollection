description: |-
  Per the Speedsolving wiki (speedsolving-wiki-cyclone-boys-products): "Cyclone Boys FeiJue M —
  Decent budget magnetic option, widely regarded as inferior to the Kylin V2 M and the Yulong
  V2 M." Two independent tier 2 retailers corroborate and extend this: Cubezz.com
  (cubezz-cyclone-boys-feijue, non-US), captured 2018-01-30, states directly "First magnetic 3x3
  cube from Cyclone Boys brand," giving "Size: 56*56*56mm / Packing Weight: 205g" (a box/
  shipping weight, not recorded as `weight_g` here — see that source's own reliability_note).
  TheCubicle (thecubicle-cyclone-boys-feijue, US), captured 2020-09-18, agrees exactly on the
  56mm dimension and adds: "It features highly rounded pieces, a modern internal mechanism, and
  magnetized slots in the edges and corners," with a structured "Magnets: Magnetic" field and
  "Gross Weight: 213g / Item Weight: 89.9g." No release date was found for this product at any
  tier, and no further FeiJue generation or a non-magnetic base "FeiJue" (without "M") was found
  anywhere this pass; this is the family's sole model.
