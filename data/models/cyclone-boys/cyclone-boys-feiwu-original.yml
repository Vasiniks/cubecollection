  Per the Speedsolving wiki (speedsolving-wiki-cyclone-boys-products): "Cyclone Boys FeiWu —
  Released: March 2014. A cheap but very solid cube. The FeiWu was a popular beginners cube and
  was widely available on Amazon and similar stores. Only available as stickerless. It is very
  controllable and robust: it does not pop, doesn't really lock up, and the centre-caps never
  fall out." Cubezz.com's independent product listing (cubezz-cyclone-boys-feiwu, tier 2,
  non-US) gives "Package Dimensions: 55*55*55mm / Weight: 95g" and describes "the colored new
  version with big central axis" — implying a coloured, stickered configuration existed
  alongside the wiki's "only available as stickerless" framing, a configuration-level detail
  left as a pass-4 lead rather than resolved here. No further FeiWu generation was found (per
  cyclone-boys-feiwu.yml); this is the family's sole model, later succeeded by the separate
  `cyclone-boys-feichi` family.
