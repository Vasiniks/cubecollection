  economical price of $12... Its main rival is emerging to be the GAN356R, which it completely
  outstrips." TheCubicle's own product description (thecubicle-yj-mgc-original-product,
  2019-07-21 capture): "The YJ MGC is a new, high quality 3x3 by veteran cube producer, YJ. The
  MGC comes at a compact size of 55mm and features a magnetic positioning system, primary
  internals, and stellar all-around performance."
