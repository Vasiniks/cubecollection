name: "YuXin Little Magic M V2"
scope_class: core
generation:
  label: "V2"
  ordinal: 2
  basis: manufacturer_declared
specs:
  size_mm: 55.5
  maglev: none
  adjustment_system: tool_free
description: |-
  666toy's own product page for item 1673M (666toy-little-magic-3x3-products): "Little magic
  magnetic magic Cube V2, racing standard size, 55.5 x 55.5 x 55.5mm, weight is about 76g...
  Add the magnetic adsorption technology... 12 Easily adjustment of the hand feel, configure the
  auxiliary handle of the spring, can easily adjust the elasticity... The brick pattern anti
  -adhesive trough, the magic cube rotates more smoothly..." The Speedsolving wiki independently
  (speedsolving-wiki-yuxin-products): "YuXin Little Magic M V2 — An updated version of the YuXin
  Little Magic M. Sporting a brick pattern design on the pieces and having an adjustment system,
  much like the Moyu RS3M." thecubicle-yuxin-collection-2025 records "yuxin-little-magic-3x3-v2-
  m" as a retail SKU (capture 2024-09-12); cubezz-yuxin-3x3-collection-2026 independently lists
  "YuXin Little Magic M V2 3x3x3... Stickerless" and a UV-coated version — three independent
  sources (tier 1 manufacturer, two tier 2 retailers) agreeing on this generation's existence
  and "V2" naming.

  `weight_g` is left unset at model level: 666toy states "weight is about 76g" only for the
  1673M (magnetic) item; no source gives a non-magnetic 1673 base weight to establish a shared
  design-level default distinct from the magnet's own contribution. `adjustment_system` is
  recorded as `tool_free` on the strength of "auxiliary handle of the spring, can easily adjust
  the elasticity" (adjustment via a handle, not a described tool) — the closest vocabulary
  value, though the manufacturer's own text does not use the word "tool-free."
