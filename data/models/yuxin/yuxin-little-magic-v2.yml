# model: yuxin-little-magic-v2
# Pass 3 (model enumeration). A redesigned Little Magic generation: manufacturer item 1673
# (distinct from 1513), the manufacturer's OWN product title reading "Little magic magnetic
# magic Cube V2" (tier 1 for the "V2" numeral, unlike the HuangLong V2 case). New piece-surface
# geometry ("brick pattern anti-adhesive trough" — matching the wiki's independently-worded
# "brick pattern design on the pieces") and a new spring-tension adjustment mechanism are the
# basis for model-level (not variant-level) treatment under DATA_MODEL §4.2.
id: yuxin-little-magic-v2
