description: |-
  666toy's own product page, item 1722 (666toy-little-magic-3x3-products; filed under the
  manufacturer's "little-magic-series" category, but titled "Yuxin Small Magic 1722 Magnetic
  Suspension Third Order Rubik's Cube"): "Yuxin Little Magic Magnetically Suspended Third Order
  Magic Cube adopts the leading magnetic levitation technology, which makes the Magic Cube
  rotate with greatly reduced friction, smooth and light." No numeric spec table and no "V3"
  numeral on this page. cubezz-yuxin-3x3-collection-2026 independently lists "YuXin Little Magic
  V3 MagLev 3x3x3 Cube VT Version" and "...UV Version," both with size 55.5x55.5x55.5mm and
  weight 68.2g — the basis for both the "V3" generation label and the size/weight specs recorded
  here.

  The manufacturer's own page text alternates between "Little Magic" (in the body copy, "Yuxin
  Little Magic Magnetically Suspended...") and "Small Magic" (in the page's own title/heading),
  which reads as an internal translation inconsistency rather than two distinct product lines —
  paralleling the independently-documented Black Kirin/Black Kylin spelling inconsistency on
  this same manufacturer's site (see 666toy-black-kirin-kylin-3x3-products). Recorded here under
  the yuxin-little-magic family per the manufacturer's own category placement and the
  independent retailer's "Little Magic V3" naming; `confidence: uncertain` recorded on the
  family-identity link given the page's own conflicting title.
