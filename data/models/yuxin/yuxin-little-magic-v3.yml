# model: yuxin-little-magic-v3
# Pass 3 (model enumeration). A MagLev redesign of Little Magic — magnetic-repulsion core in
# place of a spring core is a mechanism difference under DATA_MODEL §4.2. Manufacturer item
# number 1722; the manufacturer's OWN product page names it "Small Magic" rather than "Little
# Magic" (the same Kirin/Kylin-style cross-page transliteration inconsistency independently
# observed on this manufacturer's Black Kirin/Kylin pages), but the manufacturer files the
# product under its "little-magic-series" category, and an independent tier-2 retailer names it
# "Little Magic V3 MagLev" directly. Kept in the yuxin-little-magic family on that basis. See
# research/qc/pass3-b2-agent-a-yuxin.md.
