      (number 1722) under its own \"little-magic-series\" category. So the manufacturer uses
      both names on one page and calls the line Little Magic in the two places that carry more
      weight than a heading: its own prose and its own taxonomy. Cubezz independently titles it
      \"YuXin Little Magic V3 MagLev\".
      HELD AT `probable`, NOT `confirmed`: the heading genuinely does say Small Magic, and that
