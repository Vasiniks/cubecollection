    note: "REVIEWED 2026-09-11, closing ledger P4-15; raised from `uncertain`. The review did
      not need new evidence - it needed reading the source already cited. The flag said the
      manufacturer's page title reads 'Small Magic' rather than 'Little Magic', which is true
      of the HEADING only. The same 666toy page's BODY copy reads \"Yuxin Little Magic
