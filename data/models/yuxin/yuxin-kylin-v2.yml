description: |-
  666toy's own product page (666toy-black-kirin-kylin-3x3-products), item 1543: "Yuxin Kylin
  1543 Rubik's Cube V2, racing standard size: 55.5x55.5x55.5mm; Large fault-tolerant design, it
  can be rotated even without alignment... Anti-stick grooves and extended foot design...
  Available in black and clear colors." No magnet mention on this specific page. The
  Speedsolving wiki independently (speedsolving-wiki-yuxin-products): "YuXin Kylin V2 M —
  Another tiled 3x3 from YuXin, with this one being magnetized. It and the YuXin Black Kirin V2
  can be bought with transparent plastic" — matching this page's own "black and clear colors."
  thecubicle-yuxin-collection-2025 records "yuxin-kylin-3x3-v2-m" as a retail SKU (capture
  2022-10-14); cubezz-yuxin-3x3-collection-2026 independently lists both "YuXin Kylin V2 3x3x3
  Speed Cube" (non-magnetic, 55.5mm, 79g) and "YuXin Kylin V2 M 3x3x3 Magnetic Speed Cube"
  (55.5mm, 84g) — the magnetized "M" and non-magnetized base read as a variant-level (weight/
  magnet) difference on this one V2 design, not separate models, matching the "M" pattern
  already applied to HuangLong and Little Magic in this family group.

  `weight_g` is left unset at model level: the non-magnetic and magnetized SKUs differ (79g vs
  84g per cubezz), so no single figure is a shared design-level default.
