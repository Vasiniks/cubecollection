description: |-
  666toy's own product page for item 1513 (666toy-little-magic-3x3-products): "Little Magic
  Level 3 magic Cube, racing standard size, 55.5x55.5x55.5mm... Upgraded mold, better feel,
  avoiding the light feel caused by hollow corner blocks; The axis is very light, only 1.2g...
  Using 2mm screws, hardened and heat treated..." No magnet mention on this page. The
  Speedsolving wiki (speedsolving-wiki-yuxin-products) independently: "YuXin Little Magic — ...
  a newer and more famous 3x3 by YuXin. It has widely replaced the original YuXin 3x3... rated
  as one of the better budget 3x3s."

  Item 1513M's own page gives a slightly different dimension (55.7mm vs 1513's 55.5mm) alongside
  its magnet description — read as measurement/rounding noise around the same mold rather than a
  separate design, consistent with the wiki's "factory magnetized version" framing; `size_mm`
  here records the base (1513) page's own figure. A further "1513M UV" page repeats the 1513M
  text with an added UV-coating sentence, treated as a further variant of the same design, not a
  separate model. `weight_g` is left unset: no source states an overall cube weight for this
  generation (only the accessory base's weight, "4.5g," which is not the cube itself).
