# manufacturer item number 1513 (magnetized as 1513M, UV-coated as 1513M-UV). No source gives
# this generation its own version numeral; treated as the base ("Original") generation preceding
# the manufacturer-declared "V2" (item 1673, yuxin-little-magic-v2). See
# research/qc/pass3-b2-agent-a-yuxin.md.
id: yuxin-little-magic-original
