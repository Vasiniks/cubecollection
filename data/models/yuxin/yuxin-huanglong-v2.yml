manufacturer_id: yuxin
name: "YuXin HuangLong V2 MagLev"
scope_class: core
generation:
  label: "V2 (MagLev)"
  ordinal: 2
  basis: community_convention
specs:
  size_mm: 55.5
  maglev: maglev
  weight_g: 72.3
description: |-
  666toy's own product pages for item 1524 (666toy-huanglong-3x3-products; "1524VT" and
  "1524UV"): "Yuxin Huanglong 3x3 Maglev Magic Cube is not only a product, but also an
  attitude..." — names the mechanism "Maglev" directly but gives no numeric spec table and no
  "V2" numeral. cubezz-yuxin-3x3-collection-2026 independently lists "YuXin HuangLong V2 MagLev
  3x3x3 Speed Cube Texture VT Version" and "...UV Version" with brand field "YuXin HuangLong
  MagLev," size 55.5x55.5x55.5mm, and weight 72.3g (VT) / 72.8g (UV) — the two capture-to-capture
  weight figures are treated as measurement noise around one design rather than a further split.
  thecubicle-yuxin-collection-2025 independently records "yuxin-huanglong-3x3-v2-m-uv-coated" as
  a retail SKU (first capture 2025-10-01), the second, independently-worded retailer source for
  the "V2" numeral on this item.

  "VT" and "UV" are treated as surface-treatment/plastic variants of this one MagLev design
  (item 1524), not separate models, matching the "M"/"UV coated" variant pattern already
  established for yuxin-huanglong-original and for MoYu WeiLong/RS3M elsewhere in this pass.
  `weight_g` records the VT-version figure; the ~0.5g difference to the UV figure is not treated
  as a model-level spec difference.
