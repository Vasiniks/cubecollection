# model: yuxin-huanglong-v2
# Pass 3 (model enumeration). A MagLev redesign of the HuangLong 3x3 — magnetic-repulsion core
# in place of the original's spring-and-gasket core is a mechanism difference under DATA_MODEL
# §4.2, not a sold configuration, so this is a new model rather than a variant of
# yuxin-huanglong-original. Manufacturer item number 1524 (vs. 1523 for the prior generation).
# "V2" is not used in 666toy's own product-page prose for this item, but is corroborated by two
# independent tier-2 retailers (cubezz, TheCubicle) using that exact numeral for this same
# MagLev item. See research/qc/pass3-b2-agent-a-yuxin.md.
id: yuxin-huanglong-v2
