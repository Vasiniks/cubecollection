# model: guoguan-yuexiao-edm
# Pass 3 (model enumeration), agent D. Third GuoGuan YueXiao generation. TheCubicle states the
# EDM introduces "the world's first adjustable (not interchangeable) magnetic system" — an
# adjustable-in-place magnet mechanism built into the piece, a design/mould-level change from
# the Pro generation's fixed magnet slots, not a sold configuration (DATA_MODEL §4.2). The
# "world's first" framing is comparative/superlative marketing copy (RESEARCH_SPEC §3.3) and is
# not treated as verified; the underlying "adjustable... magnetic system" spec claim is used at
# tier 2 confidence.
id: guoguan-yuexiao-edm
entity: model
family_id: guoguan-yuexiao
manufacturer_id: guoguan
name: "GuoGuan YueXiao EDM"
scope_class: core
generation:
  label: "EDM"
  ordinal: 3
  basis: manufacturer_declared
released:
  value: "2019"
  precision: year
  qualifier: before
specs:
  size_mm: 56.0
  magnet_architecture: adjustable
description: |-
  TheCubicle (thecubicle-guoguan-yuexiao-edm-2020): "The GuoGuan YueXiao EDM is the latest 3x3
  released by GuoGuan. This puzzle features fantastic innovations like the world's first
  adjustable (not interchangeable) magnetic system." The "adjustable (not interchangeable)"
  language, and the vocab:magnet-configurations `adjustable` value it maps onto, describe a
  magnet mechanism the user can tune without swapping parts — a mechanism-level difference from
  the Pro generation's fixed, user-installable-or-not magnet slots, hence a new model rather
  than a variant of Pro. The "world's first" superlative is marketing copy (RESEARCH_SPEC §3.3)
  and is not independently verified this pass; only the underlying spec claim is used.

  A companion "GuoGuan YueXiao E" listing is explicitly described on its own page as "the
  unmagnetized version of the YueXiao EDM ... retains the magnetic capsules found in the EDM,
  there are simply no magnets in them" (thecubicle-guoguan-yuexiao-edm-2020) — a variant-level
  (magnetized/unmagnetized) distinction within this same model, not a separate generation
  (pass 4 material).

  Cubezz's own, independent capture of the magnetic configuration (cubezz-guoguan-yuexiao-
  edm-2019, crawled 2019-08-20) predates TheCubicle's earliest found capture by roughly a year,
  moving the plausible circulation date earlier, and corroborates the 56mm size spec.
status: drafted
