    confidence: probable
    sources: [cubezz-guoguan-yuexiao-edm-2019]
    note: "Genuine specific product-page capture (2019-08-20), used as an 'existed by' upper
      bound (`qualifier: before`) at year precision. TheCubicle's own spec table for this
      product reads 'Added: 2019-06-19' — not the documented 2018-09-11 catalogue-migration
      artefact, but still a retailer 'Added' field, and per this pass's binding instruction no
      retailer 'Added:' field is ever used as release-date evidence regardless of whether it
      matches a known artefact pattern. TheCubicle's own genuine crawl timestamp
      (2020-09-23) is a weaker (later) existence bound than Cubezz's and is not separately
      recorded."
  /generation/label:
    confidence: reported
    sources: [thecubicle-guoguan-yuexiao-edm-2020]
    note: "Single tier 2 source names 'EDM' as GuoGuan's own product designation; not
