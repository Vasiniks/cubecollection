# Pass 3 (model enumeration), agent D. The original GuoGuan YueXiao — the family's founding
# generation. Existence and identity meet S6 class 2/3 on TheCubicle alone; an independent
# non-US retailer (Cubezz) found this pass pushes the earliest evidenced circulation back to
# 2016 and supplies the only explicit dated release-year statement found for this product
# ("In 2015, GuoGuan released Yuexiao 3x3" — cubezz-guoguan-yuexiao-pro-2017, on the Pro page's
# own history recap). TheCubicle's "Added: 2018-09-11" field on this product
# (thecubicle-guoguan-yuexiao-2025) is the documented catalogue-migration artefact and is
# explicitly refused here, per the standing instruction and RESEARCH_SPEC's own list of never-
# acceptable release-date evidence.
