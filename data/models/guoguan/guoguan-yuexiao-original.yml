      TheCubicle's 'iconic cube of 2016' phrase (thecubicle-guoguan-yuexiao-pro-2018) is not
      itself a dated release claim and is treated as compatible circulation framing, not a
      competing date, so no `disputed` block is used here. The product's own 'Added:
      2018-09-11' spec-table field (present on thecubicle-guoguan-yuexiao-2025) is a documented
      catalogue-migration artefact and is explicitly refused, not used at any precision."
