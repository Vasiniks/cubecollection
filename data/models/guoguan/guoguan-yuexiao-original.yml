description: |-
  GuoGuan's founding 3x3, and the origin of the family name. TheCubicle (thecubicle-guoguan-
  yuexiao-2025): "The YueXiao is the first cube from GuoGuan, a new and exciting brand by MoYu.
  It features an appearance and design similar to that of the Cong's Design MeiYing, but with
  an all-new core design and more rounded edges." Cubezz's own, differently-worded product copy
  for the Pro generation (cubezz-guoguan-yuexiao-pro-2017) gives a direct history: "In 2015,
  GuoGuan released Yuexiao 3x3, then Xinghen 2x2 was released in the following year" — the only
  explicit release-year statement found this pass, preferred here over TheCubicle's vaguer "one
  of the most iconic cubes of 2016" framing (a circulation/reputation claim, not itself a
  release-date claim, and not read as contradicting 2015). Cubezz's own, independent, much
  earlier capture of this exact product (cubezz-guoguan-yuexiao-2016, crawled 2016-02-27) is
  consistent with a 2015 release and precedes TheCubicle's earliest found capture by roughly
  nine years.

  No mechanism/mould change is described relative to any earlier GuoGuan product (there is
  none — this is the family's first release), so this is the family's ordinal-1 model by
  definition, not by comparison.
status: drafted
