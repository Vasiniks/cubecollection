description: |-
  TheCubicle (thecubicle-guoguan-yuexiao-pro-2018): "The YueXiao Pro by GuoGuan is the
  highly-anticipated update to the original YueXiao, one of the most iconic cubes of 2016. The
  YueXiao Pro features a brand new mechanism with more internal tracks to help reduce friction
  and a more rounded corner piece design that manages to preserve the anti-corner twisting
  characteristics of the original YueXiao. The YueXiao Pro features slots for magnets to be
  easily added, but this particular variant is not magnetized." Independently, Cubezz's own
  (differently-worded) product copy (cubezz-guoguan-yuexiao-pro-2017): "Yuexiao Pro uses new
  mechanism, the designer fully consider the structure and performance of this model in
  designing. 3-segment section and 3-segment round corner, Polyline type anti-corner-twisting
  design and anti-sticky concave, which bring the speed cube mechanism to a new level." Both
  sources independently describe a genuine mechanism/mould change (DATA_MODEL §4.2), not a sold
  configuration, supporting the model-level (not variant-level) split from `guoguan-yuexiao`.

  Cubezz's own capture (2017-08-13) is over a year earlier than TheCubicle's earliest found
  capture of this product, moving the plausible circulation date to 2017 or earlier. TheCubicle
  also describes the design as accepting user-added magnets ("slots for magnets to be easily
  added") without shipping magnetized by default — the magnetized configuration is sold
  separately as "YueXiao Pro M," a variant of this same model (pass 4 material), not a separate
  generation.
