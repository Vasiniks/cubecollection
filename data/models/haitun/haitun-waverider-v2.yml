description: |-
  TheCubicle's own product page for the Standard configuration states directly: "the HaiTun
  Waverider V2 3x3 (Standard), the highly anticipated second generation from boutique
  manufacturer HaiTun" (thecubicle-haitun-waverider-v2-standard-2026) — an explicit,
  manufacturer-attributed generation claim, not merely a retailer or community numbering, the
  basis for `generation.basis: manufacturer_declared`. The Ultimate tier's own page separately
  calls itself "the crown jewel of the Waverider V2 series" with "a revolutionary magnet system
  with 94 magnets in total" (thecubicle-haitun-waverider-v2-ultimate-2026) — a substantial
  hardware difference from the Standard tier's own magnet count, read per DATA_MODEL §4.2 as a
  configuration difference within one model (a sold option, not a different mould/mechanism),
  since no distinct-tooling claim was found for any V2 tier.

  No TheCubicle capture of any V2 configuration checked this pass (Standard, Flagship, Pioneer,
  Ultimate) gives a dimensions figure. A non-US retailer, Cubezz.com, independently lists a
  "HAITUN Waverider V2 3x3x3 Speed Cube Standard Version" giving "Dimensions: 56x56x56
  millimeters" (cubezz-haitun-waverider-v2-standard) — used here as the sole basis for
  `specs.size_mm`. The same Cubezz listing also names a "Supreme Edition" tier not found at
  TheCubicle this pass (possibly a rename or regional equivalent of the "Ultimate" tier, not
  resolved this pass — a pass-4 lead).
