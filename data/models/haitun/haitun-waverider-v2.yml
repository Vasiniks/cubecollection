# Pass 3 final-seven lane, Agent A. HaiTun's second design generation, explicitly declared as
# such by the retailer's own product copy. Configuration tiers (Standard, Pioneer, Flagship,
# Ultimate, and a Cubezz-documented "Supreme Edition" not otherwise seen this pass) are
# variants of this one model — pass 4 territory, not enumerated here.
