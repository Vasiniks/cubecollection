scope_justification: |-
  "Bandaged" cubes are a recognised, named twisty-puzzle mechanism category with its own
  documented permutation-group significance, not a marketing label invented for this product:
  Wikipedia's general combination-puzzle reference (wikipedia-combination-puzzle, tier 4,
  corroboration only) states "A bandaged cube is a cube where some of the pieces are stuck
  together" and that puzzles built this way "are often called 'bandaged' cubes." TheCubicle's
  own product description (thecubicle-calvins-bandaged-3x3-maze-300, tier 2) matches this
  definition directly, not loosely: "a standard 3x3 with 3D printed tiles attached to the
  pieces. These tiles bandage some of the pieces, restricting movement." This is a clean,
  specific match between a documented category and this product's own described mechanism
  (contrast calvins-full-function-crazy-3x3 and calvins-crazy-mirror-3x3x3, both left
  `reference_only` this pass because the closest documented category found did not cleanly
  match their described mechanisms). The product is also sold under its own distinct name
  ("Maze-300 Cube") by a specialist puzzle manufacturer, continuously catalogued by at least
  one major retailer since at least 2023. This clears the "documented... place in [puzzle]
  history" bar in the pass-3 admission policy section 2, rather than resting on "it is
  unusual."
scope_decided_by: model-researcher-agent-d
scope_decided_on: "2026-09-03"
description: |-
  TheCubicle's own product page (thecubicle-calvins-bandaged-3x3-maze-300, tier 2): "The
  Calvin's Bandaged 3x3 (Maze-300 Cube) is a standard 3x3 with 3D printed tiles attached to the
  pieces. These tiles bandage some of the pieces, restricting movement. This cube is almost as
  difficult to scramble as it is to solve!" Filed under the retailer's own "Shape Mods" type,
  "Manufacturer: Calvin's Puzzle."

  **Open modification/service question, preserved, not resolved.** The pass-2 family record
  flagged that this is physically described as a base 3x3 with attached tiles, raising whether
  DATA_MODEL section 4.3's `modified_from`/`service` framing fits better than an independent
  model. That framing requires identifying "the exact base variant," which no source located
  this pass does — the base cube's own manufacturer and identity are unstated. Recorded here as
  its own model under Calvin's Puzzle per the retailer's own product naming and manufacturer
  attribution; a future pass with a source identifying the specific base cube should revisit
  this as a possible `modified_from` relationship instead.
