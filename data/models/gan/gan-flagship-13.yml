  note: "A lower bound, not a release date. The model must have existed by 2022 because a dated limited edition of it did. Recorded with qualifier 'before' rather than 'exact' so it is never mistaken for the launch."
description: |-
  GAN's own current product page (gancube-gan13-maglev-product) sells "UV Coated", "Frosted",
  and "GAN13 Maglev fx" as Versions of one listing, and describes "Magnetic Repulsion Drive"
  and "Magnetic Attraction Drive — 30°+ Auto Aligning" without a separate non-Maglev tier
  bundled on the same page (unlike GAN12/14's own pages, which bundle a Leap-and-Maglev
  choice); no separate non-Maglev "GAN13 M Leap" listing was located this pass, so it is left
  an open question whether one ever existed.

  GAN13 disappearance: this generation is present in GAN's own "Flagship Series" nav dropdown
  on 2026-08-11 ("GAN16 Maglev, GAN15, GAN14, GAN13 Maglev, GAN12, GAN11 Series...") and again
  as late as 2026-02-28 in a separate capture (this archive's own discovery-session fetch of
  gancube.com/products/gan-v100-leap-year-of-the-horse, not independently preserved as a
  citable source this pass), but is absent from the equivalent, apparently complete dropdown
  ("GAN16 Maglev, GAN15, GAN14, GAN12, GAN11 Series...") captured eight days after the 08-11
  snapshot, on 2026-08-19. No source found this pass states GAN13 was discontinued, and its own
  product page still resolved with HTTP 200 as of the last capture checked this pass
  (2026-08-11); only its place in one specific navigation grouping is shown to have changed,
  in a very narrow window. Recorded as an open lead, not a discontinuation fact.
