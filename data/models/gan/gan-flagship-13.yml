# succession by naming pattern and dated evidence. Also the family's flagged "disappearance"
# case: present in GAN's own "Flagship Series" nav dropdown as late as 2026-08-11
# (gancube-swift-block-super-maglev-product) but absent from the equivalent, apparently
# complete dropdown captured just eight days later, 2026-08-19
# (gancube-gan17-magdrive-product). See research/notes/models/gan-pass3.md for the full
# reasoning on why this is recorded as a narrowly-dated navigation change, not a discontinuation.
