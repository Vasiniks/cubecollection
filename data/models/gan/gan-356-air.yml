description: |-
  GAN's original numbered-line flagship shell, sold from at least August 2016 (GAN's own
  earliest archived site capture already lists "GAN356 Air (New!)" as a current headline
  product) through 2019, when the flagship position moved to the honeycomb "Air S" redesign and
  then to GAN356 X. "Air Advanced", "Air Master", "Air Grand Master", "Air Ultimate" (Air U),
  "Air UM" (magnetized Ultimate), and "Air Pro" are treated as variants of this one model:
  TheCubicle's own product copy states directly that "GAN356 Air UM is a magnetized GAN356 Air
  Ultimate," i.e. the same shell with magnets installed at assembly — the DATA_MODEL §4.2
  worked-decision-A pattern (different core/magnet hardware chosen at assembly = variant, not
  model).

  Distinguished at model level from the later "GAN356 Air S" (honeycomb-piece redesign,
  ~2018-2019) and from the bare "GAN356 S / S V2" line, which the 2016 capture already lists as
  a separate simultaneous product.
