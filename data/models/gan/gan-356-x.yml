description: |-
  GAN's own Chinese-language technology-history page states directly: "In 2018, the GAN356 X
  introduced the world's first quantifiable adjustment system core — the quantifiable
  adjustment steel-plastic IPG. This groundbreaking system enables adjustments to compression
  and axial distance without the need for any tools." This is a first-party statement of a new
  core mechanism/geometry, the clearest possible model-level boundary case in the whole GAN356
  lineage. TheCubicle's own listing for "GAN356 X (IPG v5)" implies at least one earlier
  hardware revision (IPG v4 or lower) was sold under the same "GAN356 X" name — recorded as a
  model.revisions[] candidate, not researched further this pass (a lead for pass 4/5: was an
  earlier IPG version ever sold as its own distinct SKU, or is 'IPG v5' simply this retailer's
  way of specifying current stock?).
