description: |-
  GAN's own product page: "The GAN V100 Leap Year of the Horse is a 55mm magnetic speed cube
  built for stable, controlled performance. It features a spring-based GES system (no maglev)
  for a more grounded and consistent turning feel. With 64 magnets, a lightweight 64g build
  [a second FAQ answer on the same page instead states 62 grams — the discrepancy is GAN's
  own and is not resolved by any source found this pass], and a refined frosted finish..."
  (gancube-gan-v100-leap-year-of-the-horse-product). An earlier capture of the same design under
  a different name and URL ("GAN V100 Leap Chinese New Year Edition", captured 2026-01-27)
  carries word-for-word identical description text
  (gancube-gan-v100-leap-chinese-new-year-edition-product) — read as the same product retitled,
  not two products, since GAN gives no indication of any change beyond the name.

  To date, no source found this pass shows a "plain" GAN V100 Leap sold without a themed
  edition name (Chinese New Year / Year of the Horse) attached — only one design has been
  found under this mechanism, always carrying that theme's name. This model record is named
  for the underlying design ("GAN V100 Leap") on the pattern established elsewhere in this
  archive (e.g. gan-356-maglev is a bare design name even though it is sold under themed/tier
  names at variant level); the theme-specific names are recorded as aliases here and are
  expected to become the `edition`/`colorway` on the corresponding variant record in pass 4.

  `specs` is left unset per the same reasoning recorded on gan-v100-maglev's description.
