  (i, i2, i3 V2, i4) as the more reliable signal of true design order and records the
  succession accordingly, while flagging that the retailer-floor dates do not confirm that
  order and may instead reflect GAN356 i3 V2 continuing to sell as a lower-tier product
  alongside the newer, "356"-prefix-dropped GAN i4 — the same coexistence pattern already
  documented for the GAN356 mainline running alongside GAN Flagship Series, and for i-carry-2/
  i-carry-e running alongside i-carry-4.
