# Pass 3 (model enumeration). GAN's own product page states directly: "GAN12 Maglev is the
# 12th generation of GANCUBE" — the single strongest manufacturer-declared generation-ordinal
# statement found anywhere in this pass, and the anchor for treating the whole GAN11-17
# succession as manufacturer-declared generation numbering. The same page's own "Versions"
# selector sells "GAN12 M Leap" and "GAN12 Maglev" (crossed with UV/Frosted coating and a
# Sticker Version) from ONE listing — confirming Leap-vs-Maglev is a variant-level
# core/magnet-system choice within this one model, not two models. See
# research/notes/models/gan-pass3.md.
