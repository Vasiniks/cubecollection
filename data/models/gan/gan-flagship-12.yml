description: |-
  GAN's own product page: "GAN12 Maglev is the 12th generation of GANCUBE and is the testimony
  of an innovative mechanism: a magnetic tensioning system. Compared with traditional-springs
  cubes, GAN12 Maglev used embedded magnets to replace traditional springs... The GAN12 M Leap
  features GES Pro+ technology and weighs 61 grams, while the GAN12 Maglev uses the new
  Magnetic GES system at 66 grams." M Leap (magnetic, large-angle alignment, springs) and
  Maglev (magnetic repulsion replacing springs) are treated as variants of this one model, sold
  from a single listing (gancube-gan12-maglev-product).
