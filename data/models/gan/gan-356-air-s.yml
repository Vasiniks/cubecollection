description: |-
  A honeycomb-piece redesign of the Air shell, distinguished from the original GAN356 Air by a
  physically different piece geometry per TheCubicle's own description (see the source's own
  excerpt). Sold as "Air S" (magnet slots removed, non-magnetic, lightest configuration) and
  "Air SM" (magnet slots present, magnetized) from evidently the same honeycomb piece family —
  treated as variants of this one model, not two models, since the removal/presence of a magnet
  cavity in an otherwise-shared piece family is the same kind of assembly-time part choice as
  worked decision A, one level more granular than the Air-vs-Air-S distinction itself.

  This is recorded as a genuine judgement call, not a settled fact: an alternative, equally
  defensible reading is that "Air S" and "Air SM" are themselves two separate models (if the
  "removed" cavity really does require a distinct mold rather than a swappable/omittable
  insert). Flagged explicitly for review rather than silently resolved either way.
