# model: gan-356-air-s
# Pass 3 (model enumeration). The hardest single boundary call of this pass. TheCubicle
# describes "Air S" as having "a unique honeycomb design on the pieces" and states the magnet
# slots present in "Air SM" "have been removed" in "Air S" to reduce weight. Read as a
# redesigned piece geometry distinct from the original GAN356 Air (a mold-level difference,
# DATA_MODEL §4.2), making "Air S" its own model — while "Air S" (non-magnetic) vs "Air SM"
# (magnetic) are themselves treated as variants of THIS model, since both share the same
# honeycomb piece family and differ only by whether magnets are installed (worked decision A
# again, one level down). See thecubicle-gan-356-air-s-master and
# research/notes/models/gan-pass3.md for the full reasoning and its explicit uncertainty.
