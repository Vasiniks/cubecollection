# model: gan-ui-16-maglev-max
# Created in the Pass 4.5 cleanup, closing the G1 gap identified in Pass 4 preparation: a
# tier-1 GAN product page existed for this product with no model record anywhere in the archive.
#
# VERDICT: "underlying design changes."
#
# Reasoning, stated so it can be argued with:
#   - GAN's own site navigation places this product under the "GAN ui Series" heading, and the
#     source excerpt records it as "distinct from the mechanical 'GAN16 Maglev' listing". The
#     manufacturer draws the boundary; the archive follows it.
#   - It is therefore NOT a variant of gan-flagship-16. Attaching it there because the name
#     contains "GAN16" was the specific error Pass 4 was warned against and correctly refused.
#   - It is also not a configuration of any existing gan-ui-series model. All four of those
#     (gan-ui-12-freeplay, gan-ui-12-maglev, gan-ui-12-sp, gan-ui-mini-freeplay) are built on a
#     GAN12 or Mini shell. A different numbered shell generation is a different underlying
#     design, not a different part chosen at assembly.
#   - The evidentiary basis is the same one on which all four existing ui models were created:
#     GAN's own listing and naming. Creating this one on a weaker basis than its siblings would
#     be inconsistent; refusing to create it at all would leave the archive knowingly incomplete
#     while holding a tier-1 source for the product's existence.
#
# WHAT IS NOT ESTABLISHED, and is recorded as an open question rather than asserted:
#   - That this model uses the GAN16 mechanical shell. That is inferred from the name and from
#     the family's pattern, and no source consulted states it. No smart_version_of relationship
#     is created, because asserting an unsourced derivation is precisely what this archive
#     refuses to do. See research/staging/variants/gan-pass4-boundary-questions.yml.

