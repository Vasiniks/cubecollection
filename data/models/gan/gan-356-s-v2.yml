# model: gan-356-s-v2
# Pass 3 (model enumeration). The bare "GAN356 S V2" line, sold in parallel with GAN356 Air
# since at least August 2016 ("GAN356sV2" on GAN's own earliest archived site). A separate
# design from Air: no source found this pass equates the two shells, and the "S" line is
# addressed as its own product on GAN's 2016 navigation, distinct from "Air". Reworked into
# GAN356 R in 2020 (see gan-356-r.yml's succeeds relationship). See
# research/notes/models/gan-pass3.md.
