description: |-
  A separate, bare "S"-branded 356 shell sold alongside GAN356 Air from at least August 2016.
  No source found this pass states whether an "S V1" existed as its own separate product before
  this "V2" naming, or whether "V2" was simply part of the product's permanent name from launch;
  left as an open question rather than asserting a predecessor. "S V2 Lite", "S V2 Master", and
  "S V2 Advanced" (found as separate TheCubicle listings) are treated as variants of this one
  model, on the same tier-word pattern established for GAN356 Air, though no source was found
  this pass explicitly stating their shared-mold relationship the way thecubicle-gan-356-air-um
  did for Air/Air UM.

  GAN356 R (2020) is described by TheCubicle as "a modern rework of the classic 356 S" — treated
  here as a succession claim from this model, not as evidence they are the same model, since "a
  modern rework" implies a new design rather than a continuation of the same tooling.
