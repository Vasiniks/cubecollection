# model: gan-v100-maglev
# Pass 3 (model enumeration). The base "GAN V100"/"GAN v100 Maglev" design: a MagLev
# (magnetic-repulsion) mechanism, 55mm, 64g per GAN's own combo-page copy, TheCubicle
# additionally reporting 76 magnets and a GAN16-derived tension-adjustment system. Split from
# gan-v100-leap on the same evidence pattern already established for gan-356-maglev vs.
# gan-356-m-e: separate product URLs, no combined "Versions" selector bundling MagLev and
# spring-based tiers the way GAN12/14/15/16's own listings do (their own "Versions" selector on
# this product offers only "UV Coated" — a single MagLev item). See
# research/notes/models/gan-pass3.md.
