description: |-
  GAN's own product page banner reads "GAN v100 Maglev is Available Now!" (captured
  2025-10-24), the earliest V100 evidence found anywhere this pass. This page's own "Versions"
  selector offers a single item ("UV Coated") — unlike GAN12/14/15/16's own listings, which
  bundle a spring-based "Leap"/"M Leap" tier and a MagLev tier from one product page (see
  gan-flagship-12's description). No combined listing was found for V100. TheCubicle's own
  copy states V100 shares "GAN's advanced tension adjustment system—identical to the system
  found in the flagship GAN16" and reports "76 strategically placed magnets" and "72 unique
  setting combinations" (thecubicle-gan-v100-maglev-uv-3x3, tier 2). GAN's own combo-bundle
  page states the base design directly: "Compact, featherweight 55mm size and 64g design"
  (gancube-gan-v100-uv-coated-2026-easter-combo-product, tier 1) — the only place this pass
  found GAN stating V100 Maglev's own size/weight numerically in its own copy; V100 Maglev's
  own single-product page carries only tagline marketing copy with no numeric specification.

  "GAN V100 Maglev Minions Edition" is recorded as an edition/variant of this model, not a
  separate model — it is part of a cross-line "Minions" collaboration theme also applied to
  GAN16 ui Maglev MAX and GAN i4, evidence of a colourway/collaboration theme rather than a
  mechanism change (gancube-gan-v100-maglev-minions-edition-product). A themed bundle, "GAN
  V100 UV Coated 2026 Easter Combo", reproduces this model's own marketing copy verbatim
  alongside gan-v100-leap's own copy — read as a probable bundle of the two models, not
  independently investigated as a pass-3 (model) question; left for pass 4.

  `specs` is left entirely unset, matching the established pattern across every other GAN
  flagship-tier model in this archive (see gan-flagship-12 through gan-flagship-17): GAN's own
  "Versions" selectors and running copy consistently bundle coating and other configuration
  choices under one listing without a model-level constant this archive can safely assert, and
  numeric magnet/weight figures found here (76 magnets, 64g) come from a single source each
  rather than corroborated manufacturer spec sheets, so they are recorded in prose rather than
  in the `specs` object pending pass 4/5 corroboration.
status: drafted
