description: |-
  Rubik's own site, 2022 homepage banner (rubiks-com-2022, tier 1): "EXCLUSIVE: The New Rubik's
  Speed Cube – Engineered for Speed With Magnets." The dedicated current product page
  (rubiks-com-speed-product-2024, tier 1): "The Rubik's Speed Cube is designed to help you
  twist and turn faster than ever before. Constructed with magnets for added stability and
  precision, and a stronger, more reliable core, the Rubik's Speed Cube is built for speed! ...
  ENGINEERED FOR SPEED: The new magnetic Rubik's Speed Cube turns at an accelerated racing
  pace... SMOOTHER PLAY: The magnetic Rubik's Speed Cube features a stronger core and has a
  mechanism designed to make it faster, smoother & more reliable than ever... The Speed Cube
  comes pre-lubricated." Magnets, a "stronger, more reliable core," and pre-lubrication are
  tier 1 specification claims (distinguished from the comparative marketing copy around them,
  per the tier-4-for-comparative-claims rule); no source states these are sold as an option
  alongside a non-magnetic current-production version, which is why this is treated as a
  generation succeeding `rubiks-speed-original` rather than a variant-level magnet
  configuration of one persisting model.
