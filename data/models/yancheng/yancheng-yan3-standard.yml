description: |-
  TheCubicle (thecubicle-yancheng-yan3-2020): "The YAN3 is the first cube released by the
  YanCheng brand. It has a unique gliding feel that makes turning feel exceptionally
  effortless. The puzzle is packaged inside a special drawer-style box." An independent non-US
  retailer (Cubelelo, India) found this pass carries the identical listing text under its own
  "New Arrivals" category as of 2017-04-06 (cubelelo-yancheng-yan3-2017) — over three years
  before TheCubicle's earliest found capture. The description text is verbatim-identical
  between the two retailers and is therefore not independent corroboration of its content
  (RESEARCH_SPEC §3.2), only of the product's existence and this earlier date, moving the
  plausible circulation date to early 2017 or before (materially earlier than the family
  record's own "circa 2018" `introduced` reading, itself not altered here — out of this pass's
  write lane).

  Sold in multiple colourways (Black, White, Primary, Stickerless Bright per TheCubicle) —
  pass 4 material, not enumerated here. No second YanCheng product, predecessor, or successor
  was found this pass (`thecubicle.com/products/yancheng*` and a domain-wide non-US retailer
  sweep both return exactly this one product). This is therefore both the family's founding
  and only model.
