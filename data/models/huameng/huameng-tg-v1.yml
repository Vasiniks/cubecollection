description: |-
  TheCubicle's own product description (thecubicle-huameng-tg-3x3-ball-core): "The HuaMeng TG
  is the most feature-rich 3x3 we've seen so far! With 1620 different adjustment combinations
  you can find one that fits your turning style. It has hand-adjustable compression settings
  and a tool to adjust tensions and magnet strength. It has 6 tension settings, 9 compression
  settings, 5 edge magnet adjustments, and 6 corner/core magnet adjustments." This is read as
  a three-parameter (tension / compression / magnet-strength) adjustable core, hence
  `adjustment_system: tri_adjust` and `core_system: dual_adjustment` (independent tension and
  compression) — both are readings of a single retailer's descriptive marketing paragraph
  rather than a structured spec-table field, so recorded `uncertain` rather than `probable`.

