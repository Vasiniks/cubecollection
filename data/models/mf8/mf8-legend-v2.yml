# WCA-format 3x3 (Type: 3x3, 56.0mm, 100g) — see thecubicle-mf8-legend-v2.
#
# A predecessor "MF8 Legend" (no suffix) was NOT admitted as a model this pass. The
# Speedsolving wiki's dated product list places "MF8 Legend 3x3x3" at 2011 and "MF8 Legend V2
# 3x3x3" at 2013, but that wiki is Tier 4 (see speedsolving-wiki-mf8-products's own
