# ("Much much better than the V1, my V1 died when I tried to lube/tension it, the ball core
# stripped") independently implies a "V1" existed and used a ball core — but a customer review
# is Tier 5, inadmissible as a citation per DATA_MODEL §5.1/rule 12, and is recorded only as an
# uncited lead in research/notes/models/mf8-huameng-escube-leads.md. No Tier 1-3 source naming
# "MF8 Legend" (unsuffixed) as a distinct product was found this pass despite a TheCubicle and
# SpeedCubeShop /products/ prefix sweep and a Cubelelo (non-US) check. Recorded as a candidate,
# not created as a model — see the Pass 3 report for the full search record.
