  `mf8-crazy-3x3-plus-planet-earth`, `-jupiter`, `-mars`, ..., captured 2024-12 through
  2025-06) and a distinct 8-planet bundle SKU (`mf8-crazy-3x3-plus-planet-series-8-versions`,
  2023-09) — all read as the same underlying design sold under different retailer SKU/bundle
  structures, not new models, consistent with the materiality rule that bundle membership and
  colourway are variant-level, not model-level, distinctions.

  See mf8-crazy-3x3-planets.yml for the full reasoning on why this is treated as a *distinct,
  but uncertainly-related* generation rather than the same model as the earlier (pre-2023,
  non-"Plus") "Crazy 3x3 Planets" listings. No source states a mould or mechanism difference
  between the two naming eras; the split rests on the naming change itself plus the release
  gap, per RESEARCH_SPEC §4 worked decision G ("when the evidence is unclear, default to new
  model... with confidence: uncertain").
