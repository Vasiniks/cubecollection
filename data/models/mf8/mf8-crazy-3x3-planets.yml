  shape: other
description: |-
  SpeedCubeShop's earliest found capture (speedcubeshop-mf8-crazy-planet-assortment-3x3x3-2015,
  2015-11): "This 3x3x3 is much more of a challenge since it is the crazy version by mf8. The
  rotation of this puzzle is clicky and the layers lock into place making this puzzle easier to
  manipulate. You can complete your collection by collecting all of the planets!" TheCubicle's
  independent capture (thecubicle-mf8-crazy-3x3-planets-assorted, live 2020-09, re-verified
  live 2026-09-03): "Manufacturer: mf8 / Type: Cuboids / Gross Weight: 145g." No magnets field
  is present in either source, so `specs.magnet_architecture` is left unset rather than assumed
  non-magnetic (contrast the later "Plus" generation, which explicitly states no magnets).

  A "MF8 Crazy 3x3x3 series" entry appears in the Speedsolving wiki's dated product list under
  2010 (speedsolving-wiki-mf8-products, Tier 4). It is plausibly the earliest appearance of
  this same design — nothing found this pass suggests two distinct 2010-vs-2015 mechanisms —
  but the wiki does not by itself clear the Tier 1-3 bar for a separate model claim, so it is
  treated as unconfirmed supporting background for this model's dating rather than as evidence
  of a third, still-earlier generation. `introduced` is therefore left unset at the model level
  (the family record already carries an `uncertain`-confidence `circa 2010` from this same
  wiki entry).

  **THE CENTRAL BOUNDARY QUESTION.** Is this the same design as `mf8-crazy-3x3-plus-planet-
  series` (2023-2025 SpeedCubeShop captures, product name including "Plus")? Evidence
  considered:
  - The 2015/2020 captures never use "Plus" in the name; the 2023-2025 captures consistently
    do ("Mf8 Crazy 3x3 Plus Planet Series").
  - TheCubicle (2020) classifies this product "Type: Cuboids"; SpeedCubeShop (2024) classifies
    the "Plus" product "Type: Shape Mod" — a different taxonomy field, though both plausibly
    describe the same broad category of non-standard-cut 3x3.
  - Both are non-magnetic shape-mod 3x3s of similar size class (this model's weight is
    documented at 145g gross; the "Plus" generation gives 57mm with no weight figure) — no
    source directly contradicts the other on a shared spec, but neither strongly confirms
    identity either.
  - MF8's 2x2 "Crazy...Plus" line (mf8-crazy-2x2-plus-type-000/001/011) is *always* sold under
    the "Plus" name in every capture found — there is no unsuffixed "MF8 Crazy 2x2" in this
    archive's evidence — which weakens (but does not eliminate) the reading that "Plus" marks
    a genuine second design generation specifically for the 3x3 line, since it may simply be
    MF8's standing brand name for this style of shape mod rather than a generational marker.

  No source states a mould, mechanism, or internal-geometry difference between the two name
  forms. Per DATA_MODEL §4.2 and RESEARCH_SPEC §4 worked decision G — "the evidence is
  genuinely unclear whether the mechanism changed" — this model is **split** from
  `mf8-crazy-3x3-plus-planet-series` rather than merged, with a `succeeds` relationship and
  `confidence: uncertain` on the generation claim, in both directions. This is a decision to
  flag for human review, not to re-litigate silently.
