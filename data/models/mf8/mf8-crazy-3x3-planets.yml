scope_class: conditional
scope_justification: |-
  Non-WCA-legal shape-mod 3x3 (TheCubicle: "Type: Cuboids"). Admitted on documented historical
  and collector significance: this is the earliest Tier 1-3-evidenced generation of MF8's
  "Crazy" 3x3 mechanism line, in retail circulation from at least 2015 (SpeedCubeShop) through
  at least 2020 (TheCubicle, still live as of a 2026-09-03 re-check), and the line as a whole
  (across this model and its successor, mf8-crazy-3x3-plus-planet-series) was in continuous
  retail circulation from 2015 to 2025 — inside the archive's research window, per the S6
  admission-policy decision at research/qc/pass3-admission-policy.md §2, which explicitly
  rejected `reference_only` for this family on this evidence.
