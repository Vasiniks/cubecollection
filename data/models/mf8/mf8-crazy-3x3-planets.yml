# the sibling record mf8-crazy-3x3-plus-planet-series.yml and the Pass 3 report for full
# reasoning. Two independent Tier 2 retailer sources, five years and two publishers apart,
# describe the same unsuffixed "Crazy Planet(s) Assortment 3x3x3" product:
# speedcubeshop-mf8-crazy-planet-assortment-3x3x3-2015 ("Mf8 Crazy Planet Assortment 3x3x3",
# 2015-11) and thecubicle-mf8-crazy-3x3-planets-assorted ("mf8 Crazy 3x3 Planets (Assorted)",
# Type: Cuboids, 145g, live again as of 2020-09 and re-verified live 2026-09-03). Two genuinely
# independent Tier 2 publishers agreeing on a distinct-product naming and mechanism supports
# `confidence: confirmed` on existence (DATA_MODEL rule 9).
