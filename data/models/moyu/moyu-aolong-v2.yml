  ordinal: 2
  basis: manufacturer_declared
released:
  value: "2014-07"
  precision: month
  qualifier: circa
description: |-
  The Speedsolving wiki (speedsolving-wiki-moyu): "The MoYu AoLong V2 is an updated version of
  the original MoYu AoLong. It was intended to reduce corner twists after Feliks Zemdegs
  received a DNF on a would-be world record due to a corner twist. However, 'bad' Aolongs exist
  due to the V2 controversy in July 2014. MoYu decided to produce the first batch of Aolong V2s
  with a different plastic while discontinuing the V1. Once everyone noticed how poor the
  performance was on the new cubes, MoYu changed the plastic on all new V2s." TheCubicle's own
  full product page, "Cubicle AoLong V2" (thecubicle-us-moyu-early-3x3-lines, captured
  2015-09-18), independently confirms the product as "made by MoYu" ("Original puzzle made by
  MoYu") at 57.0mm — a later capture than the original 2014 launch, evidencing continued sale
  rather than the launch itself.
