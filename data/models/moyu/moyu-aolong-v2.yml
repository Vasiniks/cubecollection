# model: moyu-aolong-v2
# Pass 3 (model enumeration). A documented plastic/mould revision of AoLong, made mid-2014 in
# response to a competitive incident (a corner-twist DNF at a Feliks Zemdegs world-record
# attempt). Recorded as a new model rather than a variant of moyu-aolong-original: the wiki
# frames it as intended to change piece behaviour (reduce corner twists), and the first
# production batch used a different plastic outright before MoYu corrected course — a tooling/
# material change to the underlying design, not a configuration choice offered alongside the
# original at assembly. See DATA_MODEL §4.2 worked decision B and
# research/qc/pass3-agent-a-moyu.md.
id: moyu-aolong-v2
entity: model
family_id: moyu-aolong
