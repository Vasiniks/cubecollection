description: |-
  The Speedsolving wiki (speedsolving-wiki-moyu): "Released spring 2023. It featured a
  split-piece design a la WR M 2020, but the internal geometry is most similar to the WRM 2019,
  as a 'back-to-basics' type design. So far, the Standard version is the cheapest of the
  Weilong series from the past few years, but it loses adjustable magnet strength. Maglev
  features maglev springs and purple corner/edge stalks, and the Ballcore features corner-core
  magnets as well as repelling edge magnets similar to that of the GAN 13." Standard, Maglev,
  and Ballcore are recorded as variants of this model (core-system/maglev/magnet-architecture
  differences), not separate models, per DATA_MODEL §4.2.

  Lead for pass 4, not adopted as a model or revision here: "A 20-magnet Ballcore version was
  released in January 2024, adding 12 more core magnets to attract to the edge-repelling
  magnets. Retails for $47.99" — read as a further magnet-architecture variant of the Ballcore
  configuration, a sold configuration difference, not a new design generation.
