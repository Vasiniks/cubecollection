# model: moyu-weilong-v9
# Pass 3 (model enumeration). A new named flagship generation, described as a deliberate
# "back-to-basics" design combining WR M 2020's split-piece construction with WR M 2019's
# internal geometry — read as a genuine design change (a stated redesign, not a sold
# configuration of an existing shell), meeting the model boundary even though it explicitly
# recombines elements of two prior generations. Standard/Maglev/Ballcore are recorded as
# variants of this one model (core-system and maglev differences), not separate models. See
# research/qc/pass3-agent-a-moyu.md.
id: moyu-weilong-v9
entity: model
