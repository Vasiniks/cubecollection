description: |-
  The Speedsolving wiki (speedsolving-wiki-moyu): "Released on 4/3/2019, is a GTS3 without
  ridges. The magnets were weaker, the same as the GTS3 LM. It was also widely popular and
  considered one of the best speedcubes, but many cubers complained that the magnets were just
  a tad too weak." "Without ridges" is a piece-geometry difference from GTS3, the basis for a
  new model; the magnet-strength comparison to GTS3 LM is a configuration-level observation, not
  a second mould. TheCubicle's own catalogue (thecubicle-com-moyu-3x3-collection-2021, captured
  2021-01-14) lists both "MoYu WeiLong WR 3x3" (non-magnetic) and "MoYu WeiLong WR M 3x3"
  (magnetic) as parallel, contemporaneous options of the same product line, corroborating the
  variant-level reading. "WR M" is recorded here in `aliases` and description only; it is not a
  separate model record.
