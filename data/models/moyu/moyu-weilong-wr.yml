# Pass 3 (model enumeration). HARD CASE resolved: "WR" and "WR M" are recorded as ONE model.
# The wiki describes the design change as "a GTS3 without ridges" (a piece-geometry change from
# GTS3, sufficient for a new model), then separately notes magnet strength ("the same as the
# GTS3 LM") as the only difference from the non-magnetic version — magnet architecture is a
# variant-level difference per DATA_MODEL §4.2's materiality test, not a mould/mechanism change.
# "WR M" is therefore NOT created as its own model here; it belongs at variant level (pass 4)
# under this model. See research/qc/pass3-agent-a-moyu.md.
