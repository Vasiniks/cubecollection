# Pass 3 (model enumeration). A new spring-compression adjustment mechanism, sold "magnetic,
# nonmagnetic, or with light magnets" (the wiki's own words) — magnet configuration is a
# variant-level difference per DATA_MODEL §4.2's worked decision A, so "GTS3", "GTS3 M" (or
# "3M"), and "GTS3 LM" ("light magnets") are recorded here as one model, not three. See
# research/qc/pass3-agent-a-moyu.md.
