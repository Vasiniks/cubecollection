description: |-
  The Speedsolving wiki (speedsolving-wiki-moyu): "Released May-September 2018, these cubes
  feature a new system in which it is possible to easily change the spring compression and
  therefore control how fast you want the cube to be... It combined the stability of the GTS2
  and the flexibility of the GTS3 and came magnetic, nonmagnetic, or with light magnets." The
  new user-adjustable spring-compression mechanism is the basis for treating this as a new
  design generation. "3M" (full-strength magnets) and "3LM" ("light magnets") are magnet-
  architecture options of this same design and are recorded as variants, not separate models,
  per DATA_MODEL §4.2 worked decision A; TheCubicle's own catalogue
  (thecubicle-com-moyu-3x3-collection-2021) independently corroborates this reading, listing
  "MoYu WeiLong GTS3 3x3", "MoYu WeiLong GTS3 M 3x3", and "MoYu WeiLong GTS3 LM 3x3" as three
  separate purchase options rather than three separate manufacturer lines.
