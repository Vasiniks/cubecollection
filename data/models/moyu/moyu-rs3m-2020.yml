description: |-
  The Speedsolving wiki (speedsolving-wiki-moyu): "Considered one of the best 3x3s of all time,
  this puzzle features magnets, a dual adjustment system in which you could change the spring
  compression and a cheap price point of only $9. There is, however, a major problem being that
  the puzzle has very weak magnets." TheCubicle's own catalogue
  (thecubicle-com-moyu-3x3-collection-2021, captured 2021-01-14) independently confirms "MoYu
  RS3 M 2020 3x3", "Angstrom RS3 M 2020+ 3x3", "Mystic RS3 M 2020+ 3x3", "Pro Shop RS3 M 2020+
  3x3", "Celeritas RS3 M 2020+ 3x3", and "MAX RS3 M 2020+ 3x3" as real, currently-sold retail
  listings — TheCubicle's own in-house tuning tiers of this same base line, not separate
  manufacturer models.

  Variant leads for pass 4, not created here: "MoYu RS3M MagLev" (wiki: "uses MagLev
  technology, having 2 repelling magnets that replicate springs... also very fast" — a MagLev-
  vs-spring configuration of this same design); "MoYu RS3M 2020 UV" (wiki: "A slight update to
  the RS3M 2020 adding UV coating and slightly stronger magnets... the cheapest mass-produced
  UV-coated puzzle at 17.99 USD" — a coating/magnet-strength configuration).

  "2021" is mentioned once, in passing, in the wiki's own "Super RS3M" entry ("An updated
  version of the RS3M 2020/2021"), with no distinguishing design feature ever stated for a
  2021-specific generation. Not promoted to its own model or `revisions[]` entry on the
  strength of that single ambiguous mention; flagged here as an open question rather than
  either fabricated or silently dropped.
