# Pass 3 (model enumeration). Explicit successor to Tornado V3, with a stated new core system
# (ball-core). "V4 AI" (the smart/electronic sibling) is treated as a variant of this model, not
# a separate model — a deliberate boundary call, recorded for review. See
# research/qc/pass3-agent-b-qiyi.md.
