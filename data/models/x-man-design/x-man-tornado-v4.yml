description: |-
  Per TheCubicle's product page (thecubicle-x-man-tornado-v4-m-3x3-flagship-product): "This
  puzzle is a successor to the Tornado V3 which has set many world records over the last few
  years. This one has a ball-core, and an updated adjustment system that allows you to adjust
  the magnet strength in an entire corner with just a single twist!" A ball-core is a named,
  specific core-system change from V3 (which is not described as ball-core), the basis for
  model-level treatment. That page's own spec table has no Dimensions row; `size_mm: 55.5` is
  instead taken, at reduced confidence, from thecubicle-x-man-tornado-v4-ai-3x3-uv-product's own
  "Standard 55.5mm size for familiar, ergonomic control" statement for the same V4 platform.

  **Model/variant boundary call, recorded for review: "Tornado V4 AI" is treated as a variant of
  this model, not a separate model.** TheCubicle's own copy for the AI product describes it
  directly as "the smart upgrade of the world-renowned Tornado V4" (thecubicle-x-man-tornado-
  v4-ai-3x3-uv-product), i.e. built on the same mechanical platform with electronics (gyroscope,
  "magnetic foot positioning system", companion app) added. DATA_MODEL section 4.1 explicitly
  lists smart/electronic capability as a variant-level (not model-level) difference, and this
  matches the precedent already set for QiYi's own M Pro Elite/Smart Cube pairing
  (qiyi-m-pro-elite.yml) — the opposite treatment from GAN's separately-named, persisting smart
  FAMILIES (i Series, ui Series), because no separately-named persisting "X-Man smart" collection
  identity was found for Tornado, only this one product.
