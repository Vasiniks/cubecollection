# model: x-man-tornado-v3
# Pass 3 (model enumeration). Explicit successor to Tornado V2, with a stated mechanical change
# (rivets replaced by screws) rather than only a marketing version bump. "Pioneer" and "Magnetic
# Core" configurations are treated as variants of this model, not modelled separately. See
# research/qc/pass3-agent-b-qiyi.md.
