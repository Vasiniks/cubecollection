  basis: manufacturer_declared
announced:
  value: "2022"
  precision: year
  qualifier: circa
specs:
  size_mm: 55.5
description: |-
  Per TheCubicle's product page (thecubicle-x-man-tornado-v3-m-standard-product): "The X-Man
  Tornado V3 M is QiYi's new flagship 3x3 speedcube... X-man has released 3 versions,
  introducing core magnets and maglev tech to the Tornado line. It solves some small issues that
  were present in the V2 like replacing the rivets with screws and allowing the center caps to
  fit from any orientation. The improved mechanism gives a more cohesive, smooth feel when
  turning." Replacing rivets with screws is a genuine, explicit mechanical change from V2 (not
  merely a marketing version bump), and "3 versions" (Standard, Magnetic Core, Pioneer MagLev) is
  the manufacturer/retailer's own framing of magnet/maglev configuration options within this one
  generation — treated as variants of this model per DATA_MODEL section 4.2 worked decision A,
  not separate models. A "Pioneer 3x3 Revived Limited Edition" reissue
  (thecubicle-x-man-designs-collection-2025) is likewise left as a pass-4 variant question.
  `size_mm: 55.5` (vs V2's 55.0mm) is taken from this page's spec table.
