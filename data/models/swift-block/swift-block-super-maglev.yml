description: |-
  GAN's own product page: "At the heart of the Swift 3X3 Super are dual magnetic rings. These
  rings create a strong magnetic grip between layers, ensuring the cube rotates smoothly with
  zero sticking... Weighing only 71 grams... with a cube size of 55mm... Built-in GES Tension
  System with 8 Adjustable Settings" (gancube-swift-block-super-maglev-specifications). A UV
  coated version ("Swift 3X3 Super Maglev UV") is also described on the same page as a
  configuration choice, not a separate product.

  "Dual magnetic rings" is a materially different mechanism description from "Swift Block 355
  Maglev"'s own page, which named no mechanism at all beyond the word "Maglev" in its title;
  combined with a substantially lower weight (71g vs. 91.8g) and the loss of the "355" numeral
  from the naming pattern used by every other Swift Block 3x3 model found this pass, this is
  read as a new design generation. No source found this pass states a direct succession
  sentence ("replaces the 355 Maglev" or similar); the `succeeds` relationship below is this
  archive's own inference from the shared "Maglev" positioning, naming-family, and dated
  capture order, held at `confidence: uncertain`.
