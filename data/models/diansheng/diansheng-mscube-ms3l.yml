description: |-
  Per TheCubicle's own product page (thecubicle-mscube-ms3l-3x3-standard-product): "The MsCube
  MS3L 3x3 (Standard) features a spiderweb pattern on the contact surfaces, swappable
  center/core pieces to adjust tension, a compression adjustment under each center cap, and a
  traditional magnetic layout with magnets in the edges and corners." A CDX prefix sweep of
  https://www.thecubicle.com/products/mscube confirms only two listings under this family --
  mscube-ms3l-3x3-standard and mscube-ms3l-3x3-enhanced -- both first captured 2022-01-29, i.e.
  Standard and Enhanced are sold configurations of one product (differing, per that source, in
  plastic used for internals), not separate models. No second MsCube 3x3 model was found.

  `core_system: dual_adjustment` and `adjustment_system: tension_compression` are read from
  "swappable center/core pieces to adjust tension" plus "a compression adjustment under each
  center cap" -- independent tension and compression adjustment, matching those vocabulary
  values' own definitions. `magnet_architecture: single_layer` is read from "a traditional
  magnetic layout with magnets in the edges and corners" -- the closest existing vocabulary
  term to a conventional single set of positioning magnets at standard piece locations; no
  vocabulary term names "edges and corners" specifically, so this mapping is recorded at
  `uncertain` on its own attestation line rather than folded into the source's own `probable`
  confidence for the other two spec fields.

  `size_mm` and `weight_g` are left unset: neither source states them.
