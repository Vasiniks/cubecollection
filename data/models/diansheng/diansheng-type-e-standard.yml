description: |-
  Three independent 2008 Speedsolving.com forum threads establish this as a real, distinct,
  actively-discussed 3x3x3 product, entirely independent of the family's tier 4 wiki source:
  a dated hands-on review, 2008-06-25 (speedsolving-forum-diansheng-type-e-review-2008,
  "Comes assembled with correct color scheme -- and surprisingly they have stickers, not
  paint!"..."turns very well"..."equal to the white Type D"); a for-sale listing, 2008-12-23
  (speedsolving-forum-diansheng-for-sale-2008, a white cube with painted-on colouring); and a
  discussion thread, 2008-07-09 (speedsolving-forum-diansheng-questions-2008, "the two
  Dianshengs I have are extremely good... at least as good as a white Type D"). All three name
  or clearly describe the same "(e)"/"Type E" product, sold and discussed continuously across
  at least mid-to-late 2008.

  The Speedsolving wiki (speedsolving-wiki-diansheng-products, tier 4, corroboration only):
  "3x3x3 Cube 'Type-E' (Released c. 2008)... Type E cubes are known as Diansheng (or DS) cubes.
  Out of the box they were quite bad, but after lubing with silicone they became much better...
  There are two types of DS cubes, no.222 and no.333. Rather than stickers, the Diansheng
  no.333 has the colors painted onto the sides of the cube... Because of their very light
  weight, and very loose, smooth turning; DS 3x3x3's were often used in One-Handed cubing." The
  wiki's "painted vs. stickered" distinction is corroborated independently by the forum record
  above (one 2008 batch had genuine stickers; a separate for-sale listing describes painted
  colouring) and is treated as a sticker/colour-application variant difference within this one
  design (DATA_MODEL §4.1), not a second model — "no.222"/"no.333" read as catalogue/product
  numbers, not confirmed as separate designs by any source found this pass.

  No dimension, weight, or exact release date was found at tier 1-2 anywhere this pass (the
  forum threads, tier 3, do not give measurements; the wiki, tier 4, cannot establish a
  specification). Both left unset per the S6 policy.
