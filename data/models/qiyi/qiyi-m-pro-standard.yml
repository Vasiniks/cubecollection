description: |-
  Per the Speedsolving wiki (speedsolving-wiki-qiyi-products): "Qiyi M Pro Released mid 2023.
  This was QiYi's budget magnetic 3x3 release... This 3x3 also has multiple versions" — Standard
  (48 magnets, stickered/stickerless), Maglev, and Maglev with Ballcore, explicitly described as
  configurations of one product, not separate models (DATA_MODEL section 4.2 worked decision A).
  TheCubicle's own product page for the base configuration
  (thecubicle-qiyi-m-pro-3x3-product) independently corroborates: "The QiYi M Pro 3x3 is a
  budget-friendly, magnetic puzzle from QiYi. It features a hand-adjustable compression system."
  A separate MagLev product page (thecubicle-qiyi-m-pro-3x3-maglev-product) exists at the same
  55.0mm size and is treated as a variant of this model, not modelled separately, consistent
  with the wiki's framing.
  "M Pro" carries no manufacturer-declared ordinal of its own (unlike the later, explicitly
  numbered "V2"), so `generation.basis` is recorded as community_convention for the ordinal
  placement, following the same treatment given to gan-356-air and qiyi-ms-original elsewhere in
  this archive.
