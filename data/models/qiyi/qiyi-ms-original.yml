description: |-
  Per the Speedsolving wiki (speedsolving-wiki-qiyi-products): "QiYi MS 3x3 Released early 2020.
  A budget 3x3 that is magnetized... This puzzle comes in a stickered (black) version and a
  stickerless version. It measures 56.5mm." TheCubicle's own product page
  (thecubicle-qiyi-ms-3x3-product) independently corroborates existence, magnetic configuration,
  and positioning: "The QiYi MS 3x3 is a magnetic 3x3 speed cube built for performance and
  economy. Part of QiYi's new economy 'MS' line..." That retailer's own spec table, however,
  gives no Dimensions row at this capture, so `specs.size_mm` is left unset for this model
  rather than populated from the wiki's uncorroborated 56.5mm figure, which RESEARCH_SPEC's S6
  admission policy does not permit for a specification claim ("A wiki may never establish a
  specification"). The stickered/stickerless distinction is a colourway/application difference,
  left for pass 4 (variant enumeration).
