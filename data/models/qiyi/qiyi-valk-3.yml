# Pass 3 (model enumeration). MAJOR FINDING, recorded for human review: "Valk2 M", "Valk 4 M",
# and "Valk 5 M" — which the qiyi-valk FAMILY record's own description lists as if they were
# sequential 3x3 generations ("Valk2 M, Valk 3..., Valk 4 M..., and Valk 5 M") — are in fact a
# 2x2, a 4x4, and a 5x5 respectively, per their own TheCubicle product pages. "Valk" appears to
# be a cross-category QiYi brand where the numeral denotes cube SIZE (2x2/3x3/4x4/5x5), not a
# sequence of 3x3 design generations. "Valk 3" is therefore, on the evidence found this pass,
# the ONLY 3x3 generation in the Valk line; "Power", "Elite", and "Mini" are sibling 3x3 designs
# within that one generation, not further numbered generations. See
# research/qc/pass3-agent-b-qiyi.md for the full finding and its implications for the family
# record (not edited here — families are frozen for this pass).
