# model: qiyi-valk-3-power
# Pass 3 (model enumeration). A sibling 3x3 design within the "Valk 3" generation, distinguished
# from the base Valk 3 by a described internal-construction difference (not merely a
# configuration choice). No `succeeds` relationship is asserted: a 2018 QiYi storefront capture
# already lists both "Valk 3" and "Valk3 Power" concurrently, so this reads as a parallel tier,
# not a later replacement. See research/qc/pass3-agent-b-qiyi.md.
id: qiyi-valk-3-power
