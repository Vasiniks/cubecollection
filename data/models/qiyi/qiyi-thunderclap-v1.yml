  `size_mm: 56.5` is taken from TheCubicle's spec table. No generation ordinal or version suffix
  is used by either source for this earliest Thunderclap; "V2" and "V3/M" are both explicitly
  numbered by contrast (see qiyi-thunderclap-v2 and qiyi-thunderclap-v3-m), so this model is
  treated as the line's un-numbered first generation.
