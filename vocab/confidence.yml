# confidence
# Controlled vocabulary. validate.mjs injects these values as the enum for every
# schema property annotated x-vocab: confidence, so the schema and this file cannot drift.

id: confidence
description: "Evidentiary confidence in a single attested claim. Assigned from the source tier and corroboration rules in docs/data-architecture.md section 5."
values:
  - value: confirmed
    label: "Confirmed"
    description: "Tier 1 source, or two independent Tier 2 sources in agreement."
  - value: probable
    label: "Probable"
    description: "One Tier 2 source, uncontradicted."
  - value: reported
    label: "Reported"
    description: "Tier 3 source, uncontradicted and plausible."
  - value: uncertain
    label: "Uncertain"
    description: "Weak or single-source, or internally implausible."
  - value: disputed
    label: "Disputed"
    description: "Credible sources disagree. See the attestation's disputed block."
  - value: unknown
    label: "Unknown"
    description: "Explicitly researched and not found. Not the same as an absent field."
