# logo-treatment
# Controlled vocabulary. validate.mjs injects these values as the enum for every
# schema property annotated x-vocab: logo-treatment, so the schema and this file cannot drift.

id: logo-treatment
description: "How a logo is applied."
values:
  - value: printed
    label: "Printed"
  - value: engraved
    label: "Engraved"
  - value: sticker
    label: "Sticker"
  - value: embossed
    label: "Embossed"
  - value: inlaid
    label: "Inlaid"
  - value: none
    label: "None"
  - value: unknown
    label: "Unknown"
    description: "Researched and not established."
