# link-status
# Controlled vocabulary. validate.mjs injects these values as the enum for every
# schema property annotated x-vocab: link-status, so the schema and this file cannot drift.

id: link-status
description: "State of a source's URL at last check."
values:
  - value: live
    label: "Live"
  - value: dead
    label: "Dead"
  - value: redirected
    label: "Redirected"
  - value: paywalled
    label: "Paywalled"
  - value: altered
    label: "Altered"
    description: "Still present but materially changed."
  - value: unchecked
    label: "Unchecked"
